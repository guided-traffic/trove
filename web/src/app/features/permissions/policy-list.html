<header class="page-header">
  <h1 tabindex="-1" i18n="@@policies.heading">Permission policies</h1>
  @if (session.has('policies:write')) {
    <a mat-flat-button routerLink="/admin/permissions/new" i18n="@@policies.new">New policy</a>
  } @else {
    <button mat-flat-button type="button" disabled aria-describedby="needs-policies" i18n="@@policies.new-disabled">New policy</button>
  }
</header>
<trove-needs id="needs-policies" capability="policies:write" />

<div class="list-layout" [class.panel-open]="panelOpen()">
  <div class="list-main">
    <div class="list-toolbar">
      <trove-filter-toggle [(open)]="panelOpen" [activeCount]="activeCount()" [controls]="panel.panelId" />
    </div>

    <trove-data-table
      [caption]="caption"
      [columns]="columns"
      [sort]="sort()"
      (sortChange)="sortBy($event)"
      [loaded]="list.loaded()"
      [loading]="list.loading()"
      [error]="list.error()"
      [empty]="list.items().length === 0"
      i18n-emptyText="@@policies.empty"
      emptyText="No policy matches."
      [hasMore]="list.hasMore()"
      (more)="list.more()"
      (retry)="list.reload()"
    >
      @for (p of list.items(); track p.name) {
        <tr>
          <th scope="row">
            <a [routerLink]="['/admin/permissions', p.name]" translate="no">{{ p.name }}</a>
            @if (p.inert) {
              <span class="badge warn"><span class="material-icons" aria-hidden="true">warning</span><ng-container i18n="@@policies.inert">Grants nothing</ng-container></span>
            }
          </th>
          <td>{{ p.description }}</td>
          <td>{{ principalSummary(p) }}</td>
          <td class="wrap" translate="no">{{ repositorySummary(p) }}</td>
          <td class="wrap" translate="no">{{ actionSummary(p) }}</td>
        </tr>
      }
    </trove-data-table>
  </div>

  <trove-filter-panel
    #panel
    class="list-side"
    [(open)]="panelOpen"
    [activeCount]="activeCount()"
    (apply)="apply()"
    (clearAll)="clear()"
  >
    <trove-filter-category i18n-label="@@policies.principal" label="Principal" [active]="!!principalFilter().trim()" [expanded]="!!principalFilter().trim()">
      <trove-text-field
        i18n-label="@@policies.principal"
        label="Principal"
        name="principal"
        [(value)]="principalFilter"
        i18n-hint="@@policies.principal-hint"
        hint="user:name, group:name, sa:name, anonymous or authenticated"
      />
    </trove-filter-category>
    <trove-filter-category i18n-label="@@policies.repository" label="Repository" [active]="!!repositoryFilter().trim()" [expanded]="!!repositoryFilter().trim()">
      <trove-text-field i18n-label="@@policies.repository" label="Repository" name="repository" [(value)]="repositoryFilter" />
    </trove-filter-category>
  </trove-filter-panel>
</div>
