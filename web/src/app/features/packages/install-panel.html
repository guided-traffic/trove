<section class="install" aria-labelledby="install-heading">
  <h2 id="install-heading" i18n="@@pkg.install.heading">Install</h2>

  @if (clients().length === 0) {
    <p i18n="@@pkg.install.no-clients">There are no install instructions for this package type yet.</p>
  } @else {
    <trove-install-command
      [format]="format()"
      [name]="name()"
      [version]="version().version"
      [repository]="repository()"
      [(client)]="client"
    >
      @if (version().repositories.length > 1) {
        <label class="picker">
          <span i18n="@@pkg.install.repository">Repository</span>
          <select class="select-input" (change)="pickRepository($event)">
            @for (r of version().repositories; track r.key) {
              <option [value]="r.key" [selected]="r.key === repository()" translate="no">{{ r.key }}</option>
            }
          </select>
        </label>
      }
    </trove-install-command>

    <p class="setup-link">
      <a
        routerLink="/setup"
        [queryParams]="{ repository: repository(), client: client() ?? clients()[0]?.id }"
        i18n="@@pkg.install.setup-link"
        >Set up your client for this repository</a
      >
    </p>
  }
</section>
