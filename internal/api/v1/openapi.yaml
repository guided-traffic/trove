  # <<< M5 backup
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A trove token (`trv_` prefix). Credentials that are present but invalid always give `401`.
  headers:
    # >>> M13 bastion
    BastionInterface:
      description: The main installation's version of the Bastion interface (R-BAS-009).
      schema:
        type: integer
        minimum: 1
    # <<< M13 bastion
    #
    RequestId:
      description: The trace ID of the request (W3C Trace Context); quote it when reporting a problem.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    ETag:
      description: Strong entity tag of the representation, the quoted revision (R-API-012).
      schema:
        type: string
        example: '"4"'
    AuthzEpoch:
      description: >-
        The authorization epoch this write produced. Send it as `Trove-Authz-Min-Epoch` on the next
        request to see the change on whichever replica answers (R-AUTHZ-032).
      schema:
        type: integer
        format: int64
        minimum: 1
    Location:
      description: The URL of the created resource, or of the job to poll (R-API-004, R-API-015).
      schema:
        type: string
    Link:
      description: 'RFC 8288 link to the next page, `rel="next"`, present while more items exist (R-API-010).'
      schema:
        type: string
    RateLimitPolicy:
      description: 'The limit class of the route, `"read";q=200;w=4` (R-API-016).'
      schema:
        type: string
    RateLimit:
      description: 'The remaining budget, `"read";r=199;t=3` (R-API-016).'
      schema:
        type: string
    IdempotencyReplayed:
      description: '`true` when the answer is the stored outcome of an earlier request with the same Idempotency-Key (R-API-014).'
      schema:
        type: string
        enum: ["true"]
  parameters:
    ProjectKey:
      name: projectKey
      in: path
      required: true
      description: The project key (`^[a-z][a-z0-9]*(?:-+[a-z0-9]+)*$` (2 to 32 characters)), immutable. A project the caller cannot see answers `404`, exactly as a project that does not exist.
      schema:
        type: string
        pattern: "^[a-z][a-z0-9]*(?:-+[a-z0-9]+)*$"
        minLength: 2
        maxLength: 32
    RepoKey:
      name: repoKey
      in: path
      required: true
      description: The repository key (R-REPO-002), unique within its project (Q-REPO-212).
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:(?:[._]|__|-+)[a-z0-9]+)*$"
        minLength: 2
        maxLength: 64
        x-trove-reserved-names: [batch-create, batch-update, batch-get, batch-delete, quick-setup]
    # >>> M13 bastion
    BastionInterface:
      name: Trove-Bastion-Interface
      in: header
      required: false
      description: |
        The Bastion's interface version (R-BAS-009). Required on every request of a Bastion: a request without it, or with
        another version, is answered `400 bastion_interface_mismatch` before the operation runs. It is declared optional
        here so that the answer is the interface's, not the binder's.
      schema:
        type: integer
        minimum: 1
    # <<< M13 bastion
    #
    Limit:
      name: limit
      in: query
      description: Page size, 1 to `api.page_size_max` (R-API-010).
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The `nextCursor` of the previous page. Opaque; valid only with the filters and sort it was issued for.
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag loaded with the resource, or `*` to overwrite deliberately (R-API-012).
      schema:
        type: string
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: The ETag loaded with the resource, or `*`. A `DELETE` honours it when sent and answers `412` for a stale one (R-API-012).
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: An ETag the client holds; a match answers `304` (R-API-012).
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 1 to 255 printable ASCII characters, preferably a UUID (R-API-014).
      schema:
        type: string
        minLength: 1
        maxLength: 255
    BackupRunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-trove-reserved-names: [summary]
    JobId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    # >>> M2 packages
    PackageId:
      name: packageId
      in: path
      required: true
