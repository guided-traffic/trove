          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        createdAddr:
          type: [string, "null"]
        userAgent:
          type: [string, "null"]
        authMethod:
          type: string
          enum: [oidc, break_glass]
        providerId:
          type: [string, "null"]
