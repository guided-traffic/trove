  /api/v1/endpoints/{endpoint}/check-exposure:
    post:
      operationId: checkExposure
      tags: [endpoints]
      summary: Check what an endpoint exposes
      description: |
        A dry run for one repository (R-EP-016, R-EP-017): exposed or not, the admitting rule or the
        reason, for the repository or a package, and for the `versions` and `paths` asked. Reasons:
        `exposed`, `no_rule`, `rule_disabled`, `package_excluded`, `path_excluded`,
        `version_excluded`, `out_of_range`, `prerelease`, `tag_excluded`. It reads the stored rules
        from PostgreSQL, transfers no content and contacts no upstream. `rule` is a draft of the rule
        editor that is evaluated in place of the stored rule of its name, or in addition, and is
        validated like a write (Q-EP-18). Needs `endpoints:read` and `read` on the repository; a
        repository the caller cannot read answers `404` like a missing one. Generic repositories are
        checked through `paths`. For a format with versions, a request that names a package and no
        `versions` (absent or empty) judges the versions the repository stores of that package, newest first,
        and answers the package's tags in `distTags` (Q-EP-61). The caller sees only what it may read
        (Q-EP-62): a package it may not read answers exactly as one the repository does not hold, a version it may
        not read is left out, and so is a tag that points to one. A hosted repository lists its live
        versions, a remote one the versions of its cached document (its tags are not stored, so none
        are listed), and a virtual repository stores nothing of its own, so the answer carries the
        warning `stored_versions_not_listed`. The newest 1,000 versions and the first 1,000 tags (by name) are judged,
        the rest is cut and the answer carries `stored_versions_truncated` (Q-EP-63); the version a tag points to is
        always judged. A tag is visible when a rule admits its name and the
        version it points to is exposed. `distTags` is filled whenever a package of a format with
        tags is named, also when `versions` are sent.
      x-trove-permission:
        permission: endpoints:read
      parameters:
        - name: endpoint
          in: path
          required: true
          description: An endpoint name, `default` for the default endpoint.
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{0,19}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExposureCheckRequest"
            example:
              repository: generic-local
              paths: [releases/1.0/app.zip, internal/x.bin]
      responses:
        "200":
          description: The verdicts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExposureCheck"
              example:
                endpoint: customers
                repository: generic-local
                mode: rules
                package: null
                packageExposed: true
                rule: releases
                reason: exposed
                versions: []
                paths:
                  - {path: releases/1.0/app.zip, exposed: true, rule: releases, reason: exposed}
                  - {path: internal/x.bin, exposed: false, rule: null, reason: path_excluded}
                distTags: []
                exposureFingerprint: "sha256:5b1e0c39d4c1a7e0b9f2d6a8c3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2"
                warnings: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  # <<< M1 endpoints
  #
  # >>> M2 packages
  /api/v1/packages:
    get:
      operationId: listPackages
      tags: [packages]
      summary: List packages
      description: |
        Packages across repositories (R-API-029), with cursor pagination (R-API-010). A package is
        listed when at least one of its versions is visible to the caller, and every member of an
        entry (`latestVersion`, `repositories`, `versionCount`, `downloadCount`, `createdAt`,
        `updatedAt`) is computed from the visible versions only, so a hidden version leaks neither its
        number nor its existence. `format` and `repository` repeat for OR; a virtual repository
        expands to its members; a remote repository contributes only cached versions. `q` matches
        the name and the description case-insensitively, `namePrefix` the start of the name,
        `keyword` one keyword exactly. `createdFrom` (inclusive) and `createdTo` (exclusive) bound
        the creation time of the first visible version. `sort` takes one field, a leading `-` sorts
        descending; the default is `name`. An anonymous caller sees what anonymous holds `read` on.
        The filter runs in SQL. A sort field or filter this document does not list answers
        `400 malformed_request`.
      x-trove-permission:
        public: true
      parameters:
        - name: format
          in: query
          description: Repeat the parameter for several formats (`npm`, `nuget`, …).
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: project
          in: query
          description: |
            A project key: only the versions in the physical repositories of that project count (Q-UI-129). It
            combines with `repository` by intersection. A project the caller cannot see lists nothing.
          schema:
            type: string
        - name: repository
          in: query
          description: Repeat the parameter for several repository keys.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: q
          in: query
          description: Case-insensitive substring of the name or the description.
          schema:
            type: string
        - name: namePrefix
          in: query
          schema:
            type: string
        - name: keyword
          in: query
          schema:
            type: string
