        locale:
          type: [string, "null"]
          description: "`en`, `de` or `null` (the browser decides)."
        theme:
          type: [string, "null"]
          description: "`light`, `dark` or `null` (the system decides)."
        keyboardShortcuts:
          type: boolean
        revision:
          type: integer
          minimum: 1
      example: {locale: de, theme: null, keyboardShortcuts: false, revision: 2}
    PreferencesPatch:
      type: object
      description: "`null` resets a member to its default. `revision` is accepted and ignored."
      properties:
        locale:
          type: [string, "null"]
          description: "`en`, `de` or `null`."
        theme:
          type: [string, "null"]
          description: "`light`, `dark` or `null`."
        keyboardShortcuts:
          type: [boolean, "null"]
