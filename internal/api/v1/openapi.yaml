          description: The path of the file item in the repository that holds it.
        sizeBytes:
          type: integer
          format: int64
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        downloadUrl:
          type: string
          description: Absolute, built on the public base URL.
        contentUrl:
          type: string
          description: The relative URL of the content route of the file item (`/api/v1/projects/{projectKey}/repositories/{repoKey}/content/{path}`), which the session cookie authenticates on the role `api`; the UI's downloads use it (R-API-025, R-API-029, Q-UI-106).
    PackageVersion:
      type: object
      required: [packageId, format, name, version, prerelease, publishedAt, licenses, sizeBytes, downloadCount, hasReadme, metadata, repositories, files]
      properties:
        packageId:
          type: string
        format:
          type: string
        name:
          type: string
        version:
          type: string
        prerelease:
          type: boolean
        publishedAt:
          type: string
          format: date-time
        licenses:
          type: array
          description: SPDX identifiers or the license expression the package declares; empty when it declares none.
          items:
            type: string
        sizeBytes:
          type: integer
          format: int64
        downloadCount:
          type: integer
          format: int64
        hasReadme:
          type: boolean
          description: Whether `readme` answers 200; the UI uses it to choose the default tab without a probing request.
        metadata:
