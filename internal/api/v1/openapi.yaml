openapi: 3.1.0
info:
  title: trove management API
  version: 1.0.0
  summary: Management API of the trove artifact repository manager.
  description: |
    Every endpoint lives under `/api/v1/`; the major version in the path is the only version
    selector. Errors are `application/problem+json` (RFC 9457). Package-manager protocol endpoints
    follow their ecosystem's specification and are not part of this document.

    This document is the contract: the server code (`internal/api/v1/gen`) and the UI client types
    are generated from it. It is served at `/api/v1/openapi.json` and `/api/v1/openapi.yaml`
    without authentication and holds no instance data except `servers[0].url`, which the server
    replaces with its public base URL.

    Names. Every repository belongs to exactly one project and its key is unique within the project
    (Q-AUTHZ-206, Q-REPO-212); a repository is addressed `<projectKey>/<repoKey>`, in this document by the two
    path parameters `{projectKey}` and `{repoKey}` of `/api/v1/projects/{projectKey}/repositories/{repoKey}`, and
    on the protocol routes as `/api/<format>/<projectKey>/<repoKey>/…` and `/files/<projectKey>/<repoKey>/…`.
    Wherever a parameter or a member outside such a path holds a repository (`repository`, `repositories`, a
    `repository` filter, a link), it holds the qualified name `<projectKey>/<repoKey>`; a project's own objects (the
    members and deploy target of a virtual repository, the selectors of a project policy or a project CI mapping) name
    repositories of their project by the bare key. A project's service accounts, permission policies and CI mappings
    are named within the project (Q-AUTHZ-209): `/api/v1/projects/{projectKey}/service-accounts/{name}`, references
    `sa:<projectKey>/<name>` and `ci:<issuer>/<projectKey>/<name>`; the unprefixed routes
    `/api/v1/service-accounts…` and `/api/v1/permission-policies…` address instance-wide objects only, and their
    lists show the project of each object in a `project` member, `null` for an instance-wide one. A selector outside
    a project (a global policy, a token scope, an exposure rule) is `<projectGlob>/<keyGlob>[:<format>]` or
    `@any…[:<format>]` for all projects; a bare key there is `422` (R-AUTHZ-004).

    The declaration `x-trove-permission` of an operation is one of: `public: true`; `authenticated: true`; `role`;
    `permission: <capability>`, which admits the holders of the capability and, with `projectRole`, the members of a
    project: `projectRole: reader` admits a member of the project named by `project` (a value expression,
    `path.projectKey` or `query.project`) with at least the role Reader, `owner` one with the role Owner who may
    administer with this credential (a session, or a token with `admin: true`, Q-AUTHZ-208); without `project` the
    role is read in any project the caller is a member of, and the handler narrows. The action form
    `action: <action>, repository: path.repoKey, project: path.projectKey[, path: …]` asks for a repository action on
    the coordinate the request names, which the role of a project member grants (Q-AUTHZ-208).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://trove.example.com
    description: The public base URL (`server.base_url`); the server replaces this entry.
tags:
  - name: system
    description: Liveness of the API, build facts, installation facts and the replica registry.
  - name: meta
    description: This document and the problem catalog.
  # >>> M1 audit
  - name: audit
    description: Query and export of the audit trail.
  # <<< M1 audit
  #
  # >>> M1 api
  - name: jobs
    description: Background jobs and the maintenance tasks that start them.
  # <<< M1 api
  #
  # >>> M1 identity
  - name: users
    description: Users, their groups, disabling, deletion and the break-glass unlock (R-AUTH-016).
  - name: groups
    description: Groups and their memberships (R-AUTH-018).
  - name: service-accounts
    description: Service accounts for automation (R-AUTH-020).
  - name: tokens
    description: Personal and service-account tokens. A token value is returned by the call that creates it and never again (R-AUTH-027 to R-AUTH-030).
  - name: auth-settings
    description: The runtime authentication settings (R-AUTH-040).
  # <<< M1 identity
  #
  # >>> M1 login
  - name: auth
    description: The sign-in options and the caller's principal and credential (R-AUTH-009, R-API-021).
  - name: sessions
    description: The UI sessions of a user (R-AUTH-010).
  - name: preferences
    description: The caller's UI preferences (R-API-021).
  # <<< M1 login
  #
  # >>> M1 authz
  - name: permissions
    description: Permission policies, system roles and role bindings, and the permission checks of the caller.
  # <<< M1 authz
  #
  # >>> M5a projects
  - name: projects
    description: Projects, the container of repositories and the unit of delegated administration (R-AUTHZ-026), their members with a role (Q-AUTHZ-207, Q-AUTHZ-208) and the objects a project holds.
  # <<< M5a projects
  #
  # >>> M4 ci
  - name: ci
    description: |
      GitLab CI OIDC federation (R-CI-001 to R-CI-030): trusted CI issuers and their signing keys, identity mappings, the
      dry run, the issued CI tokens, and the token exchange at `POST /api/v1/auth/oidc/token`.
  # <<< M4 ci
  #
  # >>> M1 repository
  - name: repositories
    description: Repository configuration (create, read, update, list, delete) and the format catalog.
  # <<< M1 repository
  #
  # >>> M1 files
  - name: items
    description: Files and folders of a repository, their listing, statistics and deletion.
  - name: files
    description: Raw file transfer below `/files/<projectKey>/<repoKey>/` (PUT, GET, HEAD, DELETE), without a format protocol, and the same transfer for the UI below `/api/v1/projects/{projectKey}/repositories/{repoKey}/content/` (GET, HEAD, PUT), which the session cookie authenticates.
  # <<< M1 files
  #
  # >>> M1 endpoints
  - name: endpoints
    description: |
      The configured endpoints and the exposure rules that decide what an endpoint with
      `exposure: rules` serves (R-EP-012 to R-EP-017). Endpoints are configuration-file data and
      are read only here; exposure rules change at runtime and take effect on every replica within
      the bound of the grant index.
  # <<< M1 endpoints
  #
  # >>> M2 packages
  - name: packages
    description: Packages across repositories, their versions, files and rendered READMEs (R-API-029); the client setup snippets of a repository are in the repositories tag (R-API-030).
  # <<< M2 packages
  #
  # >>> M2 proxy
  # <<< M2 proxy
  #
  # >>> M2 virtual
  # <<< M2 virtual
  #
  # >>> M2 npm
  # <<< M2 npm
  #
  # >>> M2 ownership
  - name: ownership
    description: |
      Package ownership (R-AUTHZ-018, R-AUTHZ-019): who may change a package name in a local repository
      whose `packageOwnership` is `enforce`. The first publish claims a name for the owners its grant
      designates; these operations read the owners, add and remove them, pre-assign a name nobody has
      published, and list the names an identity owns.
  # <<< M2 ownership
  #
  # >>> M2 manual
  - name: manual
    description: The trove manual of the running version, for the help area of the UI (R-API-054, R-UI-050).
  # <<< M2 manual
  # >>> M13 bastion
  - name: bastions
    description: |
      Registrations of trove Bastions on the main installation and their tokens (R-BAS-004): the principal of the kind
      `bastion`, its `bst` tokens and the last contact of each replica.
  - name: bastion
    description: |
      The Bastion interface of the main installation (R-BAS-008 to R-BAS-016): handshake, credential and read check,
      revocation feed and download intake. The operations are called by a Bastion with its token, carry the interface
      version in `x-trove-bastion-interface` and are not part of the management API's v1 promise but of the interface
      version (R-ARCH-025, R-BAS-009).
  # <<< M13 bastion
  #
  # >>> M4b vulnerabilities
  - name: vulnerabilities
    description: |
      Vulnerability scanning (R-VULN-001 to R-VULN-029): the findings and their triage, the advisories, the summary and the
      trend, the advisory sources, the claimed-name matches, the vulnerabilities of a package version and the rescan of a
      repository.
  # <<< M4b vulnerabilities
  #
security:
  - bearerAuth: []
paths:
  /api/v1/system/ping:
    get:
      operationId: getPing
      tags: [system]
      summary: Check that this replica is ready to take work
      description: |
        Answers `200 text/plain` with `OK` while the replica is ready, a degraded replica included,
        and `503` with `UNAVAILABLE` otherwise. A Valkey outage never fails a ping. Anonymous
        callers are accepted. A presented credential is validated, so tooling can check the base URL
        and a token in one call: an invalid, expired or revoked token yields `401`.
      security:
        - {}
        - bearerAuth: []
      x-trove-permission:
        public: true
      responses:
        "200":
          description: The replica is ready.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            text/plain:
              schema:
                type: string
                enum: [OK]
              example: OK
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          description: The replica is not ready (starting, unready or draining).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            text/plain:
              schema:
                type: string
                enum: [UNAVAILABLE]
              example: UNAVAILABLE
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/system/version:
    get:
      operationId: getVersion
      tags: [system]
      summary: Build facts of this replica
      description: |
        By default this requires an authenticated caller of any kind. With
        `system.public_version: true` anonymous callers are accepted as well. Invalid credentials
        yield `401` in either mode.
      security:
        - {}
        - bearerAuth: []
      x-trove-permission:
        authenticated: true
        publicSwitch: system.public_version
      responses:
        "200":
          description: The build facts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
              example:
                version: 0.1.0
                revision: 4f1c2a9e0d7b8a6c5e3f1d2b4a6c8e0f1a3b5c7d
                buildTime: "2026-10-20T09:12:00Z"
                goVersion: go1.27.3
                formats: []
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/system/info:
    get:
      operationId: getSystemInfo
      tags: [system]
      summary: Installation facts
      description: |
        The facts an operator needs to describe the deployment, with every secret omitted.
        Cluster-wide facts come from PostgreSQL; `answeredBy` and the pools describe the replica
        that answered, because requests reach replicas at random and replicas never ask each other.
        A block whose source is not available on this replica is `null`.
      x-trove-permission:
        permission: settings:read
      responses:
        "200":
          description: The installation facts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/system/replicas:
    get:
      operationId: listReplicas
      tags: [system]
      summary: The replica registry
      description: |
        Every replica with its roles, node, state, heartbeat, readiness checks and its own view of
        Valkey. A replica whose heartbeat is older than `system.heartbeat_stale_after` is `lost`.
      x-trove-permission:
        permission: settings:read
      responses:
        "200":
          description: The replicas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplicaList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/system/migrations:
    get:
      operationId: getMigrationStatus
      tags: [system]
      summary: The schema migrations and the background data migrations
      description: |
        The upgrade verification of R-HA-020 and step 4 of the upgrade preparation of R-HA-021: the schema state, the
        answering replica's binary, the steps that binary embeds and the database has not applied (`pending`, with what the
        contract guard checks before a contract step), every applied step, and the background data migrations the binary
        declares with their states (R-HA-022). `trove migrate status` prints the same report from the same code. During a
        rolling upgrade, replicas of both releases answer, each for its own binary (`binary.version`; the replica is named in
        `X-Trove-Replica`).
      x-trove-permission:
        permission: settings:read
      responses:
        "200":
          description: The migration report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/system/overview:
    get:
      operationId: getSystemOverview
      tags: [system]
      summary: The counts and the stored content of the installation
      description: |
        What the admin dashboard shows besides the registry (Q-OPS-175): how many repositories, packages, principals,
        tokens, projects, endpoints and Bastions exist, how much content the object store holds as the metadata records
        it, and the state of the job queue. Counted from PostgreSQL by the replica that answers and cached there for
        `cacheSeconds`, so a dashboard that refreshes does not count again on every request.
      x-trove-permission:
        permission: settings:read
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemOverview"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/openapi.json:
    get:
      operationId: getOpenApiJson
      tags: [meta]
      summary: This document as JSON
      security:
        - {}
      x-trove-permission:
        public: true
      responses:
        "200":
          description: The document, with `servers[0].url` set to the public base URL.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/openapi.yaml:
    get:
      operationId: getOpenApiYaml
      tags: [meta]
      summary: This document as YAML
      security:
        - {}
      x-trove-permission:
        public: true
      responses:
        "200":
          description: The embedded document, with `servers[0].url` set to the public base URL.
          content:
            application/yaml:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/problems/{code}:
    get:
      operationId: getProblemType
      tags: [meta]
      summary: Describe a problem code
      description: |
        The `type` member of every problem is `/api/v1/problems/<code>`; this endpoint resolves it
        to a description. The registry is embedded, so the URI resolves on every installation.
      security:
        - {}
      x-trove-permission:
        public: true
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_]{1,63}$"
      responses:
        "200":
          description: The description of the code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemType"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
  # >>> M1 audit
  /api/v1/audit/events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: Query the audit trail
      description: |
        Audit events, newest first, with keyset pagination over `(occurredAt, id)` (R-OPS-017): the
        cursor is valid on every replica and no page holds a transaction. Without `from` the range is
        the last 24 hours; `to` is exclusive. `action` is an exact name or a prefix ending in `.*`
        (`authz.*`). `actor` is a principal ID or a name. `limit` is at most 1000 (default 100).
      x-trove-permission:
        permission: audit:read
      parameters:
        - name: from
          in: query
          description: Start of the range, inclusive (RFC 3339); default the last 24 hours.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: End of the range, exclusive (RFC 3339); default open.
          schema:
            type: string
            format: date-time
        - name: action
          in: query
          description: An event name, or a prefix ending in `.*` such as `authz.*`.
          schema:
            type: string
        - name: category
          in: query
          description: "One of auth, token, identity, authz, repository, content, system, config, webhook."
          schema:
            type: string
        - name: outcome
          in: query
          description: "success, failure or denied."
          schema:
            type: string
        - name: actor
          in: query
          description: A principal ID or a name.
          schema:
            type: string
        - name: repository
          in: query
          schema:
            type: string
        - name: resourceType
          in: query
          schema:
            type: string
        - name: resourceId
          in: query
          schema:
            type: string
        - name: traceId
          in: query
          description: The trace ID the client received as `X-Request-Id`.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size, 1 to 1000 (default 100).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of events.
          headers:
            Link:
              $ref: "#/components/headers/Link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
              example:
                items:
                  - id: 01933b1e-7c2a-7f4e-9d1b-6a2f0c9e8b11
                    occurredAt: "2026-10-28T11:58:02.417Z"
                    action: authz.policy.created
                    category: authz
                    outcome: success
                    actor: {type: user, id: 5f0e6c3a-6b1d-4c1e-8f43-0d7c3d1c9a10, name: sec-alice, tokenId: null, authMethod: null}
                    source: {ip: 10.12.4.7, userAgent: curl/8.7.1}
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                    replica: trove-web-6f9c7d8b5-x2v4q
                    endpoint: default
                    resource: {type: permission_policy, id: 8c0d2f4e-1f64-4b7a-9d0e-3b5c7a9e1f20}
                    repository: null
                    path: null
                    reason: null
                    details: {epoch: 1842, version: 1}
                nextCursor: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/audit/events/export:
    get:
      operationId: exportAuditEvents
      tags: [audit]
      summary: Export the audit trail
      description: |
        Streams the events of a range, oldest first, as JSON Lines (`application/x-ndjson`, default) or
        CSV (R-OPS-017). `from` and `to` are both required and cover at most 400 days
        (`400 invalid_audit_range`). The export reads keyset batches of short queries and holds no
        transaction while the client reads, so a cut export is resumed on any replica with an inclusive
        `from` set to the `occurredAt` of the last complete line, dropping the IDs already received.
        The event `audit.exported` is written before the first byte; if it cannot be written nothing is
        streamed.
      x-trove-permission:
        permission: audit:read
      parameters:
        - name: from
          in: query
          description: Start of the range, inclusive (RFC 3339). Required; a missing value answers `400 invalid_audit_range`.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: End of the range, exclusive (RFC 3339). Required; a missing value answers `400 invalid_audit_range`.
          schema:
            type: string
            format: date-time
        - name: action
          in: query
          description: An event name, or a prefix ending in `.*` such as `authz.*`.
          schema:
            type: string
        - name: category
          in: query
          description: "One of auth, token, identity, authz, repository, content, system, config, webhook."
          schema:
            type: string
        - name: outcome
          in: query
          description: "success, failure or denied."
          schema:
            type: string
        - name: actor
          in: query
          description: A principal ID or a name.
          schema:
            type: string
        - name: repository
          in: query
          schema:
            type: string
        - name: resourceType
          in: query
          schema:
            type: string
        - name: resourceId
          in: query
          schema:
            type: string
        - name: traceId
          in: query
          description: The trace ID the client received as `X-Request-Id`.
          schema:
            type: string
        - name: format
          in: query
          description: "`jsonl` (default) or `csv`."
          schema:
            type: string
            enum: [jsonl, csv]
            default: jsonl
      responses:
        "200":
          description: |
            The events of the range, oldest first. `application/x-ndjson`: one `AuditEvent` per line, each
            line a complete JSON object. `text/csv`: a header row, then one row per event with the columns
            `id`, `occurredAt`, `action`, `category`, `outcome`, `actorType`, `actorId`, `actorName`,
            `tokenId`, `authMethod`, `sourceIp`, `userAgent`, `traceId`, `replica`, `endpoint`,
            `resourceType`, `resourceId`, `repository`, `path`, `reason` and `details` (the JSON text); a
            cell that would open as a formula in a spreadsheet starts with an apostrophe. The streamed
            bodies have no schema here because a line-delimited stream is not one JSON document.
          content:
            application/x-ndjson: {}
            text/csv: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/audit/events/{id}:
    get:
      operationId: getAuditEvent
      tags: [audit]
      summary: Read one audit event
      description: One event by its ID (a UUIDv7). An ID that does not exist, or is not an event ID, answers `404`.
      x-trove-permission:
        permission: audit:read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            x-trove-reserved-names: [export]
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEvent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
