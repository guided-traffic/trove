        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The credential is valid but the operation is not permitted.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The target does not exist or is not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Internal:
      description: Unexpected failure. The `detail` is generic; the cause is in the log under the same request ID.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: A dependency is unreachable. `Retry-After` is set.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadGateway:
      description: An upstream system the operation contacts could not be reached or answered unusably (`upstream_failed`); the detail names the failure class, the HTTP status and the host, never a response body.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The request cannot be read, or a parameter, header, cursor or sort field is not valid (`malformed_request`, `invalid_cursor`, `invalid_header`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with the current state, or an idempotent request is still in progress (`Retry-After` is set then).
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: '`If-Match` does not match; the extension `currentEtag` holds the current tag (R-API-012).'
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionRequired:
      description: The operation needs `If-Match` (R-API-012).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: The body exceeds `api.max_request_body_bytes`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The body is not of the media type the operation takes.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: The body is well-formed but a value is invalid, or an `Idempotency-Key` was reused for another request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: The rate limit of the caller's class is used up (R-API-016). `Retry-After` is set.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
        RateLimit-Policy:
          $ref: "#/components/headers/RateLimitPolicy"
        RateLimit:
          $ref: "#/components/headers/RateLimit"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotModified:
      description: The ETag matches `If-None-Match`; no body.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
  schemas:
    Problem:
      type: object
      description: |
        RFC 9457 problem details. The extension members are `code`, `requestId`, `errors`, `currentEtag`, `job` and `references`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: The relative URI `/api/v1/problems/<code>`.
          example: /api/v1/problems/not_found
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          description: The request path.
        code:
          type: string
          description: Stable snake_case identifier; clients match on it.
