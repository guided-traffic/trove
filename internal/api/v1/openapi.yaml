      example:
        principal: {kind: user, name: alice, id: 0192f0c4-7a7e-7b51-9b1e-2f0d6c9e1a10, groups: [team-web]}
        credential: {type: pat, tokenId: 0192f0d1-1c2a-7c3e-8a51-6f7d2b9c4e11, scope: {inherit: true, admin: false, repositories: [], system: []}, expiresAt: "2026-11-27T10:00:00Z"}
    Session:
      type: object
