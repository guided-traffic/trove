          type: boolean
          description: "`auth.anonymous.allowed`: when false, anonymous access cannot be switched on."
        tokens:
          $ref: "#/components/schemas/AuthSettingsTokens"
    AuthSettingsProvider:
      type: object
      required: [id, displayName, available]
      properties:
        id:
          type: string
        displayName:
          type: string
        available:
          type: boolean
          description: Whether the replica that answers holds the provider's discovery document.
    AuthSettingsStatus:
      type: object
      description: Read-only status (R-AUTH-040). The break-glass password and the issuer details are not part of it.
      required: [providers, breakGlass, sessions, clients]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/AuthSettingsProvider"
        breakGlass:
          type: object
          required: [enabled, passwordStatus, lockedUntil]
          properties:
            enabled:
              type: boolean
            passwordStatus:
              type: string
              enum: [ok, not_configured, unusable, not_applicable]
              description: |
                Whether the replica that answers can verify the break-glass password (R-AUTH-014). `ok`: the account is
                enabled and holds a usable password. `not_configured`: the account is enabled but
                `auth.break_glass.password_file` is empty, so every local sign-in is refused with `403 local_login_disabled`.
                `unusable`: a file is configured but the replica holds no usable password because a rotated file did not
                contain one; local sign-in is refused until the file is fixed. `not_applicable`: the account is disabled.
                The password itself is never part of the answer.
            lockedUntil:
              type: [string, "null"]
              format: date-time
        sessions:
          type: object
          required: [idleTimeoutSeconds, absoluteTimeoutSeconds, maxPerUser, recentAuthWindowSeconds]
          properties:
            idleTimeoutSeconds:
              type: integer
            absoluteTimeoutSeconds:
              type: integer
            maxPerUser:
              type: integer
            recentAuthWindowSeconds:
              type: integer
        clients:
          type: object
          required: [basicEnabled]
          properties:
            basicEnabled:
              type: boolean
    AuthSettings:
      type: object
      description: |
        The runtime authentication settings (R-AUTH-040): the effective runtime values, the YAML ceilings they
        are bound by, and read-only status. The runtime members have the shape `PATCH` takes, so a body
        obtained by `GET` can be sent back; `ceilings` and `status` are ignored then.
      required: [anonymousAccess, tokens, ceilings, status]
      properties:
        anonymousAccess:
          type: boolean
          description: Whether anonymous access is in force (the runtime switch within the ceiling).
        tokens:
