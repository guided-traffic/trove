        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryClaimsInput"
            example:
              claims:
                - {pattern: "@acme/*", scope: global}
                - {pattern: "@partner/*"}
              removeAuto: [left-pad]
      responses:
        "200":
          description: The claims after the write, with the warnings of the write.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryClaims"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
