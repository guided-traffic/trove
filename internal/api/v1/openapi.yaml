      description: An identity mapping with its resolved defaults (R-CI-009). `warnings` is present on the answer of a save only.
      additionalProperties: false
      required: [name, description, priority, enabled, subjectKinds, match, grants, maxTtlSeconds, options, tier, issuer, version, createdBy, createdAt, updatedAt]
      properties:
        name: {type: string, pattern: "^[a-z0-9][a-z0-9._-]{1,63}$"}
        description: {type: string}
        priority: {type: integer, minimum: 1, maximum: 1000000, description: Unique within the issuer's tier.}
        enabled: {type: boolean, default: true}
        subjectKinds: {type: array, items: {type: string, enum: [id_token]}, default: [id_token], description: "`job_token` is P2 (R-CI-022)."}
        match: {$ref: "#/components/schemas/CiCondition"}
        grants: {$ref: "#/components/schemas/CiGrants"}
        maxTtlSeconds: {type: [integer, "null"], format: int64, minimum: 1, description: "Between `ci.token.min_ttl` (30 s by default) and `ci.token.max_ttl` (`422 out_of_range` otherwise). It bounds what this mapping gives a token: the token's lifetime when the mapping owns it (a system mapping, or the project mapping that lives longest), otherwise this mapping's contribution only (R-CI-016, Q-CI-47)."}
        options:
          type: object
          additionalProperties: false
          properties:
            crossProjectSource: {type: string, enum: [deny, read_only], default: deny}
            allowUnprotectedRefs: {type: boolean, default: false}
        tier: {type: string, description: "`system` or `project:<key>`; `delegation:<id>` from P1."}
        project: {type: string, description: The project key of a project mapping.}
        issuer: {type: string}
        version: {type: integer, format: int64}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        warnings: {type: array, items: {$ref: "#/components/schemas/CiWarning"}}
    CiMappingList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CiMapping"
    CiWarning:
      type: object
      additionalProperties: false
      required: [code, detail]
      properties:
        code: {type: string, description: "For example `unpinned_condition`, `repository_template_unconstrained`, `shared_ownership`."}
        pointer: {type: string}
        detail: {type: string}
    CiEvaluateRequest:
      type: object
      description: A claim set, never a token (R-CI-019).
      additionalProperties: false
      required: [claims]
      properties:
        subjectKind: {type: string, enum: [id_token], default: id_token}
        claims: {type: object, additionalProperties: true}
        scope: {type: string, description: The `scope` request parameter of the exchange to narrow with.}
        now: {type: integer, format: int64, description: "Unix seconds; when set, `exp`, `nbf` and `iat` are checked against it."}
    CiLeafResult:
      type: object
      additionalProperties: false
      required: [pointer, claim, operator, expected, actual, absent, passed]
      properties:
        pointer: {type: string}
        claim: {type: string}
        operator: {type: string}
        expected: {type: array, items: {type: string}}
        actual: {type: array, items: {type: string}}
        absent: {type: boolean}
        passed: {type: boolean}
    CiTraceEntry:
      type: object
      additionalProperties: false
      required: [tier, mapping, matched, contributes]
      properties:
        tier: {type: string}
        mapping: {type: string}
        matched: {type: boolean}
        contributes: {type: boolean, description: "False for a matched mapping whose `crossProjectSource` is `deny` on a cross-project token."}
        failedLeaf: {type: string}
        detail: {type: string}
        leaves: {type: array, items: {$ref: "#/components/schemas/CiLeafResult"}}
    CiEvaluateResult:
      type: object
      additionalProperties: false
      required: [crossProject, trace, selected]
      properties:
        crossProject: {type: boolean}
        trace: {type: array, items: {$ref: "#/components/schemas/CiTraceEntry"}}
        selected: {type: array, items: {type: string}}
        failure: {type: string, description: The reason the exchange would fail with; absent when it would succeed.}
        detail: {type: string}
        grants: {$ref: "#/components/schemas/CiGrants"}
        scope: {type: string}
        ttlSeconds: {type: integer, format: int64}
        warnings: {type: array, items: {$ref: "#/components/schemas/CiWarning"}}
    CiIssuance:
      type: object
      description: The record of one exchange (R-CI-020). It holds no token, no hash and no claim outside the allowlist.
      additionalProperties: false
      required: [tokenId, issuer, mappingNames, subjectKind, projectId, jobId, claims, grants, grantedScope, crossProject, issuedAt, expiresAt, active, state]
      properties:
        tokenId: {type: string, format: uuid}
        issuer: {type: string}
        mappingNames: {type: array, items: {type: string}}
        subjectKind: {type: string, enum: [id_token, job_token]}
        jti: {type: [string, "null"]}
        projectId: {type: string}
        projectPath: {type: [string, "null"]}
        namespaceId: {type: [string, "null"]}
        pipelineId: {type: [string, "null"]}
        jobId: {type: string}
        ref: {type: [string, "null"]}
        refType: {type: [string, "null"]}
        refProtected: {type: [boolean, "null"]}
        pipelineSource: {type: [string, "null"]}
        environment: {type: [string, "null"]}
        sha: {type: [string, "null"]}
        userId: {type: [string, "null"]}
        userLogin: {type: [string, "null"]}
        claims: {type: object, additionalProperties: true, description: The allowlisted claim snapshot.}
        grants: {type: object, additionalProperties: true, description: "The frozen use-time bundle: rendered inline grants, policy and group names, caps."}
        requestedScope: {type: [string, "null"]}
        grantedScope: {type: string, description: "The scope the token was issued with. Empty in an Owner's view, whose kept contributions show their own inline grants (Q-CI-52)."}
        crossProject: {type: boolean}
        issuedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        revokedAt: {type: [string, "null"], format: date-time, description: Set when the token row carries a revocation; absent when the token row is gone.}
        active: {type: boolean, description: "True exactly when `state` is `active`; the filter `active` selects on the same value."}
        state:
          type: string
          enum: [active, revoked, expired, removed]
          description: |
            Why the token is or is not usable (Q-CI-52). `active`: unrevoked and unexpired. `revoked`: the token was
            revoked (`revokedAt`). `expired`: the expiry has passed. `removed`: the token row is gone before its expiry
            because it went with the principal of a deleted mapping; no revocation time is known.
        clientIp: {type: [string, "null"]}
        userAgent: {type: [string, "null"]}
    CiIssuanceList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/CiIssuance"}}
        nextCursor: {type: [string, "null"]}
    CiIssuanceDetail:
      type: object
      description: An issuance record and its usage summary from the audit store.
      additionalProperties: false
      required: [issuance, usage]
      properties:
        issuance: {$ref: "#/components/schemas/CiIssuance"}
        usage:
          type: object
          additionalProperties: false
          required: [requests, packagesDeployed]
          properties:
            requests: {type: integer, format: int64}
            lastUsedAt: {type: [string, "null"], format: date-time}
            packagesDeployed: {type: array, items: {type: string}}
    CiRevokeRequest:
      type: object
      additionalProperties: false
      required: [issuer]
      properties:
        issuer: {type: string}
        projectId: {type: string}
        pipelineId: {type: string}
        jobId: {type: string}
        mapping: {type: string}
    CiRevokeResult:
      type: object
      additionalProperties: false
      required: [revoked]
      properties:
        revoked: {type: integer}
    CiExchangeRequest:
      type: object
      description: |
        The exchange parameters with the OAuth names of RFC 8693 (R-CI-007); they are not management-API fields and keep
        their snake_case spelling. `ci_issuer` and `ttl` are trove's extensions.
      additionalProperties: false
      required: [grant_type, subject_token, subject_token_type]
      properties:
        grant_type: {type: string, enum: ["urn:ietf:params:oauth:grant-type:token-exchange"]}
        subject_token: {type: string, description: The GitLab ID token. A credential; never logged.}
        subject_token_type: {type: string, enum: ["urn:ietf:params:oauth:token-type:id_token", "urn:ietf:params:oauth:token-type:jwt"]}
        requested_token_type: {type: string, enum: ["urn:ietf:params:oauth:token-type:access_token"]}
        scope: {type: string, description: "Space-delimited items `<action>` or `<action>:<repository selector>` (Q-CI-2)."}
        audience: {type: string, description: Must equal the configured base URL.}
        resource: {type: string, description: Must equal the configured base URL.}
        actor_token: {type: string, description: Not supported; answers `actor_token_not_supported`.}
        actor_token_type: {type: string}
        ci_issuer: {type: string, description: Must match the issuer selected by `iss`.}
        ttl: {type: integer, format: int64, description: "Requested lifetime in whole seconds; a form body sends it as digits and a JSON body as a number or a string of digits; can only shorten, and one below `ci.token.min_ttl` answers `ttl_below_minimum` (R-CI-016, Q-CI-41)."}
    CiExchangeResponse:
      type: object
      description: The token response (R-CI-007). The token value appears only here.
      additionalProperties: false
      required: [access_token, issued_token_type, token_type, expires_in, scope, ci_issuer, mappings]
      properties:
        access_token: {type: string, description: "A `trv_cit_` token."}
        issued_token_type: {type: string, enum: ["urn:ietf:params:oauth:token-type:access_token"]}
        token_type: {type: string, enum: [Bearer]}
        expires_in: {type: integer, format: int64}
        scope: {type: string}
        ci_issuer: {type: string}
        mappings: {type: array, items: {type: string}}
    CiExchangeError:
      type: object
      description: The OAuth error response of RFC 6749 section 5.2 with trove's `reason` and `requestId` (R-CI-008).
      additionalProperties: false
      required: [error, requestId]
      properties:
        error: {type: string, enum: [invalid_request, unsupported_grant_type, invalid_scope, invalid_target, slow_down, temporarily_unavailable, server_error]}
        error_description: {type: string, description: Holds no claim value and no token material.}
        reason: {type: string, description: "A stable reason name of R-CI-008; left out under `ci.exchange.expose_reason: false`."}
        requestId: {type: string, description: Equals the `X-Request-Id` response header.}
    CiIssuerChoice:
      type: object
      description: What an Owner of a project sees of an issuer (Q-CI-26).
      additionalProperties: false
      required: [name, kind, issuer, publicIssuer]
      properties:
        name: {type: string}
        kind: {type: string}
        issuer: {type: string}
        publicIssuer: {type: boolean}
    CiIssuerChoiceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CiIssuerChoice"
    # <<< M4 ci
    ServiceAccount:
