              type: [string, "null"]
              format: uri
              pattern: '^https://[^/?#@\s]+(/[^?#\s]*)?$'
              maxLength: 2048
              default: null
              description: |
                Mode `forward` only. The https registry URL of the advisory provider, without user info, query or fragment; null is the remote's
                upstream URL. The provider gets the repository's sealed upstream credentials only when it is the upstream's
                origin or an `extraHosts` entry with `sendCredentials` (R-REPO-033), never through the URL.
            timeout:
              type: string
              pattern: '^([1-9]|[1-9][0-9]|[12][0-9]{2}|300)s$'
              default: 30s
              description: Mode `forward` only. The longest a forward may take, `1s` to `300s`; never longer than `server.shutdown_timeout` minus one second.
            maxBodySize:
              type: string
              pattern: '^([1-9][0-9]{0,3}KiB|([1-9]|10)MiB)$'
              default: 1MiB
              description: The largest audit body as sent, `1KiB` to `10MiB`; ten times that decompressed. Larger bodies answer 413.
    NugetSettings:
      type: object
      additionalProperties: false
      description: |
        The settings of the NuGet format, the `nuget` member of a repository document (R-REPO-004). The document
        of the format's JSON Schema is `settingsSchema` of `GET /api/v1/formats`; `TestR_ARCH_008_NugetSettingsSchemaEqualsTheOpenAPIMember`
        fails on any difference between the two. A setting that does not apply to the class of the repository
        answers 422 `not_applicable`. An omitted setting takes its default.
      properties:
        deleteMode:
          type: string
          enum: [unlist, delete]
          default: unlist
          description: |
            Local repositories (R-NUGET-007, Q-NUGET-1). What the protocol `DELETE` of a package does: `unlist` keeps the
            version in the flat container and downloadable, `delete` removes it and writes its tombstone. A delete through
            the management API, the UI or `/files/` is always a hard delete.
        forwardSearch:
          type: boolean
          default: true
          description: |
            Remote repositories (R-NUGET-016, Q-NUGET-4). Forward the search and autocomplete requests to the upstream's
            search resource; `false` answers from the packages the remote has cached.
        vulnerabilityInfo:
          type: string
          enum: [local, "off"]
          description: |
            The vulnerability information of the service index (R-VULN-018): `local` lists VulnerabilityInfo/6.7.0 and serves trove's
            own NuGet advisory data while that data is complete (every class; answers like `off` while `vulnerabilities.enabled` is
            false); `off` lists nothing. Left out, the mode is `local` while `vulnerabilities.enabled` is true and the OSV source is not
            off, else `off`. The pass-through of the upstream's information, `upstream`, is refused until R-NUGET-023 is built.
    OciSettings:
      type: object
      additionalProperties: false
      description: |
        The settings of the OCI format, the `oci` member of a repository document (R-REPO-004, R-OCI-026). The document of the
        format's JSON Schema is `settingsSchema` of `GET /api/v1/formats`; `TestR_ARCH_008_OciSettingsSchemaEqualsTheOpenAPIMember`
        fails on any difference between the two. Local and virtual repositories have no settings of the format: a setting that
        does not apply to the class of the repository answers 422 `not_applicable`. An omitted setting takes its default.
      properties:
        mirror:
          type: object
          additionalProperties: false
          description: |
            Remote repositories (R-OCI-026, Q-OCI-16). What a mirror of a registry keeps; present in both modes and effective in mode
            `mirror`. A caller without `repositories:write-config` on the project cannot change it on a mirror (R-REPO-050, Q-OCI-22).
          properties:
            tags:
              type: array
              minItems: 1
              maxItems: 64
              uniqueItems: true
              default: [latest]
              description: Tag patterns (`*` and `?`) a tag must match to be mirrored; a pattern without a wildcard names a tag that is always kept.
              items:
                type: string
                pattern: "^[a-zA-Z0-9_.*?-]{1,128}$"
            excludeTags:
              type: array
              maxItems: 64
              uniqueItems: true
              default: []
              description: Tag patterns that are never mirrored.
              items:
                type: string
                pattern: "^[a-zA-Z0-9_.*?-]{1,128}$"
            platforms:
              type: array
              maxItems: 32
              uniqueItems: true
              default: []
              description: Platforms (`os/arch` or `os/arch/variant`) of an index whose manifests are mirrored; empty is every platform.
              items:
                type: string
                pattern: "^[a-z0-9]+/[a-z0-9]+(?:/[a-z0-9]+)?$"
    RepositoryConsumerView:
      type: object
      description: What a caller sees who may read a repository but not its configuration (R-REPO-010).
      required: [key, class, format, description, layout, addresses]
      properties:
        key:
          type: string
        class:
          type: string
          enum: [local, remote, virtual]
        format:
          type: string
        description:
          type: string
        layout:
          type: string
        addresses:
          type: array
          description: "The client addresses: absolute URLs, the public base URL followed by the repository's path."
          items:
            type: string
    RepositoryRead:
      description: The answer of a read, by the caller's view.
      anyOf:
        - $ref: "#/components/schemas/Repository"
        - $ref: "#/components/schemas/RepositoryConsumerView"
    RepositorySummary:
      type: object
      required: [key, class, format, description, addresses, disabled, lastActivityAt, project]
      properties:
        key:
          type: string
        class:
          type: string
          enum: [local, remote, virtual]
        format:
          type: string
        description:
          type: string
        addresses:
          type: array
          description: "The client addresses: absolute URLs, the public base URL followed by the repository's path."
          items:
            type: string
        disabled:
          type: boolean
        lifecycle:
          type: string
          enum: [active, deleting]
          description: Only a holder of `repositories:read-config` sees a repository being deleted.
        lastActivityAt:
          type: [string, "null"]
          format: date-time
        project:
          type: string
          description: The key of the project the repository belongs to; the name is `<project>/<key>` (Q-AUTHZ-206).
    RepositoryList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            anyOf:
              - $ref: "#/components/schemas/RepositorySummary"
              - $ref: "#/components/schemas/Repository"
        nextCursor:
          type: [string, "null"]
    # <<< M1 repository
    #
    # >>> M1 files
    Stamp:
      type: object
      required: [at, by]
      properties:
        at:
          type: string
          format: date-time
        by:
          type: [string, "null"]
          description: "`<kind>:<name>` of the principal, such as `user:alice` or `ci:acme/web`; null when the principal has no record."
    Digests:
      type: object
      properties:
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        sha512:
          type: string
          pattern: "^[0-9a-f]{128}$"
        sha1:
          type: string
          pattern: "^[0-9a-f]{40}$"
        md5:
          type: string
          pattern: "^[0-9a-f]{32}$"
    Item:
      type: object
      description: The description of a file or folder (R-STOR-016, R-STOR-007).
      required: [repository, path, kind, created, modified, updatedAt, package, upstreamUrl, itemUrl]
      properties:
        repository:
          type: string
        path:
          type: string
        kind:
          type: string
          enum: [file, folder]
        size:
          type: integer
          minimum: 0
          description: Files only.
        mediaType:
          type: string
          description: Files only; `application/octet-stream` when none was recorded.
        explicit:
          type: boolean
          description: Folders only; false for a folder that exists because a file lies below it.
        created:
          $ref: "#/components/schemas/Stamp"
        modified:
          $ref: "#/components/schemas/Stamp"
        updatedAt:
          type: string
          format: date-time
        digests:
          $ref: "#/components/schemas/Digests"
        declaredDigests:
          $ref: "#/components/schemas/Digests"
        declaredMismatch:
          type: boolean
        contentStatus:
          type: string
          enum: [ok, missing, corrupt]
        package:
          type: "null"
          description: Always null for a generic repository.
        upstreamUrl:
          type: "null"
          description: Always null for a local repository.
        downloadUrl:
          type: string
          description: Files only.
        contentUrl:
          type: string
          description: Files only. The relative URL of the content route of the file (`/api/v1/projects/{projectKey}/repositories/{repoKey}/content/{path}`), which the session cookie authenticates on the role `api`; the UI's downloads use it (R-API-025, Q-UI-106).
        listingUrl:
          type: string
          description: Folders only.
        itemUrl:
          type: string
    Child:
      type: object
      required: [path, kind]
      properties:
        path:
          type: string
          description: Relative to the listed folder.
        kind:
          type: string
          enum: [file, folder]
        size:
          type: integer
          minimum: 0
        modifiedAt:
          type: string
          format: date-time
        sha256:
          type: string
        sha1:
          type: string
    ChildrenPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Child"
        nextCursor:
          type: [string, "null"]
    ItemStats:
      type: object
      required: [downloads, lastDownloadAt, lastDownloader]
      properties:
        downloads:
          type: integer
          minimum: 0
        lastDownloadAt:
          type: [string, "null"]
          format: date-time
        lastDownloader:
          type: [string, "null"]
    # <<< M1 files
    #
    # >>> M1 endpoints
    EndpointList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Endpoint"
        nextCursor:
          type: [string, "null"]
          description: Opaque; `null` on the last page.
    Endpoint:
      type: object
      required: [name, inert, ruleCount, enabledRuleCount, configuration]
      properties:
        name:
          type: string
        inert:
          type: boolean
          description: The name is not configured but still has exposure rules (H-58); they have no effect.
        ruleCount:
          type: integer
          format: int64
        enabledRuleCount:
          type: integer
          format: int64
        configuration:
          description: The endpoint as the configuration file sets it, defaults applied (R-EP-001); `null` for an inert name.
          oneOf:
            - $ref: "#/components/schemas/EndpointConfiguration"
            - type: "null"
    EndpointConfiguration:
      type: object
      required: [default, port, baseUrl, hosts, wildcardHost, hostRoots, pool, surface, auth, exposure, cacheFill, rateLimit, replicaHeader]
      properties:
        default:
          type: boolean
          description: The default endpoint of `server.listen`.
        port:
          type: [integer, "null"]
          description: The port of the listener; `null` when it is chosen at start-up (port 0).
        baseUrl:
          type: string
        hosts:
          type: array
          description: The exact hosts of the host set (R-EP-003).
          items:
            type: string
        wildcardHost:
          type: [string, "null"]
        hostRoots:
          type: object
          description: Host-root bindings, host to repository, the value being `<projectKey>/<repoKey>` (R-EP-006).
          additionalProperties:
            type: string
        pool:
          type: [string, "null"]
          description: The web pool that serves the endpoint; `null` for the main web Deployment.
        surface:
          type: array
          items:
            type: string
            enum: [ui, api, ci_exchange, packages, files]
        auth:
          type: object
          required: [tokenTypes, boundTokensOnly, anonymous]
          description: The credentials the endpoint accepts (R-EP-010).
          properties:
            tokenTypes:
              type: array
              items:
                type: string
                enum: [pat, sat, cit]
            boundTokensOnly:
              type: boolean
            anonymous:
              type: boolean
        exposure:
          type: string
          enum: [all, rules]
        cacheFill:
          type: boolean
        rateLimit:
          description: The endpoint's rate-limit class (R-EP-015); `null` for none.
          oneOf:
            - $ref: "#/components/schemas/EndpointRateLimit"
            - type: "null"
        replicaHeader:
          type: string
          enum: [authenticated, always, never]
    EndpointRateLimit:
      type: object
      required: [class, requestsPerSecond, burst, key]
      properties:
        class:
          type: string
        requestsPerSecond:
          type: number
        burst:
          type: integer
        key:
          type: string
          enum: [principal, address]
    ExposurePatterns:
      type: object
      description: Include and exclude globs of R-AUTHZ-005; an empty include list leaves the dimension unrestricted.
      properties:
        include:
          type: array
          maxItems: 256
          items:
            type: string
            minLength: 1
            maxLength: 1024
        exclude:
          type: array
          maxItems: 256
          items:
            type: string
            minLength: 1
            maxLength: 1024
    ExposureVersions:
      type: object
      properties:
        include:
          type: array
          maxItems: 256
          items:
            type: string
        exclude:
          type: array
          maxItems: 256
          items:
            type: string
        range:
          type: [string, "null"]
          maxLength: 256
          description: One range in the format's native syntax, validated by the format.
    ExposureRule:
      type: object
      description: |
        An exposure rule (R-EP-012). The request type is the response type: the read-only members
        (`endpoint`, `inert`, `warnings`, `revision`, the times and the actors) are accepted and
        ignored on a write. `name` and `repository` are required on a create and immutable after it;
        every other member has the default shown.
      required: [name, repository]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
        description:
          type: string
          maxLength: 2000
          default: ""
        repository:
          type: string
          description: The key of the repository the rule exposes; the rule is stored by the repository's ID (Q-EP-8).
        enabled:
          type: boolean
          default: true
        packages:
          $ref: "#/components/schemas/ExposurePatterns"
        paths:
          $ref: "#/components/schemas/ExposurePatterns"
        versions:
          $ref: "#/components/schemas/ExposureVersions"
        prereleases:
          type: boolean
          default: false
        distTags:
          $ref: "#/components/schemas/ExposurePatterns"
        endpoint:
          type: string
          readOnly: true
        inert:
          type: boolean
          readOnly: true
          description: The endpoint is not configured; the rule has no effect (H-58).
        warnings:
          type: array
          readOnly: true
          description: "`path_patterns_on_package_format`, `endpoint_not_in_rules_mode`."
          items:
            type: string
        revision:
          type: integer
          format: int64
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: [string, "null"]
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        updatedBy:
          type: [string, "null"]
          readOnly: true
      example:
        name: acme-sdk
        description: SDK releases for customers
        repository: web/npm-customers
        enabled: true
        packages: {include: ["@acme/sdk", "@acme/sdk-*"], exclude: ["@acme/sdk-internal"]}
        paths: {include: [], exclude: []}
        versions: {include: [], exclude: ["2.0.1"], range: ">=2.0.0"}
        prereleases: false
        distTags: {include: [latest, lts], exclude: []}
    ExposureRuleList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExposureRule"
        nextCursor:
          type: [string, "null"]
          description: Opaque; `null` on the last page.
    ExposureCheckRequest:
      type: object
      required: [repository]
      properties:
        repository:
          type: string
        package:
          type: string
          description: The package to check; absent checks the repository.
        versions:
          type: array
          maxItems: 1000
          description: Versions of the package. For a format with versions, an absent or empty list means the versions the repository stores of the package that the caller may read, newest first (Q-EP-61, Q-EP-62, Q-EP-63).
          items:
            type: string
        paths:
          type: array
          maxItems: 1000
          description: Paths to check, the dimension of generic repositories.
          items:
            type: string
        rule:
          $ref: "#/components/schemas/ExposureRule"
    ExposureCheckVersion:
      type: object
      required: [version, exposed, rule, reason]
      properties:
        version:
          type: string
        exposed:
          type: boolean
        rule:
          type: [string, "null"]
          description: The rule that exposes the version.
        reason:
          type: string
    ExposureCheckPath:
      type: object
      required: [path, exposed, rule, reason]
      properties:
        path:
          type: string
        exposed:
          type: boolean
        rule:
          type: [string, "null"]
          description: The rule that exposes the path.
        reason:
          type: string
    ExposureCheckTag:
      type: object
      required: [tag, version, visible]
      properties:
        tag:
          type: string
        version:
          type: string
        visible:
          type: boolean
    ExposureCheck:
      type: object
      required: [endpoint, repository, mode, package, packageExposed, rule, reason, versions, paths, distTags, exposureFingerprint, warnings]
      properties:
        endpoint:
          type: string
        repository:
          type: string
        mode:
          type: string
          enum: [all, rules]
        package:
          type: [string, "null"]
        packageExposed:
          type: boolean
          description: The verdict on the package, or on the repository when the check names no package.
        rule:
          type: [string, "null"]
        reason:
          type: string
        versions:
          type: array
          items:
            $ref: "#/components/schemas/ExposureCheckVersion"
        paths:
          type: array
          items:
            $ref: "#/components/schemas/ExposureCheckPath"
        distTags:
          type: array
          description: The tags the repository stores of the package, sorted by name, and whether each is visible; formats with tags only, and empty when no package is named or the repository does not list its tags.
          items:
            $ref: "#/components/schemas/ExposureCheckTag"
        exposureFingerprint:
          type: string
          description: SHA-256 over the mode and the ID, revision and state of every stored rule of the endpoint for the repository (R-EP-018).
        warnings:
          type: array
          description: "`endpoint_not_in_rules_mode`, `stored_versions_not_listed` or `stored_versions_truncated`."
          items:
            type: string
    # <<< M1 endpoints
