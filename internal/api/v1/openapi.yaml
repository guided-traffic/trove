  /api/v1/tokens:
    post:
      operationId: createToken
      tags: [tokens]
      summary: Create a personal access token
      description: |
        Creates a PAT for the caller (R-AUTH-027). The caller is a user with a session whose last interactive
        authentication is recent (`401 reauthentication_required` otherwise), or a PAT under the derivation rule:
        the new token has the presenting token's type and owner, expires no later than it and carries no broader
        scope (`403 derivation_exceeds_parent`). A CI token, the break-glass account and an `owner` naming anyone but
        the caller are refused (`ci_token_restricted`, `break_glass_restricted`, `forbidden`).

        The token value is in this answer only; no other operation returns it. The answer is never cached
        (`Cache-Control: no-store`). A retry with the same `Idempotency-Key` answers `409 token_already_issued` with
        the `tokenId`, because the value is not stored.
      x-trove-recent-auth: true
      x-trove-permission:
        authenticated: true
      x-trove-idempotency-key: optional
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: The token with its value.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            Cache-Control:
              description: '`no-store`: the answer holds a secret or must not be reused.'
              schema:
                type: string
                enum: [no-store]
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: listTokens
      tags: [tokens]
      summary: List tokens
      description: |
        Tokens newest first (R-AUTH-028). A caller without `tokens:read` sees its own tokens only and `owner` is forced
        to `me`, except that an Owner of a project lists the tokens of a service account of its project with
        `owner=sa:<project>/<name>` (R-AUTHZ-026, Q-AUTHZ-177). Through a token whose scope does not inherit its
        owner's rights, the own tokens are that token and the tokens derived from it (Q-AUTH-199). The state defaults to `active`. Neither the value nor its hash is ever returned. Cursor pagination
        (R-API-010) over the token `id`.
      x-trove-permission:
        authenticated: true
      parameters:
        - name: owner
          in: query
          description: "`me`, a username or `sa:<name>`."
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [pat, sat, cit]
        - name: state
          in: query
          schema:
            type: string
            enum: [active, expired, revoked, all]
            default: active
        - name: expiresBefore
          in: query
          schema:
            type: string
            format: date-time
        - name: expiresAfter
          in: query
          schema:
            type: string
            format: date-time
        - name: lastUsedBefore
          in: query
          description: Finds stale tokens, those last used before the instant and those never used (`lastUsedAt` null). The last use is written in batches, at most once per `auth.tokens.last_used_granularity` (R-AUTH-031), so it can be a few minutes behind.
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of tokens.
          headers:
            Link:
              $ref: "#/components/headers/Link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"

