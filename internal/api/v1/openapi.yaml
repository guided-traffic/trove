        degradedReplicas:
          type: [integer, "null"]
          description: Live replicas whose Valkey check is degraded; `null` until the replica registry exists.
    ObjectStoreFacts:
      type: object
      required: [endpoint, bucket, prefix, credentialSource]
      properties:
        endpoint:
          type: string
        bucket:
          type: string
        prefix:
          type: string
        credentialSource:
          type: string
          description: Open enum, for example `static` or `workload-identity`.
    SystemOverview:
      type: object
      required: [computedAt, cacheSeconds, counts, storage, jobs]
      properties:
        computedAt:
          type: string
          format: date-time
          description: When the answering replica counted.
        cacheSeconds:
          type: integer
          description: How long the answering replica reuses the counts.
        counts:
          type: object
          required: [repositories, packages, packageVersions, users, groups, serviceAccounts, activeTokens, projects, endpoints, bastions]
          properties:
            repositories:
              type: object
              required: [total, byClass]
              properties:
                total:
                  type: integer
                byClass:
                  type: object
                  description: Per repository class (`local`, `remote`, `virtual`).
                  additionalProperties:
                    type: integer
            packages:
              type: integer
              format: int64
            packageVersions:
              type: integer
              format: int64
            users:
              type: integer
              description: Users, disabled ones included.
            groups:
              type: integer
            serviceAccounts:
              type: integer
              description: Service accounts, disabled ones included.
            activeTokens:
              type: integer
              description: Tokens of every type neither expired nor revoked.
            projects:
              type: integer
            endpoints:
              type: integer
            bastions:
              type: integer
        storage:
          type: object
          description: |
            The content of the object store as the metadata records it: one object per distinct content (deduplicated), not
            what the store bills (object versions, incomplete uploads and the store's own overhead are not counted).
          required: [blobs, bytes, pendingDeletion]
          properties:
            blobs:
              type: integer
              format: int64
            bytes:
              type: integer
              format: int64
            pendingDeletion:
              type: integer
              format: int64
              description: Objects queued for the garbage collection.
        jobs:
          type: object
          required: [queued, running, failedLast24h]
          properties:
            queued:
              type: integer
            running:
              type: integer
            failedLast24h:
              type: integer
    MigrationStatus:
      type: object
      description: The migration report of GET /api/v1/system/migrations (R-HA-018, R-HA-020, R-HA-021, R-HA-022).
      required: [schema, binary, pending, applied, background]
      properties:
        schema:
          type: object
          required: [applied, compatFloor]
          properties:
            applied:
              type: integer
              description: The number of the newest applied step; 0 before the first migration.
            compatFloor:
              type: string
              description: |
                The highest `requires-app` of the applied contract steps, `0.0.0` while none is applied. A binary older than
                the floor does not serve (R-HA-018).
              examples: ["0.0.0"]
        binary:
          type: object
          required: [version, requiredSchema]
          properties:
            version:
              type: string
              description: The release of the answering replica.
            requiredSchema:
              type: integer
              description: The newest expand step the answering replica's binary embeds; a replica serves once `schema.applied` reaches it.
        pending:
          type: array
          description: The steps the answering replica's binary embeds that the database has not applied, in order; empty after a completed upgrade.
          items:
            $ref: "#/components/schemas/PendingMigrationStep"
        applied:
          type: array
          description: Every applied step in order, the steps of newer releases than the answering replica's included.
          items:
            $ref: "#/components/schemas/AppliedMigrationStep"
        background:
          type: array
          description: The background data migrations the answering replica's binary declares, with their states.
          items:
            $ref: "#/components/schemas/BackgroundMigration"
    PendingMigrationStep:
      type: object
      required: [version, name, class, requiresApp, requiresBackground]
      properties:
        version:
          type: integer
        name:
          type: string
          examples: ["00043_example"]
        class:
          type: string
          enum: [expand, contract]
        requiresApp:
          type: [string, "null"]
          description: |
            A contract step's `-- trove:requires-app`: the oldest release allowed to serve once the step is applied. The
            contract guard refuses the step while a live replica runs an older release. `null` for an expand step.
        requiresBackground:
          type: array
          description: |
            A contract step's `-- trove:requires-background`: the background data migrations that must have `succeeded`
            before the contract guard lets the step run (R-HA-021 step 4). Empty for every other step.
          items:
            type: string
    AppliedMigrationStep:
      type: object
      required: [version, name, class, release, appliedAt, durationMs]
      properties:
        version:
          type: integer
        name:
          type: string
          examples: ["00001_core"]
        class:
          type: string
          enum: [expand, contract]
        release:
          type: string
          description: The release whose migration Job applied the step.
        appliedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
    BackgroundMigration:
      type: object
      description: |
        A background data migration (R-HA-022): a data change too large for the migration Job, run as the job kind
        `data_migration_<name>` on a worker. Its state comes from its completion record and from the newest job of its kind.
      required: [name, release, state, processed, estimatedTotal, startedAt]
      properties:
        name:
          type: string
          examples: ["nuget_semver2"]
        release:
          type: string
          description: The release that introduced it; it starts once every live replica runs that release or a newer one.
        state:
          type: string
          enum: [pending, running, paused, succeeded, failed]
          description: |
            `pending` until a run starts, also while a run waits for replicas of an older release and after a cancelled run
            (a worker queues it again when it starts); `running` while a run holds it; `failed` when its newest run failed;
            `succeeded` once its completion is recorded. `paused` belongs to the pause operation of R-HA-022, which is not
            built.
        processed:
          type: integer
          format: int64
          description: The rows converted so far; for a succeeded migration the count of its completion.
        estimatedTotal:
          type: [integer, "null"]
          format: int64
          description: The migration's own estimate of its rows; `null` while it has none.
        startedAt:
          type: [string, "null"]
          format: date-time
          description: The start of its first run; `null` before a run started or once the job rows are removed (`jobs.retention`).
    ReplicaList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Replica"
    Replica:
      type: object
      required:
        - name
        - instanceUid
        - version
        - revision
        - roles
        - state
        - lost
        - startedAt
        - heartbeatAt
        - leases
        - node
        - checks
        - degraded
        - valkey
      properties:
        name:
          type: string
          description: The pod name, else the host name.
        instanceUid:
          type: string
          description: Random per process start.
        version:
          type: string
        revision:
          type: string
        roles:
          type: array
          description: "The role the replica registered with (Q-OPS-161), as the registry names it: `api`, `packages`, `worker`, `web` (the upgrade bridge) or `all` (the development role). One entry per replica."
          items:
            type: string
            enum: [api, packages, worker, web, all]
          example: [packages]
        pool:
          type: [string, "null"]
          description: The endpoint pool or worker pool the replica belongs to (`TROVE_POOL_NAME`); `null` for the main Deployment of its role.
        state:
          type: string
          enum: [starting, ready, unready, draining]
        lost:
          type: boolean
          description: The heartbeat is older than `system.heartbeat_stale_after`.
        startedAt:
          type: string
          format: date-time
        heartbeatAt:
          type: string
          format: date-time
        leases:
          type: array
          items:
            type: object
            required: [name, since]
            properties:
              name:
                type: string
              since:
                type: string
                format: date-time
        node:
          type: [string, "null"]
          description: The Kubernetes node name (`TROVE_NODE_NAME`); `null` outside Kubernetes.
        checks:
          type: object
          description: The last result of every readiness check, gating and reported.
          additionalProperties:
            $ref: "#/components/schemas/CheckResult"
        degraded:
          type: array
          description: The reported checks that fail.
          items:
            type: string
        valkey:
          oneOf:
            - $ref: "#/components/schemas/ValkeyView"
            - type: "null"
        runtime:
          description: "The replica's own measurements of its last heartbeat period (Q-OPS-175); `null` until its first heartbeat after the start, and for a replica of a release before them."
          oneOf:
            - $ref: "#/components/schemas/ReplicaRuntime"
            - type: "null"
    ReplicaRuntime:
      type: object
      description: |
        Written with the replica's heartbeat (Q-OPS-175): the requests it finished on its client listener, its CPU and memory,
        over the last heartbeat period. The percentiles are `null` when no request finished in the window.
      required: [sampledAt, windowSeconds, requests, errors, inFlight, latencyMs, cpuCores, cpuLimitCores, memoryBytes, memoryLimitBytes, goroutines]
      properties:
        sampledAt:
          type: string
          format: date-time
        windowSeconds:
          type: number
          description: The period the counts, the rate and the percentiles cover.
        requests:
          type: integer
          format: int64
          description: Requests finished in the window.
        errors:
          type: integer
          format: int64
          description: Of those, the ones answered with a 5xx status.
        inFlight:
          type: integer
          description: Requests being served when the snapshot was taken.
        latencyMs:
          type: object
          required: [p50, p95, p99]
          properties:
            p50:
              type: [number, "null"]
            p95:
              type: [number, "null"]
            p99:
              type: [number, "null"]
        cpuCores:
          type: number
          description: CPU time used per second of the window; 1.0 is one core busy.
        cpuLimitCores:
          type: [number, "null"]
          description: The cores the process may use (`GOMAXPROCS`, which follows the container's CPU limit); `null` when unknown.
        memoryBytes:
          type: integer
          format: int64
          description: The memory the Go runtime holds from the system (heap, stacks, runtime structures).
        memoryLimitBytes:
          type: integer
          format: int64
          description: The container memory limit; 0 when none is known.
        goroutines:
          type: integer
    CheckResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pass, fail, degraded]
        reason:
          type: string
          description: A short sanitised reason; never a host, address or error text.
        configError:
          type: boolean
        durationMs:
          type: number
          description: How long the check's last finished run took (Q-OPS-175); absent while the check has not finished a run (not run yet, a run skipped because the previous one still hangs, the synthetic `draining` check) and for a replica of a release before it.
    ValkeyView:
      type: object
      description: The replica's view of Valkey. No credential, user name or key appears.
      required: [state, reason, circuit, primary, sentinelsReachable, sentinelsConfigured, serverVersion, lastPrimaryChangeAt]
      properties:
        state:
          type: string
          enum: [available, degraded]
        reason:
          type: [string, "null"]
          description: "`null`, or an error kind (`timeout`, `connection`, `readonly`, `auth`, `tls`, `oom`), `no_primary` or `unsupported_version`."
        circuit:
          type: string
          description: Open enum, for example `closed` or `open`.
        primary:
          type: [string, "null"]
          description: The primary address (host and port) the client currently uses.
        sentinelsReachable:
          type: integer
        sentinelsConfigured:
          type: integer
        serverVersion:
          type: [string, "null"]
        lastPrimaryChangeAt:
          type: [string, "null"]
          format: date-time
    # >>> M1 audit
    AuditActor:
      type: object
      additionalProperties: false
      required: [type, id, name, tokenId, authMethod]
      properties:
        type:
          type: string
          description: "`user`, `service_account`, `ci`, `breakglass`, `anonymous`, `admin-cli` or `system`."
        id:
          type: [string, "null"]
        name:
          type: [string, "null"]
        tokenId:
          type: [string, "null"]
        authMethod:
          type: [string, "null"]
          description: "`bearer`, `basic`, `session`, `api_key`, or null."
    AuditSource:
      type: object
      additionalProperties: false
      required: [ip, userAgent]
      properties:
        ip:
          type: [string, "null"]
        userAgent:
          type: [string, "null"]
    AuditResource:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: [string, "null"]
        id:
          type: [string, "null"]
    AuditEvent:
      type: object
      description: One audit event (R-OPS-017). The event names, categories and the shape of `details` per name are R-OPS-016; `details` never holds a secret.
      additionalProperties: false
      required: [id, occurredAt, action, category, outcome, actor, source, traceId, replica, endpoint, resource, repository, path, reason, details]
      properties:
        id:
          type: string
          description: A UUIDv7 the producer made; the time it carries is close to `occurredAt`.
        occurredAt:
          type: string
          format: date-time
        action:
          type: string
          examples: [authz.policy.created]
        category:
          type: string
        outcome:
          type: string
          enum: [success, failure, denied]
        actor:
          $ref: "#/components/schemas/AuditActor"
        source:
          $ref: "#/components/schemas/AuditSource"
        traceId:
          type: [string, "null"]
        replica:
          type: [string, "null"]
        endpoint:
          type: [string, "null"]
        resource:
          $ref: "#/components/schemas/AuditResource"
        repository:
          type: [string, "null"]
        path:
          type: [string, "null"]
        reason:
          type: [string, "null"]
        details:
          type: object
          additionalProperties: true
    AuditEventList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        nextCursor:
          type: [string, "null"]
    # <<< M1 audit
    #
    # >>> M1 api
    JobState:
      type: string
      enum: [queued, running, succeeded, failed, cancelling, cancelled]
    TaskName:
      type: string
      pattern: "^[a-z][a-z0-9_.:-]{0,62}$"
    TaskRunRequest:
      type: object
      description: The parameters of the task; each task defines its own (garbage collection takes `dryRun`, the OSV sync tasks `vuln-sync-osv` and `vuln-sync-osv-full` take `acceptShrink`).
      additionalProperties: true
    JobProgress:
      type: object
      required: [done, total, unit]
      properties:
        done:
          type: integer
          format: int64
        total:
          type: [integer, "null"]
          format: int64
        unit:
          type: [string, "null"]
    JobTarget:
      type: object
      required: [kind, key]
      properties:
        kind:
          type: string
        key:
          type: string
    JobError:
      type: object
      additionalProperties: false
      required: [code]
      description: Why the last attempt of a job failed, or why the job ended without succeeding (R-OPS-019, Q-OPS-186).
      properties:
        code:
          type: string
          description: Stable snake_case identifier; clients match on it.
          enum: [job_failed, job_timeout, attempts_exhausted, cancelled, superseded]
        detail:
          type: string
          description: The text of the failed attempt's error as the handler returned it, cut to 2,000 bytes; a handler whose error could carry a secret or a full URL reduces it before it returns. Not translated.
        attempt:
          type: integer
          minimum: 1
          description: The attempt the detail belongs to; absent where the reaper or a cancel wrote the error. A job queued or running again keeps the error of the attempt before.
    Job:
      type: object
      required: [id, kind, state, replica, enqueuedAt, startedAt, finishedAt, attempt, maxAttempts, progress, result, error, triggeredBy, target, href]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          example: gc
        state:
          $ref: "#/components/schemas/JobState"
        replica:
          type: [string, "null"]
          description: The name of the replica that ran or runs the job; `null` while it is queued.
        enqueuedAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        attempt:
          type: integer
        maxAttempts:
          type: integer
        progress:
          oneOf:
            - $ref: "#/components/schemas/JobProgress"
            - type: "null"
        result:
          type: [object, "null"]
          description: The result summary the kind defines; `null` until the job succeeded.
          additionalProperties: true
        error:
          description: Why the last attempt failed or why the job ended without succeeding; `null` until an attempt failed or the job was cancelled.
          oneOf:
            - $ref: "#/components/schemas/JobError"
            - type: "null"
        triggeredBy:
          type: [string, "null"]
          description: The ID of the principal that started the job; `null` for scheduled and system runs.
        target:
          oneOf:
            - $ref: "#/components/schemas/JobTarget"
            - type: "null"
        href:
          type: string
          description: The path to poll.
    JobList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        nextCursor:
          type: [string, "null"]
          description: Opaque; `null` on the last page.
    JobReference:
      type: object
      required: [id, kind, state, href]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        state:
          $ref: "#/components/schemas/JobState"
        href:
          type: string
    JobReferenceEnvelope:
      type: object
      required: [job]
      properties:
        job:
          $ref: "#/components/schemas/JobReference"
    TaskLastRun:
      type: object
      required: [jobId, startedAt, finishedAt, outcome, replica]
      properties:
        jobId:
          type: string
          format: uuid
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        outcome:
          $ref: "#/components/schemas/JobState"
        replica:
          type: [string, "null"]
    Task:
      type: object
      required: [name, schedule, enabled, nextRunAt, running, lastRun]
      properties:
        name:
          $ref: "#/components/schemas/TaskName"
        schedule:
          type: [string, "null"]
          description: Five-field cron expression in UTC; `null` for a manual-only task.
        enabled:
          type: boolean
        nextRunAt:
          type: [string, "null"]
          format: date-time
          description: "`null` for a manual-only or disabled task."
        running:
          type: boolean
        lastRun:
          oneOf:
            - $ref: "#/components/schemas/TaskLastRun"
            - type: "null"
    TaskList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        nextCursor:
          type: [string, "null"]
    EncryptionKey:
      type: object
      required: [id, active, sealedValues, canary]
      properties:
        id:
          type: string
        active:
          type: boolean
          description: The answering replica seals with this key.
        sealedValues:
          type: integer
          format: int64
          description: Sealed values under this key ID over every registered sealed column.
        canary:
          type: string
          enum: [ok, failed, absent]
    EncryptionReplica:
      type: object
      required: [name, role, activeKeyId, keyIds]
      properties:
        name:
          type: string
        role:
          type: string
          description: The role the replica runs in (Q-OPS-161), as `answeredBy.role` of the system information names it.
          enum: [api, packages, worker, web, all]
        activeKeyId:
          type: string
        keyIds:
          type: array
          items:
            type: string
    LastReencryption:
      type: object
      required: [jobId, state, finishedAt]
      properties:
        jobId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/JobState"
        finishedAt:
          type: [string, "null"]
          format: date-time
    EncryptionStatus:
      type: object
      required: [answeredBy, activeKeyId, keys, replicas, ringsCompatible, lastReencryption]
      properties:
        answeredBy:
          type: string
          description: The replica whose ring `activeKeyId` and `keys[].canary` describe.
        activeKeyId:
          type: string
        keys:
          type: array
          items:
            $ref: "#/components/schemas/EncryptionKey"
        replicas:
          type: array
          description: The live `web` and `worker` replicas, from the replica registry.
          items:
            $ref: "#/components/schemas/EncryptionReplica"
        ringsCompatible:
          type: boolean
          description: Every live replica's ring holds every key ID that is active on any live replica or referenced by a sealed value.
        lastReencryption:
          oneOf:
            - $ref: "#/components/schemas/LastReencryption"
            - type: "null"
    # <<< M1 api
    #
    # >>> M1 identity
    UserIdentity:
      type: object
      description: The link of a user to an identity provider (R-AUTH-007).
      required: [provider, linked]
      properties:
        provider:
          type: string
          description: The provider ID.
        linked:
          type: boolean
          description: "`false` for a pending link that the user's first login at the provider completes."
    UserGroupMembership:
      type: object
      required: [name, source]
      properties:
        name:
          type: string
        source:
          type: string
          description: "`manual`, `auto`, `scim` or `oidc:<providerId>` (R-AUTH-018)."
          examples: ["oidc:corp"]
    GroupClaimMissing:
      type: object
      description: Set while the user's last login carried no usable group claim (R-AUTH-008).
      required: [provider, reason]
      properties:
        provider:
          type: string
        reason:
          type: string
          enum: [absent, wrong_type, overage]
    User:
      type: object
      description: A user (R-AUTH-016). `isAdmin`, `adminVia` and `lockedUntil` are derived and read only.
      required: [id, username, email, emailVerified, displayName, origin, status, disabledReason, isAdmin, adminVia,
                 identities, groups, groupClaimMissing, lockedUntil, lastLoginAt, createdAt, avatarUrl]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: [string, "null"]
        emailVerified:
          type: boolean
        displayName:
          type: [string, "null"]
        avatarUrl:
          type: [string, "null"]
          description: |
            The path of the user's avatar image (`/api/v1/avatars/<sha256>`, R-API-055), `null` for a user who has not uploaded
            one: the UI shows the generated fallback then. The path names the image by its content, so it changes when the
            avatar does.
        origin:
          type: string
          enum: [jit, admin, scim, system]
        status:
          type: string
          enum: [active, disabled]
        disabledReason:
          type: [string, "null"]
          description: "`admin`, `dormant` or `scim` while the user is disabled."
        isAdmin:
          type: boolean
        adminVia:
          type: array
          description: "Why the user is an administrator: `direct`, `group:<name>` or `break-glass`."
          items:
            type: string
        identities:
          type: array
          items:
            $ref: "#/components/schemas/UserIdentity"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/UserGroupMembership"
        groupClaimMissing:
          oneOf:
            - $ref: "#/components/schemas/GroupClaimMissing"
            - type: "null"
        lockedUntil:
          type: [string, "null"]
          format: date-time
          description: The end of the lockout of the break-glass account while it is in force (R-AUTH-038).
        lastLoginAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      example:
        id: 0192f0c4-7a7e-7b51-9b1e-2f0d6c9e1a10
        username: alice
        email: alice@example.com
        emailVerified: true
        displayName: Alice Example
        avatarUrl: null
        origin: jit
        status: active
        disabledReason: null
        isAdmin: false
        adminVia: []
        identities: [{provider: corp, linked: true}]
        groups: [{name: team-web, source: "oidc:corp"}]
        groupClaimMissing: null
        lockedUntil: null
        lastLoginAt: "2026-10-28T09:12:00Z"
        createdAt: "2026-09-01T08:00:00Z"
    UserList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        nextCursor:
          type: [string, "null"]
          description: Opaque; `null` on the last page.
    PendingIdentity:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          description: A provider ID of `auth.oidc.providers`.
        subject:
          type: "null"
          description: "Always `null`: a pending link is completed by the first login (R-AUTH-007)."
    NewUser:
      type: object
      required: [username]
      properties:
        username:
          type: string
          description: Matches `^[a-z0-9][a-z0-9._@+-]{0,127}$` and is not reserved (R-AUTH-007).
        email:
          type: [string, "null"]
        displayName:
          type: [string, "null"]
        identities:
          type: array
          items:
            $ref: "#/components/schemas/PendingIdentity"
      example:
        username: bob
        email: bob@example.com
        displayName: Bob Example
        identities: [{provider: corp, subject: null}]
    UserPatch:
      type: object
      description: The members an administrator can correct. The read-only members of `User` are accepted and ignored.
      properties:
        email:
          type: [string, "null"]
        displayName:
          type: [string, "null"]
        identities:
          type: array
          description: Replaces the pending links; a linked identity stays.
          items:
            $ref: "#/components/schemas/PendingIdentity"
    DisableRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 1024
          description: Recorded in the audit event.
        revokeTokens:
          type: boolean
          description: Revoke the principal's tokens with reason `principal_disabled`. Default `true` for a user, `false` for a service account.
    MembershipChange:
      type: object
      properties:
        add:
          type: array
          maxItems: 100
          items:
            type: string
        remove:
          type: array
          maxItems: 100
          items:
            type: string
      example:
        add: [team-web]
        remove: [old]
    UserGroups:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/UserGroupMembership"
    Group:
      type: object
      description: A group (R-AUTH-018). `roles`, `memberCount` and `syncDetached` are read only here; `syncDetached` is cleared with `PATCH`.
      required: [id, name, description, autoJoin, syncDetached, origin, memberCount, roles, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        autoJoin:
          type: boolean
        syncDetached:
          type: boolean
          description: |
            Set by the replay of a rename after a restore (R-AUTH-041): group synchronization neither fills nor creates the group
            (R-AUTH-008). An administrator attaches it again with `PATCH` and `{"syncDetached": false}`.
        origin:
          type: string
          enum: [admin, oidc, scim]
        memberCount:
          type: integer
          minimum: 0
        roles:
          type: array
          description: The system roles bound to the group; empty on the list.
          items:
            type: string
        createdAt:
          type: string
          format: date-time
      example:
        id: 0192f0c4-7a7e-7b51-9b1e-2f0d6c9e1a11
        name: team-web
        description: Web team
        autoJoin: false
        syncDetached: false
        origin: admin
        memberCount: 3
        roles: []
        createdAt: "2026-09-01T08:00:00Z"
    GroupList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Group"
        nextCursor:
          type: [string, "null"]
          description: Opaque; `null` on the last page.
    NewGroup:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Matches `^[a-z0-9][a-z0-9._-]{0,127}$`.
        description:
          type: string
        autoJoin:
          type: boolean
        members:
          type: array
          maxItems: 1000
          description: Usernames and `sa:<name>`.
          items:
            type: string
      example:
        name: team-web
        description: Web team
        autoJoin: false
        members: [alice, "sa:ci-bot"]
    GroupPatch:
      type: object
      description: "`name` renames the group. The read-only members of `Group` are accepted and ignored."
      properties:
        name:
          type: string
        description:
          type: string
        autoJoin:
          type: boolean
        syncDetached:
          type: boolean
          enum: [false]
          description: Only `false` is accepted; it attaches a detached group to group synchronization again.
    GroupMember:
      type: object
      required: [principal, kind, sources]
      properties:
        principal:
          type: string
          description: The username, or `sa:<name>` for a service account.
        kind:
          type: string
          enum: [user, service_account]
        sources:
          type: array
          description: Empty for a member the request removed that holds no other source.
          items:
            type: string
      example:
        principal: alice
        kind: user
        sources: [manual, "oidc:corp"]
    GroupMemberList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupMember"
        nextCursor:
          type: [string, "null"]
          description: Opaque; `null` on the last page.
    GroupMembersChange:
      type: object
      properties:
        add:
          type: array
          maxItems: 1000
          items:
            type: string
        remove:
          type: array
          maxItems: 1000
          items:
            type: string
        source:
          type: string
          enum: [manual, auto]
          default: manual
      example:
        add: [bob]
        remove: ["sa:old-bot"]
    # >>> M5a projects
    Project:
      type: object
      description: A project (R-AUTHZ-026). `version` is the ETag source; it moves with `displayName` and `description` only.
      additionalProperties: false
      required: [key, displayName, description, owners, members, repositories, serviceAccounts, policies, logicalBytes, version, createdAt, createdBy, updatedAt, updatedBy]
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9]*(?:-+[a-z0-9]+)*$"
          minLength: 2
          maxLength: 32
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        owners:
          type: array
          description: References of the members with the role Owner, `user:<name>` and `group:<name>`, ordered by kind and name.
          items:
            type: string
        members:
          type: integer
          description: The number of members, users and groups.
        role:
          description: The caller's own role in the project, absent for a caller that is no member (a holder of `projects:read`).
          $ref: "#/components/schemas/ProjectRole"
        repositories:
          type: integer
          description: Repositories of the project, those being deleted included.
        serviceAccounts:
          type: integer
        policies:
          type: integer
        logicalBytes:
          type: integer
          format: int64
          description: |
            The size the project is charged (Q-STOR-155): the sum of the sizes of the files in its repositories, in bytes, each
            file counted in full whether another repository or project holds the same content. It is the sum of the repositories'
            folded usage counters (R-STOR-003), so it lags a write by at most one fold interval, and it follows a repository
            that moves to another project. The object store's physical size is a figure of the whole installation
            (`storage.bytes` of `GET /api/v1/system/overview`), not of a project.
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: A principal reference; empty when the creator no longer exists.
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
    ProjectInput:
      type: object
      description: What a client writes. The read-only members of `Project` are accepted and ignored, so a body obtained by `GET` can be sent back. A create takes the key; a replace needs `displayName`.
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9]*(?:-+[a-z0-9]+)*$"
          minLength: 2
          maxLength: 32
          description: Required on create; on replace it must equal the key of the path.
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024
          default: ""
        owners:
          type: array
          description: On create, the references (`user:<name>`, `group:<name>`) that become the first Owners of the project in the transaction of the create (Q-AUTHZ-229); a reference that is no user or group answers `422 principal_not_allowed`, one that does not exist `404`. Ignored on replace.
          items:
            type: string
        members:
          type: integer
          readOnly: true
        role:
          readOnly: true
          $ref: "#/components/schemas/ProjectRole"
        repositories:
          type: integer
          readOnly: true
        serviceAccounts:
          type: integer
          readOnly: true
        policies:
          type: integer
          readOnly: true
        version:
          type: integer
          format: int64
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: string
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        updatedBy:
          type: string
          readOnly: true
    ProjectList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        nextCursor:
          type: [string, "null"]
          description: Opaque; `null` on the last page.
    ProjectRole:
      type: string
      description: |
        The role of a member of a project (Q-AUTHZ-208); each role holds what the role before it holds. `reader`: `read` on every
        repository of the project. `developer`: also `annotate` and `deploy`. `maintainer`: every repository action
        (`overwrite`, `delete`, `manage` too). `owner`: every repository action and the administration of the project: its members and
        their roles, repositories, permission policies, service accounts and settings. The administration needs a session or a token
        with `admin: true`.
      enum: [reader, developer, maintainer, owner]
    Member:
      type: object
      description: A member of a project (Q-AUTHZ-207). Only users and groups are members; a service account reaches a project through its policies.
      additionalProperties: false
      required: [project, principal, kind, name, role]
      properties:
        project:
          type: string
          description: The project key.
        principal:
          type: string
          description: "`user:<name>` or `group:<name>`."
        kind:
          type: string
          enum: [user, group]
        name:
          type: string
        role:
          $ref: "#/components/schemas/ProjectRole"
    MemberInput:
      type: object
      description: The role of a member. The read-only members of `Member` are accepted and ignored.
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/ProjectRole"
        project:
          type: string
          readOnly: true
        principal:
          type: string
          readOnly: true
        kind:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
    MemberList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
    MoveRepositoryRequest:
      type: object
      additionalProperties: false
      required: [project]
      properties:
        project:
          type: string
          pattern: "^[a-z][a-z0-9]*(?:-+[a-z0-9]+)*$"
          minLength: 2
          maxLength: 32
          description: The key of the target project. The project of the path itself is allowed, and the answer is `200` with nothing changed.
    ProjectPrincipal:
      type: object
      additionalProperties: false
      required: [kind, name, principal]
      properties:
        kind:
          type: string
          enum: [user, group]
        name:
          type: string
        principal:
          type: string
          description: The reference to put in a policy entry or a member.
    ProjectPrincipalList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ProjectPrincipal"
    Membership:
      type: object
      description: |
        A project the caller is a member of through this credential (Q-AUTHZ-207). `role` is the role in force for the credential:
        `owner` only when the credential may administer (a session, or a token with `admin: true`), otherwise `maintainer`, which is
        what the role Owner holds beyond the administration (D2 of Q-AUTHZ-208).
      additionalProperties: false
      required: [key, role]
      properties:
        key:
          type: string
        role:
          $ref: "#/components/schemas/ProjectRole"
