        externalImagesBlocked:
          type: integer
          format: int32
          description: The number of external images replaced by links.
    ClientSnippet:
      type: object
      description: |
        One snippet. The `id` is stable and names the explanation the UI shows
        (`<client>.<tab>.<name>`, for example `npm.configure.npmrc`); the text is the UI's.
