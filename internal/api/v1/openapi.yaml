          type: [string, "null"]
          format: uuid
        scope:
          oneOf:
            - $ref: "#/components/schemas/TokenScope"
            - type: "null"
          description: The token's scope; `null` for a session.
        expiresAt:
          type: [string, "null"]
          format: date-time
