          type: [string, "null"]
          description: The file the snippet belongs in (`.npmrc`, `.yarnrc.yml`); null for a command.
        language:
          type: string
          enum: [ini, yaml, json, shell, xml, text]
        content:
          type: string
    ClientSetup:
      type: object
      required: [repository, format, client, credentials, registryUrl, endpointPath, username, publishTarget, tokenTtlSeconds, snippets]
      properties:
        repository:
          type: string
        format:
          type: string
        client:
          type: string
        credentials:
          type: string
          enum: [placeholder, env, none]
        registryUrl:
          type: string
          description: The package-manager endpoint URL of INV-6, absolute, with its trailing slash.
        endpointPath:
          type: string
          description: "`registryUrl` without its scheme (`//host/path/`), the key npm matches credentials by."
        username:
          type: [string, "null"]
          description: The caller's name; null for an anonymous caller.
        publishTarget:
          type: [string, "null"]
