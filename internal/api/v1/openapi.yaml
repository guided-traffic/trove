    BastionPatch:
      type: object
      description: The read-only members of `Bastion` are accepted and ignored.
      properties:
        description:
          type: string
          maxLength: 1024
        enabled:
          type: boolean
    NewBastionToken:
      type: object
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 1024
        ttlSeconds:
          type: integer
          minimum: 1
          description: The lifetime; at most `auth.tokens.bst.max_ttl`, default `auth.tokens.bst.default_ttl`.
      example:
        description: partners 2026
        ttlSeconds: 31536000
    BastionTokenCreated:
      type: object
      description: A Bastion token with its value. The value is in this answer only.
      required: [id, token, hint, description, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          description: The secret, 57 characters with the prefix `trv_bst_`. Shown once.
        hint:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    BastionHandshake:
      type: object
      additionalProperties: false
      description: The answer of the handshake (R-BAS-010).
      required: [interfaceVersion, bastion, installation, responseBaseUrl, anonymousAccess, recordDownloads, feed, serverTime]
      properties:
        interfaceVersion:
          type: integer
          minimum: 1
        bastion:
          type: object
          additionalProperties: false
          required: [name, tokenId, tokenExpiresAt]
          properties:
            name:
              type: string
            tokenId:
              type: string
              format: uuid
            tokenExpiresAt:
              type: string
              format: date-time
        installation:
          type: object
          additionalProperties: false
          required: [baseUrl, release]
          properties:
            baseUrl:
              type: string
            release:
              type: string
        responseBaseUrl:
          type: string
        anonymousAccess:
          type: boolean
        recordDownloads:
          type: boolean
        feed:
          type: object
          additionalProperties: false
          required: [cursor]
          properties:
            cursor:
              type: string
        serverTime:
          type: string
          format: date-time
    BastionCheckRequest:
      type: object
      additionalProperties: false
      required: [credential, clientAddress, repositories]
      properties:
        credential:
          type: [string, "null"]
          description: The token string the caller presented, or `null` for an anonymous caller.
        clientAddress:
          type: string
        repositories:
          type: array
          items:
            type: string
    BastionCheckAnswer:
      type: object
      additionalProperties: false
      required: [subject, repositories]
      properties:
        subject:
          $ref: "#/components/schemas/BastionSubject"
        repositories:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/BastionRepositoryRead"
    BastionSubject:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [token, anonymous, anonymous_refused, invalid, throttled]
        tokenId:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        retryAfterSeconds:
          type: integer
          minimum: 1
    BastionRepositoryRead:
      type: object
      additionalProperties: false
      required: [read]
      properties:
        read:
          type: string
          enum: [full, partial, none]
        status:
          type: integer
          enum: [401, 403, 404]
          description: 'Set with `none`: the status the caller would receive for a read of the repository.'
    BastionFeedAnswer:
      type: object
      additionalProperties: false
      required: [entries, cursor, more, reset]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/BastionFeedEntry"
        cursor:
          type: string
        more:
          type: boolean
        reset:
          type: boolean
    BastionFeedEntry:
      type: object
      additionalProperties: false
      required: [id, at, kind]
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        kind:
          type: string
          enum: [token, principal, grants, settings, content]
        tokens:
          type: array
          items:
            type: string
        principals:
          type: array
          items:
            type: string
        repositories:
          type: array
          items:
            type: string
    BastionDownloadsRequest:
      type: object
      additionalProperties: false
      required: [events, dropped]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/BastionDownloadEvent"
        dropped:
          type: integer
          minimum: 0
        droppedSince:
          type: string
          format: date-time
    BastionDownloadEvent:
      type: object
      additionalProperties: false
      required: [at, clientAddress, repository, path, sha256, replica]
      properties:
        at:
          type: string
          format: date-time
        tokenId:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
        clientAddress:
          type: string
        repository:
          type: string
        path:
          type: string
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        userAgent:
          type: string
        replica:
          type: string
    # <<< M13 bastion
    #
    # >>> M4b vulnerabilities
    VulnerabilitySeverity:
      type: string
      enum: [critical, high, medium, low, none, unknown]
      description: The level of an advisory (R-VULN-007); `unknown` is a level of its own and sorts last.
    VulnerabilityKind:
      type: string
      enum: [vulnerability, malicious]
      description: "`malicious` for the OpenSSF malicious-packages records (identifier prefix `MAL-`), else `vulnerability`."
    VulnerabilityStatus:
      type: string
      enum: [needs_triage, confirmed, blocked, dismissed, resolved]
      description: |
        The status of a finding (R-VULN-012). `needs_triage`, `confirmed` and `blocked` are open; `resolved` is set by trove
        only.
    VulnerabilityBlockReason:
      type: string
      enum: [malicious, triage]
      description: Why the version's download is refused (R-VULN-015).
    VulnerabilityVersionBlockReason:
      type: string
      enum: [malicious, triage, missing_data]
      description: |
        Why a version's download is refused in a repository (R-VULN-015): a finding blocks it (`malicious`, `triage`), or the
        repository sets `onMissingData: block` and the ecosystem's advisory data was never imported completely
        (`missing_data`, no finding behind it).
    VulnerabilityDismissalReason:
      type: string
      enum: [not_exploitable, false_positive, risk_accepted, mitigated, test_only]
    VulnerabilityResolvedReason:
      type: string
      enum: [no_longer_affected, advisory_withdrawn, version_removed, scanning_disabled]
    VulnerabilityEvaluation:
      type: string
      enum: [evaluated, pending_data, internal, not_covered]
      description: |
        The derived evaluation state of a stored version in a repository (R-VULN-001): `evaluated` (the advisory data is
        complete), `pending_data` (it was never imported completely), `internal` (public advisories do not apply to the name)
        or `not_covered` (scanning is off, the upstream is not recognised, or the format has no adapter).
    VulnerabilitySettings:
      type: object
      additionalProperties: false
      description: |
        The `vulnerabilities` member of a repository document (R-VULN-002): local and remote repositories of a format with the
        vulnerability adapter (npm, NuGet). Virtual repositories and other formats answer `422 not_applicable` at
        `/vulnerabilities`. A member that sets some fields takes the defaults of the others. A change of `enabled` or
        `matchPublicAdvisories` enqueues a `vuln-rescan` of the repository in the same transaction; `blockMalicious` and
        `onMissingData` act without a job.
      properties:
        enabled: {type: boolean, default: true, description: "false: the repository's stored versions are neither evaluated nor blocked."}
        matchPublicAdvisories:
          type: string
          enum: [auto, always, never]
          default: auto
          description: Which stored versions public advisories apply to (R-VULN-010).
        blockMalicious: {type: boolean, default: true, description: Refuse the versions an open malicious finding names (R-VULN-015).}
        onMissingData:
          type: string
          enum: [allow, block]
          default: allow
          description: What a version of an ecosystem whose advisory data was never imported completely gets (R-VULN-015).
    VulnerabilityCvss:
      type: object
      additionalProperties: false
      required: [version, score, vector]
      description: The vector the severity was scored from (R-VULN-007); trove never mixes versions in one value.
      properties:
        version: {type: string, enum: ["4.0", "3.1", "3.0", "2.0"]}
        score: {type: number, minimum: 0, maximum: 10}
        vector: {type: string}
    VulnerabilitySource:
      type: object
      additionalProperties: false
      required: [name, license, url]
      description: The attribution of an advisory (R-VULN-003).
      properties:
        name: {type: string, example: GitHub Advisory Database}
        license: {type: [string, "null"], example: CC-BY 4.0}
        url: {type: string}
    VulnerabilityFinding:
      type: object
      additionalProperties: false
      required: [id, project, repository, format, package, version, advisory, aliases, kind, summary, severity, cvss, knownExploited, fixAvailable, fixedVersions, status, blocked, blockReason, detectedAt, resolvedAt]
      description: |
        One finding: one canonical advisory affects one stored version in one repository (R-VULN-012). `blocked` and
        `blockReason` are computed with the rule of R-VULN-015 and the repository's current policy, so the API, the report and
        the download agree.
      properties:
        id: {type: string, format: uuid}
        project: {type: string, description: The key of the project of the repository.}
        repository: {type: string, description: The qualified name `<project>/<key>`.}
        format: {type: string}
        package: {type: string}
        version: {type: string}
        advisory: {type: string, description: The canonical identifier.}
        aliases: {type: array, maxItems: 1000, items: {type: string}}
        kind: {$ref: "#/components/schemas/VulnerabilityKind"}
        summary: {type: string}
        severity: {$ref: "#/components/schemas/VulnerabilitySeverity"}
        cvss:
          oneOf:
            - $ref: "#/components/schemas/VulnerabilityCvss"
            - type: "null"
        knownExploited: {type: boolean}
        knownExploitedAddedAt: {type: [string, "null"], format: date}
        fixAvailable: {type: boolean}
        fixedVersions: {type: array, maxItems: 1000, items: {type: string}}
        status: {$ref: "#/components/schemas/VulnerabilityStatus"}
        dismissalReason:
          oneOf:
            - $ref: "#/components/schemas/VulnerabilityDismissalReason"
            - type: "null"
        resolvedReason:
          oneOf:
            - $ref: "#/components/schemas/VulnerabilityResolvedReason"
            - type: "null"
        blocked: {type: boolean}
        blockReason:
          oneOf:
            - $ref: "#/components/schemas/VulnerabilityBlockReason"
            - type: "null"
        detectedAt: {type: string, format: date-time}
        resolvedAt: {type: [string, "null"], format: date-time}
      example:
        id: 01933b2a-7c1e-7d10-9a4b-3f0e2c1d0a11
        project: web
        repository: web/npm-remote
        format: npm
        package: lodash
        version: 4.17.20
        advisory: GHSA-35jh-r3h4-6jhm
        aliases: [CVE-2021-23337]
        kind: vulnerability
        summary: Command Injection in lodash
        severity: high
        cvss: {version: "3.1", score: 7.2, vector: "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H"}
        knownExploited: false
        fixAvailable: true
        fixedVersions: [4.17.21]
        status: needs_triage
        blocked: false
        blockReason: null
        detectedAt: "2026-10-31T09:12:00Z"
        resolvedAt: null
    VulnerabilityFindingList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/VulnerabilityFinding"}}
        nextCursor: {type: [string, "null"]}
    VulnerabilityAffected:
      type: object
      additionalProperties: false
      required: [name, ranges, versions, fixed]
      description: One affected entry of an advisory, as stored (R-VULN-006).
      properties:
        name: {type: string}
        ranges:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [type, events]
            properties:
              type: {type: string, enum: [SEMVER, ECOSYSTEM, GIT]}
              events:
                type: array
                maxItems: 1000
                items:
                  type: object
                  description: "One event: exactly one of introduced, fixed, last_affected and limit."
                  additionalProperties: {type: string}
        versions: {type: array, maxItems: 10000, items: {type: string}}
        fixed: {type: array, maxItems: 1000, items: {type: string}}
    VulnerabilityAdvisory:
      type: object
      additionalProperties: false
      required: [ecosystem, id, aliases, kind, summary, details, detailsHtml, severity, cvss, knownExploited, knownExploitedAddedAt, cwe, affected, fixedVersions, references, source, modified, published, withdrawn]
      description: One advisory (R-VULN-020). `details` is Markdown from an untrusted source and has to be rendered through the sanitizer (R-UI-008).
      properties:
        ecosystem: {type: string}
        id: {type: string, description: The canonical identifier.}
        aliases: {type: array, maxItems: 1000, items: {type: string}}
        kind: {$ref: "#/components/schemas/VulnerabilityKind"}
        summary: {type: string}
        details: {type: string}
        detailsHtml:
          type: string
          description: |
            `details` rendered by the sanitizer of the package README (R-UI-008): script, event handlers, `javascript:` links and
            images from origins that are not allowed do not survive. A client shows this and never renders `details` itself.
        severity: {$ref: "#/components/schemas/VulnerabilitySeverity"}
        cvss:
          oneOf:
            - $ref: "#/components/schemas/VulnerabilityCvss"
            - type: "null"
        knownExploited: {type: boolean}
        knownExploitedAddedAt: {type: [string, "null"], format: date}
        cwe: {type: array, maxItems: 100, items: {type: string}}
        affected: {type: array, maxItems: 1000, items: {$ref: "#/components/schemas/VulnerabilityAffected"}}
        fixedVersions: {type: array, maxItems: 1000, items: {type: string}}
        references:
          type: array
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [url]
            properties:
              type: {type: string}
              url: {type: string}
        source: {$ref: "#/components/schemas/VulnerabilitySource"}
        modified: {type: string, format: date-time}
        published: {type: [string, "null"], format: date-time}
        withdrawn: {type: [string, "null"], format: date-time}
    VulnerabilityFindingEvent:
      type: object
      additionalProperties: false
      required: [at, actor, change, fromStatus, toStatus, reason, comment]
      description: One row of a finding's history (R-VULN-012).
      properties:
        at: {type: string, format: date-time}
        actor:
          type: [object, "null"]
          description: The principal behind the change; `null` for trove.
          additionalProperties: false
          required: [id, name]
          properties:
            id: {type: string}
            name: {type: [string, "null"]}
        change: {type: string, enum: [detected, status_changed, resolved, redetected, reopened, advisory_changed]}
        fromStatus: {type: [string, "null"]}
        toStatus: {type: [string, "null"]}
        reason: {type: [string, "null"]}
        comment: {type: [string, "null"]}
        details: {type: [object, "null"], additionalProperties: true}
    VulnerabilityFindingDetail:
      type: object
      additionalProperties: false
      required: [finding, advisory, virtualRepositories, blockedBy, comment, history]
      description: |
        A finding with its advisory, the readable virtual repositories whose effective member list contains its repository, for
        a block set in triage the principal and time that set it, and the history (R-VULN-020).
      properties:
        finding: {$ref: "#/components/schemas/VulnerabilityFinding"}
        advisory: {$ref: "#/components/schemas/VulnerabilityAdvisory"}
        virtualRepositories: {type: array, maxItems: 1000, items: {type: string}}
        blockedBy:
          type: [object, "null"]
          description: Who set the block, for `blockReason` triage; `null` otherwise.
          additionalProperties: false
          required: [principal, at, comment]
          properties:
            principal: {type: [object, "null"], additionalProperties: false, required: [id, name], properties: {id: {type: string}, name: {type: [string, "null"]}}}
            at: {type: string, format: date-time}
            comment: {type: [string, "null"]}
        comment: {type: [string, "null"], maxLength: 4000}
        statusChangedAt: {type: string, format: date-time}
        history: {type: array, maxItems: 1000, items: {$ref: "#/components/schemas/VulnerabilityFindingEvent"}}
    VulnerabilityFindingPatch:
      type: object
      additionalProperties: false
      description: The merge patch of a triage (R-VULN-013).
      properties:
        status:
          description: "`resolved` is refused (`422 status_not_settable`); `blocked` needs a confirmed finding (`409 finding_not_confirmed`)."
          $ref: "#/components/schemas/VulnerabilityStatus"
        dismissalReason:
          description: Required with `dismissed`, refused otherwise.
          $ref: "#/components/schemas/VulnerabilityDismissalReason"
        comment: {type: [string, "null"], maxLength: 4000}
    VulnerabilitySetStatusRequest:
      type: object
      additionalProperties: false
      required: [ids, status]
      properties:
        ids: {type: array, minItems: 1, maxItems: 500, items: {type: string, format: uuid}}
        status: {$ref: "#/components/schemas/VulnerabilityStatus"}
        dismissalReason: {$ref: "#/components/schemas/VulnerabilityDismissalReason"}
        comment: {type: string, maxLength: 4000}
    VulnerabilitySetStatusResult:
      type: object
      additionalProperties: false
      required: [bulkId, results]
      properties:
        bulkId: {type: string, description: The identifier every event of the operation carries.}
        results:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [id, outcome, status, code]
            properties:
              id: {type: string, format: uuid}
              outcome: {type: string, enum: [changed, unchanged, failed]}
              status: {type: integer, description: "200 for changed and unchanged, 404 for an id the caller cannot read, 409 for finding_resolved and finding_not_confirmed."}
              code: {type: [string, "null"], description: The problem code of a failure.}
    VulnerabilityAdvisoryDetail:
      type: object
      additionalProperties: false
      required: [advisory, findings]
      properties:
        advisory: {$ref: "#/components/schemas/VulnerabilityAdvisory"}
        findings: {type: array, maxItems: 1000, items: {$ref: "#/components/schemas/VulnerabilityFinding"}}
        truncated:
          type: boolean
          description: True when the caller can read more findings than the 1,000 listed; the findings list filtered by `advisory` pages through all of them.
    VulnerabilitySeverityCounts:
      type: object
      additionalProperties: false
      required: [critical, high, medium, low, none, unknown]
      properties:
        critical: {type: integer, format: int64}
        high: {type: integer, format: int64}
        medium: {type: integer, format: int64}
        low: {type: integer, format: int64}
        none: {type: integer, format: int64}
        unknown: {type: integer, format: int64}
    VulnerabilitySummary:
      type: object
      additionalProperties: false
      required: [bySeverity, byKind, needsTriage, blockedVersions, fixAvailable, coverage, data]
      description: The open findings the caller can read (R-VULN-021).
      properties:
        bySeverity: {$ref: "#/components/schemas/VulnerabilitySeverityCounts"}
        byKind:
          type: object
          additionalProperties: false
          required: [vulnerability, malicious]
          properties:
            vulnerability: {type: integer, format: int64}
            malicious: {type: integer, format: int64}
        needsTriage: {type: integer, format: int64}
        blockedVersions: {type: integer, format: int64, description: The versions whose download is refused.}
        fixAvailable: {type: integer, format: int64}
        coverage:
          type: object
          additionalProperties: false
          required: [evaluated, pendingData, internal, notCovered]
          description: The readable repositories by the evaluation state of their scanning.
          properties:
            evaluated: {type: integer}
            pendingData: {type: integer}
            internal: {type: integer}
            notCovered: {type: integer}
        data:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [ecosystem, state, stale, syncedAt]
            properties:
              ecosystem: {type: string}
              state: {type: string, enum: [empty, complete]}
              stale: {type: boolean}
              syncedAt: {type: [string, "null"], format: date-time}
    VulnerabilityTrend:
      type: object
      additionalProperties: false
      required: [from, to, basis, points]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        basis: {type: string, description: "How the counts are made: a finding counts under its current severity, and dismissed findings count until they resolve."}
        points:
          type: array
          maxItems: 400
          items:
            type: object
            additionalProperties: false
            required: [date, counts]
            properties:
              date: {type: string, format: date}
              counts: {$ref: "#/components/schemas/VulnerabilitySeverityCounts"}
    VulnerabilitySourceState:
      type: object
      additionalProperties: false
      required: [source, ecosystem, mode, repository, state, stale, syncedAt, fullSyncedAt, attemptedAt, failures, lastError, records, rejected, unevaluable, fullRejected, nextRunAt]
      description: One source and ecosystem (R-VULN-021).
      properties:
        source: {type: string, enum: [osv, kev]}
        ecosystem: {type: string, description: The OSV ecosystem; empty for kev.}
        mode: {type: string, enum: [online, repository, "off"]}
        repository:
          type: [string, "null"]
          description: The key of the configured mirror repository in the mode `repository` (R-VULN-005), else `null`.
        state: {type: string, enum: [empty, complete]}
        stale: {type: boolean}
        syncedAt: {type: [string, "null"], format: date-time}
        fullSyncedAt: {type: [string, "null"], format: date-time}
        attemptedAt: {type: [string, "null"], format: date-time}
        failures: {type: integer, description: Consecutive failed runs.}
        lastError:
          oneOf:
            - $ref: "#/components/schemas/Problem"
            - type: "null"
        records: {type: integer}
        rejected: {type: integer, description: "The records the last run, full or incremental, rejected (R-VULN-004)."}
        fullRejected: {type: integer, description: "The records the last full sync rejected; an incremental run does not change it (Q-VULN-122)."}
        unevaluable: {type: integer}
        nextRunAt: {type: [string, "null"], format: date-time}
    VulnerabilitySourceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/VulnerabilitySourceState"}}
    ClaimedNameMatch:
      type: object
      additionalProperties: false
      required: [ecosystem, advisory, name, kind, claimRepository, firstSeenAt]
      description: A public advisory for a name the installation treats as internal (R-VULN-010).
      properties:
        ecosystem: {type: string}
        advisory: {type: string, description: The canonical identifier.}
        name: {type: string}
        kind: {$ref: "#/components/schemas/VulnerabilityKind"}
        claimRepository: {type: [string, "null"], description: The repository whose claim covers the name.}
        firstSeenAt: {type: string, format: date-time}
    ClaimedNameMatchList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/ClaimedNameMatch"}}
        nextCursor: {type: [string, "null"]}
    VulnerabilityVersionReport:
      type: object
      additionalProperties: false
      required: [packageId, version, repositories]
      description: What the scanning says of one version in every readable repository that holds it (R-VULN-020).
      properties:
        packageId: {type: string}
        version: {type: string}
        repositories:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [repository, evaluation, blocked, blockReason, findings]
            properties:
              repository: {type: string}
              evaluation: {$ref: "#/components/schemas/VulnerabilityEvaluation"}
              syncedAt: {type: [string, "null"], format: date-time, description: The data's `syncedAt` for an evaluated version.}
              blocked: {type: boolean}
              blockReason:
                oneOf:
                  - $ref: "#/components/schemas/VulnerabilityVersionBlockReason"
                  - type: "null"
              findings: {type: array, maxItems: 1000, items: {$ref: "#/components/schemas/VulnerabilityFinding"}}
    VulnerabilityPackageReport:
      type: object
      additionalProperties: false
      required: [packageId, versions]
      properties:
        packageId: {type: string}
        versions:
          type: array
          maxItems: 100000
          items:
            type: object
            additionalProperties: false
            required: [version, open]
            properties:
              version: {type: string}
              open: {$ref: "#/components/schemas/VulnerabilitySeverityCounts"}
    VulnerabilityDataFacts:
      type: object
      additionalProperties: false
      required: [enforcement, sources]
      description: |
        The advisory data's state as an operator reads it (R-OPS-004, R-VULN-024), from `vuln_source_state` as the sources
        operation reads it. It is cluster-wide state and never affects readiness.
      properties:
        enforcement: {type: string, enum: [enforce, report]}
        sources:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [source, ecosystem, mode, state, stale, syncedAt, failures]
            properties:
              source: {type: string, enum: [osv, kev]}
              ecosystem: {type: string}
              mode: {type: string, enum: [online, repository, "off"]}
              state: {type: string, enum: [empty, complete]}
              stale: {type: boolean}
              syncedAt: {type: [string, "null"], format: date-time}
              failures: {type: integer}
    # <<< M4b vulnerabilities
    #
    # >>> M6b mirror
    MirrorSettings:
      type: object
      additionalProperties: false
      description: |
        The settings of the mirror mode (`remote.mirror`, R-REPO-050). Every member is returned, with its default where a
        request omitted it; they take effect in `mode: mirror` only. An Owner without `repositories:write-config` keeps them as stored and may
        change `paused` only (Q-REPO-142, `422 mirror_restricted`).
      properties:
        paused:
          type: boolean
          default: false
          description: No pass starts; a running pass stops before its next package (R-REPO-053). Pause and resume are this member.
        intervalSeconds:
          type: integer
          minimum: 300
          maximum: 604800
          default: 3600
          description: From the start of one pass to the start of the next (R-REPO-053).
        fullPassIntervalSeconds:
          type: integer
          minimum: 0
          maximum: 7776000
          default: 604800
          description: Age of the last full pass after which the next pass is full; `0` only when an incremental pass cannot run; otherwise at least 86400 (R-REPO-051).
        discovery:
          type: string
          enum: [auto, feed, listing, names]
          default: auto
          description: How the pass discovers names (R-REPO-051); `auto` tries feed, listing and names in that order.
        concurrency:
          type: integer
          minimum: 1
          maximum: 64
          default: 4
          description: Ceiling of the pass's concurrent background fetches, held below the background share of the fetch budget (R-REPO-054, R-REPO-055).
        maxVersionsPerPackage:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
          description: Newest versions of a package the pass stores by the format's version order; `0` all (R-REPO-051).
        includePrereleases:
          type: boolean
          default: true
          description: Whether the pass stores prerelease versions (R-REPO-051).
        maxBytes:
          type: [integer, "null"]
          format: int64
          minimum: 1048576
          description: |
            Byte bound of the repository's stored content beyond which the pass adds nothing; `null` no bound of its own
            (R-REPO-052). A mirror of the format's well-known upstream needs it or include patterns that each have a literal
            prefix (`422 mirror_unbounded`).
    MirrorMethod:
      type: string
      enum: [feed, listing, names]
      description: How a pass discovers names (R-REPO-051).
    MirrorBoundKind:
      type: string
      enum: [bytes, quota, capacity]
      description: The bound that stopped a pass's additions (R-REPO-052).
    MirrorRunRequest:
      type: object
      additionalProperties: false
      description: The optional body of `POST /api/v1/projects/{projectKey}/repositories/{repoKey}/mirror/run` (R-REPO-056).
      properties:
        full:
          type: boolean
          default: false
          description: Make the requested pass a full one, which discovers every name again instead of reading the feed from its cursor (R-REPO-051).
    MirrorStatus:
      type: object
      description: |
        The status of the mirror of a remote repository (R-REPO-056), read from PostgreSQL. `pass` and `lastCompletePass` are
        `null` when there is none.
      required: [mode, state, pass, lastCompletePass, nextPassAt, lastFullPassAt, errors, rateLimit, bound]
      properties:
        mode:
          type: string
          enum: [pullThrough, mirror]
          description: The repository's `remote.mode` (R-REPO-050).
        state:
          type: string
          enum: [off, paused, scheduled, running, waiting, bound_reached, failing]
          description: |
            `off` for mode `pullThrough`; `paused` for `remote.mirror.paused`; `failing` after three or more failures in a row;
            `bound_reached` while the storage bound stops additions (R-REPO-052); `running` while a pass is in progress and
            its job runs; `waiting` while a pass is in progress and no job runs it, for a long rate-limit wait, a failure or a
            release, until the next job; `scheduled` otherwise. The first of these that holds is the state, in this order.
        pass:
          oneOf:
            - $ref: "#/components/schemas/MirrorPass"
            - type: "null"
        lastCompletePass:
          oneOf:
            - $ref: "#/components/schemas/MirrorPassSummary"
            - type: "null"
        nextPassAt:
          type: [string, "null"]
          format: date-time
          description: When the next pass is due; `null` when it is due at the next dispatch (at most 60 s) or no pass has been planned.
        lastFullPassAt:
          type: [string, "null"]
          format: date-time
        errors:
          $ref: "#/components/schemas/MirrorErrors"
        rateLimit:
          $ref: "#/components/schemas/MirrorRateLimit"
        bound:
          $ref: "#/components/schemas/MirrorBound"
    MirrorPass:
      type: object
      description: The pass in progress.
      required: [kind, method, startedAt, namesDiscovered, packagesDone, packagesPending, packagesFailed, itemsStored, bytesStored, discoveryDone, job]
      properties:
        kind:
          type: string
          enum: [full, incremental]
        method:
          description: The discovery method of the pass (R-REPO-051); `null` until the pass has chosen one.
          oneOf:
            - $ref: "#/components/schemas/MirrorMethod"
            - type: "null"
        startedAt:
          type: string
          format: date-time
        namesDiscovered:
          type: integer
          format: int64
        packagesDone:
          type: integer
          format: int64
        packagesPending:
          type: integer
          format: int64
          description: The names discovered and not yet filled, counted from `mirror_pending`.
        packagesFailed:
          type: integer
          format: int64
        itemsStored:
          type: integer
          format: int64
        bytesStored:
          type: integer
          format: int64
        discoveryDone:
          type: boolean
        job:
          description: The job that owns the pass, `href` `/api/v1/system/jobs/<id>`; `null` when the job row has been removed.
          oneOf:
            - $ref: "#/components/schemas/JobReference"
            - type: "null"
    MirrorPassSummary:
      type: object
      description: The last complete pass.
      required: [kind, method, startedAt, finishedAt, outcome, packages, packagesFailed, itemsStored, bytesStored, discoveryComplete, discoveryNote]
      properties:
        kind:
          type: string
          enum: [full, incremental]
        method:
          oneOf:
            - $ref: "#/components/schemas/MirrorMethod"
            - type: "null"
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        outcome:
          type: string
          enum: [complete, partial, bound_reached, offline, stopped]
        packages:
          type: integer
          format: int64
        packagesFailed:
          type: integer
          format: int64
        itemsStored:
          type: integer
          format: int64
        bytesStored:
          type: integer
          format: int64
        discoveryComplete:
          type: boolean
          description: "`false` when the upstream's discovery could not see everything; `discoveryNote` says why."
        discoveryNote:
          type: [string, "null"]
    MirrorErrors:
      type: object
      required: [consecutiveFailures, lastAt, lastCode, lastMessage]
      properties:
        consecutiveFailures:
          type: integer
        lastAt:
          type: [string, "null"]
          format: date-time
        lastCode:
          type: [string, "null"]
        lastMessage:
          type: [string, "null"]
          description: The last failure in words, naming hosts and never a URL or a credential.
    MirrorRateLimit:
      type: object
      required: [waits, waitSeconds, lastAt, lastStatus, until]
      properties:
        waits:
          type: integer
          format: int64
          description: The rate-limit answers the passes waited for (R-REPO-054).
        waitSeconds:
          type: integer
          format: int64
        lastAt:
          type: [string, "null"]
          format: date-time
        lastStatus:
          type: [integer, "null"]
          description: The HTTP status of the last rate-limit answer.
        until:
          type: [string, "null"]
          format: date-time
          description: While set and in the future, the mirror waits for the upstream until then.
    MirrorBound:
      type: object
      required: [reached, at, maxBytes, usedBytes]
      properties:
        reached:
          description: |
            The bound that stopped the pass's additions (R-REPO-052): `bytes` is `remote.mirror.maxBytes`, `quota` a quota of
            the repository, `capacity` the storage's; `null` when none.
          oneOf:
            - $ref: "#/components/schemas/MirrorBoundKind"
            - type: "null"
        at:
          type: [string, "null"]
          format: date-time
        maxBytes:
          type: [integer, "null"]
          format: int64
          description: "`remote.mirror.maxBytes` of the configuration; `null` for no bound of its own."
        usedBytes:
          type: integer
          format: int64
          description: The repository's logical bytes (R-REPO-052), as the usage counters report them.
    # <<< M6b mirror
    # >>> M5 backup
    BackupProgress:
      type: object
      description: What the heartbeat of the run last wrote (R-BAK-009); members that do not apply to the phase are absent.
      properties:
        phase:
          type: string
        tablesDone:
          type: integer
        tablesTotal:
          type: integer
        blobsToCopy:
          type: integer
          format: int64
        blobsCopied:
          type: integer
          format: int64
        bytesCopied:
          type: integer
          format: int64
        pinsLeft:
          type: integer
          format: int64
        snapshotOpenSince:
          type: string
          format: date-time
    BackupRun:
      type: object
      description: One row of `backup_run` in the names of R-API-003 (R-API-050).
      required: [id, operation, backupId, state, trigger, pod, troveVersion, target, startedAt, heartbeatAt, leaseExpired, finishedAt, snapshotAt, progress, result, error]
      properties:
        id:
          type: string
          format: uuid
        operation:
          type: string
          description: "`create`, `delete` or `verify`."
        backupId:
          type: [string, "null"]
          description: The backup ID of R-BAK-002; `null` for a delete run of several backups.
        state:
          type: string
          description: "`starting`, `snapshot`, `copying`, `finalizing`, `pruning`, `completed`, `completed_with_warnings`, `failed`, `interrupted` or `abandoned` (R-BAK-009)."
        trigger:
          type: string
          description: "`schedule` or `manual`."
        pod:
          type: string
          description: The pod of the run; a Job created by hand carries the name its creator chose.
        troveVersion:
          type: string
        target:
          type: string
          description: "`s3://<bucket>/<prefix>` as recorded; never a credential."
        startedAt:
          type: string
          format: date-time
        heartbeatAt:
          type: string
          format: date-time
        leaseExpired:
          type: boolean
          description: True for a run in an active state whose lease has passed (R-BAK-010).
        finishedAt:
          type: [string, "null"]
          format: date-time
        snapshotAt:
          type: [string, "null"]
          format: date-time
        progress:
          $ref: "#/components/schemas/BackupProgress"
        result:
          type: [object, "null"]
          description: The manifest summary, the retention outcome and the warnings (R-BAK-009, R-BAK-016).
          additionalProperties: true
        error:
          type: [object, "null"]
          description: The stored problem object; its `code` is stable (R-UI-042).
          additionalProperties: true
    BackupRunList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BackupRun"
        nextCursor:
          type: [string, "null"]
          description: Opaque; `null` on the last page.
        total:
          type: integer
          format: int64
          description: Present with `includeTotal=true`.
    BackupLastFailure:
      type: object
      required: [runId, at, code]
      properties:
        runId:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        code:
          type: [string, "null"]
    BackupActiveRun:
      type: object
      required: [id, operation, state, startedAt, leaseExpired]
      properties:
        id:
          type: string
          format: uuid
        operation:
          type: string
          description: "`create`, `delete` or `verify`."
        state:
          type: string
          description: "`starting`, `snapshot`, `copying`, `finalizing`, `pruning`, `completed`, `completed_with_warnings`, `failed`, `interrupted` or `abandoned` (R-BAK-009)."
        startedAt:
          type: string
          format: date-time
        leaseExpired:
          type: boolean
    BackupInfo:
      type: object
      description: "The `backup` block of the system information (R-OPS-004): the short form of the summary, under the same overdue rule."
      required: [expectedIntervalSeconds, lastSuccessAt, overdue, lastRunState]
      properties:
        expectedIntervalSeconds:
          type: integer
          format: int64
          description: "`backup.expected_interval` in seconds."
        lastSuccessAt:
          type: [string, "null"]
          format: date-time
        overdue:
          type: [boolean, "null"]
          description: True when `lastSuccessAt` is older than 1.5 times the expected interval; `null` with no successful run.
        lastRunState:
          type: [string, "null"]
          description: The state of the newest run of any operation (R-BAK-009); `null` before any run.
    BackupRetention:
      type: object
      required: [keepLast, keepWithinSeconds]
      properties:
        keepLast:
          type: integer
        keepWithinSeconds:
          type: integer
          format: int64
    StoredBackup:
      type: object
      required: [backupId, snapshotAt, troveVersion, schemaStep, databaseBytes, blobCount, blobBytes, damaged]
      properties:
        backupId:
          type: string
        snapshotAt:
          type: string
          format: date-time
        troveVersion:
          type: string
        schemaStep:
          type: integer
        databaseBytes:
          type: integer
          format: int64
        blobCount:
          type: integer
          format: int64
        blobBytes:
          type: integer
          format: int64
        damaged:
          type: boolean
    StoredBackups:
      type: object
      description: The complete backups the newest create or delete run found after its own deletions (Q-API-11).
      required: [asOf, runId, items]
      properties:
        asOf:
          type: string
          format: date-time
        runId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/StoredBackup"
    BackupRestoredFrom:
      type: object
      description: "`system_state.restored_from` after a restore (R-BAK-022)."
      required: [installationId, incarnation, backupId, snapshotAt]
      properties:
        installationId:
          type: string
        incarnation:
          type: string
        backupId:
          type: string
        snapshotAt:
          type: string
          format: date-time
    BackupManualRun:
      type: object
      description: What the chart renders into `backup.manual_run`, so the UI can show the exact command; each is `null` when unset.
      required: [namespace, cronJob]
      properties:
        namespace:
          type: [string, "null"]
        cronJob:
          type: [string, "null"]
    BackupSummary:
      type: object
      required: [expectedIntervalSeconds, lastSuccessAt, overdue, lastFailure, active, target, retention, storedBackups, restoredFrom, manualRun]
      properties:
        expectedIntervalSeconds:
          type: integer
          format: int64
          description: "`backup.expected_interval`, the value behind `trove_backup_expected_interval_seconds` and `TroveBackupStale`."
        lastSuccessAt:
          type: [string, "null"]
          format: date-time
        overdue:
          type: [boolean, "null"]
          description: True when `lastSuccessAt` is older than 1.5 times the expected interval; `null` with no successful run.
        lastFailure:
          oneOf:
            - $ref: "#/components/schemas/BackupLastFailure"
            - type: "null"
        active:
          oneOf:
            - $ref: "#/components/schemas/BackupActiveRun"
            - type: "null"
        target:
          type: [string, "null"]
          description: The target of the newest run, as recorded; `null` before any run.
        retention:
          oneOf:
            - $ref: "#/components/schemas/BackupRetention"
            - type: "null"
        storedBackups:
          oneOf:
            - $ref: "#/components/schemas/StoredBackups"
            - type: "null"
        restoredFrom:
          oneOf:
            - $ref: "#/components/schemas/BackupRestoredFrom"
            - type: "null"
        manualRun:
          $ref: "#/components/schemas/BackupManualRun"
