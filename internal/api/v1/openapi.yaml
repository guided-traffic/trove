    ServiceAccountPatch:
      type: object
      description: The read-only members of `ServiceAccount` are accepted and ignored.
      properties:
        description:
          type: string
    TokenScopePatterns:
      type: object
      properties:
        include:
          type: array
          items:
            type: string
        exclude:
          type: array
          items:
            type: string
    TokenScopeGrant:
      type: object
      required: [repositories, actions]
      properties:
        repositories:
          type: array
          items:
            type: string
        packages:
          $ref: "#/components/schemas/TokenScopePatterns"
        paths:
          $ref: "#/components/schemas/TokenScopePatterns"
        actions:
          type: array
          items:
            type: string
            enum: [read, annotate, deploy, overwrite, delete, manage]
    TokenScope:
      type: object
      description: The ceiling a token puts on its owner's rights (R-AUTH-024). It never grants anything.
      properties:
        inherit:
          type: boolean
          description: All repository rights of the owner. Exclusive with `repositories`.
        admin:
          type: boolean
          description: The token exercises the owner's system roles.
        repositories:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/TokenScopeGrant"
        system:
          type: array
          description: System capabilities (R-AUTHZ-010), from the closed list of R-AUTH-025.
          items:
            type: string
        endpoints:
          type: array
          description: |
            The endpoint names the token is valid on (R-EP-011); empty is unbound. Every name must be a configured
            endpoint that accepts the token's type (`auth.token_types`, R-EP-010): a binding to another is `400`
            `invalid_scope` naming the endpoint, because such a token would be refused there by its type and
            everywhere else by its binding.
          items:
            type: string
      example:
        inherit: true
        admin: false
        repositories: []
        system: []
    TokenOwner:
      type: object
      required: [kind, name]
      properties:
