        startUrl:
          type: string
          description: Server-relative start URL, `/auth/oidc/{providerId}/start`.
        available:
          type: boolean
          description: Whether the replica that answers holds the provider's discovery document.
    LoginOptions:
      type: object
      description: What the sign-in screen offers (R-AUTH-009). It names no issuer, client ID or error detail.
      required: [providers, localLogin, anonymousAccess, autoRedirect]
      properties:
        providers:
          type: array
          description: In configuration order (`order`, then ID).
          items:
            $ref: "#/components/schemas/LoginProvider"
        localLogin:
          type: boolean
          description: The break-glass form is offered on the page; it is reachable with `?auto_sign_in=false` regardless.
        anonymousAccess:
          type: boolean
