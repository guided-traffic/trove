openapi: 3.1.0
info:
  title: trove management API
  version: 1.0.0
  summary: Management API of the trove artifact repository manager.
  description: |
    Every endpoint lives under `/api/v1/`; the major version in the path is the only version
    selector. Errors are `application/problem+json` (RFC 9457). Package-manager protocol endpoints
    follow their ecosystem's specification and are not part of this document.

    This document is the contract: the server code (`internal/api/v1/gen`) and the UI client types
    are generated from it. It is served at `/api/v1/openapi.json` and `/api/v1/openapi.yaml`
    without authentication and holds no instance data except `servers[0].url`, which the server
    replaces with its public base URL.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://trove.example.com
    description: The public base URL (`server.base_url`); the server replaces this entry.
tags:
  - name: system
    description: Liveness of the API, build facts, installation facts and the replica registry.
  - name: meta
    description: This document and the problem catalog.
  # >>> M1 audit
  # <<< M1 audit
  #
  # >>> M1 api
  - name: jobs
    description: Background jobs and the maintenance tasks that start them.
  # <<< M1 api
  #
  # >>> M1 identity
  # <<< M1 identity
  #
  # >>> M1 login
  # <<< M1 login
  #
  # >>> M1 authz
  # <<< M1 authz
  #
  # >>> M1 repository
  # <<< M1 repository
  #
  # >>> M1 files
  # <<< M1 files
  #
  # >>> M1 endpoints
  # <<< M1 endpoints
security:
  - bearerAuth: []
paths:
  /api/v1/system/ping:
    get:
      operationId: getPing
      tags: [system]
      summary: Check that this replica is ready to take work
      description: |
        Answers `200 text/plain` with `OK` while the replica is ready, a degraded replica included,
        and `503` with `UNAVAILABLE` otherwise. A Valkey outage never fails a ping. Anonymous
        callers are accepted. A presented credential is validated, so tooling can check the base URL
        and a token in one call: an invalid, expired or revoked token yields `401`.
      security:
        - {}
        - bearerAuth: []
      x-trove-permission:
        public: true
      responses:
        "200":
          description: The replica is ready.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            text/plain:
              schema:
                type: string
                enum: [OK]
              example: OK
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          description: The replica is not ready (starting, unready or draining).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            text/plain:
              schema:
                type: string
                enum: [UNAVAILABLE]
              example: UNAVAILABLE
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/system/version:
    get:
      operationId: getVersion
      tags: [system]
      summary: Build facts of this replica
      description: |
        By default this requires an authenticated caller of any kind. With
        `system.public_version: true` anonymous callers are accepted as well. Invalid credentials
        yield `401` in either mode.
      security:
        - {}
        - bearerAuth: []
      x-trove-permission:
        authenticated: true
        publicSwitch: system.public_version
      responses:
        "200":
          description: The build facts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
              example:
                version: 0.1.0
                revision: 4f1c2a9e0d7b8a6c5e3f1d2b4a6c8e0f1a3b5c7d
                buildTime: "2026-10-20T09:12:00Z"
                goVersion: go1.27.3
                formats: []
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/system/info:
    get:
      operationId: getSystemInfo
      tags: [system]
      summary: Installation facts
      description: |
        The facts an operator needs to describe the deployment, with every secret omitted.
        Cluster-wide facts come from PostgreSQL; `answeredBy` and the pools describe the replica
        that answered, because requests reach replicas at random and replicas never ask each other.
        A block whose source is not available on this replica is `null`.
      x-trove-permission:
        permission: settings:read
      responses:
        "200":
          description: The installation facts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/system/replicas:
    get:
      operationId: listReplicas
      tags: [system]
      summary: The replica registry
      description: |
        Every replica with its roles, node, state, heartbeat, readiness checks and its own view of
        Valkey. A replica whose heartbeat is older than `system.heartbeat_stale_after` is `lost`.
      x-trove-permission:
        permission: settings:read
      responses:
        "200":
          description: The replicas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplicaList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/openapi.json:
    get:
      operationId: getOpenApiJson
      tags: [meta]
      summary: This document as JSON
      security:
        - {}
      x-trove-permission:
        public: true
      responses:
        "200":
          description: The document, with `servers[0].url` set to the public base URL.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/openapi.yaml:
    get:
      operationId: getOpenApiYaml
      tags: [meta]
      summary: This document as YAML
      security:
        - {}
      x-trove-permission:
        public: true
      responses:
        "200":
          description: The embedded document, with `servers[0].url` set to the public base URL.
          content:
            application/yaml:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/problems/{code}:
    get:
      operationId: getProblemType
      tags: [meta]
      summary: Describe a problem code
      description: |
        The `type` member of every problem is `/api/v1/problems/<code>`; this endpoint resolves it
        to a description. The registry is embedded, so the URI resolves on every installation.
      security:
        - {}
      x-trove-permission:
        public: true
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_]{1,63}$"
      responses:
        "200":
          description: The description of the code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemType"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
  # >>> M1 audit
  # <<< M1 audit
  #
  # >>> M1 api
  /api/v1/system/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List jobs
      description: |
        The durable background jobs of every kind (R-OPS-019, R-API-015), newest first. A caller who
        holds `settings:read` sees all jobs; any other authenticated caller sees only the jobs it
        started. A garbage-collection run is `?kind=gc` or `?kind=gc-full`. Cursor pagination
        (R-API-010) over `(enqueuedAt, id)`: the cursor is valid on every replica.
      x-trove-permission:
        authenticated: true
      parameters:
        - name: kind
          in: query
          description: Repeat the parameter to select several kinds.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: state
          in: query
          description: Repeat the parameter to select several states.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/JobState"
          style: form
          explode: true
        - name: sort
          in: query
          description: "`enqueuedAt` or `-enqueuedAt` (default)."
          schema:
            type: string
            enum: [enqueuedAt, "-enqueuedAt"]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of jobs.
          headers:
            Link:
              $ref: "#/components/headers/Link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
              example:
                items:
                  - id: 01933b2a-7c41-7d1e-9a52-3f0e4b8c2d11
                    kind: gc
                    state: succeeded
                    replica: trove-worker-7d4b9c6f8-q8n2m
                    enqueuedAt: "2026-10-28T12:40:00.000Z"
                    startedAt: "2026-10-28T12:40:01.200Z"
                    finishedAt: "2026-10-28T12:40:02.118Z"
                    attempt: 1
                    maxAttempts: 10
                    progress: null
                    result: {dryRun: false, candidates: 3, kept: 1, deleted: 2, bytesReclaimed: 4096, errors: 0}
                    error: null
                    triggeredBy: null
                    target: null
                    href: /api/v1/system/jobs/01933b2a-7c41-7d1e-9a52-3f0e4b8c2d11
                nextCursor: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/system/jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Read a job
      description: |
        One job with its progress and result summary. A caller without `settings:read` reads only the
        jobs it started; any other job answers `404`, like a missing one. While the job is queued,
        running or cancelling, the answer carries `Retry-After` with a suggested polling interval
        (R-API-015).
      x-trove-permission:
        authenticated: true
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The job.
          headers:
            Retry-After:
              description: Suggested polling interval in seconds, present while the job has not ended.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/system/jobs/{id}/cancel:
    post:
      operationId: cancelJob
      tags: [jobs]
      summary: Cancel a job
      description: |
        A queued job ends `cancelled` at once; a running job turns `cancelling` and stops at its next
        checkpoint. Allowed for a caller with `settings:write` and for the caller who started the job
        (R-API-015); for anyone else the job does not exist. A finished job answers `409`.
      x-trove-permission:
        authenticated: true
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "202":
          description: The job is cancelled or cancelling.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/system/tasks:
    get:
      operationId: listTasks
      tags: [jobs]
      summary: List the maintenance tasks
      description: |
        The registered maintenance tasks with their schedule (from `maintenance.tasks`, read only),
        the next scheduled run, whether a run is going on, and the last run (R-OPS-019). A manual-only
        task such as `secrets-reencrypt` has `schedule` and `nextRunAt` `null`. Ordered by name; cursor
        pagination as everywhere (R-API-010).
      x-trove-permission:
        permission: settings:read
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of tasks.
          headers:
            Link:
              $ref: "#/components/headers/Link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/system/tasks/{name}/run:
    post:
      operationId: runTask
      tags: [jobs]
      summary: Run a maintenance task now
      description: |
        Enqueues a run of the task and answers `202` with the job and its `Location`. The `web`
        replica that answers only enqueues; a `worker` replica executes the run (R-ARCH-001). While a
        run of the task, or of a task that shares its exclusive key (`gc` and `gc-full`), is queued or
        running, the answer is `409` with that job. A task with a precondition that fails answers
        `409` with the code of the precondition (`key_ring_incompatible` for `secrets-reencrypt`) and
        enqueues nothing. The optional body holds the task's parameters, for example
        `{"dryRun": true}` for garbage collection. Starting a run is audited as `system.task_triggered`.
      x-trove-permission:
        permission: settings:write
      x-trove-idempotency-key: optional
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TaskName"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRunRequest"
            example:
              dryRun: true
      responses:
        "202":
          description: The run is queued.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobReferenceEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/system/encryption:
    get:
      operationId: getEncryptionStatus
      tags: [system]
      summary: Status of the stored-secret key ring
      description: |
        Key IDs, the number of sealed values per key ID, the canary state, the key IDs every live
        replica holds, and the last re-encryption (R-API-049). `activeKeyId` and `keys[].canary` are
        the answering replica's view, named by `answeredBy`; the other replicas are in `replicas`.
        The answer carries key IDs only, never key material, fingerprints, ciphertext or plaintext.
      x-trove-permission:
        permission: settings:read
      responses:
        "200":
          description: The key-ring status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncryptionStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  # <<< M1 api
  #
  # >>> M1 identity
  # <<< M1 identity
  #
  # >>> M1 login
  # <<< M1 login
  #
  # >>> M1 authz
  # <<< M1 authz
  #
  # >>> M1 repository
  # <<< M1 repository
  #
  # >>> M1 files
  # <<< M1 files
  #
  # >>> M1 endpoints
  # <<< M1 endpoints
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A trove token (`trv_` prefix). Credentials that are present but invalid always give `401`.
  headers:
    RequestId:
      description: The trace ID of the request (W3C Trace Context); quote it when reporting a problem.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    ETag:
      description: Strong entity tag of the representation, the quoted revision (R-API-012).
      schema:
        type: string
        example: '"4"'
    Location:
      description: The URL of the created resource, or of the job to poll (R-API-004, R-API-015).
      schema:
        type: string
    Link:
      description: 'RFC 8288 link to the next page, `rel="next"`, present while more items exist (R-API-010).'
      schema:
        type: string
    RateLimitPolicy:
      description: 'The limit class of the route, `"read";q=200;w=4` (R-API-016).'
      schema:
        type: string
    RateLimit:
      description: 'The remaining budget, `"read";r=199;t=3` (R-API-016).'
      schema:
        type: string
    IdempotencyReplayed:
      description: '`true` when the answer is the stored outcome of an earlier request with the same Idempotency-Key (R-API-014).'
      schema:
        type: string
        enum: ["true"]
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size, 1 to `api.page_size_max` (R-API-010).
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The `nextCursor` of the previous page. Opaque; valid only with the filters and sort it was issued for.
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag loaded with the resource, or `*` to overwrite deliberately (R-API-012).
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: An ETag the client holds; a match answers `304` (R-API-012).
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 1 to 255 printable ASCII characters, preferably a UUID (R-API-014).
      schema:
        type: string
        minLength: 1
        maxLength: 255
    JobId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthenticated:
      description: The request carries no valid credential.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The credential is valid but the operation is not permitted.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The target does not exist or is not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Internal:
      description: Unexpected failure. The `detail` is generic; the cause is in the log under the same request ID.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: A dependency is unreachable. `Retry-After` is set.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The request cannot be read, or a parameter, header, cursor or sort field is not valid (`malformed_request`, `invalid_cursor`, `invalid_header`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with the current state, or an idempotent request is still in progress (`Retry-After` is set then).
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: '`If-Match` does not match; the extension `currentEtag` holds the current tag (R-API-012).'
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionRequired:
      description: The operation needs `If-Match` (R-API-012).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: The body exceeds `api.max_request_body_bytes`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The body is not of the media type the operation takes.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: The body is well-formed but a value is invalid, or an `Idempotency-Key` was reused for another request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: The rate limit of the caller's class is used up (R-API-016). `Retry-After` is set.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
        RateLimit-Policy:
          $ref: "#/components/headers/RateLimitPolicy"
        RateLimit:
          $ref: "#/components/headers/RateLimit"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotModified:
      description: The ETag matches `If-None-Match`; no body.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
  schemas:
    Problem:
      type: object
      description: |
        RFC 9457 problem details. The extension members are `code`, `requestId` and `errors`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: The relative URI `/api/v1/problems/<code>`.
          example: /api/v1/problems/not_found
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          description: The request path.
        code:
          type: string
          description: Stable snake_case identifier; clients match on it.
          example: not_found
        requestId:
          type: string
          description: Equals the `X-Request-Id` response header.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        currentEtag:
          type: string
          description: "Extension of `precondition_failed`: the current ETag of the resource (R-API-012)."
        job:
          $ref: "#/components/schemas/JobReference"
    FieldError:
      type: object
      required: [pointer, code, detail]
      properties:
        pointer:
          type: string
          description: RFC 6901 JSON pointer into the request body.
        code:
          type: string
        detail:
          type: string
    ProblemType:
      type: object
      required: [code, title, status, description]
      properties:
        code:
          type: string
        title:
          type: string
        status:
          type: integer
        description:
          type: string
    Version:
      type: object
      required: [version, revision, buildTime, goVersion, formats]
      properties:
        version:
          type: string
          description: The trove version, or `dev` for a build without a release version.
        revision:
          type: string
          description: The source revision, or `unknown`.
        buildTime:
          type: string
          description: RFC 3339 UTC time of the build, or `unknown`.
        goVersion:
          type: string
        formats:
          type: array
          description: The package formats this build serves.
          items:
            type: string
    SystemInfo:
      type: object
      required:
        - installationId
        - incarnation
        - answeredBy
        - version
        - baseUrl
        - baseUrlSource
        - maintenanceMode
        - replicas
        - database
        - valkey
        - objectStore
        - backup
        - features
        - formats
        - runtime
      properties:
        installationId:
          type: [string, "null"]
          description: UUID generated by the first migration; `null` until this replica has read `system_state`.
        incarnation:
          type: [string, "null"]
          description: UUID written by a restore; `null` until this replica has read `system_state`.
        answeredBy:
          type: object
          required: [replica, role]
          properties:
            replica:
              type: string
            role:
              type: string
              enum: [web, worker, all]
        version:
          type: object
          required: [version, revision, goVersion]
          properties:
            version:
              type: string
            revision:
              type: string
            goVersion:
              type: string
        baseUrl:
          type: string
          description: The origin generated URLs are built from.
        baseUrlSource:
          type: string
          enum: [config, request]
          description: "`request` means `server.base_url` is unset and the origin was derived from the request (development only)."
        maintenanceMode:
          type: string
          description: Open enum; `normal` until the maintenance modes exist.
          example: normal
        replicas:
          $ref: "#/components/schemas/ReplicaSummary"
        database:
          oneOf:
            - $ref: "#/components/schemas/DatabaseFacts"
            - type: "null"
        valkey:
          $ref: "#/components/schemas/ValkeyFacts"
        objectStore:
          $ref: "#/components/schemas/ObjectStoreFacts"
        backup:
          type: "null"
          description: Always `null` until the backup runs exist.
        features:
          type: object
          required: [tracing, webhooks, configAsCode]
          properties:
            tracing:
              type: boolean
            webhooks:
              type: boolean
            configAsCode:
              type: boolean
        formats:
          type: array
          items:
            type: string
        runtime:
          type: object
          required: [goos, goarch, gomaxprocs, memoryLimitBytes]
          properties:
            goos:
              type: string
            goarch:
              type: string
            gomaxprocs:
              type: integer
            memoryLimitBytes:
              type: integer
              format: int64
              description: The container memory limit; 0 when none is known.
    ReplicaSummary:
      type: object
      required: [live, ready, versions, roles]
      properties:
        live:
          type: integer
        ready:
          type: integer
        versions:
          type: object
          description: Live replicas per version.
          additionalProperties:
            type: integer
        roles:
          type: object
          description: Per role (`web`, `worker`, `all`).
          additionalProperties:
            $ref: "#/components/schemas/RoleSummary"
    RoleSummary:
      type: object
      required: [live, ready, degraded, nodes]
      properties:
        live:
          type: integer
        ready:
          type: integer
        degraded:
          type: integer
        nodes:
          type: integer
          description: Distinct nodes the live replicas of the role run on.
    DatabaseFacts:
      type: object
      required: [serverVersion, schemaVersion, supportedSchemaVersions, poolerMode, pools]
      properties:
        serverVersion:
          type: string
        schemaVersion:
          type: integer
        supportedSchemaVersions:
          type: array
          items:
            type: integer
        poolerMode:
          type: string
          description: Open enum; `none` or `transaction`.
        pools:
          type: object
          description: The answering replica's pools.
          additionalProperties:
            $ref: "#/components/schemas/PoolFacts"
    PoolFacts:
      type: object
      required: [max, inUse, idle]
      properties:
        max:
          type: integer
        inUse:
          type: integer
        idle:
          type: integer
    ValkeyFacts:
      type: object
      description: Installation facts only; each replica's view is in the replica registry. No Sentinel address appears.
      required: [mode, primaryName, sentinels, tls, keyPrefix, keyspace, degradedReplicas]
      properties:
        mode:
          type: string
          enum: [sentinel, standalone]
        primaryName:
          type: string
        sentinels:
          type: integer
          description: The number of configured Sentinels.
        tls:
          type: string
          description: The TLS verification mode.
        keyPrefix:
          type: string
        keyspace:
          type: [string, "null"]
          description: The keyspace segment of every key; `null` until this replica has read it.
        degradedReplicas:
          type: [integer, "null"]
          description: Live replicas whose Valkey check is degraded; `null` until the replica registry exists.
    ObjectStoreFacts:
      type: object
      required: [endpoint, bucket, prefix, credentialSource]
      properties:
        endpoint:
          type: string
        bucket:
          type: string
        prefix:
          type: string
        credentialSource:
          type: string
          description: Open enum, for example `static` or `workload-identity`.
    ReplicaList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Replica"
    Replica:
      type: object
      required:
        - name
        - instanceUid
        - version
        - revision
        - roles
        - state
        - lost
        - startedAt
        - heartbeatAt
        - leases
        - node
        - checks
        - degraded
        - valkey
      properties:
        name:
          type: string
          description: The pod name, else the host name.
        instanceUid:
          type: string
          description: Random per process start.
        version:
          type: string
        revision:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [web, worker, all]
        state:
          type: string
          enum: [starting, ready, unready, draining]
        lost:
          type: boolean
          description: The heartbeat is older than `system.heartbeat_stale_after`.
        startedAt:
          type: string
          format: date-time
        heartbeatAt:
          type: string
          format: date-time
        leases:
          type: array
          items:
            type: object
            required: [name, since]
            properties:
              name:
                type: string
              since:
                type: string
                format: date-time
        node:
          type: [string, "null"]
          description: The Kubernetes node name (`TROVE_NODE_NAME`); `null` outside Kubernetes.
        checks:
          type: object
          description: The last result of every readiness check, gating and reported.
          additionalProperties:
            $ref: "#/components/schemas/CheckResult"
        degraded:
          type: array
          description: The reported checks that fail.
          items:
            type: string
        valkey:
          oneOf:
            - $ref: "#/components/schemas/ValkeyView"
            - type: "null"
    CheckResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pass, fail, degraded]
        reason:
          type: string
          description: A short sanitised reason; never a host, address or error text.
        configError:
          type: boolean
    ValkeyView:
      type: object
      description: The replica's view of Valkey. No credential, user name or key appears.
      required: [state, reason, circuit, primary, sentinelsReachable, sentinelsConfigured, serverVersion, lastPrimaryChangeAt]
      properties:
        state:
          type: string
          enum: [available, degraded]
        reason:
          type: [string, "null"]
          description: "`null`, or an error kind (`timeout`, `connection`, `readonly`, `auth`, `tls`, `oom`), `no_primary` or `unsupported_version`."
        circuit:
          type: string
          description: Open enum, for example `closed` or `open`.
        primary:
          type: [string, "null"]
          description: The primary address (host and port) the client currently uses.
        sentinelsReachable:
          type: integer
        sentinelsConfigured:
          type: integer
        serverVersion:
          type: [string, "null"]
        lastPrimaryChangeAt:
          type: [string, "null"]
          format: date-time
    # >>> M1 audit
    # <<< M1 audit
    #
    # >>> M1 api
    JobState:
      type: string
      enum: [queued, running, succeeded, failed, cancelling, cancelled]
    TaskName:
      type: string
      pattern: "^[a-z][a-z0-9_.:-]{0,62}$"
    TaskRunRequest:
      type: object
      description: The parameters of the task; each task defines its own (garbage collection takes `dryRun`).
      additionalProperties: true
    JobProgress:
      type: object
      required: [done, total, unit]
      properties:
        done:
          type: integer
          format: int64
        total:
          type: [integer, "null"]
          format: int64
        unit:
          type: [string, "null"]
    JobTarget:
      type: object
      required: [kind, key]
      properties:
        kind:
          type: string
        key:
          type: string
    Job:
      type: object
      required: [id, kind, state, replica, enqueuedAt, startedAt, finishedAt, attempt, maxAttempts, progress, result, error, triggeredBy, target, href]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          example: gc
        state:
          $ref: "#/components/schemas/JobState"
        replica:
          type: [string, "null"]
          description: The name of the replica that ran or runs the job; `null` while it is queued.
        enqueuedAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        attempt:
          type: integer
        maxAttempts:
          type: integer
        progress:
          oneOf:
            - $ref: "#/components/schemas/JobProgress"
            - type: "null"
        result:
          type: [object, "null"]
          description: The result summary the kind defines; `null` until the job succeeded.
          additionalProperties: true
        error:
          type: [object, "null"]
          description: A stable `code` and a sanitised message; `null` unless the job failed or was cancelled.
          additionalProperties: true
        triggeredBy:
          type: [string, "null"]
          description: The ID of the principal that started the job; `null` for scheduled and system runs.
        target:
          oneOf:
            - $ref: "#/components/schemas/JobTarget"
            - type: "null"
        href:
          type: string
          description: The path to poll.
    JobList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        nextCursor:
          type: [string, "null"]
          description: Opaque; `null` on the last page.
    JobReference:
      type: object
      required: [id, kind, state, href]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        state:
          $ref: "#/components/schemas/JobState"
        href:
          type: string
    JobReferenceEnvelope:
      type: object
      required: [job]
      properties:
        job:
          $ref: "#/components/schemas/JobReference"
    TaskLastRun:
      type: object
      required: [jobId, startedAt, finishedAt, outcome, replica]
      properties:
        jobId:
          type: string
          format: uuid
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        outcome:
          $ref: "#/components/schemas/JobState"
        replica:
          type: [string, "null"]
    Task:
      type: object
      required: [name, schedule, enabled, nextRunAt, running, lastRun]
      properties:
        name:
          $ref: "#/components/schemas/TaskName"
        schedule:
          type: [string, "null"]
          description: Five-field cron expression in UTC; `null` for a manual-only task.
        enabled:
          type: boolean
        nextRunAt:
          type: [string, "null"]
          format: date-time
          description: "`null` for a manual-only or disabled task."
        running:
          type: boolean
        lastRun:
          oneOf:
            - $ref: "#/components/schemas/TaskLastRun"
            - type: "null"
    TaskList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        nextCursor:
          type: [string, "null"]
    EncryptionKey:
      type: object
      required: [id, active, sealedValues, canary]
      properties:
        id:
          type: string
        active:
          type: boolean
          description: The answering replica seals with this key.
        sealedValues:
          type: integer
          format: int64
          description: Sealed values under this key ID over every registered sealed column.
        canary:
          type: string
          enum: [ok, failed, absent]
    EncryptionReplica:
      type: object
      required: [name, role, activeKeyId, keyIds]
      properties:
        name:
          type: string
        role:
          type: string
          enum: [web, worker, all]
        activeKeyId:
          type: string
        keyIds:
          type: array
          items:
            type: string
    LastReencryption:
      type: object
      required: [jobId, state, finishedAt]
      properties:
        jobId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/JobState"
        finishedAt:
          type: [string, "null"]
          format: date-time
    EncryptionStatus:
      type: object
      required: [answeredBy, activeKeyId, keys, replicas, ringsCompatible, lastReencryption]
      properties:
        answeredBy:
          type: string
          description: The replica whose ring `activeKeyId` and `keys[].canary` describe.
        activeKeyId:
          type: string
        keys:
          type: array
          items:
            $ref: "#/components/schemas/EncryptionKey"
        replicas:
          type: array
          description: The live `web` and `worker` replicas, from the replica registry.
          items:
            $ref: "#/components/schemas/EncryptionReplica"
        ringsCompatible:
          type: boolean
          description: Every live replica's ring holds every key ID that is active on any live replica or referenced by a sealed value.
        lastReencryption:
          oneOf:
            - $ref: "#/components/schemas/LastReencryption"
            - type: "null"
