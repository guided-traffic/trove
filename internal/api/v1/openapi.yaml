    # <<< M2 manual
    #
    # >>> M2 proxy
    CacheInvalidateRequest:
      type: object
      properties:
        path:
          type: string
          maxLength: 256
          description: A canonical path or package name prefix of whole segments; empty is the whole repository.
          default: ""
        scope:
          type: string
          enum: [metadata, negative, all]
          default: metadata
    CacheInvalidateResult:
      type: object
      required: [invalidated]
      properties:
        invalidated:
          type: integer
          minimum: 0
          description: The metadata entries covered at the time of the call; cached misses are not counted.
    CacheEntry:
      type: object
      required: [path, variant, kind, upstreamUrl, fetchedAt, validatedAt, expiresAt, upstreamGoneAt, lastUsedAt]
      properties:
        path:
          type: string
        variant:
          type: string
        kind:
          type: string
          enum: [metadata, artifact]
        upstreamUrl:
          type: string
        fetchedAt:
          type: string
          format: date-time
        validatedAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, "null"]
          format: date-time
        upstreamGoneAt:
          type: [string, "null"]
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    CacheEntryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CacheEntry"
        nextCursor:
          type: [string, "null"]
    RemoteSettings:
      type: object
      additionalProperties: false
      description: |
        The `remote` section of a remote repository (R-REPO-024). Every member is returned, the
        defaults of the format applied. Omitted members of a request take their defaults. The password
        is a secret field: it is never returned (R-REPO-033).
      properties:
        url:
          type: string
          maxLength: 2048
          description: |
            The upstream base URL (NuGet: the service index URL): absolute `http` or `https`, without user
            information and without a fragment. Stored normalized: scheme and host in lower case, the
            default port removed, an empty path as `/`. Required unless the format proposes an upstream.
            A plain `http` URL is saved with the warning `plain_http_upstream`.
        extraHosts:
          type: array
          maxItems: 20
          description: |
            Further hosts that upstream metadata or redirects may point to (R-REPO-043). The format
            proposes entries for its well-known upstream only.
          items:
            $ref: "#/components/schemas/RemoteExtraHost"
        authMode:
          type: string
          enum: [none, basic, bearer]
          default: none
        username:
          type: string
          maxLength: 256
          default: ""
          description: Sent with `basic`; ignored with `bearer`. It must not contain a colon.
        password:
          oneOf:
            - $ref: "#/components/schemas/SecretField"
            - type: "null"
          description: The password, or the token with `bearer`. Needed with `bearer`; `basic` needs a username or a password.
        clientCertificate:
          type: [string, "null"]
          description: A named client certificate (R-REPO-034, P1). A value is refused with `not_applicable` until it is built.
        headers:
          type: array
          maxItems: 32
          description: Custom request headers (R-REPO-036, P1). A non-empty list is refused with `not_applicable` until it is built.
          items:
            type: object
            additionalProperties: true
        forwardAuthOnRedirect:
          type: boolean
          default: false
          description: |
            Also send the credentials to the other origins of a redirect chain (R-REPO-039). The first
            request to a host that is neither the upstream nor an `extraHosts` entry with
            `sendCredentials` never carries them.
        outboundProxy:
          type: object
          additionalProperties: false
          description: "`named` is refused with `not_applicable` until named proxies are built (R-REPO-037, P1)."
          properties:
            mode:
              type: string
              enum: [default, direct, named]
              default: default
            name:
              type: string
        connectTimeoutMs:
          type: integer
          minimum: 1000
          maximum: 120000
          default: 10000
        readTimeoutMs:
          type: integer
          minimum: 1000
          maximum: 600000
          default: 15000
        sourceNetwork:
          type: [string, "null"]
          description: |
            An IPv4 or IPv6 CIDR prefix; each replica binds its upstream connections to the first of its
            own interface addresses inside it (Q-REPO-9). Stored as the network. A prefix that holds a
            single address is saved with the warning `source_network_single_address`; a value that is not
            a prefix is `422 invalid_source_network`.
        cacheFillAction:
          type: string
          enum: [read, deploy]
          default: read
        cache:
          type: object
          additionalProperties: false
          properties:
            storeArtifacts:
              type: boolean
              default: true
              description: "`false` is pass-through (R-REPO-044, P1) and is refused with `not_applicable` until it is built."
            metadataTtlSeconds:
              type: integer
              minimum: 0
              maximum: 2592000
              description: The format's default (npm 7200, NuGet 300).
            metadataRefreshTimeoutSeconds:
              type: integer
              minimum: 1
              maximum: 600
              default: 60
            notFoundTtlSeconds:
              type: integer
              minimum: 0
              maximum: 86400
              description: The format's default (npm and NuGet 1800).
            maxStaleSeconds:
              type: integer
              minimum: 0
              maximum: 31536000
              default: 0
            unusedRetentionHours:
              type: integer
              minimum: 0
              maximum: 87600
              default: 0
              description: A value above 0 is refused with `not_applicable` until the cleanup is built (R-REPO-046, P1).
        integrity:
          type: object
          additionalProperties: false
          properties:
            checksumPolicy:
              type: string
              enum: [verify-if-available, require, ignore, pass-through]
              default: verify-if-available
              description: >-
                `require` is refused with `not_applicable` for a format whose upstream announces no digest (NuGet), and `ignore` and
                `pass-through` for a format that always verifies the digest its metadata announces (npm) (R-REPO-041, Q-ARCH-269, Q-NPM-79).
            blockUnexpectedContentTypes:
              type: boolean
              default: true
            allowedContentTypes:
              type: array
              maxItems: 20
              items:
                type: string
        availability:
          type: object
          additionalProperties: false
          properties:
            mode:
              type: string
              enum: [online, offline]
              default: online
            failureThreshold:
              type: integer
              minimum: 1
              maximum: 100
              default: 5
            circuitOpenSeconds:
              type: integer
              minimum: 0
              maximum: 86400
              default: 300
        limits:
          type: object
          additionalProperties: false
          properties:
            maxArtifactBytes:
              type: [integer, "null"]
              format: int64
              minimum: 1
              description: "`null` is the system value `proxy.max_artifact_bytes`."
            maxMetadataBytes:
              type: [integer, "null"]
              format: int64
              minimum: 1
              description: "`null` is the system value `proxy.max_metadata_bytes`."
            maxConcurrentFetches:
              type: integer
              minimum: 1
              maximum: 4096
              default: 64
        mode:
          type: string
          enum: [pullThrough, mirror]
          default: pullThrough
          description: |
            `pullThrough` fetches what clients ask for; `mirror` also stores, in background passes on `worker`, what the
            upstream offers within the patterns and bounds (R-REPO-050). A format whose upstream cannot be discovered answers
            `422 not_applicable`; a mirror of the format's well-known upstream without a bound `422 mirror_unbounded`, of
            another upstream the warning `mirror_unbounded`; an Owner without `repositories:write-config` `422 mirror_restricted` (Q-REPO-142).
        mirror:
          $ref: "#/components/schemas/MirrorSettings"
    RemoteExtraHost:
      type: object
      additionalProperties: false
      required: [pattern]
      properties:
        pattern:
          type: string
          maxLength: 253
          description: A host name pattern in lower case with the wildcards `*` and `?`, for example `*.nuget.org`. No port, no path.
        sendCredentials:
          type: boolean
          default: false
          description: Send the upstream credentials to hosts that match (R-REPO-033).
    SecretField:
      type: object
      additionalProperties: false
      description: |
        A secret member of a document (R-REPO-033). A request sends `value`, which is sealed at once, or
        `secretRef`, or `set: true`, which keeps the stored value; a document that was read can therefore
        be sent back without blanking or leaking the secret. A read shows `{"set": true}` for a sealed
        value and the reference itself for a reference. The value is never returned. `value` and
        `secretRef` together, an empty value, a reference outside the rules of R-OPS-029 (a file directly
        under `config_as_code.secrets_dir`; a variable named `TROVE_CAC_<NAME>`) and `set: false` are
        `422 invalid_secret`.
      properties:
        value:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 8192
        secretRef:
          $ref: "#/components/schemas/SecretReference"
        set:
          type: boolean
          enum: [true]
    SecretReference:
      type: object
      additionalProperties: false
      description: Exactly one of `file` and `env`.
      properties:
        file:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,254}$"
        env:
          type: string
          pattern: "^TROVE_CAC_[A-Z0-9_]{1,200}$"
    UpstreamTestRequest:
      type: object
      additionalProperties: false
      required: [format, remote]
      properties:
        format:
          type: string
          description: The format of the repository the section is for; its defaults and probe resource apply.
        remote:
          $ref: "#/components/schemas/RemoteSettings"
    UpstreamTestResult:
      type: object
      required: [reachable, httpStatus, authenticated, durationMs, tls, outboundProxy, sourceAddress, error]
      properties:
        reachable:
          type: boolean
          description: The upstream answered with an HTTP response, whatever its status.
        httpStatus:
          type: [integer, "null"]
        authenticated:
          type: [boolean, "null"]
          description: "`false` for `401` and `403`; `null` when there was no response."
        durationMs:
          type: integer
          format: int64
        tls:
          type: [object, "null"]
          description: The leaf certificate of the host that answered; `null` over plain `http`.
          required: [peerSubject, notAfter]
          properties:
            peerSubject:
              type: string
            notAfter:
              type: string
              format: date-time
        outboundProxy:
          type: [string, "null"]
          description: The named proxy the request went through; `null` until named proxies exist.
        sourceAddress:
          type: [string, "null"]
          description: The local address the probing replica bound, when the repository has a `sourceNetwork`.
        error:
          type: [object, "null"]
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - dns_error
                - connection_refused
                - timeout
                - tls_untrusted
                - egress_denied
                - source_network_unavailable
                - upstream_secret_unavailable
                - offline
                - too_many_redirects
                - insecure_redirect
                - request_failed
            message:
              type: string
    # <<< M2 proxy
    #
    # >>> M2 virtual
    VirtualSettings:
      type: object
      description: |
        The `virtual` section of a virtual repository (R-REPO-017). The members, the deploy target and
        the pin rules are stored as rows, so that a repository which is a member or a target cannot be
        deleted (`409 repository_referenced`, or `detach=true`); the document is rendered from them.
      properties:
        members:
          type: array
          description: |
            The keys of the member repositories in resolution order: local and remote repositories of
            the virtual repository's format, no duplicates, at most `repositories.max_virtual_members`.
            Virtual members arrive with nested virtual repositories (R-REPO-018).
          items:
            type: string
        deployTarget:
          type: [string, "null"]
          description: The key of the local member that takes writes (R-REPO-021); `null` makes the repository read-only.
        mergedMetadataTtlSeconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: How long a merged metadata document is cached (R-REPO-020).
        pinning:
          type: object
          properties:
            rules:
              type: array
              maxItems: 200
              items:
                $ref: "#/components/schemas/PinRule"
    PinRule:
      type: object
      description: |
        Only the listed members are consulted for the names that `packages` selects (R-REPO-023). A
        pattern is an exact name or a literal followed by one trailing `*` or `**`; the rule of the most
        specific matching pattern applies. Pin rules take precedence over claims. A rule without members
        answers `404` for its names. The members are listed in the order of the member list.
      required: [packages, members]
      properties:
        packages:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            maxLength: 256
        members:
          type: array
          items:
            type: string
    RepositoryClaim:
      type: object
      required: [pattern, source, scope, createdAt]
      properties:
        pattern:
          type: string
          description: The claimed name or prefix, in the format's normalized form.
        source:
          type: string
          enum: [manual, auto]
        scope:
          type: string
          enum: [members, global]
        createdAt:
          type: string
          format: date-time
    RepositoryClaims:
      type: object
      required: [claims]
      properties:
        claims:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/RepositoryClaim"
        warnings:
          type: array
          readOnly: true
          description: Findings of the write that did not block it (`claim_overlaps`); present on a write.
          items:
            $ref: "#/components/schemas/RepositoryWarning"
    RepositoryClaimsInput:
      type: object
      required: [claims]
      additionalProperties: false
      properties:
        claims:
          type: array
          maxItems: 1000
          description: The complete set of manual claims.
          items:
            type: object
            required: [pattern]
            additionalProperties: false
            properties:
              pattern:
                type: string
                maxLength: 256
              scope:
                type: string
                enum: [members, global]
                default: members
        removeAuto:
          type: array
          description: Patterns of automatic claims to remove. Automatic claims not listed here stay.
          items:
            type: string
            maxLength: 256
    RepositoryResolution:
      type: object
      required: [repository, descriptor, members, unreadableMembers]
      properties:
        repository:
          type: string
        descriptor:
          type: object
          required: [path, kind]
          properties:
            path:
              type: string
            kind:
              type: string
              enum: [artifact, metadata, search, write, other]
            package:
              type: string
        decidedBy:
          type: object
          description: The claim or the pin rule that narrowed the members; absent when neither did.
          properties:
            claim:
              type: string
            pin:
              type: string
            claimedBy:
              type: array
              description: The repositories with the most specific claim that the caller can read.
              items:
                type: string
        members:
          type: array
          description: The members in the order of the member list, without those the caller cannot read.
          items:
            type: object
            required: [key, class, decision]
            properties:
              key:
                type: string
              class:
                type: string
                enum: [local, remote]
              decision:
                type: string
                enum:
                  - disabled
                  - not_admitted
                  - pinned-out
                  - claimed-elsewhere
                  - refused-claimed
                  - no-read
                  - no-cache-fill
                  - hit
                  - miss
                  - negative
                  - offline
                  - circuit-open
        unreadableMembers:
          type: integer
          minimum: 0
          description: The number of members the caller cannot read, which are not named.
    # <<< M2 virtual
    #
