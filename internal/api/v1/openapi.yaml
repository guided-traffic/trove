      schema:
        type: string
    # <<< M2 packages
    #
  responses:
    # >>> M13 bastion
    NotImplemented:
      description: The operation belongs to the Bastion work and is not built in this release yet (`bastion_not_implemented`).
      content:
        application/problem+json:
