# oapi-codegen configuration (R-API-002, Q-API-1): models and the std-http-server
# interface only. The strict-server variant is not used: handlers set ETag,
# Location, Link and Retry-After themselves.
package: gen
output: api.gen.go
generate:
  models: true
  std-http-server: true
output-options:
  skip-prune: true
  # The operations tagged files (/files/..., R-API-002) are served by the raw file
  # path of R-ARCH-011, not by the generated interface; the route-parity check
  # covers them.
  exclude-tags:
    - files
