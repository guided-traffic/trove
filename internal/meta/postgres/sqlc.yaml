version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: q
        out: q
        sql_package: pgx/v5
        emit_json_tags: false
        emit_empty_slices: true
        # The enum helpers sqlc generates (Null types) implement database/sql/driver
        # interfaces, which no trove package imports (R-ARCH-026). Plain strings
        # carry the values; the CHECK of the type keeps them valid.
        overrides:
          - db_type: "job_state"
            go_type: "string"
          - db_type: "job_state"
            nullable: true
            go_type:
              type: "string"
              pointer: true
