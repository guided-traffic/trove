version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: q
        out: q
        sql_package: pgx/v5
        emit_json_tags: false
        emit_empty_slices: true
        # The enum helpers sqlc generates (Null types) implement database/sql/driver
        # interfaces, which no trove package imports (R-ARCH-026). Plain strings
        # carry the values; the CHECK of the type keeps them valid.
        overrides:
          # The blob store reads and writes these as plain times: its package may
          # not import the driver types (R-ARCH-002).
          - column: "blob_gc_queue.enqueued_at"
            go_type: "time.Time"
          - column: "blobs.created_at"
            go_type: "time.Time"
          # The audit package reads event times as plain times (R-ARCH-002).
          - column: "audit_event.occurred_at"
            go_type: "time.Time"
          # A transaction-mode pooler runs the main pool in pgx's Exec mode (R-ARCH-019, Q-ARCH-14), which sends no parameter
          # types: pgx then encodes a []byte as bytea ("\\x7b..."), which a ::jsonb cast refuses. json.RawMessage is sent as the
          # JSON text it holds.
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type: "encoding/json.RawMessage"
          - db_type: "job_state"
            go_type: "string"
          - db_type: "job_state"
            nullable: true
            go_type:
              type: "string"
              pointer: true
