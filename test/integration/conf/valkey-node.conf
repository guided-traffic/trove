# Data node of the integration stack: TLS only, ACL file, asynchronous replication.
bind 0.0.0.0
protected-mode no
port 0
tls-cert-file /certs/server.crt
tls-key-file /certs/server.key
tls-ca-cert-file /certs/ca.crt
tls-auth-clients no
tls-replication yes
dir /data
appendonly no
save ""
aclfile /data/users.acl
masteruser ops
masterauth ops-valkey-it
replica-announce-ip 127.0.0.1
repl-diskless-sync-delay 0
