# Sentinel of the integration stack: TLS only, password-protected.
bind 0.0.0.0
protected-mode no
port 0
tls-cert-file /certs/server.crt
tls-key-file /certs/server.key
tls-ca-cert-file /certs/ca.crt
tls-auth-clients no
tls-replication yes
dir /data
requirepass sentinel-valkey-it
sentinel sentinel-pass sentinel-valkey-it
sentinel announce-ip 127.0.0.1
sentinel monitor trove 127.0.0.1 16379 2
sentinel auth-user trove ops
sentinel auth-pass trove ops-valkey-it
sentinel down-after-milliseconds trove 3000
sentinel failover-timeout trove 15000
sentinel parallel-syncs trove 1
sentinel deny-scripts-reconfig yes
