openapi: 3.1.0
info:
  title: trove management API
  version: 1.0.0
  summary: Management API of the trove artifact repository manager.
  description: |
    Every endpoint lives under `/api/v1/`; the major version in the path is the only version
    selector. Errors are `application/problem+json` (RFC 9457). Package-manager protocol endpoints
    follow their ecosystem's specification and are not part of this document.

    This document is the contract: the server code (`internal/api/v1/gen`) and the UI client types
    are generated from it. It is served at `/api/v1/openapi.json` and `/api/v1/openapi.yaml`
    without authentication and holds no instance data except `servers[0].url`, which the server
    replaces with its public base URL.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://trove.example.com
    description: The public base URL (`server.base_url`); the server replaces this entry.
tags:
  - name: system
    description: Liveness of the API, build facts, installation facts and the replica registry.
  - name: meta
    description: This document and the problem catalog.
  # >>> M1 audit
  - name: audit
    description: Query and export of the audit trail.
  # <<< M1 audit
  #
  # >>> M1 api
  - name: jobs
    description: Background jobs and the maintenance tasks that start them.
  # <<< M1 api
  #
  # >>> M1 identity
  # <<< M1 identity
  #
  # >>> M1 login
  # <<< M1 login
  #
  # >>> M1 authz
  - name: permissions
    description: Permission policies, system roles and role bindings, and the permission checks of the caller.
  # <<< M1 authz
  #
  # >>> M1 repository
  # <<< M1 repository
  #
  # >>> M1 files
  # <<< M1 files
  #
  # >>> M1 endpoints
  # <<< M1 endpoints
security:
  - bearerAuth: []
paths:
  /api/v1/system/ping:
    get:
      operationId: getPing
      tags: [system]
      summary: Check that this replica is ready to take work
      description: |
        Answers `200 text/plain` with `OK` while the replica is ready, a degraded replica included,
        and `503` with `UNAVAILABLE` otherwise. A Valkey outage never fails a ping. Anonymous
        callers are accepted. A presented credential is validated, so tooling can check the base URL
        and a token in one call: an invalid, expired or revoked token yields `401`.
      security:
        - {}
        - bearerAuth: []
      x-trove-permission:
        public: true
      responses:
        "200":
          description: The replica is ready.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            text/plain:
              schema:
                type: string
                enum: [OK]
              example: OK
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          description: The replica is not ready (starting, unready or draining).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            text/plain:
              schema:
                type: string
                enum: [UNAVAILABLE]
              example: UNAVAILABLE
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/system/version:
    get:
      operationId: getVersion
      tags: [system]
      summary: Build facts of this replica
      description: |
        By default this requires an authenticated caller of any kind. With
        `system.public_version: true` anonymous callers are accepted as well. Invalid credentials
        yield `401` in either mode.
      security:
        - {}
        - bearerAuth: []
      x-trove-permission:
        authenticated: true
        publicSwitch: system.public_version
      responses:
        "200":
          description: The build facts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
              example:
                version: 0.1.0
                revision: 4f1c2a9e0d7b8a6c5e3f1d2b4a6c8e0f1a3b5c7d
                buildTime: "2026-10-20T09:12:00Z"
                goVersion: go1.27.3
                formats: []
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/system/info:
    get:
      operationId: getSystemInfo
      tags: [system]
      summary: Installation facts
      description: |
        The facts an operator needs to describe the deployment, with every secret omitted.
        Cluster-wide facts come from PostgreSQL; `answeredBy` and the pools describe the replica
        that answered, because requests reach replicas at random and replicas never ask each other.
        A block whose source is not available on this replica is `null`.
      x-trove-permission:
        permission: settings:read
      responses:
        "200":
          description: The installation facts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/system/replicas:
    get:
      operationId: listReplicas
      tags: [system]
      summary: The replica registry
      description: |
        Every replica with its roles, node, state, heartbeat, readiness checks and its own view of
        Valkey. A replica whose heartbeat is older than `system.heartbeat_stale_after` is `lost`.
      x-trove-permission:
        permission: settings:read
      responses:
        "200":
          description: The replicas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplicaList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/openapi.json:
    get:
      operationId: getOpenApiJson
      tags: [meta]
      summary: This document as JSON
      security:
        - {}
      x-trove-permission:
        public: true
      responses:
        "200":
          description: The document, with `servers[0].url` set to the public base URL.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/openapi.yaml:
    get:
      operationId: getOpenApiYaml
      tags: [meta]
      summary: This document as YAML
      security:
        - {}
      x-trove-permission:
        public: true
      responses:
        "200":
          description: The embedded document, with `servers[0].url` set to the public base URL.
          content:
            application/yaml:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/problems/{code}:
    get:
      operationId: getProblemType
      tags: [meta]
      summary: Describe a problem code
      description: |
        The `type` member of every problem is `/api/v1/problems/<code>`; this endpoint resolves it
        to a description. The registry is embedded, so the URI resolves on every installation.
      security:
        - {}
      x-trove-permission:
        public: true
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_]{1,63}$"
      responses:
        "200":
          description: The description of the code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemType"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
  # >>> M1 audit
  /api/v1/audit/events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: Query the audit trail
      description: |
        Audit events, newest first, with keyset pagination over `(occurredAt, id)` (R-OPS-017): the
        cursor is valid on every replica and no page holds a transaction. Without `from` the range is
        the last 24 hours; `to` is exclusive. `action` is an exact name or a prefix ending in `.*`
        (`authz.*`). `actor` is a principal ID or a name. `limit` is at most 1000 (default 100).
      x-trove-permission:
        permission: audit:read
      parameters:
        - name: from
          in: query
          description: Start of the range, inclusive (RFC 3339); default the last 24 hours.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: End of the range, exclusive (RFC 3339); default open.
          schema:
            type: string
            format: date-time
        - name: action
          in: query
          description: An event name, or a prefix ending in `.*` such as `authz.*`.
          schema:
            type: string
        - name: category
          in: query
          description: "One of auth, token, identity, authz, repository, content, system, config, webhook."
          schema:
            type: string
        - name: outcome
          in: query
          description: "success, failure or denied."
          schema:
            type: string
        - name: actor
          in: query
          description: A principal ID or a name.
          schema:
            type: string
        - name: repository
          in: query
          schema:
            type: string
        - name: resourceType
          in: query
          schema:
            type: string
        - name: resourceId
          in: query
          schema:
            type: string
        - name: traceId
          in: query
          description: The trace ID the client received as `X-Request-Id`.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size, 1 to 1000 (default 100).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of events.
          headers:
            Link:
              $ref: "#/components/headers/Link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
              example:
                items:
                  - id: 01933b1e-7c2a-7f4e-9d1b-6a2f0c9e8b11
                    occurredAt: "2026-10-28T11:58:02.417Z"
                    action: authz.policy.created
                    category: authz
                    outcome: success
                    actor: {type: user, id: 5f0e6c3a-6b1d-4c1e-8f43-0d7c3d1c9a10, name: sec-alice, tokenId: null, authMethod: null}
                    source: {ip: 10.12.4.7, userAgent: curl/8.7.1}
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                    replica: trove-web-6f9c7d8b5-x2v4q
                    endpoint: default
                    resource: {type: permission_policy, id: 8c0d2f4e-1f64-4b7a-9d0e-3b5c7a9e1f20}
                    repository: null
                    path: null
                    reason: null
                    details: {epoch: 1842, version: 1}
                nextCursor: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/audit/events/export:
    get:
      operationId: exportAuditEvents
      tags: [audit]
      summary: Export the audit trail
      description: |
        Streams the events of a range, oldest first, as JSON Lines (`application/x-ndjson`, default) or
        CSV (R-OPS-017). `from` and `to` are both required and cover at most 400 days
        (`400 invalid_audit_range`). The export reads keyset batches of short queries and holds no
        transaction while the client reads, so a cut export is resumed on any replica with an inclusive
        `from` set to the `occurredAt` of the last complete line, dropping the IDs already received.
        The event `audit.exported` is written before the first byte; if it cannot be written nothing is
        streamed.
      x-trove-permission:
        permission: audit:read
      parameters:
        - name: from
          in: query
          description: Start of the range, inclusive (RFC 3339). Required; a missing value answers `400 invalid_audit_range`.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: End of the range, exclusive (RFC 3339). Required; a missing value answers `400 invalid_audit_range`.
          schema:
            type: string
            format: date-time
        - name: action
          in: query
          description: An event name, or a prefix ending in `.*` such as `authz.*`.
          schema:
            type: string
        - name: category
          in: query
          description: "One of auth, token, identity, authz, repository, content, system, config, webhook."
          schema:
            type: string
        - name: outcome
          in: query
          description: "success, failure or denied."
          schema:
            type: string
        - name: actor
          in: query
          description: A principal ID or a name.
          schema:
            type: string
        - name: repository
          in: query
          schema:
            type: string
        - name: resourceType
          in: query
          schema:
            type: string
        - name: resourceId
          in: query
          schema:
            type: string
        - name: traceId
          in: query
          description: The trace ID the client received as `X-Request-Id`.
          schema:
            type: string
        - name: format
          in: query
          description: "`jsonl` (default) or `csv`."
          schema:
            type: string
            enum: [jsonl, csv]
            default: jsonl
      responses:
        "200":
          description: |
            The events of the range, oldest first. `application/x-ndjson`: one `AuditEvent` per line, each
            line a complete JSON object. `text/csv`: a header row, then one row per event with the columns
            `id`, `occurredAt`, `action`, `category`, `outcome`, `actorType`, `actorId`, `actorName`,
            `tokenId`, `authMethod`, `sourceIp`, `userAgent`, `traceId`, `replica`, `endpoint`,
            `resourceType`, `resourceId`, `repository`, `path`, `reason` and `details` (the JSON text); a
            cell that would open as a formula in a spreadsheet starts with an apostrophe. The streamed
            bodies have no schema here because a line-delimited stream is not one JSON document.
          content:
            application/x-ndjson: {}
            text/csv: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/audit/events/{id}:
    get:
      operationId: getAuditEvent
      tags: [audit]
      summary: Read one audit event
      description: One event by its ID (a UUIDv7). An ID that does not exist, or is not an event ID, answers `404`.
      x-trove-permission:
        permission: audit:read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            x-trove-reserved-names: [export]
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEvent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  # <<< M1 audit
  #
  # >>> M1 api
  /api/v1/system/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List jobs
      description: |
        The durable background jobs of every kind (R-OPS-019, R-API-015), newest first. A caller who
        holds `settings:read` sees all jobs; any other authenticated caller sees only the jobs it
        started. A garbage-collection run is `?kind=gc` or `?kind=gc-full`. Cursor pagination
        (R-API-010) over `(enqueuedAt, id)`: the cursor is valid on every replica.
      x-trove-permission:
        authenticated: true
      parameters:
        - name: kind
          in: query
          description: Repeat the parameter to select several kinds.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: state
          in: query
          description: Repeat the parameter to select several states.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/JobState"
          style: form
          explode: true
        - name: sort
          in: query
          description: "`enqueuedAt` or `-enqueuedAt` (default)."
          schema:
            type: string
            enum: [enqueuedAt, "-enqueuedAt"]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of jobs.
          headers:
            Link:
              $ref: "#/components/headers/Link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
              example:
                items:
                  - id: 01933b2a-7c41-7d1e-9a52-3f0e4b8c2d11
                    kind: gc
                    state: succeeded
                    replica: trove-worker-7d4b9c6f8-q8n2m
                    enqueuedAt: "2026-10-28T12:40:00.000Z"
                    startedAt: "2026-10-28T12:40:01.200Z"
                    finishedAt: "2026-10-28T12:40:02.118Z"
                    attempt: 1
                    maxAttempts: 10
                    progress: null
                    result: {dryRun: false, candidates: 3, kept: 1, deleted: 2, bytesReclaimed: 4096, errors: 0}
                    error: null
                    triggeredBy: null
                    target: null
                    href: /api/v1/system/jobs/01933b2a-7c41-7d1e-9a52-3f0e4b8c2d11
                nextCursor: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/system/jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Read a job
      description: |
        One job with its progress and result summary. A caller without `settings:read` reads only the
        jobs it started; any other job answers `404`, like a missing one. While the job is queued,
        running or cancelling, the answer carries `Retry-After` with a suggested polling interval
        (R-API-015).
      x-trove-permission:
        authenticated: true
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The job.
          headers:
            Retry-After:
              description: Suggested polling interval in seconds, present while the job has not ended.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/system/jobs/{id}/cancel:
    post:
      operationId: cancelJob
      tags: [jobs]
      summary: Cancel a job
      description: |
        A queued job ends `cancelled` at once; a running job turns `cancelling` and stops at its next
        checkpoint. Allowed for a caller with `settings:write` and for the caller who started the job
        (R-API-015); for anyone else the job does not exist. A finished job answers `409`.
      x-trove-permission:
        authenticated: true
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "202":
          description: The job is cancelled or cancelling.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/system/tasks:
    get:
      operationId: listTasks
      tags: [jobs]
      summary: List the maintenance tasks
      description: |
        The registered maintenance tasks with their schedule (from `maintenance.tasks`, read only),
        the next scheduled run, whether a run is going on, and the last run (R-OPS-019). A manual-only
        task such as `secrets-reencrypt` has `schedule` and `nextRunAt` `null`. Ordered by name; cursor
        pagination as everywhere (R-API-010).
      x-trove-permission:
        permission: settings:read
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of tasks.
          headers:
            Link:
              $ref: "#/components/headers/Link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/system/tasks/{name}/run:
    post:
      operationId: runTask
      tags: [jobs]
      summary: Run a maintenance task now
      description: |
        Enqueues a run of the task and answers `202` with the job and its `Location`. The `web`
        replica that answers only enqueues; a `worker` replica executes the run (R-ARCH-001). While a
        run of the task, or of a task that shares its exclusive key (`gc` and `gc-full`), is queued or
        running, the answer is `409` with that job. A task with a precondition that fails answers
        `409` with the code of the precondition (`key_ring_incompatible` for `secrets-reencrypt`) and
        enqueues nothing. The optional body holds the task's parameters, for example
        `{"dryRun": true}` for garbage collection. Starting a run is audited as `system.task_triggered`.
      x-trove-permission:
        permission: settings:write
      x-trove-idempotency-key: optional
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TaskName"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRunRequest"
            example:
              dryRun: true
      responses:
        "202":
          description: The run is queued.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobReferenceEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
