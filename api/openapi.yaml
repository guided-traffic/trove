          schema:
            type: string
        - name: recursive
          in: query
          schema:
            type: boolean
            default: false
        - name: maxDepth
          in: query
          description: With `recursive`, the deepest level below the folder to list; 0 is no bound.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: folders
