              schema:
                type: integer
                format: int64
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deletePermissionPolicy
      tags: [permissions]
      summary: Delete a permission policy
      description: |
        Removes the policy with its selectors, patterns and entries. `If-Match` is optional here; when
        sent, a version that is not current answers `412`. The answer carries `Trove-Authz-Epoch`. The
        audit event `authz.policy.deleted` is journaled (R-AUTHZ-031).
      x-trove-permission:
        permission: policies:write
      parameters:
        - name: If-Match
          in: header
          description: The `ETag` of the policy, or `*`.
          schema:
            type: string
      responses:
        "204":
          description: The policy was deleted.
          headers:
            Trove-Authz-Epoch:
              description: >-
                The authorization epoch this write produced. Send it as `Trove-Authz-Min-Epoch` on the next
                request to see the change on whichever replica answers (R-AUTHZ-032).
              schema:
                type: integer
                format: int64
                minimum: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/authz/validate-policy:
    post:
      operationId: validatePermissionPolicy
      tags: [permissions]
      summary: Validate a permission policy without storing it
      description: |
        Runs the validation of a create (R-AUTHZ-021) and answers every problem, the warnings, and the
        keys of the repositories the selectors currently cover. A policy with problems is still a `200`
        answer with `valid: false`; the editor shows the list. The name need not be unused.
      x-trove-permission:
        permission: policies:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionPolicyInput"
      responses:
        "200":
          description: The result of the validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyValidation"
              example:
                valid: true
                errors: []
                warnings: [selector_matches_nothing]
                covers: [npm-internal]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/roles:
    get:
      operationId: listRoles
      tags: [permissions]
      summary: List the system roles
      description: |
        The fixed set of system roles and the capabilities each bundles (R-AUTHZ-010). Trove has no
        custom roles, so the list is not paginated and `nextCursor` is always `null`.
      x-trove-permission:
        authenticated: true
      responses:
        "200":
          description: The roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleList"
              example:
                items:
                  - {name: auditor, capabilities: ["audit:read", "policies:read", "roles:read"]}
                nextCursor: null
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/role-bindings:
    get:
      operationId: listRoleBindings
      tags: [permissions]
      summary: List role bindings
      description: |
        The system roles bound to users, groups and service accounts (R-AUTHZ-022), ordered by role and
        principal, with cursor pagination. Filters: `role` and `principal` (a reference such as
        `group:platform-admins`).
      x-trove-permission:
        permission: roles:read
      parameters:
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/RoleName"
        - name: principal
          in: query
          description: A principal reference.
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of bindings.
          headers:
            Link:
              $ref: "#/components/headers/Link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleBindingList"
              example:
                items:
                  - role: admin
                    principal: "group:platform-admins"
                    grantedAt: "2026-10-28T09:00:00Z"
                    grantedBy: "user:root"
                nextCursor: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/role-bindings/{role}/{principalRef}:
    parameters:
      - name: role
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RoleName"
      - name: principalRef
        in: path
        required: true
        description: The percent-encoded principal reference, for example `group%3Aplatform-admins`.
        schema:
          type: string
    put:
      operationId: bindRole
      tags: [permissions]
      summary: Bind a role to a principal
      description: |
        Idempotent (R-AUTHZ-022): `201` for a new binding, `200` for one that exists. Roles bind to users,
        groups and service accounts only (`422 role_not_allowed`); a role on an auto-join group is
        `409 auto_join_admin_conflict`. A new binding writes `authz.role.bound` and carries
        `Trove-Authz-Epoch`; for an existing one the header is the current epoch.
      x-trove-permission:
        permission: roles:write
      responses:
        "200":
          description: The binding existed.
          headers:
            Trove-Authz-Epoch:
              description: >-
                The authorization epoch this write produced. Send it as `Trove-Authz-Min-Epoch` on the next
                request to see the change on whichever replica answers (R-AUTHZ-032).
              schema:
                type: integer
                format: int64
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleBinding"
        "201":
          description: The binding was created.
          headers:
            Trove-Authz-Epoch:
              description: >-
                The authorization epoch this write produced. Send it as `Trove-Authz-Min-Epoch` on the next
                request to see the change on whichever replica answers (R-AUTHZ-032).
              schema:
                type: integer
                format: int64
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleBinding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: unbindRole
      tags: [permissions]
      summary: Remove a role binding
      description: |
        Removes the binding (`authz.role.unbound`, journaled). Removing the last `admin` binding while
        the break-glass administrator is disabled answers `409 last_admin`; a binding that does not
        exist answers `404`.
      x-trove-permission:
        permission: roles:write
      responses:
        "204":
          description: The binding was removed.
          headers:
            Trove-Authz-Epoch:
              description: >-
                The authorization epoch this write produced. Send it as `Trove-Authz-Min-Epoch` on the next
                request to see the change on whichever replica answers (R-AUTHZ-032).
              schema:
                type: integer
                format: int64
                minimum: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/authz/me:
    get:
      operationId: getAuthzMe
      tags: [permissions]
      summary: What the caller may do
      description: |
        The system roles and capabilities the caller's credential exercises, the principals the caller
        acts as (the user, its groups, `authenticated`) and a summary of the credential's scope, which
        is a ceiling (R-AUTHZ-013). The answer says nothing about other principals. `epoch` is the
        epoch of the index that answered.
      x-trove-permission:
        authenticated: true
      responses:
        "200":
          description: The caller's rights.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthzMe"
              example:
                roles: [auditor]
                capabilities: ["audit:read", "policies:read", "roles:read"]
                principals: ["user:alice", "group:team-web", authenticated]
                scope: null
                epoch: 1842
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/authz/check:
    post:
      operationId: checkPermissions
      tags: [permissions]
      summary: Check repository actions for the caller
      description: |
        Evaluates up to 100 checks for the caller's own credential, scope included (R-AUTHZ-023); all
        checks are decided on one index. A repository the caller cannot see answers `allowed: false`,
        exactly as a missing one. Nothing is audited. The UI hides controls whose check fails; the
        server enforces every operation regardless.
      x-trove-permission:
        authenticated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionCheckRequest"
            example:
              checks:
                - {repository: npm-internal, package: "@web/button", action: deploy}
                - {repository: npm-all, action: read}
      responses:
        "200":
          description: One result per check, in order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionCheckResponse"
              example:
                results: [{allowed: true}, {allowed: false}]
                epoch: 1842
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  # <<< M1 authz
  #
  # >>> M1 repository
  # <<< M1 repository
  #
  # >>> M1 files
  # <<< M1 files
  #
  # >>> M1 endpoints
  # <<< M1 endpoints
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A trove token (`trv_` prefix). Credentials that are present but invalid always give `401`.
  headers:
    RequestId:
      description: The trace ID of the request (W3C Trace Context); quote it when reporting a problem.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    ETag:
      description: Strong entity tag of the representation, the quoted revision (R-API-012).
      schema:
        type: string
        example: '"4"'
    Location:
      description: The URL of the created resource, or of the job to poll (R-API-004, R-API-015).
      schema:
        type: string
    Link:
      description: 'RFC 8288 link to the next page, `rel="next"`, present while more items exist (R-API-010).'
      schema:
        type: string
    RateLimitPolicy:
      description: 'The limit class of the route, `"read";q=200;w=4` (R-API-016).'
      schema:
        type: string
    RateLimit:
      description: 'The remaining budget, `"read";r=199;t=3` (R-API-016).'
      schema:
        type: string
    IdempotencyReplayed:
      description: '`true` when the answer is the stored outcome of an earlier request with the same Idempotency-Key (R-API-014).'
      schema:
        type: string
        enum: ["true"]
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size, 1 to `api.page_size_max` (R-API-010).
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Cursor:
      name: cursor
      in: query
      description: The `nextCursor` of the previous page. Opaque; valid only with the filters and sort it was issued for.
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag loaded with the resource, or `*` to overwrite deliberately (R-API-012).
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: An ETag the client holds; a match answers `304` (R-API-012).
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 1 to 255 printable ASCII characters, preferably a UUID (R-API-014).
      schema:
        type: string
        minLength: 1
        maxLength: 255
    JobId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthenticated:
      description: The request carries no valid credential.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The credential is valid but the operation is not permitted.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The target does not exist or is not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Internal:
      description: Unexpected failure. The `detail` is generic; the cause is in the log under the same request ID.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: A dependency is unreachable. `Retry-After` is set.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The request cannot be read, or a parameter, header, cursor or sort field is not valid (`malformed_request`, `invalid_cursor`, `invalid_header`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with the current state, or an idempotent request is still in progress (`Retry-After` is set then).
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: '`If-Match` does not match; the extension `currentEtag` holds the current tag (R-API-012).'
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionRequired:
      description: The operation needs `If-Match` (R-API-012).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: The body exceeds `api.max_request_body_bytes`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The body is not of the media type the operation takes.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: The body is well-formed but a value is invalid, or an `Idempotency-Key` was reused for another request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: The rate limit of the caller's class is used up (R-API-016). `Retry-After` is set.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
        RateLimit-Policy:
          $ref: "#/components/headers/RateLimitPolicy"
        RateLimit:
          $ref: "#/components/headers/RateLimit"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotModified:
      description: The ETag matches `If-None-Match`; no body.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
  schemas:
    Problem:
      type: object
      description: |
        RFC 9457 problem details. The extension members are `code`, `requestId` and `errors`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: The relative URI `/api/v1/problems/<code>`.
          example: /api/v1/problems/not_found
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          description: The request path.
        code:
          type: string
          description: Stable snake_case identifier; clients match on it.
          example: not_found
        requestId:
          type: string
          description: Equals the `X-Request-Id` response header.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        currentEtag:
          type: string
          description: "Extension of `precondition_failed`: the current ETag of the resource (R-API-012)."
        job:
          $ref: "#/components/schemas/JobReference"
    FieldError:
      type: object
      required: [pointer, code, detail]
      properties:
        pointer:
          type: string
          description: RFC 6901 JSON pointer into the request body.
        code:
          type: string
        detail:
          type: string
    ProblemType:
      type: object
      required: [code, title, status, description]
      properties:
        code:
          type: string
        title:
          type: string
        status:
          type: integer
        description:
          type: string
    Version:
      type: object
      required: [version, revision, buildTime, goVersion, formats]
      properties:
        version:
          type: string
          description: The trove version, or `dev` for a build without a release version.
        revision:
          type: string
          description: The source revision, or `unknown`.
        buildTime:
          type: string
          description: RFC 3339 UTC time of the build, or `unknown`.
        goVersion:
          type: string
        formats:
          type: array
          description: The package formats this build serves.
          items:
            type: string
    SystemInfo:
      type: object
      required:
        - installationId
        - incarnation
        - answeredBy
        - version
        - baseUrl
        - baseUrlSource
        - maintenanceMode
        - replicas
        - database
        - valkey
        - objectStore
        - backup
        - features
        - formats
        - runtime
      properties:
        installationId:
          type: [string, "null"]
          description: UUID generated by the first migration; `null` until this replica has read `system_state`.
        incarnation:
          type: [string, "null"]
          description: UUID written by a restore; `null` until this replica has read `system_state`.
        answeredBy:
          type: object
          required: [replica, role]
          properties:
            replica:
              type: string
            role:
              type: string
              enum: [web, worker, all]
        version:
          type: object
          required: [version, revision, goVersion]
          properties:
            version:
              type: string
            revision:
              type: string
            goVersion:
              type: string
        baseUrl:
          type: string
          description: The origin generated URLs are built from.
        baseUrlSource:
          type: string
          enum: [config, request]
          description: "`request` means `server.base_url` is unset and the origin was derived from the request (development only)."
        maintenanceMode:
          type: string
          description: Open enum; `normal` until the maintenance modes exist.
          example: normal
        replicas:
          $ref: "#/components/schemas/ReplicaSummary"
        database:
          oneOf:
            - $ref: "#/components/schemas/DatabaseFacts"
            - type: "null"
        valkey:
          $ref: "#/components/schemas/ValkeyFacts"
        objectStore:
          $ref: "#/components/schemas/ObjectStoreFacts"
        backup:
          type: "null"
          description: Always `null` until the backup runs exist.
        features:
          type: object
          required: [tracing, webhooks, configAsCode]
          properties:
            tracing:
              type: boolean
            webhooks:
              type: boolean
            configAsCode:
              type: boolean
        formats:
          type: array
          items:
            type: string
        runtime:
          type: object
          required: [goos, goarch, gomaxprocs, memoryLimitBytes]
          properties:
            goos:
              type: string
            goarch:
              type: string
            gomaxprocs:
              type: integer
            memoryLimitBytes:
              type: integer
              format: int64
              description: The container memory limit; 0 when none is known.
    ReplicaSummary:
      type: object
      required: [live, ready, versions, roles]
      properties:
        live:
          type: integer
        ready:
          type: integer
        versions:
          type: object
          description: Live replicas per version.
          additionalProperties:
            type: integer
        roles:
          type: object
          description: Per role (`web`, `worker`, `all`).
          additionalProperties:
            $ref: "#/components/schemas/RoleSummary"
    RoleSummary:
      type: object
      required: [live, ready, degraded, nodes]
      properties:
        live:
          type: integer
        ready:
          type: integer
        degraded:
          type: integer
        nodes:
          type: integer
          description: Distinct nodes the live replicas of the role run on.
    DatabaseFacts:
      type: object
      required: [serverVersion, schemaVersion, supportedSchemaVersions, poolerMode, pools]
      properties:
        serverVersion:
          type: string
        schemaVersion:
          type: integer
        supportedSchemaVersions:
          type: array
          items:
            type: integer
        poolerMode:
          type: string
          description: Open enum; `none` or `transaction`.
        pools:
          type: object
          description: The answering replica's pools.
          additionalProperties:
            $ref: "#/components/schemas/PoolFacts"
    PoolFacts:
      type: object
      required: [max, inUse, idle]
      properties:
        max:
          type: integer
        inUse:
          type: integer
        idle:
          type: integer
    ValkeyFacts:
      type: object
      description: Installation facts only; each replica's view is in the replica registry. No Sentinel address appears.
      required: [mode, primaryName, sentinels, tls, keyPrefix, keyspace, degradedReplicas]
      properties:
        mode:
          type: string
          enum: [sentinel, standalone]
        primaryName:
          type: string
        sentinels:
          type: integer
          description: The number of configured Sentinels.
        tls:
          type: string
          description: The TLS verification mode.
        keyPrefix:
          type: string
        keyspace:
          type: [string, "null"]
          description: The keyspace segment of every key; `null` until this replica has read it.
        degradedReplicas:
          type: [integer, "null"]
          description: Live replicas whose Valkey check is degraded; `null` until the replica registry exists.
    ObjectStoreFacts:
      type: object
      required: [endpoint, bucket, prefix, credentialSource]
      properties:
        endpoint:
          type: string
        bucket:
          type: string
        prefix:
          type: string
        credentialSource:
          type: string
          description: Open enum, for example `static` or `workload-identity`.
    ReplicaList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Replica"
    Replica:
      type: object
      required:
        - name
        - instanceUid
        - version
        - revision
        - roles
        - state
        - lost
        - startedAt
        - heartbeatAt
        - leases
        - node
        - checks
        - degraded
        - valkey
      properties:
        name:
          type: string
          description: The pod name, else the host name.
        instanceUid:
          type: string
          description: Random per process start.
        version:
          type: string
        revision:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [web, worker, all]
        state:
          type: string
          enum: [starting, ready, unready, draining]
        lost:
          type: boolean
          description: The heartbeat is older than `system.heartbeat_stale_after`.
        startedAt:
          type: string
          format: date-time
        heartbeatAt:
          type: string
          format: date-time
        leases:
          type: array
          items:
            type: object
            required: [name, since]
            properties:
              name:
                type: string
              since:
                type: string
                format: date-time
        node:
          type: [string, "null"]
          description: The Kubernetes node name (`TROVE_NODE_NAME`); `null` outside Kubernetes.
        checks:
          type: object
          description: The last result of every readiness check, gating and reported.
          additionalProperties:
            $ref: "#/components/schemas/CheckResult"
        degraded:
          type: array
          description: The reported checks that fail.
          items:
            type: string
        valkey:
          oneOf:
            - $ref: "#/components/schemas/ValkeyView"
            - type: "null"
    CheckResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pass, fail, degraded]
        reason:
          type: string
          description: A short sanitised reason; never a host, address or error text.
        configError:
          type: boolean
    ValkeyView:
      type: object
      description: The replica's view of Valkey. No credential, user name or key appears.
      required: [state, reason, circuit, primary, sentinelsReachable, sentinelsConfigured, serverVersion, lastPrimaryChangeAt]
      properties:
        state:
          type: string
          enum: [available, degraded]
        reason:
          type: [string, "null"]
          description: "`null`, or an error kind (`timeout`, `connection`, `readonly`, `auth`, `tls`, `oom`), `no_primary` or `unsupported_version`."
        circuit:
          type: string
          description: Open enum, for example `closed` or `open`.
        primary:
          type: [string, "null"]
          description: The primary address (host and port) the client currently uses.
        sentinelsReachable:
          type: integer
        sentinelsConfigured:
          type: integer
        serverVersion:
          type: [string, "null"]
        lastPrimaryChangeAt:
          type: [string, "null"]
          format: date-time
    # >>> M1 audit
    AuditActor:
      type: object
      additionalProperties: false
      required: [type, id, name, tokenId, authMethod]
      properties:
        type:
          type: string
          description: "`user`, `service_account`, `ci`, `breakglass`, `anonymous`, `admin-cli` or `system`."
        id:
          type: [string, "null"]
        name:
          type: [string, "null"]
        tokenId:
          type: [string, "null"]
        authMethod:
          type: [string, "null"]
          description: "`bearer`, `basic`, `session`, `api_key`, or null."
    AuditSource:
      type: object
      additionalProperties: false
      required: [ip, userAgent]
      properties:
        ip:
          type: [string, "null"]
        userAgent:
          type: [string, "null"]
    AuditResource:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: [string, "null"]
        id:
          type: [string, "null"]
    AuditEvent:
      type: object
      description: One audit event (R-OPS-017). The event names, categories and the shape of `details` per name are R-OPS-016; `details` never holds a secret.
      additionalProperties: false
      required: [id, occurredAt, action, category, outcome, actor, source, traceId, replica, endpoint, resource, repository, path, reason, details]
      properties:
        id:
          type: string
          description: A UUIDv7 the producer made; the time it carries is close to `occurredAt`.
        occurredAt:
          type: string
          format: date-time
        action:
          type: string
          examples: [authz.policy.created]
        category:
          type: string
        outcome:
          type: string
          enum: [success, failure, denied]
        actor:
          $ref: "#/components/schemas/AuditActor"
        source:
          $ref: "#/components/schemas/AuditSource"
        traceId:
          type: [string, "null"]
        replica:
          type: [string, "null"]
        endpoint:
          type: [string, "null"]
        resource:
          $ref: "#/components/schemas/AuditResource"
        repository:
          type: [string, "null"]
        path:
          type: [string, "null"]
        reason:
          type: [string, "null"]
        details:
          type: object
          additionalProperties: true
    AuditEventList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        nextCursor:
          type: [string, "null"]
    # <<< M1 audit
    #
    # >>> M1 api
    JobState:
      type: string
      enum: [queued, running, succeeded, failed, cancelling, cancelled]
    TaskName:
      type: string
      pattern: "^[a-z][a-z0-9_.:-]{0,62}$"
    TaskRunRequest:
      type: object
      description: The parameters of the task; each task defines its own (garbage collection takes `dryRun`).
      additionalProperties: true
    JobProgress:
      type: object
      required: [done, total, unit]
      properties:
        done:
          type: integer
          format: int64
        total:
          type: [integer, "null"]
          format: int64
        unit:
          type: [string, "null"]
    JobTarget:
      type: object
      required: [kind, key]
      properties:
        kind:
          type: string
        key:
          type: string
    Job:
      type: object
      required: [id, kind, state, replica, enqueuedAt, startedAt, finishedAt, attempt, maxAttempts, progress, result, error, triggeredBy, target, href]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          example: gc
        state:
          $ref: "#/components/schemas/JobState"
        replica:
          type: [string, "null"]
          description: The name of the replica that ran or runs the job; `null` while it is queued.
        enqueuedAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        attempt:
          type: integer
        maxAttempts:
          type: integer
        progress:
          oneOf:
            - $ref: "#/components/schemas/JobProgress"
            - type: "null"
        result:
          type: [object, "null"]
          description: The result summary the kind defines; `null` until the job succeeded.
          additionalProperties: true
        error:
          type: [object, "null"]
          description: A stable `code` and a sanitised message; `null` unless the job failed or was cancelled.
          additionalProperties: true
        triggeredBy:
          type: [string, "null"]
          description: The ID of the principal that started the job; `null` for scheduled and system runs.
        target:
          oneOf:
            - $ref: "#/components/schemas/JobTarget"
            - type: "null"
        href:
          type: string
          description: The path to poll.
    JobList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        nextCursor:
          type: [string, "null"]
          description: Opaque; `null` on the last page.
    JobReference:
      type: object
      required: [id, kind, state, href]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        state:
          $ref: "#/components/schemas/JobState"
        href:
          type: string
    JobReferenceEnvelope:
      type: object
      required: [job]
      properties:
        job:
          $ref: "#/components/schemas/JobReference"
    TaskLastRun:
      type: object
      required: [jobId, startedAt, finishedAt, outcome, replica]
      properties:
        jobId:
          type: string
          format: uuid
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        outcome:
          $ref: "#/components/schemas/JobState"
        replica:
          type: [string, "null"]
    Task:
      type: object
      required: [name, schedule, enabled, nextRunAt, running, lastRun]
      properties:
        name:
          $ref: "#/components/schemas/TaskName"
        schedule:
          type: [string, "null"]
          description: Five-field cron expression in UTC; `null` for a manual-only task.
        enabled:
          type: boolean
        nextRunAt:
          type: [string, "null"]
          format: date-time
          description: "`null` for a manual-only or disabled task."
        running:
          type: boolean
        lastRun:
          oneOf:
            - $ref: "#/components/schemas/TaskLastRun"
            - type: "null"
    TaskList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        nextCursor:
          type: [string, "null"]
    EncryptionKey:
      type: object
      required: [id, active, sealedValues, canary]
      properties:
        id:
          type: string
        active:
          type: boolean
          description: The answering replica seals with this key.
        sealedValues:
          type: integer
          format: int64
          description: Sealed values under this key ID over every registered sealed column.
        canary:
          type: string
          enum: [ok, failed, absent]
    EncryptionReplica:
      type: object
      required: [name, role, activeKeyId, keyIds]
      properties:
        name:
          type: string
        role:
          type: string
          enum: [web, worker, all]
        activeKeyId:
          type: string
        keyIds:
          type: array
          items:
            type: string
    LastReencryption:
      type: object
      required: [jobId, state, finishedAt]
      properties:
        jobId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/JobState"
        finishedAt:
          type: [string, "null"]
          format: date-time
    EncryptionStatus:
      type: object
      required: [answeredBy, activeKeyId, keys, replicas, ringsCompatible, lastReencryption]
      properties:
        answeredBy:
          type: string
          description: The replica whose ring `activeKeyId` and `keys[].canary` describe.
        activeKeyId:
          type: string
        keys:
          type: array
          items:
            $ref: "#/components/schemas/EncryptionKey"
        replicas:
          type: array
          description: The live `web` and `worker` replicas, from the replica registry.
          items:
            $ref: "#/components/schemas/EncryptionReplica"
        ringsCompatible:
          type: boolean
          description: Every live replica's ring holds every key ID that is active on any live replica or referenced by a sealed value.
        lastReencryption:
          oneOf:
            - $ref: "#/components/schemas/LastReencryption"
            - type: "null"
    # <<< M1 api
    #
    # >>> M1 identity
    UserIdentity:
      type: object
      description: The link of a user to an identity provider (R-AUTH-007).
      required: [provider, linked]
      properties:
        provider:
          type: string
          description: The provider ID.
        linked:
          type: boolean
          description: "`false` for a pending link that the user's first login at the provider completes."
    UserGroupMembership:
      type: object
      required: [name, source]
      properties:
        name:
          type: string
        source:
          type: string
          description: "`manual`, `auto`, `scim` or `oidc:<providerId>` (R-AUTH-018)."
          examples: ["oidc:corp"]
    GroupClaimMissing:
      type: object
      description: Set while the user's last login carried no usable group claim (R-AUTH-008).
      required: [provider, reason]
      properties:
        provider:
          type: string
        reason:
          type: string
          enum: [absent, wrong_type, overage]
    User:
      type: object
      description: A user (R-AUTH-016). `isAdmin`, `adminVia` and `lockedUntil` are derived and read only.
      required: [id, username, email, emailVerified, displayName, origin, status, disabledReason, isAdmin, adminVia,
                 identities, groups, groupClaimMissing, lockedUntil, lastLoginAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: [string, "null"]
        emailVerified:
          type: boolean
        displayName:
          type: [string, "null"]
        origin:
          type: string
          enum: [jit, admin, scim, system]
        status:
          type: string
          enum: [active, disabled]
        disabledReason:
          type: [string, "null"]
          description: "`admin`, `dormant` or `scim` while the user is disabled."
        isAdmin:
          type: boolean
        adminVia:
          type: array
          description: "Why the user is an administrator: `direct`, `group:<name>` or `break-glass`."
          items:
            type: string
        identities:
          type: array
          items:
            $ref: "#/components/schemas/UserIdentity"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/UserGroupMembership"
        groupClaimMissing:
          oneOf:
            - $ref: "#/components/schemas/GroupClaimMissing"
            - type: "null"
        lockedUntil:
          type: [string, "null"]
          format: date-time
          description: The end of the lockout of the break-glass account while it is in force (R-AUTH-038).
        lastLoginAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      example:
        id: 0192f0c4-7a7e-7b51-9b1e-2f0d6c9e1a10
        username: alice
        email: alice@example.com
        emailVerified: true
        displayName: Alice Example
        origin: jit
        status: active
        disabledReason: null
        isAdmin: false
        adminVia: []
        identities: [{provider: corp, linked: true}]
        groups: [{name: team-web, source: "oidc:corp"}]
        groupClaimMissing: null
        lockedUntil: null
        lastLoginAt: "2026-10-28T09:12:00Z"
        createdAt: "2026-09-01T08:00:00Z"
    UserList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        nextCursor:
          type: [string, "null"]
          description: Opaque; `null` on the last page.
    PendingIdentity:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          description: A provider ID of `auth.oidc.providers`.
        subject:
          type: "null"
          description: "Always `null`: a pending link is completed by the first login (R-AUTH-007)."
    NewUser:
      type: object
      required: [username]
      properties:
        username:
          type: string
          description: Matches `^[a-z0-9][a-z0-9._@+-]{0,127}$` and is not reserved (R-AUTH-007).
        email:
          type: [string, "null"]
        displayName:
          type: [string, "null"]
        identities:
          type: array
          items:
            $ref: "#/components/schemas/PendingIdentity"
      example:
        username: bob
        email: bob@example.com
        displayName: Bob Example
        identities: [{provider: corp, subject: null}]
    UserPatch:
      type: object
      description: The members an administrator can correct. The read-only members of `User` are accepted and ignored.
      properties:
        email:
          type: [string, "null"]
        displayName:
          type: [string, "null"]
        identities:
          type: array
          description: Replaces the pending links; a linked identity stays.
          items:
            $ref: "#/components/schemas/PendingIdentity"
    DisableRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 1024
          description: Recorded in the audit event.
        revokeTokens:
          type: boolean
          description: Revoke the principal's tokens with reason `principal_disabled`. Default `true` for a user, `false` for a service account.
    MembershipChange:
      type: object
      properties:
        add:
          type: array
          maxItems: 100
          items:
            type: string
        remove:
          type: array
          maxItems: 100
          items:
            type: string
      example:
        add: [team-web]
        remove: [old]
    UserGroups:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/UserGroupMembership"
    Group:
      type: object
      description: A group (R-AUTH-018). `roles` and `memberCount` are read only.
      required: [id, name, description, autoJoin, origin, memberCount, roles, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        autoJoin:
          type: boolean
        origin:
          type: string
          enum: [admin, oidc, scim]
        memberCount:
          type: integer
          minimum: 0
        roles:
          type: array
          description: The system roles bound to the group; empty on the list.
          items:
            type: string
        createdAt:
          type: string
          format: date-time
      example:
        id: 0192f0c4-7a7e-7b51-9b1e-2f0d6c9e1a11
        name: team-web
        description: Web team
        autoJoin: false
        origin: admin
        memberCount: 3
        roles: []
        createdAt: "2026-09-01T08:00:00Z"
    GroupList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Group"
        nextCursor:
          type: [string, "null"]
          description: Opaque; `null` on the last page.
    NewGroup:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Matches `^[a-z0-9][a-z0-9._-]{0,127}$`.
        description:
          type: string
        autoJoin:
          type: boolean
        members:
          type: array
          maxItems: 1000
          description: Usernames and `sa:<name>`.
          items:
            type: string
      example:
        name: team-web
        description: Web team
        autoJoin: false
        members: [alice, "sa:ci-bot"]
    GroupPatch:
      type: object
      description: "`name` renames the group. The read-only members of `Group` are accepted and ignored."
      properties:
        name:
          type: string
        description:
          type: string
        autoJoin:
          type: boolean
    GroupMember:
      type: object
      required: [principal, kind, sources]
      properties:
        principal:
          type: string
          description: The username, or `sa:<name>` for a service account.
        kind:
          type: string
          enum: [user, service_account]
        sources:
          type: array
          description: Empty for a member the request removed that holds no other source.
          items:
            type: string
      example:
        principal: alice
        kind: user
        sources: [manual, "oidc:corp"]
    GroupMemberList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupMember"
        nextCursor:
          type: [string, "null"]
          description: Opaque; `null` on the last page.
    GroupMembersChange:
      type: object
      properties:
        add:
          type: array
          maxItems: 1000
          items:
            type: string
        remove:
          type: array
          maxItems: 1000
          items:
            type: string
        source:
          type: string
          enum: [manual, auto]
          default: manual
      example:
        add: [bob]
        remove: ["sa:old-bot"]
    ServiceAccount:
      type: object
      description: A service account (R-AUTH-020).
      required: [id, name, description, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, disabled]
        createdAt:
          type: string
          format: date-time
      example:
        id: 0192f0c4-7a7e-7b51-9b1e-2f0d6c9e1a12
        name: ci-bot
        description: Deploy jobs
        status: active
        createdAt: "2026-09-01T08:00:00Z"
    ServiceAccountList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceAccount"
        nextCursor:
          type: [string, "null"]
          description: Opaque; `null` on the last page.
    NewServiceAccount:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Matches `^[a-z0-9][a-z0-9-]{1,62}$`.
        description:
          type: string
      example:
        name: ci-bot
        description: Deploy jobs
    ServiceAccountPatch:
      type: object
      description: The read-only members of `ServiceAccount` are accepted and ignored.
      properties:
        description:
          type: string
    TokenScopePatterns:
      type: object
      properties:
        include:
          type: array
          items:
            type: string
        exclude:
          type: array
          items:
            type: string
    TokenScopeGrant:
      type: object
      required: [repositories, actions]
      properties:
        repositories:
          type: array
          items:
            type: string
        packages:
          $ref: "#/components/schemas/TokenScopePatterns"
        paths:
          $ref: "#/components/schemas/TokenScopePatterns"
        actions:
          type: array
          items:
            type: string
            enum: [read, annotate, deploy, overwrite, delete, manage]
    TokenScope:
      type: object
      description: The ceiling a token puts on its owner's rights (R-AUTH-024). It never grants anything.
      properties:
        inherit:
          type: boolean
          description: All repository rights of the owner. Exclusive with `repositories`.
        admin:
          type: boolean
          description: The token exercises the owner's system roles.
        repositories:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/TokenScopeGrant"
        system:
          type: array
          description: System capabilities (R-AUTHZ-010), from the closed list of R-AUTH-025.
          items:
            type: string
        endpoints:
          type: array
          description: The endpoint names the token is valid on (R-EP-011); empty is unbound.
          items:
            type: string
      example:
        inherit: true
        admin: false
        repositories: []
        system: []
    TokenOwner:
      type: object
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [user, service_account, ci]
        name:
          type: string
    CreateTokenRequest:
      type: object
      required: [description]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 1024
        ttlSeconds:
          type: integer
          minimum: 0
          description: The lifetime. `0` asks for a non-expiring service-account token. Exclusive with `expiresAt`.
        expiresAt:
          type: string
          format: date-time
        scope:
          $ref: "#/components/schemas/TokenScope"
        selfRotatable:
          type: boolean
          default: false
        owner:
          type: string
          description: Only the caller's own name is accepted; there is no impersonation (Q-AUTH-7).
      example:
        description: laptop npm
        ttlSeconds: 2592000
        scope: {inherit: true}
        selfRotatable: false
    Token:
      type: object
      description: A token as a list or an inspection shows it (R-AUTH-028). Neither the value nor its hash is part of it.
      required: [id, type, hint, owner, description, scope, createdAt, createdBy, createdVia, expiresAt, lastUsedAt,
                 lastUsedAddr, state, revokedAt, revokedBy, revocationReason, rotatedFrom, selfRotatable, ciContext]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [pat, sat, cit]
        hint:
          type: string
          description: The prefix and the first characters of the value, for recognising a token.
        owner:
          $ref: "#/components/schemas/TokenOwner"
        description:
          type: string
        scope:
          $ref: "#/components/schemas/TokenScope"
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: [string, "null"]
          description: The ID of the principal that created the token.
        createdVia:
          type: string
        expiresAt:
          type: [string, "null"]
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time
        lastUsedAddr:
          type: [string, "null"]
        state:
          type: string
          enum: [active, expired, revoked]
        revokedAt:
          type: [string, "null"]
          format: date-time
        revokedBy:
          type: [string, "null"]
          description: The ID of the principal that revoked the token.
        revocationReason:
          type: [string, "null"]
        rotatedFrom:
          type: [string, "null"]
          format: uuid
        selfRotatable:
          type: boolean
        ciContext:
          type: [object, "null"]
          additionalProperties: true
    TokenCreated:
      type: object
      description: |
        A token with its value. The value is in this answer only; the answer is sent with `Cache-Control: no-store`.
      required: [id, type, token, hint, owner, description, scope, createdAt, expiresAt, selfRotatable]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [pat, sat]
        token:
          type: string
          description: The secret. Shown once.
        hint:
          type: string
        owner:
          $ref: "#/components/schemas/TokenOwner"
        description:
          type: string
        scope:
          $ref: "#/components/schemas/TokenScope"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, "null"]
          format: date-time
        selfRotatable:
          type: boolean
        rotatedFrom:
          type: [string, "null"]
          format: uuid
          description: The predecessor of a rotation; `null` for a new token.
      example:
        id: 0192f0d1-1c2a-7c3e-8a51-6f7d2b9c4e11
        type: pat
        token: trv_pat_3kQ9xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        hint: trv_pat_3kQ9
        owner: {kind: user, name: alice}
        description: laptop npm
        scope: {inherit: true, admin: false, repositories: [], system: []}
        createdAt: "2026-10-28T10:00:00Z"
        expiresAt: "2026-11-27T10:00:00Z"
        selfRotatable: false
        rotatedFrom: null
    TokenList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Token"
        nextCursor:
          type: [string, "null"]
          description: Opaque; `null` on the last page.
    RotateRequest:
      type: object
      properties:
        overlapSeconds:
          type: integer
          minimum: 0
          maximum: 86400
          default: 0
          description: Keeps the old value valid that long. `0` revokes it with reason `rotated`.
    RevokeByValueRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The token value, `trv_…`.
    RevokedToken:
      type: object
      description: What an administrator receives from a revocation by value.
      required: [id, owner]
      properties:
        id:
          type: string
          format: uuid
        owner:
          type: string
          description: The username, or `sa:<name>`.
    AuthSettingsTokens:
      type: object
      required: [pat, sat, expiryNoticeSeconds]
      properties:
        pat:
          $ref: "#/components/schemas/AuthSettingsLifetimes"
        sat:
          $ref: "#/components/schemas/AuthSettingsLifetimes"
        expiryNoticeSeconds:
          type: integer
          minimum: 60
    AuthSettingsLifetimes:
      type: object
      required: [defaultTTLSeconds, maxTTLSeconds]
      properties:
        defaultTTLSeconds:
          type: integer
          minimum: 60
        maxTTLSeconds:
          type: integer
          minimum: 60
    AuthSettingsCeilings:
      type: object
      description: The YAML values the runtime values are bound by.
      required: [anonymousAllowed, tokens]
      properties:
        anonymousAllowed:
          type: boolean
          description: "`auth.anonymous.allowed`: when false, anonymous access cannot be switched on."
        tokens:
          $ref: "#/components/schemas/AuthSettingsTokens"
    AuthSettingsProvider:
      type: object
      required: [id, displayName, available]
      properties:
        id:
          type: string
        displayName:
          type: string
        available:
          type: boolean
          description: Whether the replica that answers holds the provider's discovery document.
    AuthSettingsStatus:
      type: object
      description: Read-only status (R-AUTH-040). The break-glass password and the issuer details are not part of it.
      required: [providers, breakGlass, sessions, clients]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/AuthSettingsProvider"
        breakGlass:
          type: object
          required: [enabled, lockedUntil]
          properties:
            enabled:
              type: boolean
            lockedUntil:
              type: [string, "null"]
              format: date-time
        sessions:
          type: object
          required: [idleTimeoutSeconds, absoluteTimeoutSeconds, maxPerUser, recentAuthWindowSeconds]
          properties:
            idleTimeoutSeconds:
              type: integer
            absoluteTimeoutSeconds:
              type: integer
            maxPerUser:
              type: integer
            recentAuthWindowSeconds:
              type: integer
        clients:
          type: object
          required: [basicEnabled]
          properties:
            basicEnabled:
              type: boolean
    AuthSettings:
      type: object
      description: |
        The runtime authentication settings (R-AUTH-040): the effective runtime values, the YAML ceilings they
        are bound by, and read-only status. The runtime members have the shape `PATCH` takes, so a body
        obtained by `GET` can be sent back; `ceilings` and `status` are ignored then.
      required: [anonymousAccess, tokens, ceilings, status]
      properties:
        anonymousAccess:
          type: boolean
          description: Whether anonymous access is in force (the runtime switch within the ceiling).
        tokens:
          $ref: "#/components/schemas/AuthSettingsTokens"
        ceilings:
          $ref: "#/components/schemas/AuthSettingsCeilings"
        status:
          $ref: "#/components/schemas/AuthSettingsStatus"
      example:
        anonymousAccess: false
        tokens:
          pat: {defaultTTLSeconds: 7776000, maxTTLSeconds: 31536000}
          sat: {defaultTTLSeconds: 7776000, maxTTLSeconds: 31536000}
          expiryNoticeSeconds: 604800
        ceilings:
          anonymousAllowed: true
          tokens:
            pat: {defaultTTLSeconds: 7776000, maxTTLSeconds: 31536000}
            sat: {defaultTTLSeconds: 7776000, maxTTLSeconds: 31536000}
            expiryNoticeSeconds: 604800
        status:
          providers: [{id: corp, displayName: Corporate SSO, available: true}]
          breakGlass: {enabled: true, lockedUntil: null}
          sessions: {idleTimeoutSeconds: 3600, absoluteTimeoutSeconds: 43200, maxPerUser: 20, recentAuthWindowSeconds: 3600}
          clients: {basicEnabled: true}
    AuthSettingsPatch:
      type: object
      description: Only the runtime members are writable; `ceilings` and `status` are accepted and ignored. A lifetime is at least 60 seconds.
      properties:
        anonymousAccess:
          type: boolean
        tokens:
          type: object
          properties:
            pat:
              type: object
              properties:
                defaultTTLSeconds:
                  type: integer
                maxTTLSeconds:
                  type: integer
            sat:
              type: object
              properties:
                defaultTTLSeconds:
                  type: integer
                maxTTLSeconds:
                  type: integer
            expiryNoticeSeconds:
              type: integer
    # <<< M1 identity
    #
    # >>> M1 login
    LoginProvider:
      type: object
      required: [id, displayName, startUrl, available]
      properties:
        id:
          type: string
        displayName:
          type: string
        startUrl:
          type: string
          description: Server-relative start URL, `/auth/oidc/{providerId}/start`.
        available:
          type: boolean
          description: Whether the replica that answers holds the provider's discovery document.
    LoginOptions:
      type: object
      description: What the sign-in screen offers (R-AUTH-009). It names no issuer, client ID or error detail.
      required: [providers, localLogin, anonymousAccess, autoRedirect]
      properties:
        providers:
          type: array
          description: In configuration order (`order`, then ID).
          items:
            $ref: "#/components/schemas/LoginProvider"
        localLogin:
          type: boolean
          description: The break-glass form is offered on the page; it is reachable with `?local=1` regardless.
        anonymousAccess:
          type: boolean
        autoRedirect:
          type: [string, "null"]
          description: The provider ID to redirect to at once; `null` shows the buttons.
      example:
        providers: [{id: corp, displayName: Corporate SSO, startUrl: /auth/oidc/corp/start, available: true}]
        localLogin: false
        anonymousAccess: false
        autoRedirect: corp
    WhoamiPrincipal:
      type: object
      required: [kind, name, id]
      properties:
        kind:
          type: string
          enum: [user, service_account, ci, break_glass]
        name:
          type: string
        id:
          type: string
          format: uuid
        groups:
          type: array
          description: The names of the groups the principal belongs to, resolved for this request.
          items:
            type: string
    WhoamiCredential:
      type: object
      required: [type, tokenId, scope, expiresAt]
      properties:
        type:
          type: string
          enum: [pat, sat, cit, session]
        tokenId:
          type: [string, "null"]
          format: uuid
        scope:
          oneOf:
            - $ref: "#/components/schemas/TokenScope"
            - type: "null"
          description: The token's scope; `null` for a session.
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: The token's expiry; `null` for a session and for a non-expiring token.
    Whoami:
      type: object
      required: [principal, credential]
      properties:
        principal:
          $ref: "#/components/schemas/WhoamiPrincipal"
        credential:
          $ref: "#/components/schemas/WhoamiCredential"
      example:
        principal: {kind: user, name: alice, id: 0192f0c4-7a7e-7b51-9b1e-2f0d6c9e1a10, groups: [team-web]}
        credential: {type: pat, tokenId: 0192f0d1-1c2a-7c3e-8a51-6f7d2b9c4e11, scope: {inherit: true, admin: false, repositories: [], system: []}, expiresAt: "2026-11-27T10:00:00Z"}
    Session:
      type: object
      required: [id, createdAt, lastSeenAt, createdAddr, userAgent, authMethod, providerId, current]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        createdAddr:
          type: [string, "null"]
        userAgent:
          type: [string, "null"]
        authMethod:
          type: string
          enum: [oidc, break_glass]
        providerId:
          type: [string, "null"]
        current:
          type: boolean
          description: Whether the session made this request. Always `false` in a list of another user's sessions.
    SessionList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        nextCursor:
          type: [string, "null"]
          description: "Always `null`: a user holds at most `auth.sessions.max_per_user` sessions."
    Preferences:
      type: object
      description: The caller's UI preferences (R-API-021). `revision` is the ETag number.
      required: [locale, theme, keyboardShortcuts, projectFilter, revision]
      properties:
        locale:
          type: [string, "null"]
          description: "`en`, `de` or `null` (the browser decides)."
        theme:
          type: [string, "null"]
          description: "`light`, `dark` or `null` (the system decides)."
        keyboardShortcuts:
          type: boolean
        projectFilter:
          type: [string, "null"]
        revision:
          type: integer
          minimum: 1
      example: {locale: de, theme: null, keyboardShortcuts: false, projectFilter: null, revision: 2}
    PreferencesPatch:
      type: object
      description: "`null` resets a member to its default. `revision` is accepted and ignored."
      properties:
        locale:
          type: [string, "null"]
          description: "`en`, `de` or `null`."
        theme:
          type: [string, "null"]
          description: "`light`, `dark` or `null`."
        keyboardShortcuts:
          type: [boolean, "null"]
        projectFilter:
          type: [string, "null"]
    # <<< M1 login
    #
    # >>> M1 authz
    PatternLists:
      type: object
      description: The include and exclude globs of one dimension of a resource set (R-AUTHZ-005). An empty include list is unrestricted.
      additionalProperties: false
      properties:
        include:
          type: array
          maxItems: 256
          items:
            type: string
        exclude:
          type: array
          maxItems: 256
          items:
            type: string
    PolicyResources:
      type: object
      description: The resource set of a policy (R-AUTHZ-004, R-AUTHZ-005).
      additionalProperties: false
      properties:
        repositories:
          type: array
          description: Repository selectors, a key (`npm-internal`), a key pattern (`npm-team-*`) or a class (`@any-local`, `@any-remote`, `@any-virtual`, `@any`), each optionally restricted to a format (`@any-local:npm`).
          maxItems: 256
          items:
            type: string
        packages:
          $ref: "#/components/schemas/PatternLists"
        paths:
          $ref: "#/components/schemas/PatternLists"
    PolicyEntry:
      type: object
      description: Actions given to one principal. A policy holds at most one entry per principal.
      additionalProperties: false
      required: [principal, actions]
      properties:
        principal:
          type: string
          description: "`user:<name>`, `group:<name>`, `sa:<name>`, `anonymous` or `authenticated`."
          examples: ["group:team-web"]
        actions:
          type: array
          description: Actions or presets (`read`, `write`, `maintain`, `full`) on input; the expanded, alphabetical list of actions on output.
          items:
            type: string
    PermissionPolicyInput:
      type: object
      description: What a client writes. The read-only members of the representation (`inert`, `warnings`, `version`, `createdAt`, `createdBy`, `updatedAt`, `updatedBy`) are accepted and ignored, so a body obtained by GET can be sent back.
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{0,127}$"
        description:
          type: string
          maxLength: 1024
        resourceType:
          type: string
          enum: [repository]
          default: repository
        resources:
          $ref: "#/components/schemas/PolicyResources"
        entries:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/PolicyEntry"
        inert:
          type: boolean
          readOnly: true
        warnings:
          type: array
          readOnly: true
          items:
            type: string
        version:
          type: integer
          format: int64
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: string
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        updatedBy:
          type: string
          readOnly: true
    PermissionPolicy:
      type: object
      description: A permission policy (R-AUTHZ-021). `inert` is true when no selector is left (a key selector goes with its repository); the policy stays and grants nothing. `warnings` are `path_patterns_on_package_format`, `selector_matches_nothing` and `anonymous_populates_remote`. `version` is the ETag source.
      additionalProperties: false
      required: [name, description, resourceType, resources, entries, inert, warnings, version, createdAt, createdBy, updatedAt, updatedBy]
      properties:
        name:
          type: string
        description:
          type: string
        resourceType:
          type: string
          enum: [repository]
        resources:
          $ref: "#/components/schemas/PolicyResources"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/PolicyEntry"
        inert:
          type: boolean
        warnings:
          type: array
          items:
            type: string
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: A principal reference; empty when the creator no longer exists.
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
    PermissionPolicyList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PermissionPolicy"
        nextCursor:
          type: [string, "null"]
    PolicyValidation:
      type: object
      description: The result of a validation without storing (R-AUTHZ-021).
      additionalProperties: false
      required: [valid, errors, warnings, covers]
      properties:
        valid:
          type: boolean
          description: True when `errors` is empty.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/PolicyProblem"
        warnings:
          type: array
          items:
            type: string
        covers:
          type: array
          description: The keys of the repositories the selectors currently cover, sorted. Empty while the policy has errors.
          items:
            type: string
    PolicyProblem:
      type: object
      additionalProperties: false
      required: [pointer, code, detail]
      properties:
        pointer:
          type: string
          description: A JSON pointer into the policy.
        code:
          type: string
        detail:
          type: string
    RoleName:
      type: string
      enum: [admin, security-admin, auditor, repository-admin, webhook-admin]
    Role:
      type: object
      additionalProperties: false
      required: [name, capabilities]
      properties:
        name:
          $ref: "#/components/schemas/RoleName"
        capabilities:
          type: array
          description: The capabilities the role bundles (R-AUTHZ-010).
          items:
            type: string
    RoleList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        nextCursor:
          type: "null"
    RoleBinding:
      type: object
      additionalProperties: false
      required: [role, principal, grantedAt, grantedBy]
      properties:
        role:
          $ref: "#/components/schemas/RoleName"
        principal:
          type: string
          description: A principal reference.
        grantedAt:
          type: string
          format: date-time
        grantedBy:
          type: string
          description: A principal reference; empty for a binding made by a command or whose granter was deleted.
    RoleBindingList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RoleBinding"
        nextCursor:
          type: [string, "null"]
    ScopeSummary:
      type: object
      description: The ceiling of the caller's credential (R-AUTHZ-013).
      additionalProperties: false
      required: [inherit, admin, system, grants]
      properties:
        inherit:
          type: boolean
          description: The credential has no repository ceiling.
        admin:
          type: boolean
          description: The credential exercises the caller's system roles.
        system:
          type: array
          items:
            type: string
        grants:
          type: integer
          description: The number of repository grants in the scope.
    AuthzMe:
      type: object
      additionalProperties: false
      required: [roles, capabilities, principals, scope, epoch]
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleName"
        capabilities:
          type: array
          description: The system capabilities the credential exercises (R-AUTHZ-010), for example `settings:read`.
          items:
            type: string
        principals:
          type: array
          description: The references the caller acts as; it never lists other principals.
          items:
            type: string
        scope:
          oneOf:
            - $ref: "#/components/schemas/ScopeSummary"
            - type: "null"
        epoch:
          type: integer
          format: int64
    PermissionCheckItem:
      type: object
      additionalProperties: false
      required: [repository, action]
      properties:
        repository:
          type: string
        package:
          type: string
          description: The package name of an item, as the format spells it.
        path:
          type: string
          description: The canonical path of an item inside the repository.
        action:
          type: string
          enum: [read, annotate, deploy, overwrite, delete, manage]
    PermissionCheckRequest:
      type: object
      additionalProperties: false
      required: [checks]
      properties:
        checks:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PermissionCheckItem"
    PermissionCheckResult:
      type: object
      additionalProperties: false
      required: [allowed]
      properties:
        allowed:
          type: boolean
    PermissionCheckResponse:
      type: object
      additionalProperties: false
      required: [results, epoch]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/PermissionCheckResult"
        epoch:
          type: integer
          format: int64
          description: The epoch of the index that decided every check.
