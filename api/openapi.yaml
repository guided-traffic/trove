          schema:
            type: string
            enum: [active, expired, revoked, all]
            default: active
        - name: expiresBefore
          in: query
          schema:
            type: string
            format: date-time
        - name: expiresAfter
          in: query
          schema:
            type: string
            format: date-time
        - name: lastUsedBefore
          in: query
