        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        createdAddr:
          type: [string, "null"]
        userAgent:
          type: [string, "null"]
        authMethod:
          type: string
          enum: [oidc, break_glass]
        providerId:
          type: [string, "null"]
        current:
          type: boolean
          description: Whether the session made this request. Always `false` in a list of another user's sessions.
    SessionList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        nextCursor:
          type: [string, "null"]
