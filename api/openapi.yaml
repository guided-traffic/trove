    Preferences:
      type: object
      description: The caller's UI preferences (R-API-021). `revision` is the ETag number.
      required: [locale, theme, keyboardShortcuts, projectFilter, revision]
      properties:
        locale:
          type: [string, "null"]
          description: "`en`, `de` or `null` (the browser decides)."
        theme:
          type: [string, "null"]
          description: "`light`, `dark` or `null` (the system decides)."
        keyboardShortcuts:
          type: boolean
        projectFilter:
          type: [string, "null"]
        revision:
          type: integer
          minimum: 1
      example: {locale: de, theme: null, keyboardShortcuts: false, projectFilter: null, revision: 2}
    PreferencesPatch:
      type: object
      description: "`null` resets a member to its default. `revision` is accepted and ignored."
      properties:
        locale:
          type: [string, "null"]
          description: "`en`, `de` or `null`."
        theme:
          type: [string, "null"]
          description: "`light`, `dark` or `null`."
        keyboardShortcuts:
          type: [boolean, "null"]
        projectFilter:
          type: [string, "null"]
    # <<< M1 login
    #
    # >>> M1 authz
    PatternLists:
      type: object
      description: The include and exclude globs of one dimension of a resource set (R-AUTHZ-005). An empty include list is unrestricted.
      additionalProperties: false
      properties:
        include:
          type: array
          maxItems: 256
          items:
            type: string
        exclude:
          type: array
          maxItems: 256
          items:
            type: string
    PolicyResources:
      type: object
      description: The resource set of a policy (R-AUTHZ-004, R-AUTHZ-005).
      additionalProperties: false
      properties:
        repositories:
          type: array
          description: Repository selectors, a key (`npm-internal`), a key pattern (`npm-team-*`) or a class (`@any-local`, `@any-remote`, `@any-virtual`, `@any`), each optionally restricted to a format (`@any-local:npm`).
          maxItems: 256
          items:
            type: string
        packages:
          $ref: "#/components/schemas/PatternLists"
        paths:
          $ref: "#/components/schemas/PatternLists"
    PolicyEntry:
      type: object
      description: Actions given to one principal. A policy holds at most one entry per principal.
      additionalProperties: false
      required: [principal, actions]
      properties:
        principal:
          type: string
          description: "`user:<name>`, `group:<name>`, `sa:<name>`, `anonymous` or `authenticated`."
          examples: ["group:team-web"]
        actions:
          type: array
          description: Actions or presets (`read`, `write`, `maintain`, `full`) on input; the expanded, alphabetical list of actions on output.
          items:
            type: string
    PermissionPolicyInput:
      type: object
      description: What a client writes. The read-only members of the representation (`inert`, `warnings`, `version`, `createdAt`, `createdBy`, `updatedAt`, `updatedBy`) are accepted and ignored, so a body obtained by GET can be sent back.
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{0,127}$"
        description:
          type: string
          maxLength: 1024
        resourceType:
          type: string
          enum: [repository]
          default: repository
        resources:
          $ref: "#/components/schemas/PolicyResources"
        entries:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/PolicyEntry"
        inert:
          type: boolean
          readOnly: true
        warnings:
          type: array
          readOnly: true
          items:
            type: string
        version:
          type: integer
          format: int64
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: string
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        updatedBy:
          type: string
          readOnly: true
    PermissionPolicy:
      type: object
      description: A permission policy (R-AUTHZ-021). `inert` is true when no selector is left (a key selector goes with its repository); the policy stays and grants nothing. `warnings` are `path_patterns_on_package_format`, `selector_matches_nothing` and `anonymous_populates_remote`. `version` is the ETag source.
      additionalProperties: false
      required: [name, description, resourceType, resources, entries, inert, warnings, version, createdAt, createdBy, updatedAt, updatedBy]
      properties:
        name:
          type: string
        description:
          type: string
        resourceType:
          type: string
          enum: [repository]
        resources:
          $ref: "#/components/schemas/PolicyResources"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/PolicyEntry"
        inert:
          type: boolean
        warnings:
          type: array
          items:
            type: string
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: A principal reference; empty when the creator no longer exists.
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
    PermissionPolicyList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PermissionPolicy"
        nextCursor:
          type: [string, "null"]
    PolicyValidation:
      type: object
      description: The result of a validation without storing (R-AUTHZ-021).
      additionalProperties: false
      required: [valid, errors, warnings, covers]
      properties:
        valid:
          type: boolean
          description: True when `errors` is empty.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/PolicyProblem"
        warnings:
          type: array
          items:
            type: string
        covers:
          type: array
          description: The keys of the repositories the selectors currently cover, sorted. Empty while the policy has errors.
          items:
            type: string
    PolicyProblem:
      type: object
      additionalProperties: false
      required: [pointer, code, detail]
      properties:
        pointer:
          type: string
          description: A JSON pointer into the policy.
        code:
          type: string
        detail:
          type: string
    RoleName:
      type: string
      enum: [admin, security-admin, auditor, repository-admin, webhook-admin]
    Role:
      type: object
      additionalProperties: false
      required: [name, capabilities]
      properties:
        name:
          $ref: "#/components/schemas/RoleName"
        capabilities:
          type: array
          description: The capabilities the role bundles (R-AUTHZ-010).
          items:
            type: string
    RoleList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        nextCursor:
          type: "null"
    RoleBinding:
      type: object
      additionalProperties: false
      required: [role, principal, grantedAt, grantedBy]
      properties:
        role:
          $ref: "#/components/schemas/RoleName"
        principal:
          type: string
          description: A principal reference.
        grantedAt:
          type: string
          format: date-time
        grantedBy:
          type: string
          description: A principal reference; empty for a binding made by a command or whose granter was deleted.
    RoleBindingList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RoleBinding"
        nextCursor:
          type: [string, "null"]
    ScopeSummary:
      type: object
      description: The ceiling of the caller's credential (R-AUTHZ-013).
      additionalProperties: false
      required: [inherit, admin, system, grants]
      properties:
        inherit:
          type: boolean
          description: The credential has no repository ceiling.
        admin:
          type: boolean
          description: The credential exercises the caller's system roles.
        system:
          type: array
          items:
            type: string
        grants:
          type: integer
          description: The number of repository grants in the scope.
    AuthzMe:
      type: object
      additionalProperties: false
      required: [roles, capabilities, principals, scope, epoch]
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleName"
        capabilities:
          type: array
          description: The system capabilities the credential exercises (R-AUTHZ-010), for example `settings:read`.
          items:
            type: string
        principals:
          type: array
          description: The references the caller acts as; it never lists other principals.
          items:
            type: string
        scope:
          oneOf:
            - $ref: "#/components/schemas/ScopeSummary"
            - type: "null"
        epoch:
          type: integer
          format: int64
    PermissionCheckItem:
      type: object
      additionalProperties: false
      required: [repository, action]
      properties:
        repository:
          type: string
        package:
          type: string
          description: The package name of an item, as the format spells it.
        path:
          type: string
          description: The canonical path of an item inside the repository.
        action:
          type: string
          enum: [read, annotate, deploy, overwrite, delete, manage]
    PermissionCheckRequest:
      type: object
      additionalProperties: false
      required: [checks]
      properties:
        checks:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PermissionCheckItem"
    PermissionCheckResult:
      type: object
      additionalProperties: false
      required: [allowed]
      properties:
        allowed:
          type: boolean
    PermissionCheckResponse:
      type: object
      additionalProperties: false
      required: [results, epoch]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/PermissionCheckResult"
        epoch:
          type: integer
          format: int64
          description: The epoch of the index that decided every check.
    # <<< M1 authz
    #
    # >>> M1 repository
    FormatDescriptor:
      type: object
      required: [name, classes, layout, protocolBasePath, defaultUpstreamUrl, defaultMetadataTtlSeconds, defaultNotFoundTtlSeconds, patternSubject, priorityMembers, pinsAndClaims, caps]
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9-]{1,31}$"
        displayName:
          type: string
        classes:
          type: array
          description: The classes the implementation accepts.
          items:
            type: string
            enum: [local, remote, virtual]
        layout:
          type: string
        protocolBasePath:
          type: string
          description: The client address template; `{key}` is the repository key.
        defaultUpstreamUrl:
          type: [string, "null"]
        defaultMetadataTtlSeconds:
          type: [integer, "null"]
        defaultNotFoundTtlSeconds:
          type: [integer, "null"]
        patternSubject:
          type: string
          enum: [name, path]
        priorityMembers:
          type: boolean
        pinsAndClaims:
          type: boolean
        caps:
          type: boolean
    FormatList:
      type: object
      required: [formats]
      properties:
        formats:
          type: array
          items:
            $ref: "#/components/schemas/FormatDescriptor"
    RepositoryWarning:
      type: object
      required: [code, detail]
      properties:
        code:
          type: string
        pointer:
          type: string
        detail:
          type: string
    Repository:
      type: object
      description: |
        The configuration document of a repository (R-REPO-004): the body of a create, the answer of a
        read and the base of a patch. A member that does not apply to the class or the format is absent.
        Secret fields are never returned. `layout`, `lifecycle`, `createdAt`, `updatedAt`,
        `lastActivityAt` and `warnings` are read-only: a body obtained by `GET` can be sent back, and
        they are ignored.
      required: [key, class, format]
      properties:
        key:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{1,63}$"
          description: Fixed at creation; reserved names are the sub-paths of `/api/v1/repositories`.
        class:
          type: string
          enum: [local, remote, virtual]
          description: Fixed at creation.
        format:
          type: string
          description: Fixed at creation; the names of `GET /api/v1/formats`.
        layout:
          type: string
          readOnly: true
        description:
          type: string
          maxLength: 2000
        adminNotes:
          type: string
          maxLength: 8000
          description: Only for holders of `repositories:read-config`.
        includePatterns:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 1024
        excludePatterns:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 1024
        disabled:
          type: boolean
        requireAuthentication:
          type: boolean
        priorityMember:
          type: boolean
        hideExistence:
          type: string
          enum: [inherit, "true", "false"]
        local:
          type: object
          additionalProperties: true
        remote:
          type: object
          additionalProperties: true
        virtual:
          type: object
          additionalProperties: true
        storage:
          type: object
          additionalProperties: true
        lifecycle:
          type: string
          enum: [active, deleting]
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        lastActivityAt:
          type: [string, "null"]
          format: date-time
          readOnly: true
          description: The latest upload or download as the replicas flushed it (at most a minute late).
        warnings:
          type: array
          readOnly: true
          description: Findings of the write that did not block it; present on create, replace and update.
          items:
            $ref: "#/components/schemas/RepositoryWarning"
    RepositoryConsumerView:
      type: object
      description: What a caller sees who may read a repository but not its configuration (R-REPO-010).
      required: [key, class, format, description, layout, addresses]
      properties:
        key:
          type: string
        class:
          type: string
          enum: [local, remote, virtual]
        format:
          type: string
        description:
          type: string
        layout:
          type: string
        addresses:
          type: array
          description: The client addresses, paths on the public base URL.
          items:
            type: string
    RepositoryRead:
      description: The answer of a read, by the caller's view.
      anyOf:
        - $ref: "#/components/schemas/Repository"
        - $ref: "#/components/schemas/RepositoryConsumerView"
    RepositorySummary:
      type: object
      required: [key, class, format, description, addresses, disabled, lastActivityAt, project]
      properties:
        key:
          type: string
        class:
          type: string
          enum: [local, remote, virtual]
        format:
          type: string
        description:
          type: string
        addresses:
          type: array
          items:
            type: string
        disabled:
          type: boolean
        lifecycle:
          type: string
          enum: [active, deleting]
          description: Only a holder of `repositories:read-config` sees a repository being deleted.
        lastActivityAt:
          type: [string, "null"]
          format: date-time
        project:
          type: [string, "null"]
          description: The project key; always null until projects exist.
    RepositoryList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            anyOf:
              - $ref: "#/components/schemas/RepositorySummary"
              - $ref: "#/components/schemas/Repository"
        nextCursor:
          type: [string, "null"]
    # <<< M1 repository
    #
    # >>> M1 files
    Stamp:
      type: object
      required: [at, by]
      properties:
        at:
          type: string
          format: date-time
        by:
          type: [string, "null"]
          description: "`<kind>:<name>` of the principal, such as `user:alice` or `ci:acme/web`; null when the principal has no record."
    Digests:
      type: object
      properties:
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        sha512:
          type: string
          pattern: "^[0-9a-f]{128}$"
        sha1:
          type: string
          pattern: "^[0-9a-f]{40}$"
        md5:
          type: string
          pattern: "^[0-9a-f]{32}$"
    Item:
      type: object
      description: The description of a file or folder (R-STOR-016, R-STOR-007).
      required: [repository, path, kind, created, modified, updatedAt, package, upstreamUrl, itemUrl]
      properties:
        repository:
          type: string
        path:
          type: string
        kind:
          type: string
          enum: [file, folder]
        size:
          type: integer
          minimum: 0
          description: Files only.
        mediaType:
          type: string
          description: Files only; `application/octet-stream` when none was recorded.
        explicit:
          type: boolean
          description: Folders only; false for a folder that exists because a file lies below it.
        created:
          $ref: "#/components/schemas/Stamp"
        modified:
          $ref: "#/components/schemas/Stamp"
        updatedAt:
          type: string
          format: date-time
        digests:
          $ref: "#/components/schemas/Digests"
        declaredDigests:
          $ref: "#/components/schemas/Digests"
        declaredMismatch:
          type: boolean
        contentStatus:
          type: string
          enum: [ok, missing, corrupt]
        package:
          type: "null"
          description: Always null for a generic repository.
        upstreamUrl:
          type: "null"
          description: Always null for a local repository.
        downloadUrl:
          type: string
          description: Files only.
        listingUrl:
          type: string
          description: Folders only.
        itemUrl:
          type: string
    Child:
      type: object
      required: [path, kind]
      properties:
        path:
          type: string
          description: Relative to the listed folder.
        kind:
          type: string
          enum: [file, folder]
        size:
          type: integer
          minimum: 0
        modifiedAt:
          type: string
          format: date-time
        sha256:
          type: string
        sha1:
          type: string
    ChildrenPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Child"
        nextCursor:
          type: [string, "null"]
    ItemStats:
      type: object
      required: [downloads, lastDownloadAt, lastDownloader]
      properties:
        downloads:
          type: integer
          minimum: 0
        lastDownloadAt:
          type: [string, "null"]
          format: date-time
        lastDownloader:
          type: [string, "null"]
    # <<< M1 files
    #
    # >>> M1 endpoints
    EndpointList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Endpoint"
        nextCursor:
          type: [string, "null"]
          description: Opaque; `null` on the last page.
    Endpoint:
      type: object
      required: [name, inert, ruleCount, enabledRuleCount, configuration]
      properties:
        name:
          type: string
        inert:
          type: boolean
          description: The name is not configured but still has exposure rules (H-58); they have no effect.
        ruleCount:
          type: integer
          format: int64
        enabledRuleCount:
          type: integer
          format: int64
        configuration:
          description: The endpoint as the configuration file sets it, defaults applied (R-EP-001); `null` for an inert name.
          oneOf:
            - $ref: "#/components/schemas/EndpointConfiguration"
            - type: "null"
    EndpointConfiguration:
      type: object
      required: [default, port, baseUrl, hosts, wildcardHost, hostRoots, wildcardRoot, pool, surface, auth, exposure, cacheFill, rateLimit, replicaHeader]
      properties:
        default:
          type: boolean
          description: The default endpoint of `server.listen`.
        port:
          type: [integer, "null"]
          description: The port of the listener; `null` when it is chosen at start-up (port 0).
        baseUrl:
          type: string
        hosts:
          type: array
          description: The exact hosts of the host set (R-EP-003).
          items:
            type: string
        wildcardHost:
          type: [string, "null"]
        hostRoots:
          type: object
          description: Host-root bindings, host to repository key (R-EP-006).
          additionalProperties:
            type: string
        wildcardRoot:
          type: string
          enum: [none, label]
        pool:
          type: [string, "null"]
          description: The web pool that serves the endpoint; `null` for the main web Deployment.
        surface:
          type: array
          items:
            type: string
            enum: [ui, api, ci_exchange, packages, files]
        auth:
          type: object
          required: [tokenTypes, boundTokensOnly, anonymous]
          description: The credentials the endpoint accepts (R-EP-010).
          properties:
            tokenTypes:
              type: array
              items:
                type: string
                enum: [pat, sat, cit]
            boundTokensOnly:
              type: boolean
            anonymous:
              type: boolean
        exposure:
          type: string
          enum: [all, rules]
        cacheFill:
          type: boolean
        rateLimit:
          description: The endpoint's rate-limit class (R-EP-015); `null` for none.
          oneOf:
            - $ref: "#/components/schemas/EndpointRateLimit"
            - type: "null"
        replicaHeader:
          type: string
          enum: [authenticated, always, never]
    EndpointRateLimit:
      type: object
      required: [class, requestsPerSecond, burst, key]
      properties:
        class:
          type: string
        requestsPerSecond:
          type: number
        burst:
          type: integer
        key:
          type: string
          enum: [principal, address]
    ExposurePatterns:
      type: object
      description: Include and exclude globs of R-AUTHZ-005; an empty include list leaves the dimension unrestricted.
      properties:
        include:
          type: array
          maxItems: 256
          items:
            type: string
            minLength: 1
            maxLength: 1024
        exclude:
          type: array
          maxItems: 256
          items:
            type: string
            minLength: 1
            maxLength: 1024
    ExposureVersions:
      type: object
      properties:
        include:
          type: array
          maxItems: 256
          items:
            type: string
        exclude:
          type: array
          maxItems: 256
          items:
            type: string
        range:
          type: [string, "null"]
          maxLength: 256
          description: One range in the format's native syntax, validated by the format.
    ExposureRule:
      type: object
      description: |
        An exposure rule (R-EP-012). The request type is the response type: the read-only members
        (`endpoint`, `inert`, `warnings`, `revision`, the times and the actors) are accepted and
        ignored on a write. `name` and `repository` are required on a create and immutable after it;
        every other member has the default shown.
      required: [name, repository]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
        description:
          type: string
          maxLength: 2000
          default: ""
        repository:
          type: string
          description: The key of the repository the rule exposes; the rule is stored by the repository's ID (Q-EP-8).
        enabled:
          type: boolean
          default: true
        packages:
          $ref: "#/components/schemas/ExposurePatterns"
        paths:
          $ref: "#/components/schemas/ExposurePatterns"
        versions:
          $ref: "#/components/schemas/ExposureVersions"
        prereleases:
          type: boolean
          default: false
        distTags:
          $ref: "#/components/schemas/ExposurePatterns"
        endpoint:
          type: string
          readOnly: true
        inert:
          type: boolean
          readOnly: true
          description: The endpoint is not configured; the rule has no effect (H-58).
        warnings:
          type: array
          readOnly: true
          description: "`path_patterns_on_package_format`, `endpoint_not_in_rules_mode`."
          items:
            type: string
        revision:
          type: integer
          format: int64
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: [string, "null"]
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        updatedBy:
          type: [string, "null"]
          readOnly: true
      example:
        name: acme-sdk
        description: SDK releases for customers
        repository: npm-customers
        enabled: true
        packages: {include: ["@acme/sdk", "@acme/sdk-*"], exclude: ["@acme/sdk-internal"]}
        paths: {include: [], exclude: []}
        versions: {include: [], exclude: ["2.0.1"], range: ">=2.0.0"}
        prereleases: false
        distTags: {include: [latest, lts], exclude: []}
    ExposureRuleList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExposureRule"
        nextCursor:
          type: [string, "null"]
          description: Opaque; `null` on the last page.
    ExposureCheckRequest:
      type: object
      required: [repository]
      properties:
        repository:
          type: string
        package:
          type: string
          description: The package to check; absent checks the repository.
        versions:
          type: array
          maxItems: 1000
          description: Versions of the package; for a format with versions an absent list means the stored versions.
          items:
            type: string
        paths:
          type: array
          maxItems: 1000
          description: Paths to check, the dimension of generic repositories.
          items:
            type: string
        rule:
          $ref: "#/components/schemas/ExposureRule"
    ExposureCheckVersion:
      type: object
      required: [version, exposed, rule, reason]
      properties:
        version:
          type: string
        exposed:
          type: boolean
        rule:
          type: [string, "null"]
          description: The rule that exposes the version.
        reason:
          type: string
    ExposureCheckPath:
      type: object
      required: [path, exposed, rule, reason]
      properties:
        path:
          type: string
        exposed:
          type: boolean
        rule:
          type: [string, "null"]
          description: The rule that exposes the path.
        reason:
          type: string
    ExposureCheckTag:
      type: object
      required: [tag, version, visible]
      properties:
        tag:
          type: string
        version:
          type: string
        visible:
          type: boolean
    ExposureCheck:
      type: object
      required: [endpoint, repository, mode, package, packageExposed, rule, reason, versions, paths, distTags, exposureFingerprint, warnings]
      properties:
        endpoint:
          type: string
        repository:
          type: string
        mode:
          type: string
          enum: [all, rules]
        package:
          type: [string, "null"]
        packageExposed:
          type: boolean
          description: The verdict on the package, or on the repository when the check names no package.
        rule:
          type: [string, "null"]
        reason:
          type: string
        versions:
          type: array
          items:
            $ref: "#/components/schemas/ExposureCheckVersion"
        paths:
          type: array
          items:
            $ref: "#/components/schemas/ExposureCheckPath"
        distTags:
          type: array
          description: The tags of the package and whether they are visible; formats with tags only.
          items:
            $ref: "#/components/schemas/ExposureCheckTag"
        exposureFingerprint:
          type: string
          description: SHA-256 over the mode and the ID, revision and state of every stored rule of the endpoint for the repository (R-EP-018).
        warnings:
          type: array
          items:
            type: string
    # <<< M1 endpoints
    #
    # >>> M2 proxy
    # <<< M2 proxy
    #
    # >>> M2 virtual
    # <<< M2 virtual
    #
    # >>> M2 npm
    # <<< M2 npm
    #
    # >>> M2 ownership
    # <<< M2 ownership
