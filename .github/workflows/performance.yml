  # The NuGet leg of the drain and failover tests under the NuGet load (nuget-ha, Q-ARCH-277): every TestNuGetHA..., on a kind
  # cluster with the scatter profile and the counting NuGet test upstream. It left Test and Release with the npm-ha legs (owner,
  # 2026-11-01); its steps are those of the e2e-nuget job there. The set also starts the npm client pods and the npm test upstream
  # (the drain of R-HA-059 runs npm and NuGet load together), so the job builds both clients images in its own steps, as e2e-ci does,
  # and the set loads them without building them again (Q-ARCH-327). TestNuGetHA needs about 16 cores under its load (Q-HA-102), far more
  # than a GitHub-hosted runner's 4, so the job runs on the large class; the set loads the 2.3 GB clients images into the control-plane
  # node only (the node of the client pods), which keeps them inside a large pod's Docker storage. Edge port 8090 is the first free port of
  # both workflows. The legs drain-load-b, -c and -e (TestDrainLoad, E5.9, edge ports 8113 to 8115) run the variants B, C and E of R-HA-059 under the same load,
  # with the long-transfer probes and R-STOR-046's full collection run, one variant per cluster.
  # Leg cold-crash (E5.2, TestColdCrash: a packages replica force-deleted during a cold npm ci and a cold dotnet restore of three clients
  # each, then trove admin storage verify) needs the same two clients images and both test upstreams, so it is a leg of this job; edge
  # port 8110 is the first free port of both workflows.
