  # The Bastion suite (R-BAS-049, docs/developer/e2e.md#the-bastion-tests) on a kind cluster: the short set `bastion`, as in Test and
  # Release, and the long set `bastion-long` (the drain of a node under a ten-minute npm ci and dotnet restore loop, and the flood of
