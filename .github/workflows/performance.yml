      - name: make dev-down
        if: always() && steps.leg.outputs.run == 'true'
        run: make dev-down


  # The upgrade leg (set upgrade, deploy/dev/e2e.sh; docs/developer/e2e.md): published releases of the chart (https://guided-traffic.github.io/trove/)
  # and their images (guidedtraffic/trove:<x.y.z> on Docker Hub), and the commit with its second UI bundle, are installed on a kind cluster
  # and upgraded to the image built from the commit, under the npm and the NuGet client loops and with a browser journey. Both clients images are needed, so the job runs on a
  # GitHub-hosted runner with the disk space freed, as e2e-vuln does (Q-ARCH-326). Edge port 8101 is the first free one after ha-suite's 8100.
  # A red leg is a finding and holds nothing (owner, 2026-11-01).
  # Switched off in the nightly run until the first stable release (Q-ARCH-340): it runs only on a dispatch that names it
  # (-f sets=upgrade). To switch it on, put `!inputs.sets || ` back in front of the contains() of the condition.
  e2e-upgrade:
    name: e2e (upgrade)
    if: ${{ contains(format(',{0},', inputs.sets), ',upgrade,') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TROVE_IMAGE: guidedtraffic/trove:dev
      TROVE_DEV_CLUSTER: trove-upgrade-${{ github.run_id }}
      TROVE_DEV_HTTP_PORT: "8101"
      # Both clients images are built once by the steps make npm-clients-image and make nuget-clients-image; deploy/dev/e2e.sh loads them
      # and does not build them again.
      TROVE_E2E_NPM_CLIENTS_IMAGE_BUILD: "0"
      TROVE_E2E_NUGET_CLIENTS_IMAGE_BUILD: "0"
    steps:
      # The rolling upgrade resolves the latest release from the tags, and the cut installs v0.16.0: the checkout needs every tag.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # The GitHub-hosted runner's preinstalled SDKs (Android, .NET, Haskell, CodeQL) take the disk space that the kind
      # nodes, the images and the build caches need; no job here uses them.
      - name: Free disk space (GitHub-hosted runner)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        uses: ./.github/actions/build-tools
        with:
          commands: jq

      - name: Set up Node.js (the browser journey of the upgrade)
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc

      - name: Install the Playwright journey and its browser
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Install the pinned helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the pinned kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install the pinned kind
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install the pinned Docker Buildx
        timeout-minutes: 16
        uses: ./.github/actions/install-buildx
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      - name: Log in to Docker Hub (the dev profile's images and the published releases)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: make npm-clients-image
        run: make npm-clients-image

      - name: make nuget-clients-image
        run: make nuget-clients-image

      - name: The dev profile's dependency pins and the runner architecture
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::the dev profile needs an amd64 runner (or qemu), got $(uname -m)"; exit 1; }
          echo "kind $KIND_VERSION, kubectl $KUBECTL_VERSION, helm $HELM_VERSION, clients Node image $E2E_CLIENTS_NODE_IMAGE, NuGet SDK $E2E_NUGETCLIENTS_SDK_IMAGE"
          kind version
          kubectl version --client
          helm version --short
          # The published releases come from the chart repository of GitHub Pages; the rest is the dev profile's own.
          for u in https://guided-traffic.github.io/trove https://charts.jetstack.io https://guided-traffic.github.io/valkey-operator https://guided-traffic.github.io/internal-secrets-operator; do
            curl -fsSL --retry 3 -o /dev/null "$u/index.yaml" || { echo "::error::chart repository $u is not reachable"; exit 1; }
          done

      - name: make image
        run: make image IMAGE="$TROVE_IMAGE" VERSION=dev

      # TestUpgrade_R_HA_020_AcrossTwoBundles installs the commit with its second UI bundle and upgrades to the image above (Q-HA-124).
      - name: make image-marked
        run: make image-marked VERSION=dev

      - name: Fetch the dev charts that are GitHub release assets
        timeout-minutes: 16
        env:
          # Read by tools/github-download.sh: sent to github.com only (Q-ARCH-356).
          GITHUB_TOKEN: ${{ github.token }}
        run: make dev-charts

      - name: make dev-up
        timeout-minutes: 25
        run: make dev-up

      - name: make e2e SET=upgrade
        timeout-minutes: 90
        run: make e2e SET=upgrade

      - name: Upload the go test -json report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-upgrade-report-upgrade
          path: .out/test-e2e.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the job logs (ci-job-*.log), the clients image logs, the upgrade's records and the test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-upgrade-artifacts-upgrade
          path: .out/e2e/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the Playwright report, traces and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-upgrade-playwright-upgrade
          path: .out/playwright/
          if-no-files-found: ignore
          retention-days: 14

      - name: Cluster state (failure only)
        if: failure()
        run: |
          set -u
          ctx="kind-${TROVE_DEV_CLUSTER}"
          mkdir -p .out/cluster-state
          kubectl config get-contexts || true
          for ns in trove ingress-controller cert-manager valkey-operator-system internal-secrets-operator-system cnpg-system kube-system; do
            kubectl --context "$ctx" -n "$ns" get pods -o wide > ".out/cluster-state/pods-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" describe pods > ".out/cluster-state/describe-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" get events --sort-by=.lastTimestamp > ".out/cluster-state/events-$ns.txt" 2>&1 || true
          done
          deploy/dev/cluster-logs.sh .out/cluster-state
          kubectl --context "$ctx" get nodes -o wide > .out/cluster-state/nodes.txt 2>&1 || true
          helm --kube-context "$ctx" -n trove status trove > .out/cluster-state/helm-status.txt 2>&1 || true
          docker ps -a > .out/cluster-state/docker-ps.txt 2>&1 || true
          cp -r .dev/logs .out/cluster-state/dev-logs 2>/dev/null || true

      - name: Upload the cluster state (failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-upgrade-cluster-state-upgrade
          path: .out/cluster-state/
          if-no-files-found: warn
          retention-days: 14

      - name: make dev-down
        if: always()
        run: make dev-down
