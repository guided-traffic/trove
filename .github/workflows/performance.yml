  # The NuGet leg of the drain and failover tests under the NuGet load (nuget-ha, Q-ARCH-277): every TestNuGetHA..., on a kind
  # cluster with the scatter profile and the counting NuGet test upstream. It left Test and Release with the npm-ha legs (owner,
  # 2026-11-01); its steps are those of the e2e-nuget job there, except that the clients image is not built here: deploy/dev/e2e.sh
  # builds it when the set starts client pods. No test is named TestNuGetHA yet, so the set passes with a notice (Q-ARCH-276) and
  # this job checks nothing beyond the bring-up of the cluster until one lands. Edge port 8090 is the first free port of both workflows.
