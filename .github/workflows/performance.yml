    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - set: npm-ha
            port: "8087"
          - set: ha-suite
            port: "8100"
          - set: ha-faults
            port: "8112"
          - set: ha-pooler
            port: "8111"
    env:
      TROVE_IMAGE: guidedtraffic/trove:dev
      TROVE_DEV_CLUSTER: trove-${{ matrix.set }}-${{ github.run_id }}
      TROVE_DEV_HTTP_PORT: ${{ matrix.port }}
