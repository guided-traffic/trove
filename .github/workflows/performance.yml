        uses: ./.github/actions/load-pins

      - name: Set up Go
        if: steps.leg.outputs.run == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        if: steps.leg.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential jq

      - name: Set up Node.js (the Playwright journey of R-BAS-007)
        if: steps.leg.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc

      - name: Install the Playwright journey and its browser
        if: steps.leg.outputs.run == 'true'
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Install the pinned helm
        if: steps.leg.outputs.run == 'true'
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

