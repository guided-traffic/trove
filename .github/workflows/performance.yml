  # The backup suite (R-BAK-029, R-HA-052 "Restore drill, trove backup", docs/developer/e2e.md#the-backup-tests) on a kind cluster in the profile
  # `backup`: a backup taken while a load publishes, deletes, trashes and collects with a grace period of 0s, restored with the restore Job into a
  # second namespace with a database, a Valkey and a bucket of its own; two overlapping Jobs; a node drain and a kill -9 of a backup and of a
  # restore; the revocation journal across a restore. It runs for about 25 minutes, so it is a long leg: nightly and on dispatch, not per change
  # (owner, 2026-11-01); a red long leg is a finding and holds nothing. It publishes .out/e2e/backup-timings.json, the timings of scenario 9, as a
  # job artifact. Large runner (a kind cluster with two databases and two Valkeys). Edge port 8102 is the first free one after e2e-upgrade's 8101.
  # Lane 3 (Q-ARCH-431): after e2e-vuln, whatever its result.
  e2e-backup:
    name: e2e (backup)
    needs: e2e-vuln
    if: ${{ !cancelled() }}
    runs-on: large
    timeout-minutes: 120
    env:
      TROVE_IMAGE: guidedtraffic/trove:dev
      TROVE_DEV_CLUSTER: trove-backup-${{ github.run_id }}
      TROVE_DEV_HTTP_PORT: "8102"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select the leg (the dispatch input sets)
