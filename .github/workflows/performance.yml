      TROVE_DEV_HTTP_PORT: "8105"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select the leg (the dispatch input sets)
        id: leg
        uses: ./.github/actions/select-leg
        with:
          leg: alerts
          job: e2e-alerts
          sets: ${{ inputs.sets }}

      - name: Free disk space (GitHub-hosted runner)
        if: steps.leg.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Load the tool pins
        if: steps.leg.outputs.run == 'true'
        uses: ./.github/actions/load-pins

      - name: Set up Go
        if: steps.leg.outputs.run == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        if: steps.leg.outputs.run == 'true'
        uses: ./.github/actions/build-tools
        with:
          commands: jq

      - name: Install the pinned helm
        if: steps.leg.outputs.run == 'true'
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the pinned kubectl
        if: steps.leg.outputs.run == 'true'
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install the pinned kind
        if: steps.leg.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install the pinned Docker Buildx
        timeout-minutes: 16
        if: steps.leg.outputs.run == 'true'
        uses: ./.github/actions/install-buildx
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Set up Docker Buildx
        if: steps.leg.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      - name: Log in to Docker Hub (the dev profile's images)
        if: steps.leg.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: The dev profile's dependency pins and the runner architecture
        if: steps.leg.outputs.run == 'true'
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::the dev profile needs an amd64 runner (or qemu), got $(uname -m)"; exit 1; }
          echo "kind $KIND_VERSION, kubectl $KUBECTL_VERSION, helm $HELM_VERSION"
          kind version
          kubectl version --client
          helm version --short
          for u in https://charts.jetstack.io https://guided-traffic.github.io/valkey-operator https://guided-traffic.github.io/internal-secrets-operator https://prometheus-community.github.io/helm-charts; do
            curl -fsSL --retry 3 -o /dev/null "$u/index.yaml" || { echo "::error::chart repository $u is not reachable"; exit 1; }
          done

      - name: make image
        if: steps.leg.outputs.run == 'true'
        run: make image IMAGE="$TROVE_IMAGE" VERSION=dev

      - name: Fetch the dev charts that are GitHub release assets
        timeout-minutes: 16
        if: steps.leg.outputs.run == 'true'
        env:
          # Read by tools/github-download.sh: sent to github.com only (Q-ARCH-356).
          GITHUB_TOKEN: ${{ github.token }}
        run: make dev-charts

      - name: make dev-up
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 25
        run: make dev-up

      - name: make e2e SET=alerts
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 200
        run: make e2e SET=alerts

      - name: Upload the go test -json report
        if: always() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-alerts-report
          path: .out/test-e2e.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the job logs and the test output
        if: always() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-alerts-artifacts
          path: .out/e2e/
          if-no-files-found: warn
          retention-days: 14

      - name: Cluster state (failure only)
        if: failure() && steps.leg.outputs.run == 'true'
        run: |
          set -u
          ctx="kind-${TROVE_DEV_CLUSTER}"
          mkdir -p .out/cluster-state
          for ns in trove trove-restore monitoring gateway-system envoy-gateway-system ingress-controller cert-manager valkey-operator-system internal-secrets-operator-system cnpg-system kube-system; do
            kubectl --context "$ctx" -n "$ns" get pods -o wide > ".out/cluster-state/pods-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" describe pods > ".out/cluster-state/describe-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" get events --sort-by=.lastTimestamp > ".out/cluster-state/events-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" get jobs -o yaml > ".out/cluster-state/jobs-$ns.yaml" 2>&1 || true
          done
          deploy/dev/cluster-logs.sh .out/cluster-state
