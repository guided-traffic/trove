# HA and Performance (nightly): the long tests, which run nightly and on dispatch and not on every change (owner,
# 2026-11-01). Per change, Test and Release runs the e2e legs push and access-long, the npm leg and the NuGet leg; the long legs of the
# failure suite (failover, npm-ha) run here instead; npm-ha-crash, the three-force-delete form of the pod crash, runs by
# hand (make e2e SET=npm-ha-crash), and job npm-ha-soak runs the same test with ten. The job latency enforces the p99 bounds of P-13
# (change propagation) and P-14 (job pick-up) with Valkey available, against the integration stack (R-ARCH-027,
# Q-ARCH-220): the per-change integration tier asserts delivery and the p50 only, because the runner pods keep a CPU
# limit and a throttled process stalls for 100 ms or more at a time. On kind clusters, job e2e runs the failover set
# (E0.13, E1.8) and the drain per role (set drain-roles, E6a.6), job e2e-npm runs leg npm-ha (drain variant A and the PostgreSQL switchover and Valkey failover under the
# npm load, E2.11), job npm-ha-soak runs the 20-minute pod crash of R-HA-052 under the npm load and the npm load
# scripts of R-ARCH-027 (Q-HA-67), job e2e-nuget runs leg nuget-ha (the drain and failover under the NuGet load, Q-ARCH-277;
# no test of that name exists yet, so the set passes with a notice, Q-ARCH-276) and job e2e-ci runs leg ci-ha (the long legs of the GitLab CI OIDC
# suite, E4.7) and job e2e-bastion runs the sets bastion and bastion-long (R-BAS-049: the Bastion's scenarios on kind, the long ones being the drain
# and the floods), job e2e-vuln runs the sets vuln and vuln-long (R-VULN-029: the scanning's scenarios on kind, the long ones being the drain of a
# full synchronization and the client tests with Valkey stopped), and job vuln-perf runs the performance run of the vulnerability scanning (R-VULN-028, V-1 to V-9, perf/vuln) against the
# integration stack and opens an issue on a miss. What the jobs run and how to reproduce them:
# docs/developer/releasing.md#ha-and-performance-nightly.
#
# Every job runs on the organisation's self-hosted runners (runs-on: self-hosted).
name: HA and Performance (nightly)

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  latency:
    name: P-13 and P-14 latency (Valkey 9.1)
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install the Docker Compose plugin (the integration stack)
        run: |
          set -euo pipefail
          docker compose version >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y docker-compose-v2; }
          docker compose version

      - name: Log in to Docker Hub (stack image pulls)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: make integration-up
        run: make integration-up

      - name: make test-performance
        run: make test-performance

      - name: Upload the go test -json report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-performance
          path: .out/test-performance.json
          if-no-files-found: warn
          retention-days: 30

      - name: Container logs (failure only)
        if: failure()
        run: |
          docker compose -f test/integration/compose.yaml ps -a || true
          for c in $(docker ps -a --filter "name=trove-it-" --format '{{.Names}}'); do
            echo "::group::logs of $c"
            docker logs --timestamps "$c" 2>&1 | tail -n 300 || true
            echo "::endgroup::"
          done

      - name: make integration-down
        if: always()
        run: make integration-down

  # R-VULN-028: the performance run of the vulnerability scanning (V-1 to V-9): 100,000 stored versions seeded in SQL, the
  # npm and NuGet dumps of the test advisory source at the size of the real ones, one web and one worker replica against the
  # integration stack (perf/vuln). It runs here and nowhere else: Test and Release never starts it (owner, 2026-11-01).
  # TROVE_PERF_GATE=1 makes a value above its target fail the job; a failed job opens an issue that lists the misses.
  vuln-perf:
    name: R-VULN-028 vulnerability scanning performance (V-1 to V-9)
    runs-on: self-hosted
    timeout-minutes: 150
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential jq

      - name: Install the Docker Compose plugin (the integration stack)
        run: |
          set -euo pipefail
          docker compose version >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y docker-compose-v2; }
          docker compose version

      - name: Log in to Docker Hub (stack image pulls)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: make integration-up
        run: make integration-up

      - name: The performance run (perf/vuln)
        id: run
        timeout-minutes: 120
        run: |
          set -euo pipefail
          mkdir -p .out
          set -a
          . .dev/integration/env
          set +a
          TROVE_PERF_GATE=1 go test -count=1 -p 1 -tags integration -timeout 115m -run 'TestR_VULN_028' -json ./perf/vuln/... | tee .out/test-vuln-perf.json

      - name: Upload the report (perf-vuln.json) and the go test -json stream
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vuln-perf
          path: |
            .out/perf-vuln.json
            .out/test-vuln-perf.json
          if-no-files-found: warn
          retention-days: 30

      - name: Open a regression issue (a miss or a failed run)
        if: failure() && steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body=.out/vuln-perf-issue.md
          {
            echo "The nightly performance run of the vulnerability scanning (R-VULN-028) failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            if [ -f .out/perf-vuln.json ]; then
              echo "Scenarios above their target (value, target):"
              echo
              jq -r '.results[] | select(.met | not) | "- \(.id) \(.scenario): \(.value) \(.unit), target \(.target) \(.unit)"' .out/perf-vuln.json
              echo
              echo "Every value of the run is in the artifact vuln-perf (perf-vuln.json)."
            else
              echo "The run ended before it wrote its report (perf-vuln.json is missing); see the job log."
            fi
          } > "$body"
          gh issue create --title "Performance regression: vulnerability scanning (R-VULN-028), run ${GITHUB_RUN_ID}" --body-file "$body"

      - name: Container logs (failure only)
        if: failure()
        run: |
          docker compose -f test/integration/compose.yaml ps -a || true
          for c in $(docker ps -a --filter "name=trove-it-" --format '{{.Names}}'); do
            echo "::group::logs of $c"
            docker logs --timestamps "$c" 2>&1 | tail -n 300 || true
            echo "::endgroup::"
          done

      - name: make integration-down
        if: always()
        run: make integration-down

  # R-HA-052's pod crash in its 20-minute form (ten force-deletes) under the npm load, then the npm load scripts of
  # R-ARCH-027 against one replica (TestNPMPerf, reported). Since the owner's decision of 2026-11-01 this is the crash
  # run of the nightly workflow, with ten force-deletes; the three-force-delete leg npm-ha-crash is run by hand. The
  # closing run of Test and Release runs the ten force-deletes too, in its leg npm-ha-closing (Q-HA-67).
  npm-ha-soak:
    name: e2e-npm on kind (npm-ha-soak)
    runs-on: self-hosted
    timeout-minutes: 90
    env:
      TROVE_IMAGE: guidedtraffic/trove:dev
      TROVE_DEV_CLUSTER: trove-npm-ha-soak-${{ github.run_id }}
      TROVE_DEV_HTTP_PORT: "8085"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential jq

      - name: Install the pinned helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the pinned kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install the pinned kind
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Log in to Docker Hub (the dev profile's images)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: The runner architecture
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::the dev profile needs an amd64 runner (or qemu), got $(uname -m)"; exit 1; }

      - name: make image
        run: make image IMAGE="$TROVE_IMAGE" VERSION=dev

      - name: make dev-up
        timeout-minutes: 25
        run: make dev-up

      - name: make e2e SET=npm-ha-soak
        timeout-minutes: 60
        run: make e2e SET=npm-ha-soak

      - name: Upload the go test -json report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-npm-report-npm-ha-soak
          path: .out/test-e2e.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the load records, the client logs and the k6 logs and summaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-npm-artifacts-npm-ha-soak
          path: .out/e2e/
          if-no-files-found: warn
          retention-days: 30

      - name: Cluster state (failure only)
        if: failure()
        run: |
          set -u
          ctx="kind-${TROVE_DEV_CLUSTER}"
          mkdir -p .out/cluster-state
          for ns in trove ingress-controller cert-manager valkey-operator-system internal-secrets-operator-system cnpg-system kube-system; do
            kubectl --context "$ctx" -n "$ns" get pods -o wide > ".out/cluster-state/pods-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" describe pods > ".out/cluster-state/describe-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" get events --sort-by=.lastTimestamp > ".out/cluster-state/events-$ns.txt" 2>&1 || true
          done
          for p in $(kubectl --context "$ctx" -n trove get pods -o name 2>/dev/null); do
            kubectl --context "$ctx" -n trove logs "$p" --all-containers --tail=500 > ".out/cluster-state/log-${p#pod/}.txt" 2>&1 || true
          done
          kubectl --context "$ctx" get nodes -o wide > .out/cluster-state/nodes.txt 2>&1 || true
          helm --kube-context "$ctx" -n trove status trove > .out/cluster-state/helm-status.txt 2>&1 || true
          docker ps -a > .out/cluster-state/docker-ps.txt 2>&1 || true
          cp -r .dev/logs .out/cluster-state/dev-logs 2>/dev/null || true

      - name: Upload the cluster state (failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-npm-cluster-state-npm-ha-soak
          path: .out/cluster-state/
          if-no-files-found: warn
          retention-days: 30

      - name: make dev-down
        if: always()
        run: make dev-down

  # The failover set of the failure suite (E0.13: PostgreSQL switchover, kill and stop, Valkey failover, kill and outage
  # under k6 load; the E1.8 limits) on a kind cluster. It left Test and Release for this workflow (owner, 2026-11-01);
  # the steps are those of the e2e job there, unchanged. Its edge port 8081 differs from the others of this file.
  e2e:
    name: e2e on kind (${{ matrix.set }})
    runs-on: self-hosted
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: failover
            port: "8081"
            # Declared so that the browser steps below type-check (actionlint); false skips them, as the e2e job skips them for failover.
            browser: false
          - set: drain-roles
            port: "8097"
            browser: false
    env:
      # The image is built with an explicit VERSION=dev: the binary refuses a version that is not
      # major.minor.patch or "dev" (see docs/developer/e2e.md). make image builds it into the local Docker.
      TROVE_IMAGE: guidedtraffic/trove:dev
      TROVE_DEV_CLUSTER: trove-${{ matrix.set }}-${{ github.run_id }}
      TROVE_DEV_HTTP_PORT: ${{ matrix.port }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential jq

      - name: Install the pinned helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the pinned kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install the pinned kind
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install the shared library the pinned Node.js loads
        if: matrix.browser
        run: |
          set -euo pipefail
          # Node.js 26 links libatomic.so.1, which the runner image does not ship (Q-ARCH-218).
          sudo apt-get update
          sudo apt-get install -y libatomic1

      - name: Set up Node.js (the Playwright journeys of E1.11)
        if: matrix.browser
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc

      - name: Install the Playwright journeys and their browser
        if: matrix.browser
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          # The browser build is the one the locked @playwright/test version names: one version per tool.
          # --with-deps installs the system libraries through apt (sudo, as for the build tools above).
          npx playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Log in to Docker Hub (the dev profile's images)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Tools on the runner
        run: |
          set -euo pipefail
          docker version --format '{{.Server.Version}}'
          kind version
          kubectl version --client
          helm version --short
          jq --version
          nproc
          free -g

      - name: The dev profile's dependency pins and the runner architecture
        run: |
          set -euo pipefail
          # The Valkey operator and the internal-secrets-operator images are published for linux/amd64
          # only (tools/versions.env); the hosted runner is amd64, so no emulation is needed here.
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::the dev profile needs an amd64 runner (or qemu), got $(uname -m)"; exit 1; }
          echo "HAProxy Ingress chart $DEV_HAPROXY_INGRESS_CHART_VERSION, image $DEV_HAPROXY_INGRESS_IMAGE"
          echo "cert-manager chart $DEV_CERT_MANAGER_CHART_VERSION (images pinned by digest)"
          echo "valkey-operator chart $DEV_VALKEY_OPERATOR_CHART_VERSION, internal-secrets-operator chart $DEV_ISO_CHART_VERSION"
          echo "CloudNativePG chart $CNPG_CHART_VERSION"
          # up.sh installs the charts from these repositories; fail early, not 5 minutes into make dev-up.
          for u in https://haproxy-ingress.github.io/charts https://charts.jetstack.io https://guided-traffic.github.io/valkey-operator https://guided-traffic.github.io/internal-secrets-operator https://cloudnative-pg.github.io/charts; do
            curl -fsSL --retry 3 -o /dev/null "$u/index.yaml" || { echo "::error::chart repository $u is not reachable"; exit 1; }
          done

      - name: make image
        run: make image IMAGE="$TROVE_IMAGE" VERSION=dev

      - name: make dev-up
        timeout-minutes: 25
        run: make dev-up

      - name: make e2e SET=${{ matrix.set }}
        timeout-minutes: 60
        run: make e2e SET=${{ matrix.set }}

      - name: Upload the go test -json report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.set }}
          path: .out/test-e2e.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the k6 logs and summaries, the pod watch, the events and the driver output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-${{ matrix.set }}
          path: .out/e2e/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the Playwright report, traces and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright-${{ matrix.set }}
          path: .out/playwright/
          if-no-files-found: ignore
          retention-days: 14

      - name: Cluster state (failure only)
        if: failure()
        run: |
          set -u
          ctx="kind-${TROVE_DEV_CLUSTER}"
          mkdir -p .out/cluster-state
          kubectl config get-contexts || true
          for ns in trove ingress-controller cert-manager valkey-operator-system internal-secrets-operator-system cnpg-system kube-system; do
            kubectl --context "$ctx" -n "$ns" get pods -o wide > ".out/cluster-state/pods-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" describe pods > ".out/cluster-state/describe-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" get events --sort-by=.lastTimestamp > ".out/cluster-state/events-$ns.txt" 2>&1 || true
          done
          for p in $(kubectl --context "$ctx" -n trove get pods -o name 2>/dev/null); do
            kubectl --context "$ctx" -n trove logs "$p" --all-containers --tail=500 > ".out/cluster-state/log-${p#pod/}.txt" 2>&1 || true
          done
          kubectl --context "$ctx" get nodes -o wide > .out/cluster-state/nodes.txt 2>&1 || true
          helm --kube-context "$ctx" -n trove status trove > .out/cluster-state/helm-status.txt 2>&1 || true
          docker ps -a > .out/cluster-state/docker-ps.txt 2>&1 || true
          cp -r .dev/logs .out/cluster-state/dev-logs 2>/dev/null || true

      - name: Upload the cluster state (failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-cluster-state-${{ matrix.set }}
          path: .out/cluster-state/
          if-no-files-found: warn
          retention-days: 14

      - name: make dev-down
        if: always()
        run: make dev-down

  # The drain and failover under the npm load of E2.11, leg npm-ha (drain variant A of R-HA-059, and the PostgreSQL
  # switchover and the Valkey failover of R-HA-052 under eight npm ci loops, a publish loop and k6) on a kind cluster.
  # It left Test and Release for this workflow (owner, 2026-11-01); the steps are those of the e2e-npm job there, unchanged.
  # The pod crash with three force-deletes (npm-ha-crash) has no job here: npm-ha-soak below runs the crash with ten
  # force-deletes over 20 minutes. Edge port 8087 differs from the other ports of this file (8081, 8085) and from the closing leg npm-ha-closing (8084).
  e2e-npm:
    name: e2e-npm on kind (${{ matrix.set }})
    runs-on: self-hosted
    timeout-minutes: ${{ startsWith(matrix.set, 'npm-ha') && 120 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: npm-ha
            port: "8087"
    env:
      TROVE_IMAGE: guidedtraffic/trove:dev
      TROVE_DEV_CLUSTER: trove-${{ matrix.set }}-${{ github.run_id }}
      TROVE_DEV_HTTP_PORT: ${{ matrix.port }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential jq

      - name: Install the pinned helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the pinned kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install the pinned kind
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The clients run inside the clients image (its own Node.js, test/e2e/clients/Dockerfile), so this job needs no
      # Node.js on the runner and none of the libraries the pinned Node.js loads (Q-ARCH-218).

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Log in to Docker Hub (the dev profile's images)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: The dev profile's dependency pins and the runner architecture
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::the dev profile needs an amd64 runner (or qemu), got $(uname -m)"; exit 1; }
          echo "kind $KIND_VERSION, kubectl $KUBECTL_VERSION, helm $HELM_VERSION, clients Node image $E2E_CLIENTS_NODE_IMAGE"
          kind version
          kubectl version --client
          helm version --short
          for u in https://haproxy-ingress.github.io/charts https://charts.jetstack.io https://guided-traffic.github.io/valkey-operator https://guided-traffic.github.io/internal-secrets-operator https://cloudnative-pg.github.io/charts; do
            curl -fsSL --retry 3 -o /dev/null "$u/index.yaml" || { echo "::error::chart repository $u is not reachable"; exit 1; }
          done

      - name: make image
        run: make image IMAGE="$TROVE_IMAGE" VERSION=dev

      - name: make dev-up
        timeout-minutes: 25
        run: make dev-up

      - name: make e2e SET=${{ matrix.set }}
        timeout-minutes: ${{ startsWith(matrix.set, 'npm-ha') && 80 || 60 }}
        run: make e2e SET=${{ matrix.set }}

      - name: Upload the go test -json report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-npm-report-${{ matrix.set }}
          path: .out/test-e2e.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the matrix report, the client logs, the test upstream's counters, the load records and k6 logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
