        if: always() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-bastion-artifacts-${{ matrix.set }}
          path: .out/e2e/
          if-no-files-found: warn
          retention-days: 14

