# HA and Performance (nightly): the long tests, which run nightly and on dispatch and not on every change (owner,
# 2026-11-01). Per change, Test and Release runs the e2e legs push and access-long, the npm leg and the NuGet leg; the long legs of the
# failure suite (failover, npm-ha) run here instead; npm-ha-crash, the three-force-delete form of the pod crash, runs by hand
# (make e2e SET=npm-ha-crash), and job npm-ha-soak runs the same test with ten. On kind clusters: job e2e runs the failover set (E0.13,
# E1.8) and the drain per role (set drain-roles, E6a.6, under the npm load of npm-ha too, Q-HA-94); job e2e-npm runs the sets npm-ha
# (drain variant A, the PostgreSQL switchover and the Valkey failover under the npm load, E2.11, and the HA of the mirror's worker pool, R-REPO-058, Q-REPO-306) and ha-suite (the failure suite under the
# npm load); job e2e-upgrade runs the set upgrade (published releases upgraded to the commit's image under the npm and NuGet loads, with a
# browser journey; switched off in the nightly run until the first stable release, Q-ARCH-340, and run by a dispatch with sets=upgrade); job npm-ha-soak runs the 20-minute pod crash of R-HA-052 under the npm load, the npm load scripts of R-ARCH-027
# (Q-HA-67) and the mirror's clients-first measurement of R-REPO-055 with its install-time ratio enforced; job e2e-nuget runs nuget-ha (TestNuGetHA: the drain and failover under the NuGet load and the npm load, on the large class,
# Q-HA-102), drain-load-b, -c and -e (TestDrainLoad: drain variants B, C and E of R-HA-059 under that load, one cluster each, E5.9, Q-HA-242)
# and cold-crash (TestColdCrash, E5.2: a replica force-deleted during a cold npm ci and dotnet restore, then trove admin storage verify,
# Q-HA-220; the legs run one at a time); job e2e-drain-pooler runs drain-load-pooler (TestDrainLoadPooler: variant D in the pooler profile);
# job e2e-ci runs ci-ha (E4.7); job e2e-bastion runs the sets bastion and
# bastion-long (R-BAS-049); job e2e-vuln runs vuln, vuln-long and vuln-pooler (R-VULN-029; vuln-pooler is the blocks through drain variant D on the cluster
# with the poolers of R-HA-058, on large); job e2e-oci runs oci-long (R-OCI-011: a push cut by the drain of the receiving pod; R-REPO-058: the drain of the node of an OCI mirror's pass); job e2e-backup runs the set backup (R-BAK-029: the restore
# drill, the drain and the kill -9 of a backup and a restore, the revocation journal across a restore); job e2e-edge runs the set edge (R-HA-039's large and
# long transfers and R-HA-038 through the Ingress and through an HTTPRoute, E5.5); job e2e-alerts runs the set alerts (the alerts of R-HA-045 in their
# R-HA-052 scenarios and "Maintenance stays quiet", E5.5; GitHub-hosted).
# The perf jobs start after every kind leg of this workflow has finished, so they measure on the large VM without this workflow's
# clusters beside them (Q-ARCH-325; a Test and Release run that starts meanwhile can still share the VM): job latency enforces the p99 bounds of P-13 (change propagation) and P-14 (job pick-up) with Valkey available, against
# the integration stack (R-ARCH-027, Q-ARCH-220), and job vuln-perf, after latency, runs the performance run of the vulnerability scanning
# (R-VULN-028, V-1 to V-9, perf/vuln) and opens an issue on a miss.
#
# A dispatch can run a part of the nightly (Q-ARCH-324): `gh workflow run "HA and Performance (nightly)" --ref main -f sets=upgrade,ha-suite`.
# The input sets is a comma-separated list of set names or job keys; empty runs every leg, as the schedule does. A leg the list does not
# name shows as a job with skipped steps, and its job summary says so. What the jobs run and how to reproduce them:
# docs/developer/releasing.md#ha-and-performance-nightly.
#
# Runners (owner, 2026-11-05; the assignment and its measured basis, Q-ARCH-326): the jobs run on the organisation's large runners (runs-on:
# large), the class for kind, e2e and load tests, except e2e-ci, e2e-bastion, e2e-upgrade and the legs vuln and vuln-long of e2e-vuln, which run on
# GitHub-hosted runners (runs-on: ubuntu-24.04); the leg vuln-pooler of e2e-vuln runs on large, as it loads no clients image.
# The leg with a CPU-bound condition that loads the NuGet clients image moved to large once that image went into the
# control-plane node only: nuget-ha (Q-HA-102). The mirror's install-time ratio (Q-REPO-211) is enforced in npm-ha-soak, a large leg without that image.
# Sizes: docs/developer/releasing.md#ci.
# Q-ARCH-431: the kind legs on the large class run in three lanes, so at most three large legs of this run are active at once
# (one per worker node of the class: three nodes of 16 CPUs, a kind leg about 12 cores). Lane 1: e2e-npm (npm-ha, then ha-suite, ha-faults and ha-pooler; Q-HA-250),
# then e2e-nuget (nuget-ha, drain-load-b, -c, -e, cold-crash). Lane 2: e2e (drain-roles, then failover), then npm-ha-soak, then e2e-edge, then e2e-drain-pooler. Lane 3: e2e-vuln (its large leg vuln-pooler, the
# GitHub-hosted legs are not in the lanes), then e2e-backup, e2e-oci. Each lane job
# needs its predecessor with `!cancelled()`, so a leg the dispatch does not select, or a failed one, does not stop the lane.
name: HA and Performance (nightly)

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      sets:
        description: >-
          Comma-separated set names or job keys to run, without spaces, for example upgrade,ha-suite. Empty runs every leg, as the
          schedule does. A job key (for example e2e-npm) runs every leg of that job.
        type: string
        required: false
        default: ""

# Q-ARCH-433: one run per ref. A dispatch on a branch runs beside main's run and does not replace its pending one; each run bounds
# its own large legs (Q-ARCH-431), so parallel branch dispatches add their large legs and are coordinated by the development agent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The runner pods have no CPU limit, so every tool would see the node's 32 cores and start that many threads on a node that other
  # jobs share; the time bounds of the tests would then measure the node. Owner, 2026-11-10: limit the tools, not the pods.
  GOMAXPROCS: "8"
  NG_BUILD_MAX_WORKERS: "8"
  VITEST_MAX_WORKERS: "8"

jobs:
  # The platform matrix of R-HA-049 (Q-HA-274, docs/developer/releasing.md#the-platform-matrix): the chart against the API server of the
  # oldest and the newest Kubernetes it is tested on (K8S_MIN_KIND_NODE_IMAGE 1.34, DEV_KIND_NODE_IMAGE 1.37), installed by Helm 4 and by
  # the latest Helm 3. Each leg is a one-node kind cluster of its own on a GitHub-hosted runner (deploy/dev/k8s-matrix.sh): lint, a server-side
  # dry run of six sets of values, a real install without waiting for pods, the fields named in R-HA-049, an upgrade and an uninstall. No pod
  # starts, so it is no part of the lanes of Q-ARCH-431 and the perf jobs do not wait for it. It does not run the failure suite (H-805).
  k8s-matrix:
    name: Platform matrix (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {leg: k8s-min-helm4, kubernetes: min, helm: "4"}
          - {leg: k8s-min-helm3, kubernetes: min, helm: "3"}
          - {leg: k8s-max-helm4, kubernetes: max, helm: "4"}
          - {leg: k8s-max-helm3, kubernetes: max, helm: "3"}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select the leg (the dispatch input sets)
        id: leg
        uses: ./.github/actions/select-leg
        with:
          leg: ${{ matrix.leg }}
          job: k8s-matrix
          sets: ${{ inputs.sets }}

      - name: Load the tool pins
        if: steps.leg.outputs.run == 'true'
        uses: ./.github/actions/load-pins

      - name: Set up Go
        if: steps.leg.outputs.run == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install the helm of this leg (HELM3_VERSION for Helm 3, HELM_VERSION for Helm 4)
        if: steps.leg.outputs.run == 'true'
        uses: azure/setup-helm@v5
        with:
          version: ${{ matrix.helm == '3' && env.HELM3_VERSION || env.HELM_VERSION }}

      - name: Install the pinned kubectl
        if: steps.leg.outputs.run == 'true'
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install the pinned kind
        if: steps.leg.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Log in to Docker Hub (the node image pull)
        if: steps.leg.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: The tools of this leg
        if: steps.leg.outputs.run == 'true'
        run: |
          set -euo pipefail
          kind version
          kubectl version --client
          helm version --short

      - name: Run the leg (deploy/dev/k8s-matrix.sh)
        if: steps.leg.outputs.run == 'true'
        env:
          NODE_IMAGE: ${{ matrix.kubernetes == 'min' && env.K8S_MIN_KIND_NODE_IMAGE || env.DEV_KIND_NODE_IMAGE }}
          HELM_MAJOR: ${{ matrix.helm }}
        run: deploy/dev/k8s-matrix.sh "$NODE_IMAGE" "$HELM_MAJOR"

      - name: Upload the dry-run manifests (failure only)
        if: failure() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: k8s-matrix-${{ matrix.leg }}
          path: .out/k8s-matrix/
          if-no-files-found: warn
          retention-days: 14

  # Q-ARCH-325: the perf jobs start after every kind leg has finished (!cancelled() lets them run when a leg failed), and vuln-perf
  # after latency, so that no perf job shares the large VM with another job of this workflow or with the other perf job.
  latency:
    name: Latency
    needs: [e2e, e2e-npm, npm-ha-soak, e2e-nuget, e2e-drain-pooler, e2e-ci, e2e-bastion, e2e-vuln, e2e-backup, e2e-edge, e2e-alerts, e2e-upgrade]
    if: ${{ !cancelled() && (!inputs.sets || contains(format(',{0},', inputs.sets), ',latency,')) }}
    runs-on: large
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        uses: ./.github/actions/build-tools

      - name: Install the Docker Compose plugin (the integration stack)
        run: |
          set -euo pipefail
          docker compose version >/dev/null 2>&1 || { sudo apt-get update || echo "::warning::apt-get update could not read every package index; installing from the indexes it read"; sudo apt-get install -y docker-compose-v2; }
          docker compose version

      - name: Log in to Docker Hub (stack image pulls)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: make integration-up
        run: make integration-up

      - name: make test-performance
        run: make test-performance

      - name: Upload the go test -json report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-performance
          path: .out/test-performance.json
          if-no-files-found: warn
          retention-days: 30

      - name: Container logs (failure only)
        if: failure()
        run: |
          docker compose -f test/integration/compose.yaml ps -a || true
          for c in $(docker ps -a --filter "name=trove-it-" --format '{{.Names}}'); do
            echo "::group::logs of $c"
            docker logs --timestamps "$c" 2>&1 | tail -n 300 || true
            echo "::endgroup::"
          done

      - name: make integration-down
        if: always()
        run: make integration-down

  # R-VULN-028: the performance run of the vulnerability scanning (V-1 to V-9): 100,000 stored versions seeded in SQL, the
  # npm and NuGet dumps of the test advisory source at the size of the real ones, one web and one worker replica against the
  # integration stack (perf/vuln). It runs here and nowhere else: Test and Release never starts it (owner, 2026-11-01).
  # TROVE_PERF_GATE=1 makes a value above its target fail the job; a failed job opens an issue that lists the misses.
  vuln-perf:
    name: Vulnerability scanning performance
    needs: [e2e, e2e-npm, npm-ha-soak, e2e-nuget, e2e-drain-pooler, e2e-ci, e2e-bastion, e2e-vuln, e2e-edge, e2e-alerts, e2e-upgrade, latency]
    if: ${{ !cancelled() && (!inputs.sets || contains(format(',{0},', inputs.sets), ',vuln-perf,')) }}
    runs-on: large
    timeout-minutes: 150
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        uses: ./.github/actions/build-tools
        with:
          commands: jq

      - name: Install the Docker Compose plugin (the integration stack)
        run: |
          set -euo pipefail
          docker compose version >/dev/null 2>&1 || { sudo apt-get update || echo "::warning::apt-get update could not read every package index; installing from the indexes it read"; sudo apt-get install -y docker-compose-v2; }
          docker compose version

      - name: Log in to Docker Hub (stack image pulls)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: make integration-up
        run: make integration-up

      - name: The performance run (perf/vuln)
        id: run
        timeout-minutes: 120
        run: |
          set -euo pipefail
          mkdir -p .out
          set -a
          . .dev/integration/env
          set +a
          TROVE_PERF_GATE=1 go test -count=1 -p 1 -tags integration -timeout 115m -run 'TestR_VULN_028' -json ./perf/vuln/... | tee .out/test-vuln-perf.json

      - name: Upload the report (perf-vuln.json), the go test -json stream and the replicas' logs of a failed run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vuln-perf
          path: |
            .out/perf-vuln.json
            .out/test-vuln-perf.json
            .out/perf-vuln-logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Open a regression issue (a miss or a failed run)
        if: failure() && steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body=.out/vuln-perf-issue.md
          {
            echo "The nightly performance run of the vulnerability scanning (R-VULN-028) failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            if [ -f .out/perf-vuln.json ]; then
              echo "Scenarios above their target, scenarios that did not finish, and scenarios not measured because one they need did not finish:"
              echo
              jq -r '.results[] | select(.met | not) | if .outcome == "measured" then "- \(.id) \(.scenario): \(.value) \(.unit), target \(.target) \(.unit)" else "- \(.id) \(.scenario): \(.outcome), \(.note); target \(.target) \(.unit)" end' .out/perf-vuln.json
              echo
              echo "Every value of the run is in the artifact vuln-perf (perf-vuln.json), and the replicas' logs of the failed run beside it (perf-vuln-logs)."
            else
              echo "The run ended before it wrote its report (perf-vuln.json is missing); see the job log."
            fi
          } > "$body"
          gh issue create --title "Performance regression: vulnerability scanning (R-VULN-028), run ${GITHUB_RUN_ID}" --body-file "$body"

      - name: Container logs (failure only)
        if: failure()
        run: |
          docker compose -f test/integration/compose.yaml ps -a || true
          for c in $(docker ps -a --filter "name=trove-it-" --format '{{.Names}}'); do
            echo "::group::logs of $c"
            docker logs --timestamps "$c" 2>&1 | tail -n 300 || true
            echo "::endgroup::"
          done

      - name: make integration-down
        if: always()
        run: make integration-down

  # R-HA-052's pod crash in its 20-minute form (ten force-deletes) under the npm load, then the npm load scripts of
  # R-ARCH-027 against one replica (TestNPMPerf, reported). Since the owner's decision of 2026-11-01 this is the crash
  # run of the nightly workflow, with ten force-deletes; the three-force-delete leg npm-ha-crash is run by hand. The
  # closing run of Test and Release runs the ten force-deletes too, in its leg npm-ha-closing (Q-HA-67). The leg also measures a mirror's clients-first
  # install (TestNPMMirror_R_REPO_055_ClientsFirst), whose install-time ratio is enforced here with TROVE_PERF_GATE=1 (Q-REPO-197), on a large runner (Q-REPO-211).
  npm-ha-soak:
    name: e2e (npm-ha-soak)
    # Lane 2 (Q-ARCH-431): after e2e, whatever its result.
    needs: e2e
    if: ${{ !cancelled() && (!inputs.sets || contains(format(',{0},', inputs.sets), ',npm-ha-soak,')) }}
    runs-on: large
    timeout-minutes: 90
    env:
      TROVE_IMAGE: guidedtraffic/trove:dev
      TROVE_DEV_CLUSTER: trove-npm-ha-soak-${{ github.run_id }}
      TROVE_DEV_HTTP_PORT: "8085"
      # The install-time bound of R-REPO-055's clients first is enforced here, not per change (Q-REPO-197).
      TROVE_PERF_GATE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        uses: ./.github/actions/build-tools
        with:
          commands: jq

      - name: Install the pinned helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the pinned kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install the pinned kind
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install the pinned Docker Buildx
        timeout-minutes: 16
        uses: ./.github/actions/install-buildx
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      - name: Log in to Docker Hub (the dev profile's images)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: The runner architecture
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::the dev profile needs an amd64 runner (or qemu), got $(uname -m)"; exit 1; }

      - name: make image
        run: make image IMAGE="$TROVE_IMAGE" VERSION=dev

      - name: Fetch the dev charts that are GitHub release assets
        timeout-minutes: 16
        env:
          # Read by tools/github-download.sh: sent to github.com only (Q-ARCH-356).
          GITHUB_TOKEN: ${{ github.token }}
        run: make dev-charts

      - name: make dev-up
        timeout-minutes: 25
        run: make dev-up

      - name: make e2e SET=npm-ha-soak
        timeout-minutes: 60
        run: make e2e SET=npm-ha-soak

      - name: Upload the go test -json report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-npm-report-npm-ha-soak
          path: .out/test-e2e.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the load records, the client logs and the k6 logs and summaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-npm-artifacts-npm-ha-soak
          path: .out/e2e/
          if-no-files-found: warn
          retention-days: 30

      - name: Cluster state (failure only)
        if: failure()
        run: |
          set -u
          ctx="kind-${TROVE_DEV_CLUSTER}"
          mkdir -p .out/cluster-state
          for ns in trove ingress-controller cert-manager valkey-operator-system internal-secrets-operator-system cnpg-system kube-system; do
            kubectl --context "$ctx" -n "$ns" get pods -o wide > ".out/cluster-state/pods-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" describe pods > ".out/cluster-state/describe-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" get events --sort-by=.lastTimestamp > ".out/cluster-state/events-$ns.txt" 2>&1 || true
          done
          deploy/dev/cluster-logs.sh .out/cluster-state
          kubectl --context "$ctx" get nodes -o wide > .out/cluster-state/nodes.txt 2>&1 || true
          helm --kube-context "$ctx" -n trove status trove > .out/cluster-state/helm-status.txt 2>&1 || true
          docker ps -a > .out/cluster-state/docker-ps.txt 2>&1 || true
          cp -r .dev/logs .out/cluster-state/dev-logs 2>/dev/null || true

      - name: Upload the cluster state (failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-npm-cluster-state-npm-ha-soak
          path: .out/cluster-state/
          if-no-files-found: warn
          retention-days: 30

      - name: make dev-down
        if: always()
        run: make dev-down

  # The failover set of the failure suite (E0.13: PostgreSQL switchover, kill and stop, Valkey failover, kill and outage
  # under k6 load; the E1.8 limits) on a kind cluster. It left Test and Release for this workflow (owner, 2026-11-01);
  # the steps are those of the e2e job there, unchanged. Its edge port 8081 differs from the others of this file.
  # The leg drain-roles (E6a.6, port 8097) evicts every role pod by pod under its own load and the npm load of npm-ha
  # (Q-HA-94): deploy/dev/e2e.sh builds the npm clients image and the counting test upstream and starts three client pods,
  # whose Node.js is the image's own, so the leg needs no Node.js on the runner.
  # Lane 2 (Q-ARCH-431): the legs run one after the other, drain-roles first, so the heavy drain sees the fewest neighbours.
  e2e:
    name: e2e (${{ matrix.set }})
    runs-on: large
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - set: drain-roles
            port: "8097"
            browser: false
          - set: failover
            port: "8081"
            # Declared so that the browser steps below type-check (actionlint); false skips them, as the e2e job skips them for failover.
            browser: false
    env:
      # The image is built with an explicit VERSION=dev: the binary refuses a version that is not
      # major.minor.patch or "dev" (see docs/developer/e2e.md). make image builds it into the local Docker.
      TROVE_IMAGE: guidedtraffic/trove:dev
      TROVE_DEV_CLUSTER: trove-${{ matrix.set }}-${{ github.run_id }}
      TROVE_DEV_HTTP_PORT: ${{ matrix.port }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select the leg (the dispatch input sets)
        id: leg
        uses: ./.github/actions/select-leg
        with:
          leg: ${{ matrix.set }}
          job: e2e
          sets: ${{ inputs.sets }}

      - name: Load the tool pins
        if: steps.leg.outputs.run == 'true'
        uses: ./.github/actions/load-pins

      - name: Set up Go
        if: steps.leg.outputs.run == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        if: steps.leg.outputs.run == 'true'
        uses: ./.github/actions/build-tools
        with:
          commands: jq

      - name: Install the pinned helm
        if: steps.leg.outputs.run == 'true'
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the pinned kubectl
        if: steps.leg.outputs.run == 'true'
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install the pinned kind
        if: steps.leg.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install the shared library the pinned Node.js loads
        if: matrix.browser && steps.leg.outputs.run == 'true'
        run: |
          set -euo pipefail
          # Node.js 26 links libatomic.so.1, which the runner image does not ship (Q-ARCH-218).
          sudo apt-get update || echo "::warning::apt-get update could not read every package index; installing from the indexes it read"
          sudo apt-get install -y libatomic1

      - name: Set up Node.js (the Playwright journeys)
        if: matrix.browser && steps.leg.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc

      - name: Install the Playwright journeys and their browser
        if: matrix.browser && steps.leg.outputs.run == 'true'
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          # The browser build is the one the locked @playwright/test version names: one version per tool.
          # --with-deps installs the system libraries through apt (sudo, as for the build tools above).
          npx playwright install --with-deps chromium

      - name: Install the pinned Docker Buildx
        timeout-minutes: 16
        if: steps.leg.outputs.run == 'true'
        uses: ./.github/actions/install-buildx
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Set up Docker Buildx
        if: steps.leg.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      - name: Log in to Docker Hub (the dev profile's images)
        if: steps.leg.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Tools on the runner
        if: steps.leg.outputs.run == 'true'
        run: |
          set -euo pipefail
          docker version --format '{{.Server.Version}}'
          kind version
          kubectl version --client
          helm version --short
          jq --version
          nproc
          free -g

      - name: The dev profile's dependency pins and the runner architecture
        if: steps.leg.outputs.run == 'true'
        run: |
          set -euo pipefail
          # The Valkey operator and the internal-secrets-operator images are published for linux/amd64
          # only (tools/versions.env); the hosted runner is amd64, so no emulation is needed here.
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::the dev profile needs an amd64 runner (or qemu), got $(uname -m)"; exit 1; }
          echo "HAProxy Ingress chart $DEV_HAPROXY_INGRESS_CHART_VERSION, image $DEV_HAPROXY_INGRESS_IMAGE"
          echo "cert-manager chart $DEV_CERT_MANAGER_CHART_VERSION (images pinned by digest)"
          echo "valkey-operator chart $DEV_VALKEY_OPERATOR_CHART_VERSION, internal-secrets-operator chart $DEV_ISO_CHART_VERSION"
          echo "CloudNativePG chart $CNPG_CHART_VERSION"
          # up.sh installs the charts of these repositories; the haproxy-ingress and cloudnative-pg archives are release assets, fetched by make dev-charts. Fail early, not 5 minutes into make dev-up.
          for u in https://charts.jetstack.io https://guided-traffic.github.io/valkey-operator https://guided-traffic.github.io/internal-secrets-operator; do
            curl -fsSL --retry 3 -o /dev/null "$u/index.yaml" || { echo "::error::chart repository $u is not reachable"; exit 1; }
          done

      - name: make image
        if: steps.leg.outputs.run == 'true'
        run: make image IMAGE="$TROVE_IMAGE" VERSION=dev

      - name: Fetch the dev charts that are GitHub release assets
        timeout-minutes: 16
        if: steps.leg.outputs.run == 'true'
        env:
          # Read by tools/github-download.sh: sent to github.com only (Q-ARCH-356).
          GITHUB_TOKEN: ${{ github.token }}
        run: make dev-charts

      - name: make dev-up
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 25
        run: make dev-up

      - name: make e2e SET=${{ matrix.set }}
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 60
        run: make e2e SET=${{ matrix.set }}

      - name: Upload the go test -json report
        if: always() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.set }}
          path: .out/test-e2e.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the k6 logs and summaries, the pod watch, the events and the driver output
        if: always() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-${{ matrix.set }}
          path: .out/e2e/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the Playwright report, traces and screenshots
        if: always() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright-${{ matrix.set }}
          path: .out/playwright/
          if-no-files-found: ignore
          retention-days: 14

      - name: Cluster state (failure only)
        if: failure() && steps.leg.outputs.run == 'true'
        run: |
          set -u
          ctx="kind-${TROVE_DEV_CLUSTER}"
          mkdir -p .out/cluster-state
          kubectl config get-contexts || true
          for ns in trove ingress-controller cert-manager valkey-operator-system internal-secrets-operator-system cnpg-system kube-system; do
            kubectl --context "$ctx" -n "$ns" get pods -o wide > ".out/cluster-state/pods-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" describe pods > ".out/cluster-state/describe-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" get events --sort-by=.lastTimestamp > ".out/cluster-state/events-$ns.txt" 2>&1 || true
          done
          deploy/dev/cluster-logs.sh .out/cluster-state
          kubectl --context "$ctx" get nodes -o wide > .out/cluster-state/nodes.txt 2>&1 || true
          helm --kube-context "$ctx" -n trove status trove > .out/cluster-state/helm-status.txt 2>&1 || true
          docker ps -a > .out/cluster-state/docker-ps.txt 2>&1 || true
          cp -r .dev/logs .out/cluster-state/dev-logs 2>/dev/null || true

      - name: Upload the cluster state (failure only)
        if: failure() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-cluster-state-${{ matrix.set }}
          path: .out/cluster-state/
          if-no-files-found: warn
          retention-days: 14

      - name: make dev-down
        if: always() && steps.leg.outputs.run == 'true'
        run: make dev-down

  # The drain and failover under the npm load of E2.11, leg npm-ha (drain variant A of R-HA-059, and the PostgreSQL
  # switchover and the Valkey failover of R-HA-052 under eight npm ci loops, a publish loop and k6, and the mirror's worker pool under failure,
  # R-REPO-053, R-REPO-054, R-REPO-058, Q-REPO-306) on a kind cluster.
  # It left Test and Release for this workflow (owner, 2026-11-01); the steps are those of the e2e-npm job there, unchanged.
  # The pod crash with three force-deletes (npm-ha-crash) has no job here: npm-ha-soak below runs the crash with ten
  # force-deletes over 20 minutes. Edge port 8087 differs from the other ports of this file (8081, 8085) and from the closing leg npm-ha-closing (8084).
  # Leg ha-suite (the failure suite under the npm load: S3 outage, node loss, PostgreSQL and Valkey primary loss, the npm-audit drain;
  # its set is added to deploy/dev/e2e.sh by another change, so this leg fails at make e2e until then) has the budgets of npm-ha, 120 and
  # 80 minutes, and edge port 8100, the first free one.
  # Legs ha-faults (the database at 0 instances for 2 minutes, R-HA-057's Sentinel quorum loss, FLUSHALL and slow Valkey, a Valkey credential
  # mismatch; E5.10, R-HA-007) and ha-pooler (a pooler instance deleted, gracefully and
  # forced, in the pooler profile; R-HA-058) run the same steps with the budgets of ha-suite, on edge ports 8112 and 8111.
