# HA and Performance (nightly): the long tests, which run nightly and on dispatch and not on every change (owner,
# 2026-11-01). Per change, Test and Release runs the e2e legs push and access-long, the npm leg and the NuGet leg; the long legs of the
# failure suite (failover, npm-ha) run here instead; npm-ha-crash, the three-force-delete form of the pod crash, runs by hand
# (make e2e SET=npm-ha-crash), and job npm-ha-soak runs the same test with ten. On kind clusters: job e2e runs the failover set (E0.13,
# E1.8) and the drain per role (set drain-roles, E6a.6, under the npm load of npm-ha too, Q-HA-94); job e2e-npm runs the sets npm-ha
# (drain variant A, the PostgreSQL switchover and the Valkey failover under the npm load, E2.11) and ha-suite (the failure suite under the
# npm load); job e2e-upgrade runs the set upgrade (published releases upgraded to the commit's image under the npm and NuGet loads, with a
# browser journey); job npm-ha-soak runs the 20-minute pod crash of R-HA-052 under the npm load and the npm load scripts of R-ARCH-027
# (Q-HA-67); job e2e-nuget runs nuget-ha (the drain and failover under the NuGet load and the npm load, Q-ARCH-277; no test of that name
# exists yet, so the set passes with a notice, Q-ARCH-276); job e2e-ci runs ci-ha (E4.7); job e2e-bastion runs the sets bastion and
# bastion-long (R-BAS-049); job e2e-vuln runs vuln and vuln-long (R-VULN-029); job e2e-mirror runs mirror and mirror-long (R-REPO-059).
# The perf jobs start after every kind leg of this workflow has finished, so they measure on the large VM without this workflow's
# clusters beside them (Q-ARCH-325; a Test and Release run that starts meanwhile can still share the VM): job latency enforces the p99 bounds of P-13 (change propagation) and P-14 (job pick-up) with Valkey available, against
# the integration stack (R-ARCH-027, Q-ARCH-220), and job vuln-perf, after latency, runs the performance run of the vulnerability scanning
# (R-VULN-028, V-1 to V-9, perf/vuln) and opens an issue on a miss.
#
# A dispatch can run a part of the nightly (Q-ARCH-324): `gh workflow run "HA and Performance (nightly)" --ref main -f sets=upgrade,ha-suite`.
# The input sets is a comma-separated list of set names or job keys; empty runs every leg, as the schedule does. A leg the list does not
# name shows as a job with skipped steps, and its job summary says so. What the jobs run and how to reproduce them:
# docs/developer/releasing.md#ha-and-performance-nightly.
#
# Runners (owner, 2026-11-05; the assignment and its measured basis, Q-ARCH-326): the jobs run on the organisation's large runners (runs-on:
# large), the class for kind, e2e and load tests, except the kind legs that load the NuGet clients image (e2e-nuget, e2e-ci, e2e-bastion,
# e2e-vuln, e2e-upgrade, and the set mirror of e2e-mirror): they need more than a large pod's 30 GiB of Docker storage and run on GitHub-hosted
# runners (runs-on: ubuntu-24.04). Sizes: docs/developer/releasing.md#ci.
name: HA and Performance (nightly)

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      sets:
        description: >-
          Comma-separated set names or job keys to run, without spaces, for example upgrade,ha-suite. Empty runs every leg, as the
          schedule does. A job key (for example e2e-npm) runs every leg of that job.
        type: string
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Q-ARCH-325: the perf jobs start after every kind leg has finished (!cancelled() lets them run when a leg failed), and vuln-perf
  # after latency, so that no perf job shares the large VM with another job of this workflow or with the other perf job.
  latency:
    name: P-13 and P-14 latency (Valkey 9.1)
    needs: [e2e, e2e-npm, npm-ha-soak, e2e-nuget, e2e-ci, e2e-bastion, e2e-vuln, e2e-mirror, e2e-upgrade]
    if: ${{ !cancelled() && (!inputs.sets || contains(format(',{0},', inputs.sets), ',latency,')) }}
    runs-on: large
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install the Docker Compose plugin (the integration stack)
        run: |
          set -euo pipefail
          docker compose version >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y docker-compose-v2; }
          docker compose version

      - name: Log in to Docker Hub (stack image pulls)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: make integration-up
        run: make integration-up

      - name: make test-performance
        run: make test-performance

      - name: Upload the go test -json report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-performance
          path: .out/test-performance.json
          if-no-files-found: warn
          retention-days: 30

      - name: Container logs (failure only)
        if: failure()
        run: |
          docker compose -f test/integration/compose.yaml ps -a || true
          for c in $(docker ps -a --filter "name=trove-it-" --format '{{.Names}}'); do
            echo "::group::logs of $c"
            docker logs --timestamps "$c" 2>&1 | tail -n 300 || true
            echo "::endgroup::"
          done

      - name: make integration-down
        if: always()
        run: make integration-down

  # R-VULN-028: the performance run of the vulnerability scanning (V-1 to V-9): 100,000 stored versions seeded in SQL, the
  # npm and NuGet dumps of the test advisory source at the size of the real ones, one web and one worker replica against the
  # integration stack (perf/vuln). It runs here and nowhere else: Test and Release never starts it (owner, 2026-11-01).
  # TROVE_PERF_GATE=1 makes a value above its target fail the job; a failed job opens an issue that lists the misses.
  vuln-perf:
    name: R-VULN-028 vulnerability scanning performance (V-1 to V-9)
    needs: [e2e, e2e-npm, npm-ha-soak, e2e-nuget, e2e-ci, e2e-bastion, e2e-vuln, e2e-mirror, e2e-upgrade, latency]
    if: ${{ !cancelled() && (!inputs.sets || contains(format(',{0},', inputs.sets), ',vuln-perf,')) }}
    runs-on: large
    timeout-minutes: 150
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential jq

      - name: Install the Docker Compose plugin (the integration stack)
        run: |
          set -euo pipefail
          docker compose version >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y docker-compose-v2; }
          docker compose version

      - name: Log in to Docker Hub (stack image pulls)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: make integration-up
        run: make integration-up

      - name: The performance run (perf/vuln)
        id: run
        timeout-minutes: 120
        run: |
          set -euo pipefail
          mkdir -p .out
          set -a
          . .dev/integration/env
          set +a
          TROVE_PERF_GATE=1 go test -count=1 -p 1 -tags integration -timeout 115m -run 'TestR_VULN_028' -json ./perf/vuln/... | tee .out/test-vuln-perf.json

      - name: Upload the report (perf-vuln.json), the go test -json stream and the replicas' logs of a failed run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vuln-perf
          path: |
            .out/perf-vuln.json
            .out/test-vuln-perf.json
            .out/perf-vuln-logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Open a regression issue (a miss or a failed run)
        if: failure() && steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body=.out/vuln-perf-issue.md
          {
            echo "The nightly performance run of the vulnerability scanning (R-VULN-028) failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            if [ -f .out/perf-vuln.json ]; then
              echo "Scenarios above their target, scenarios that did not finish, and scenarios not measured because one they need did not finish:"
              echo
              jq -r '.results[] | select(.met | not) | if .outcome == "measured" then "- \(.id) \(.scenario): \(.value) \(.unit), target \(.target) \(.unit)" else "- \(.id) \(.scenario): \(.outcome), \(.note); target \(.target) \(.unit)" end' .out/perf-vuln.json
              echo
              echo "Every value of the run is in the artifact vuln-perf (perf-vuln.json), and the replicas' logs of the failed run beside it (perf-vuln-logs)."
            else
              echo "The run ended before it wrote its report (perf-vuln.json is missing); see the job log."
            fi
          } > "$body"
          gh issue create --title "Performance regression: vulnerability scanning (R-VULN-028), run ${GITHUB_RUN_ID}" --body-file "$body"

      - name: Container logs (failure only)
        if: failure()
        run: |
          docker compose -f test/integration/compose.yaml ps -a || true
          for c in $(docker ps -a --filter "name=trove-it-" --format '{{.Names}}'); do
            echo "::group::logs of $c"
            docker logs --timestamps "$c" 2>&1 | tail -n 300 || true
            echo "::endgroup::"
          done

      - name: make integration-down
        if: always()
        run: make integration-down

  # R-HA-052's pod crash in its 20-minute form (ten force-deletes) under the npm load, then the npm load scripts of
  # R-ARCH-027 against one replica (TestNPMPerf, reported). Since the owner's decision of 2026-11-01 this is the crash
  # run of the nightly workflow, with ten force-deletes; the three-force-delete leg npm-ha-crash is run by hand. The
  # closing run of Test and Release runs the ten force-deletes too, in its leg npm-ha-closing (Q-HA-67).
  npm-ha-soak:
    name: e2e-npm on kind (npm-ha-soak)
    if: ${{ !inputs.sets || contains(format(',{0},', inputs.sets), ',npm-ha-soak,') }}
    runs-on: large
    timeout-minutes: 90
    env:
      TROVE_IMAGE: guidedtraffic/trove:dev
      TROVE_DEV_CLUSTER: trove-npm-ha-soak-${{ github.run_id }}
      TROVE_DEV_HTTP_PORT: "8085"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential jq

      - name: Install the pinned helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the pinned kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install the pinned kind
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Log in to Docker Hub (the dev profile's images)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: The runner architecture
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::the dev profile needs an amd64 runner (or qemu), got $(uname -m)"; exit 1; }

      - name: make image
        run: make image IMAGE="$TROVE_IMAGE" VERSION=dev

      - name: make dev-up
        timeout-minutes: 25
        run: make dev-up

      - name: make e2e SET=npm-ha-soak
        timeout-minutes: 60
        run: make e2e SET=npm-ha-soak

      - name: Upload the go test -json report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-npm-report-npm-ha-soak
          path: .out/test-e2e.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the load records, the client logs and the k6 logs and summaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-npm-artifacts-npm-ha-soak
          path: .out/e2e/
          if-no-files-found: warn
          retention-days: 30

      - name: Cluster state (failure only)
        if: failure()
        run: |
          set -u
          ctx="kind-${TROVE_DEV_CLUSTER}"
          mkdir -p .out/cluster-state
          for ns in trove ingress-controller cert-manager valkey-operator-system internal-secrets-operator-system cnpg-system kube-system; do
            kubectl --context "$ctx" -n "$ns" get pods -o wide > ".out/cluster-state/pods-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" describe pods > ".out/cluster-state/describe-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" get events --sort-by=.lastTimestamp > ".out/cluster-state/events-$ns.txt" 2>&1 || true
          done
          deploy/dev/cluster-logs.sh .out/cluster-state
          kubectl --context "$ctx" get nodes -o wide > .out/cluster-state/nodes.txt 2>&1 || true
          helm --kube-context "$ctx" -n trove status trove > .out/cluster-state/helm-status.txt 2>&1 || true
          docker ps -a > .out/cluster-state/docker-ps.txt 2>&1 || true
          cp -r .dev/logs .out/cluster-state/dev-logs 2>/dev/null || true

      - name: Upload the cluster state (failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-npm-cluster-state-npm-ha-soak
          path: .out/cluster-state/
          if-no-files-found: warn
          retention-days: 30

      - name: make dev-down
        if: always()
        run: make dev-down

  # The failover set of the failure suite (E0.13: PostgreSQL switchover, kill and stop, Valkey failover, kill and outage
  # under k6 load; the E1.8 limits) on a kind cluster. It left Test and Release for this workflow (owner, 2026-11-01);
  # the steps are those of the e2e job there, unchanged. Its edge port 8081 differs from the others of this file.
  # The leg drain-roles (E6a.6, port 8097) evicts every role pod by pod under its own load and the npm load of npm-ha
  # (Q-HA-94): deploy/dev/e2e.sh builds the npm clients image and the counting test upstream and starts three client pods,
  # whose Node.js is the image's own, so the leg needs no Node.js on the runner.
  e2e:
    name: e2e on kind (${{ matrix.set }})
    runs-on: large
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: failover
            port: "8081"
            # Declared so that the browser steps below type-check (actionlint); false skips them, as the e2e job skips them for failover.
            browser: false
          - set: drain-roles
            port: "8097"
            browser: false
    env:
      # The image is built with an explicit VERSION=dev: the binary refuses a version that is not
      # major.minor.patch or "dev" (see docs/developer/e2e.md). make image builds it into the local Docker.
      TROVE_IMAGE: guidedtraffic/trove:dev
      TROVE_DEV_CLUSTER: trove-${{ matrix.set }}-${{ github.run_id }}
      TROVE_DEV_HTTP_PORT: ${{ matrix.port }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select the leg (the dispatch input sets)
        id: leg
        uses: ./.github/actions/select-leg
        with:
          leg: ${{ matrix.set }}
          job: e2e
          sets: ${{ inputs.sets }}

      - name: Load the tool pins
        if: steps.leg.outputs.run == 'true'
        uses: ./.github/actions/load-pins

      - name: Set up Go
        if: steps.leg.outputs.run == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        if: steps.leg.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential jq

      - name: Install the pinned helm
        if: steps.leg.outputs.run == 'true'
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the pinned kubectl
        if: steps.leg.outputs.run == 'true'
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install the pinned kind
        if: steps.leg.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install the shared library the pinned Node.js loads
        if: matrix.browser && steps.leg.outputs.run == 'true'
        run: |
          set -euo pipefail
          # Node.js 26 links libatomic.so.1, which the runner image does not ship (Q-ARCH-218).
          sudo apt-get update
          sudo apt-get install -y libatomic1

      - name: Set up Node.js (the Playwright journeys of E1.11)
        if: matrix.browser && steps.leg.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc

      - name: Install the Playwright journeys and their browser
        if: matrix.browser && steps.leg.outputs.run == 'true'
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          # The browser build is the one the locked @playwright/test version names: one version per tool.
          # --with-deps installs the system libraries through apt (sudo, as for the build tools above).
          npx playwright install --with-deps chromium

      - name: Set up Docker Buildx
        if: steps.leg.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Log in to Docker Hub (the dev profile's images)
        if: steps.leg.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Tools on the runner
        if: steps.leg.outputs.run == 'true'
        run: |
          set -euo pipefail
          docker version --format '{{.Server.Version}}'
          kind version
          kubectl version --client
          helm version --short
          jq --version
          nproc
          free -g

      - name: The dev profile's dependency pins and the runner architecture
        if: steps.leg.outputs.run == 'true'
        run: |
          set -euo pipefail
          # The Valkey operator and the internal-secrets-operator images are published for linux/amd64
          # only (tools/versions.env); the hosted runner is amd64, so no emulation is needed here.
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::the dev profile needs an amd64 runner (or qemu), got $(uname -m)"; exit 1; }
          echo "HAProxy Ingress chart $DEV_HAPROXY_INGRESS_CHART_VERSION, image $DEV_HAPROXY_INGRESS_IMAGE"
          echo "cert-manager chart $DEV_CERT_MANAGER_CHART_VERSION (images pinned by digest)"
          echo "valkey-operator chart $DEV_VALKEY_OPERATOR_CHART_VERSION, internal-secrets-operator chart $DEV_ISO_CHART_VERSION"
          echo "CloudNativePG chart $CNPG_CHART_VERSION"
          # up.sh installs the charts from these repositories; fail early, not 5 minutes into make dev-up.
          for u in https://haproxy-ingress.github.io/charts https://charts.jetstack.io https://guided-traffic.github.io/valkey-operator https://guided-traffic.github.io/internal-secrets-operator https://cloudnative-pg.github.io/charts; do
            curl -fsSL --retry 3 -o /dev/null "$u/index.yaml" || { echo "::error::chart repository $u is not reachable"; exit 1; }
          done

      - name: make image
        if: steps.leg.outputs.run == 'true'
        run: make image IMAGE="$TROVE_IMAGE" VERSION=dev

      - name: make dev-up
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 25
        run: make dev-up

      - name: make e2e SET=${{ matrix.set }}
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 60
        run: make e2e SET=${{ matrix.set }}

      - name: Upload the go test -json report
        if: always() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.set }}
          path: .out/test-e2e.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the k6 logs and summaries, the pod watch, the events and the driver output
        if: always() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-${{ matrix.set }}
          path: .out/e2e/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the Playwright report, traces and screenshots
        if: always() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright-${{ matrix.set }}
          path: .out/playwright/
          if-no-files-found: ignore
          retention-days: 14

      - name: Cluster state (failure only)
        if: failure() && steps.leg.outputs.run == 'true'
        run: |
          set -u
          ctx="kind-${TROVE_DEV_CLUSTER}"
          mkdir -p .out/cluster-state
          kubectl config get-contexts || true
          for ns in trove ingress-controller cert-manager valkey-operator-system internal-secrets-operator-system cnpg-system kube-system; do
            kubectl --context "$ctx" -n "$ns" get pods -o wide > ".out/cluster-state/pods-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" describe pods > ".out/cluster-state/describe-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" get events --sort-by=.lastTimestamp > ".out/cluster-state/events-$ns.txt" 2>&1 || true
          done
          deploy/dev/cluster-logs.sh .out/cluster-state
          kubectl --context "$ctx" get nodes -o wide > .out/cluster-state/nodes.txt 2>&1 || true
          helm --kube-context "$ctx" -n trove status trove > .out/cluster-state/helm-status.txt 2>&1 || true
          docker ps -a > .out/cluster-state/docker-ps.txt 2>&1 || true
          cp -r .dev/logs .out/cluster-state/dev-logs 2>/dev/null || true

      - name: Upload the cluster state (failure only)
        if: failure() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-cluster-state-${{ matrix.set }}
          path: .out/cluster-state/
          if-no-files-found: warn
          retention-days: 14

      - name: make dev-down
        if: always() && steps.leg.outputs.run == 'true'
        run: make dev-down

  # The drain and failover under the npm load of E2.11, leg npm-ha (drain variant A of R-HA-059, and the PostgreSQL
  # switchover and the Valkey failover of R-HA-052 under eight npm ci loops, a publish loop and k6) on a kind cluster.
  # It left Test and Release for this workflow (owner, 2026-11-01); the steps are those of the e2e-npm job there, unchanged.
  # The pod crash with three force-deletes (npm-ha-crash) has no job here: npm-ha-soak below runs the crash with ten
  # force-deletes over 20 minutes. Edge port 8087 differs from the other ports of this file (8081, 8085) and from the closing leg npm-ha-closing (8084).
  # Leg ha-suite (the failure suite under the npm load: S3 outage, node loss, PostgreSQL and Valkey primary loss, the npm-audit drain;
  # its set is added to deploy/dev/e2e.sh by another change, so this leg fails at make e2e until then) has the budgets of npm-ha, 120 and
  # 80 minutes, and edge port 8100, the first free one.
  e2e-npm:
    name: e2e-npm on kind (${{ matrix.set }})
    runs-on: large
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: npm-ha
            port: "8087"
          - set: ha-suite
            port: "8100"
    env:
      TROVE_IMAGE: guidedtraffic/trove:dev
      TROVE_DEV_CLUSTER: trove-${{ matrix.set }}-${{ github.run_id }}
      TROVE_DEV_HTTP_PORT: ${{ matrix.port }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select the leg (the dispatch input sets)
        id: leg
        uses: ./.github/actions/select-leg
        with:
          leg: ${{ matrix.set }}
          job: e2e-npm
          sets: ${{ inputs.sets }}

      - name: Load the tool pins
        if: steps.leg.outputs.run == 'true'
        uses: ./.github/actions/load-pins

      - name: Set up Go
        if: steps.leg.outputs.run == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        if: steps.leg.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential jq

      - name: Install the pinned helm
        if: steps.leg.outputs.run == 'true'
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the pinned kubectl
        if: steps.leg.outputs.run == 'true'
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install the pinned kind
        if: steps.leg.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The clients run inside the clients image (its own Node.js, test/e2e/clients/Dockerfile), so this job needs no
      # Node.js on the runner and none of the libraries the pinned Node.js loads (Q-ARCH-218).

      - name: Set up Docker Buildx
        if: steps.leg.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Log in to Docker Hub (the dev profile's images)
        if: steps.leg.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: The dev profile's dependency pins and the runner architecture
        if: steps.leg.outputs.run == 'true'
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::the dev profile needs an amd64 runner (or qemu), got $(uname -m)"; exit 1; }
          echo "kind $KIND_VERSION, kubectl $KUBECTL_VERSION, helm $HELM_VERSION, clients Node image $E2E_CLIENTS_NODE_IMAGE"
          kind version
          kubectl version --client
          helm version --short
          for u in https://haproxy-ingress.github.io/charts https://charts.jetstack.io https://guided-traffic.github.io/valkey-operator https://guided-traffic.github.io/internal-secrets-operator https://cloudnative-pg.github.io/charts; do
            curl -fsSL --retry 3 -o /dev/null "$u/index.yaml" || { echo "::error::chart repository $u is not reachable"; exit 1; }
          done

      - name: make image
        if: steps.leg.outputs.run == 'true'
        run: make image IMAGE="$TROVE_IMAGE" VERSION=dev

      - name: make dev-up
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 25
        run: make dev-up

      - name: make e2e SET=${{ matrix.set }}
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 80
        run: make e2e SET=${{ matrix.set }}

      - name: Upload the go test -json report
        if: always() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-npm-report-${{ matrix.set }}
          path: .out/test-e2e.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the matrix report, the client logs, the test upstream's counters, the load records and k6 logs
        if: always() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-npm-artifacts-${{ matrix.set }}
          path: .out/e2e/
          if-no-files-found: warn
          retention-days: 14

      - name: Cluster state (failure only)
        if: failure() && steps.leg.outputs.run == 'true'
        run: |
          set -u
          ctx="kind-${TROVE_DEV_CLUSTER}"
          mkdir -p .out/cluster-state
          for ns in trove ingress-controller cert-manager valkey-operator-system internal-secrets-operator-system cnpg-system kube-system; do
            kubectl --context "$ctx" -n "$ns" get pods -o wide > ".out/cluster-state/pods-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" describe pods > ".out/cluster-state/describe-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" get events --sort-by=.lastTimestamp > ".out/cluster-state/events-$ns.txt" 2>&1 || true
          done
          deploy/dev/cluster-logs.sh .out/cluster-state
          kubectl --context "$ctx" get nodes -o wide > .out/cluster-state/nodes.txt 2>&1 || true
          helm --kube-context "$ctx" -n trove status trove > .out/cluster-state/helm-status.txt 2>&1 || true
          docker ps -a > .out/cluster-state/docker-ps.txt 2>&1 || true
          cp -r .dev/logs .out/cluster-state/dev-logs 2>/dev/null || true

      - name: Upload the cluster state (failure only)
        if: failure() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-npm-cluster-state-${{ matrix.set }}
          path: .out/cluster-state/
          if-no-files-found: warn
          retention-days: 14

      - name: make dev-down
        if: always() && steps.leg.outputs.run == 'true'
        run: make dev-down

  # The NuGet leg of the drain and failover tests under the NuGet load (nuget-ha, Q-ARCH-277): every TestNuGetHA..., on a kind
  # cluster with the scatter profile and the counting NuGet test upstream. It left Test and Release with the npm-ha legs (owner,
  # 2026-11-01); its steps are those of the e2e-nuget job there. The set also starts the npm client pods and the npm test upstream
  # (the drain of R-HA-059 runs npm and NuGet load together), so the job builds both clients images in its own steps, as e2e-ci does,
  # and the set loads them without building them again (Q-ARCH-327). No test is named TestNuGetHA yet, so the set passes with a notice
  # (Q-ARCH-276) and this job checks nothing beyond the bring-up of the cluster until one lands. Edge port 8090 is the first free port of both workflows.
  e2e-nuget:
    name: e2e-nuget on kind (${{ matrix.set }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: nuget-ha
            port: "8090"
    env:
      TROVE_IMAGE: guidedtraffic/trove:dev
      TROVE_DEV_CLUSTER: trove-${{ matrix.set }}-${{ github.run_id }}
      TROVE_DEV_HTTP_PORT: ${{ matrix.port }}
      # Both clients images are built once by the steps make npm-clients-image and make nuget-clients-image; deploy/dev/e2e.sh loads them
      # and does not build them again.
      TROVE_E2E_NPM_CLIENTS_IMAGE_BUILD: "0"
      TROVE_E2E_NUGET_CLIENTS_IMAGE_BUILD: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select the leg (the dispatch input sets)
        id: leg
        uses: ./.github/actions/select-leg
        with:
          leg: ${{ matrix.set }}
          job: e2e-nuget
          sets: ${{ inputs.sets }}

      # The GitHub-hosted runner's preinstalled SDKs (Android, .NET, Haskell, CodeQL) take the disk space that the kind
      # nodes, the images and the build caches need; no job here uses them.
      - name: Free disk space (GitHub-hosted runner)
        if: steps.leg.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Load the tool pins
        if: steps.leg.outputs.run == 'true'
        uses: ./.github/actions/load-pins

      - name: Set up Go
        if: steps.leg.outputs.run == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        if: steps.leg.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential jq

      - name: Install the pinned helm
        if: steps.leg.outputs.run == 'true'
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the pinned kubectl
        if: steps.leg.outputs.run == 'true'
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install the pinned kind
        if: steps.leg.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Set up Docker Buildx
        if: steps.leg.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Log in to Docker Hub (the dev profile's images)
        if: steps.leg.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: make npm-clients-image
        if: steps.leg.outputs.run == 'true'
        run: make npm-clients-image

      - name: make nuget-clients-image
        if: steps.leg.outputs.run == 'true'
        run: make nuget-clients-image

      - name: The dev profile's dependency pins and the runner architecture
        if: steps.leg.outputs.run == 'true'
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::the dev profile needs an amd64 runner (or qemu), got $(uname -m)"; exit 1; }
          echo "kind $KIND_VERSION, kubectl $KUBECTL_VERSION, helm $HELM_VERSION, NuGet SDK $E2E_NUGETCLIENTS_SDK_IMAGE"
          kind version
          kubectl version --client
          helm version --short
          for u in https://haproxy-ingress.github.io/charts https://charts.jetstack.io https://guided-traffic.github.io/valkey-operator https://guided-traffic.github.io/internal-secrets-operator https://cloudnative-pg.github.io/charts; do
            curl -fsSL --retry 3 -o /dev/null "$u/index.yaml" || { echo "::error::chart repository $u is not reachable"; exit 1; }
          done

      - name: make image
        if: steps.leg.outputs.run == 'true'
        run: make image IMAGE="$TROVE_IMAGE" VERSION=dev

      - name: make dev-up
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 25
        run: make dev-up

      - name: make e2e SET=${{ matrix.set }}
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 80
        run: make e2e SET=${{ matrix.set }}

      - name: Upload the go test -json report
        if: always() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-nuget-report-${{ matrix.set }}
          path: .out/test-e2e.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the matrix report, the clients image log, the test upstream's counters, the client logs and the k6 logs
        if: always() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-nuget-artifacts-${{ matrix.set }}
          path: .out/e2e/
          if-no-files-found: warn
          retention-days: 14

      - name: Cluster state (failure only)
        if: failure() && steps.leg.outputs.run == 'true'
        run: |
          set -u
          ctx="kind-${TROVE_DEV_CLUSTER}"
          mkdir -p .out/cluster-state
          for ns in trove ingress-controller cert-manager valkey-operator-system internal-secrets-operator-system cnpg-system kube-system; do
            kubectl --context "$ctx" -n "$ns" get pods -o wide > ".out/cluster-state/pods-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" describe pods > ".out/cluster-state/describe-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" get events --sort-by=.lastTimestamp > ".out/cluster-state/events-$ns.txt" 2>&1 || true
          done
          deploy/dev/cluster-logs.sh .out/cluster-state
          kubectl --context "$ctx" get nodes -o wide > .out/cluster-state/nodes.txt 2>&1 || true
          helm --kube-context "$ctx" -n trove status trove > .out/cluster-state/helm-status.txt 2>&1 || true
          docker ps -a > .out/cluster-state/docker-ps.txt 2>&1 || true
          cp -r .dev/logs .out/cluster-state/dev-logs 2>/dev/null || true

      - name: Upload the cluster state (failure only)
        if: failure() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-nuget-cluster-state-${{ matrix.set }}
          path: .out/cluster-state/
          if-no-files-found: warn
          retention-days: 14

      - name: make dev-down
        if: always() && steps.leg.outputs.run == 'true'
        run: make dev-down

  # The long legs of the GitLab CI OIDC suite (set ci-ha, roadmap M4 E4.7): the reference pipeline while the node of an api replica is
  # drained and again with Valkey stopped, single-use exchanges across a forced Sentinel failover and FLUSHALL, and an api pod deleted
  # while 50 jobs exchange (docs/developer/e2e.md#the-ci-tests). Its steps are those of the e2e-ci job of Test and Release, except that
  # the clients images are built by deploy/dev/e2e.sh when the set starts the client pods. Edge port 8092 is the first free one.
  e2e-ci:
    name: e2e-ci on kind (${{ matrix.set }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
