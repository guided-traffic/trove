          job: e2e-mirror
          sets: ${{ inputs.sets }}

      # The GitHub-hosted runner's preinstalled SDKs (Android, .NET, Haskell, CodeQL) take the disk space that the kind
      # nodes, the images and the build caches need; no job here uses them.
      - name: Free disk space (GitHub-hosted runner)
        if: matrix.runner == 'ubuntu-24.04' && steps.leg.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
