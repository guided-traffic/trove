  # The vulnerability suite (R-VULN-029, docs/developer/e2e.md#the-vulnerability-tests) on a kind cluster: the short set `vuln`, as in
  # Test and Release, the long set `vuln-long` (a full synchronization drained mid-run, the client tests once more with Valkey
  # stopped, the blocks through drain variants A, B, C and E, and the restore drill of R-VULN-026) and the set `vuln-pooler` (the blocks
  # through drain variant D on the cluster with the poolers of R-HA-058, E5.13). A red long leg is a finding and holds nothing (owner,
  # 2026-11-01). `vuln` and `vuln-long` load the NuGet clients image and run on a GitHub-hosted runner (Q-ARCH-326); `vuln-pooler` starts no
  # client pods and runs on a large one. Edge ports 8095, 8096 and 8103 are the first free ones of both workflows.
  e2e-vuln:
    name: e2e (${{ matrix.set }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: vuln
            port: "8095"
            runner: ubuntu-24.04
            journeys: true          # the Playwright journeys of R-VULN-022
          - set: vuln-long
            port: "8096"
            runner: ubuntu-24.04
            journeys: true
          - set: vuln-pooler
            port: "8103"
            runner: large
    env:
      TROVE_IMAGE: guidedtraffic/trove:dev
      TROVE_DEV_CLUSTER: trove-${{ matrix.set }}-${{ github.run_id }}
      TROVE_DEV_HTTP_PORT: ${{ matrix.port }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select the leg (the dispatch input sets)
        id: leg
        uses: ./.github/actions/select-leg
        with:
          leg: ${{ matrix.set }}
          job: e2e-vuln
          sets: ${{ inputs.sets }}

