  # The edge tests (set edge, exit criterion E5.5, docs/developer/e2e.md#the-edge-and-alert-tests): R-HA-039's 6 GiB upload, 17-minute download at
  # 2 MiB/s, 1 GiB NuGet push and the scoped npm package, and R-HA-038's criteria, through the chart's Ingress and through its HTTPRoute on a platform
  # Gateway (Envoy Gateway, the profile `edge`). The 6 GiB file and the spool need a large runner's disk (Q-ARCH-326); the job is the end of lane 2
