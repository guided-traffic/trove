  # The vulnerability suite (R-VULN-029, docs/developer/e2e.md#the-vulnerability-tests) on a kind cluster: the short set `vuln`, as in
  # Test and Release, and the long set `vuln-long` (a full synchronization drained mid-run, and the client tests once more with Valkey
  # stopped). A red long leg is a finding and holds nothing (owner, 2026-11-01). Edge ports 8095 and 8096 are the first free ones of
  # both workflows.
  e2e-vuln:
    name: e2e-vuln on kind (${{ matrix.set }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: vuln
            port: "8095"
          - set: vuln-long
            port: "8096"
    env:
      TROVE_IMAGE: guidedtraffic/trove:dev
      TROVE_DEV_CLUSTER: trove-${{ matrix.set }}-${{ github.run_id }}
      TROVE_DEV_HTTP_PORT: ${{ matrix.port }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select the leg (the dispatch input sets)
        id: leg
        uses: ./.github/actions/select-leg
        with:
          leg: ${{ matrix.set }}
          job: e2e-vuln
          sets: ${{ inputs.sets }}

      # The GitHub-hosted runner's preinstalled SDKs (Android, .NET, Haskell, CodeQL) take the disk space that the kind
      # nodes, the images and the build caches need; no job here uses them.
      - name: Free disk space (GitHub-hosted runner)
        if: steps.leg.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Load the tool pins
        if: steps.leg.outputs.run == 'true'
        uses: ./.github/actions/load-pins

      - name: Set up Go
        if: steps.leg.outputs.run == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        if: steps.leg.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential jq

      - name: Set up Node.js (the Playwright journeys of R-VULN-022)
        if: steps.leg.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc

      - name: Install the Playwright journeys and their browser
        if: steps.leg.outputs.run == 'true'
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Install the pinned helm
        if: steps.leg.outputs.run == 'true'
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the pinned kubectl
        if: steps.leg.outputs.run == 'true'
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install the pinned kind
        if: steps.leg.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Set up Docker Buildx
        if: steps.leg.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Log in to Docker Hub (the dev profile's images)
        if: steps.leg.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: The dev profile's dependency pins and the runner architecture
        if: steps.leg.outputs.run == 'true'
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::the dev profile needs an amd64 runner (or qemu), got $(uname -m)"; exit 1; }
          echo "kind $KIND_VERSION, kubectl $KUBECTL_VERSION, helm $HELM_VERSION, NuGet SDK $E2E_NUGETCLIENTS_SDK_IMAGE"
          kind version
          kubectl version --client
          helm version --short
          for u in https://haproxy-ingress.github.io/charts https://charts.jetstack.io https://guided-traffic.github.io/valkey-operator https://guided-traffic.github.io/internal-secrets-operator https://cloudnative-pg.github.io/charts; do
            curl -fsSL --retry 3 -o /dev/null "$u/index.yaml" || { echo "::error::chart repository $u is not reachable"; exit 1; }
          done

      - name: make image
        if: steps.leg.outputs.run == 'true'
        run: make image IMAGE="$TROVE_IMAGE" VERSION=dev

      - name: make dev-up
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 25
        run: make dev-up

      - name: make e2e SET=${{ matrix.set }}
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 100
        run: make e2e SET=${{ matrix.set }}

      - name: Upload the go test -json report
        if: always() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-vuln-report-${{ matrix.set }}
          path: .out/test-e2e.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the job logs (ci-job-*.log), the clients image logs and the test output
        if: always() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-vuln-artifacts-${{ matrix.set }}
          path: .out/e2e/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the Playwright report, traces and screenshots
        if: always() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-vuln-playwright-${{ matrix.set }}
          path: .out/playwright/
          if-no-files-found: ignore
          retention-days: 14

      - name: Cluster state (failure only)
        if: failure() && steps.leg.outputs.run == 'true'
        run: |
          set -u
          ctx="kind-${TROVE_DEV_CLUSTER}"
          mkdir -p .out/cluster-state
          for ns in trove ingress-controller cert-manager valkey-operator-system internal-secrets-operator-system cnpg-system kube-system; do
            kubectl --context "$ctx" -n "$ns" get pods -o wide > ".out/cluster-state/pods-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" describe pods > ".out/cluster-state/describe-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" get events --sort-by=.lastTimestamp > ".out/cluster-state/events-$ns.txt" 2>&1 || true
          done
          deploy/dev/cluster-logs.sh .out/cluster-state
          kubectl --context "$ctx" get nodes -o wide > .out/cluster-state/nodes.txt 2>&1 || true
          helm --kube-context "$ctx" -n trove status trove > .out/cluster-state/helm-status.txt 2>&1 || true
          docker ps -a > .out/cluster-state/docker-ps.txt 2>&1 || true
          cp -r .dev/logs .out/cluster-state/dev-logs 2>/dev/null || true

      - name: Upload the cluster state (failure only)
        if: failure() && steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-vuln-cluster-state-${{ matrix.set }}
          path: .out/cluster-state/
          if-no-files-found: warn
          retention-days: 14

      - name: make dev-down
        if: always() && steps.leg.outputs.run == 'true'
        run: make dev-down

  # The mirror suite (R-REPO-059, docs/developer/e2e.md#the-mirror-tests) on a kind cluster in the profile `mirror`: the short set `mirror`, as in
  # Test and Release, and the long set `mirror-long` (`kubectl drain` of the node of the process that runs a pass of 300 packages). A red long
  # leg is a finding and holds nothing (owner, 2026-11-01). `mirror` loads the NuGet clients image and runs on a GitHub-hosted runner,
  # `mirror-long` on a large one. Edge ports 8098 and 8099 are the first free ones of both workflows.
  e2e-mirror:
    name: e2e-mirror on kind (${{ matrix.set }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: mirror
            port: "8098"
            runner: ubuntu-24.04    # loads the NuGet clients image: it outgrows a large pod's Docker storage
          - set: mirror-long
            port: "8099"
            runner: large
    env:
      TROVE_IMAGE: guidedtraffic/trove:dev
      TROVE_DEV_CLUSTER: trove-${{ matrix.set }}-${{ github.run_id }}
      TROVE_DEV_HTTP_PORT: ${{ matrix.port }}
      # The install-time bound of R-REPO-055's clients first is enforced here, not per change (Q-REPO-197).
      TROVE_PERF_GATE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select the leg (the dispatch input sets)
