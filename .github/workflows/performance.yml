        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential jq

      - name: Set up Node.js (the browser journey of the mirror panel, R-REPO-059)
        if: matrix.set == 'mirror' && steps.leg.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc

