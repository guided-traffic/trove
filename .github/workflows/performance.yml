      - name: Install build tools
        if: steps.leg.outputs.run == 'true'
        uses: ./.github/actions/build-tools
        with:
          commands: jq

      - name: Set up Node.js (the Playwright journeys)
        if: matrix.journeys == true && steps.leg.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc

