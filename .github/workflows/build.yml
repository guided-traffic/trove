# Release Docker & Helm: runs on every published release (semantic-release publishes it on main, see
# release.yml). The release's tag is the version: the image guidedtraffic/trove (Docker Hub) for
# linux/amd64 and linux/arm64, built from the Containerfile, and the Helm charts trove and trove-bastion in the
# gh-pages branch (the chart repository https://guided-traffic.github.io/trove/) with the release's assets.
# docs/developer/releasing.md (The release pipeline) describes the jobs and the secrets.
#
# After both publish jobs, the job smoke-published installs the published artifacts into a kind cluster and runs the
# scenarios of E5.8 against them (R-HA-047, Q-HA-163 to Q-HA-165). A dispatch with the input `version` runs only that
# job, against a release that already exists: the publish jobs run on `release` events only, so a dispatch never builds
# the image, never pushes a tag and never touches the gh-pages branch (test/chart/release_workflow_test.go guards both
# conditions).
name: Release Docker & Helm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: The published release to check, without the v, for example 0.25.0 (runs the job smoke-published only)
        type: string
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# No token permission beyond reading by default; each job asks for what it uses (docs/security/data-and-secret-flow.md).
permissions:
  contents: read

jobs:
  build:
    name: Build Docker Image
    # Publishes: release events only (a dispatch runs the check alone).
    if: github.event_name == 'release'
    runs-on: self-hosted
    # contents: write for the release assets (softprops/action-gh-release, and the SPDX upload of anchore/sbom-action is off).
    # Nothing else of the token is used: no OIDC token, no attestation API, no pages.
    permissions:
      contents: write
    env:
      TROVE_SBOM_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      # The tag becomes the version of the image and, below, of the charts: it must be a plain x.y.z (the text is not echoed).
      - name: Check the release tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the release tag is not vX.Y.Z"; exit 1; }

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # The SBOM generator (below) is served from a registry container on a docker network of this run. The builder runs on
      # that network, so it reaches the registry by its name, and no build step of the image shares the runner's network
      # namespace. The registry speaks plain HTTP, allowed for that one host.
      - name: Create the docker network of the SBOM generator
        id: sbom_net
        run: |
          set -euo pipefail
          echo "network=$(tools/sbom-generator/registry.sh network)" >> "$GITHUB_OUTPUT"
          echo "host=$(tools/sbom-generator/registry.sh host)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: network=${{ steps.sbom_net.outputs.network }}
          buildkitd-config-inline: |
            [registry."${{ steps.sbom_net.outputs.host }}"]
              http = true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Docker meta
        id: tag_names
        uses: docker/metadata-action@v6
        with:
          images: |
            guidedtraffic/trove
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
          labels: |
            org.opencontainers.image.title=trove
            org.opencontainers.image.description=trove, an artifact repository manager for package formats
            org.opencontainers.image.vendor=Guided Traffic
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.documentation=https://github.com/guided-traffic/trove
            org.opencontainers.image.source=https://github.com/guided-traffic/trove

      # The build arguments read the same pins as the Makefile: the Go line of go.mod, web/.nvmrc for the
      # Node.js of the web stage, and tools/versions.env for the base image.
      - name: Name the toolchain pins of the build
        id: pins
        run: |
          set -euo pipefail
          echo "go=$(awk '$1=="go"{print $2}' go.mod)" >> "$GITHUB_OUTPUT"
          echo "node=$(tr -d '[:space:]' < web/.nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Extract version without v prefix
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Extracted version: ${VERSION}"

      # The build date is the commit's date, not the clock's, so that the same tag gives the same binary.
      - name: Get the commit date
        id: time
        run: echo "date=$(date -u -d "@$(git log -1 --format=%ct HEAD)" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # The SBOM attestation of the image comes from a BuildKit generator that runs the pinned syft (SYFT_IMAGE, the version
      # that writes the SPDX file of the release below), not from the scanner that BuildKit bundles, which carries its own
      # syft (Q-HA-166). The generator is built here for both platforms, pushed to the registry of this run and referenced by
      # its digest; it is not published. tools/sbom-generator/check-pins.sh (make versions-check) keeps the version in one
      # place, and the job sbom-generator of Test and Release builds the generator and a test image before any release.
      - name: Build the SBOM generator at the syft pin
        id: sbom_generator
        run: |
          set -euo pipefail
          image="$(tools/sbom-generator/registry.sh up)"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        id: build
        with:
          file: Containerfile
          context: .
          build-args: |
            NODE_VERSION=${{ steps.pins.outputs.node }}
            GO_VERSION=${{ steps.pins.outputs.go }}
            RUNTIME_BASE_IMAGE=${{ env.RUNTIME_BASE_IMAGE }}
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.time.outputs.date }}
          # Both architectures are cross-compiled by the Go stage of the Containerfile: no emulation.
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.tag_names.outputs.labels }}
          # Security features for better Docker Hub score
          provenance: true
          sbom: generator=${{ steps.sbom_generator.outputs.image }}
          # Pushed by digest and without a tag: no tag moves before the SBOM attestations are asserted (the next steps).
          outputs: type=image,name=guidedtraffic/trove,push-by-digest=true,name-canonical=true,push=true,annotation-index.org.opencontainers.image.description=trove

      # The builder is on the run's network, which can only be removed after it.
      - name: Remove the SBOM generator registry, its builder and its network
        if: always()
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          docker buildx rm -f "$BUILDER" || true
          tools/sbom-generator/registry.sh down

      # BuildKit writes the attestations with the image, so they can be read only after the push. The image is pushed by digest
      # without a tag: a failure here moves no tag, and release-helm-gh (needs: build) publishes no chart. The pre-release
      # check of Test and Release (job sbom-generator) is what keeps this from happening on a release.
      - name: The SBOM attestations name the pinned syft
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::the build step wrote no image digest"; exit 1; }
          tools/sbom-generator/creators.sh image "guidedtraffic/trove@${DIGEST}"

      # The tags of docker/metadata-action (version, major.minor, major, sha, and latest on main) point at the index that was
      # asserted. imagetools create adds them to that index as it is: the attestation manifests are part of it, and the tags
      # resolve to the same digest.
      - name: Tag the asserted image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.tag_names.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -z "$tag" ] || args+=(-t "$tag")
          done <<< "$TAGS"
          [ "${#args[@]}" -gt 0 ] || { echo "::error::docker/metadata-action wrote no tag"; exit 1; }
          docker buildx imagetools create "${args[@]}" "guidedtraffic/trove@${DIGEST}"
          docker buildx imagetools inspect "guidedtraffic/trove:${GITHUB_REF_NAME#v}" --format '{{ json .Manifest }}' | jq -e --arg d "$DIGEST" '.digest == $d' >/dev/null \
            || { echo "::error::the version tag does not resolve to the asserted digest"; exit 1; }

      - name: Generate and upload SBOM
        uses: anchore/sbom-action@v0
        with:
          image: guidedtraffic/trove:${{ steps.version.outputs.version }}
          format: spdx-json
          syft-version: ${{ env.SYFT_VERSION }}
          # Into the workspace, where the next step picks it up; without it the action writes to a temporary directory.
          output-file: ${{ github.workspace }}/guidedtraffic-trove_${{ steps.version.outputs.version }}.spdx.json
          upload-artifact: true
          upload-release-assets: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SBOM to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ github.workspace }}/guidedtraffic-trove_*.spdx.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Scout scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: guidedtraffic/trove:${{ steps.version.outputs.version }}
          sarif-file: scout-report.sarif
          summary: true
          dockerhub-user: guidedtraffic
          dockerhub-password: ${{ secrets.DOCKERHUB_PAT }}

  release-helm-gh:
    name: Release Helm Chart to GitHub Pages
    needs: build
    # Publishes: release events only (a dispatch runs the check alone).
    if: github.event_name == 'release'
    runs-on: self-hosted
    # The gh-pages branch is pushed with git. contents: write is what the push needs; pages: write stays as the workflow always had it,
    # because dropping it gains no least privilege and whether the Pages build runs for a GITHUB_TOKEN push is not verified here.
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      # Update the chart version and the app version of both charts to the release (R-ARCH-025, R-BAS-045),
      # and the image tag in the values.yaml of the chart trove (the only line that starts with two spaces
      # and "tag:", see test/chart/image_test.go). The chart trove-bastion keeps image.tag empty, which
      # means its appVersion.
      - name: Update Chart Versions
        id: version
        run: |
          set -euo pipefail
          # The tag is a plain vX.Y.Z before it reaches sed
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the release tag is not vX.Y.Z"; exit 1; }
          # Extract the version from the release tag (without the 'v' prefix)
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Update the chart version and the app version of both charts
          for chart in trove trove-bastion; do
            sed -i "s/^version:.*$/version: ${VERSION}/" "deploy/helm/${chart}/Chart.yaml"
            sed -i "s/^appVersion:.*$/appVersion: \"${VERSION}\"/" "deploy/helm/${chart}/Chart.yaml"
          done
          # Update the image tag in values.yaml
          sed -i "s/^  tag:.*$/  tag: \"${VERSION}\"/" deploy/helm/trove/values.yaml

      - name: Create Helm Packages
        run: |
          cd deploy/helm
          helm package trove/ trove-bastion/
          mkdir -p repo
          mv ./*.tgz repo/
          # Create a temporary index for the new charts
          helm repo index repo/ --url https://guided-traffic.github.io/trove/
          cd ../..

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Save Chart Package
        run: |
          mkdir -p /tmp/helm-charts
          cp -r deploy/helm/repo/* /tmp/helm-charts/

      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Pages
        run: |
          # Copy the new charts into the root directory
          cp /tmp/helm-charts/*.tgz .

          # Merge with the existing index.yaml, if there is one
          if [ -f index.yaml ]; then
            # Create a temporary directory for the merge
            mkdir -p temp-repo
            cp ./*.tgz temp-repo/
            # Merge with the existing index
            helm repo index temp-repo/ --url https://guided-traffic.github.io/trove/ --merge index.yaml
            cp temp-repo/index.yaml .
            rm -rf temp-repo
          else
            # Create a new index if none exists
            helm repo index . --url https://guided-traffic.github.io/trove/
          fi

          git add --force ./*.tgz index.yaml
          git commit -m "Release Helm chart for $GITHUB_REF_NAME"
          git push --force origin gh-pages

      # The working directory is the gh-pages checkout, which holds every chart ever published: a *.tgz
      # glob here would attach the whole chart history to each release. Only this release's package
      # belongs on it. index.yaml is the full repository index and stays as a restorable snapshot.
      - name: Update Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            trove-${{ steps.version.outputs.version }}.tgz
            trove-bastion-${{ steps.version.outputs.version }}.tgz
            index.yaml
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The post-release check of E5.8 (R-HA-047, Q-HA-163 to Q-HA-165, docs/developer/releasing.md#the-post-release-check): the
  # artifacts as an installer gets them. On a release it runs after both publish jobs; on a dispatch it runs alone. A red
  # result leaves the release published (Q-HA-163): each step is named by the case it decides, and a re-run of the
  # failed job (`gh run rerun <id> --failed`) covers an infrastructure fault. It is a kind leg, hence `large`
  # (docs/developer/releasing.md#ci); the port (8101) differs from the ports of the jobs in release.yml so that runs can share a host.
  smoke-published:
    name: Smoke the published release (E5.8)
    needs: [build, release-helm-gh]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.build.result == 'success' && needs.release-helm-gh.result == 'success')) }}
    runs-on: large
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      TROVE_DEV_CLUSTER: trove-smoke-${{ github.run_id }}
      TROVE_DEV_HTTP_PORT: "8101"
    steps:
      # The version comes from the release's tag or from the dispatch input. The input reaches the shell through the
      # environment only, never through the text of a command, and must be a plain x.y.z before anything uses it.
      - name: Name the release to check
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "release" ]; then raw="$REF_NAME"; else raw="$INPUT_VERSION"; fi
          [[ "$raw" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the version must look like 0.25.0 (the input is not echoed)"; exit 1; }
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"
          echo "Release to check: ${raw#v}"

      # A release checks out its tag. A dispatch checks out the ref it was started on: the harness and the dev profile come from
      # that ref and the chart and image from the release named by the input, so a dispatch on main checks an older release
      # with today's harness.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential jq

      - name: Install the pinned helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the pinned kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install the pinned kind
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: ${{ env.BUILDX_VERSION }}

      # The login also gives the nodes a pull secret for the trove image (deploy/dev/up.sh, published mode).
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: The runner architecture and the dev profile's chart repositories
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::the dev profile needs an amd64 runner (or qemu), got $(uname -m)"; exit 1; }
          kind version
          kubectl version --client
          helm version --short
          for u in https://haproxy-ingress.github.io/charts https://charts.jetstack.io https://guided-traffic.github.io/valkey-operator https://guided-traffic.github.io/internal-secrets-operator https://cloudnative-pg.github.io/charts; do
            curl -fsSL --retry 3 -o /dev/null "$u/index.yaml" || { echo "::error::chart repository $u is not reachable"; exit 1; }
          done

      # Cases decided here: release not found, chart not published (the wait for GitHub Pages ran out), chart package differs
      # from the index, image not published, attestation missing, release asset missing.
      - name: Verify the published artifacts (release, chart, image, attestations)
        id: verify
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: deploy/dev/step-time.sh verify make release-smoke VERSION="$VERSION"

      # The chart package from the chart repository and the image by the digest from the step above; nothing is built or loaded
      # from the working tree. The scenarios' profile switches run the same script with the same variables.
      - name: Install the published release
        id: install
        timeout-minutes: 25
        env:
          TROVE_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          TROVE_RELEASE_DIGEST: ${{ steps.verify.outputs.digest }}
        run: deploy/dev/step-time.sh install make dev-up

      - name: Run the scenarios against the published install (make e2e SET=release-smoke)
        timeout-minutes: 60
        env:
          TROVE_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          TROVE_RELEASE_DIGEST: ${{ steps.verify.outputs.digest }}
        run: deploy/dev/step-time.sh scenarios make e2e SET=release-smoke

      # Red when a scenario's profile switch replaced the published release with something else (case: wrong image in the cluster).
      # It runs when the install succeeded, also after red scenarios: those may be red for exactly that reason.
      - name: Check that every pod runs the published digest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          TROVE_RELEASE_DIGEST: ${{ steps.verify.outputs.digest }}
        run: deploy/dev/step-time.sh guard make release-smoke-guard

      - name: Summarise the wall time of the steps
        if: always()
        run: |
          set -uo pipefail
          times=.out/release-smoke/times.tsv
          [ -s "$times" ] || exit 0
          {
            echo "### Wall time"
            echo
            echo "| Step | Seconds | Exit code |"
            echo "|---|---|---|"
            awk -F'\t' '{printf "| %s | %s | %s |\n", $1, $2, $3}' "$times"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarise the matrix per gate row
        if: always()
        run: |
          set -uo pipefail
          report=.out/e2e/npm-matrix.json
          [ -s "$report" ] || { echo "No matrix report was written." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          {
            echo "### Matrix of E2.1 per gate row"
            echo
            echo "| Row | Passed | Failed | Not applicable |"
            echo "|---|---|---|---|"
            jq -r 'group_by(.row)[] | "| \(.[0].row) | \(map(select(.outcome=="passed"))|length) | \(map(select(.outcome=="failed"))|length) | \(map(select(.outcome=="not applicable"))|length) |"' "$report"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the go test -json report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-smoke-report
          path: .out/test-e2e.json
          if-no-files-found: warn
          retention-days: 90

      # 90 days: the walkthrough that closes E5.8 reads this evidence weeks later.
      - name: Upload the matrix report, the client logs and the evidence of the verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-smoke-artifacts
          path: |
            .out/e2e/
            .out/release-smoke/
          if-no-files-found: warn
          retention-days: 90

      - name: Cluster state (failure only)
        if: failure()
        run: |
          set -u
          ctx="kind-${TROVE_DEV_CLUSTER}"
          mkdir -p .out/cluster-state
          for ns in trove ingress-controller cert-manager valkey-operator-system internal-secrets-operator-system cnpg-system kube-system; do
            kubectl --context "$ctx" -n "$ns" get pods -o wide > ".out/cluster-state/pods-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" describe pods > ".out/cluster-state/describe-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" get events --sort-by=.lastTimestamp > ".out/cluster-state/events-$ns.txt" 2>&1 || true
          done
          deploy/dev/cluster-logs.sh .out/cluster-state
          kubectl --context "$ctx" get nodes -o wide > .out/cluster-state/nodes.txt 2>&1 || true
          helm --kube-context "$ctx" -n trove status trove > .out/cluster-state/helm-status.txt 2>&1 || true
          docker ps -a > .out/cluster-state/docker-ps.txt 2>&1 || true
          cp -r .dev/logs .out/cluster-state/dev-logs 2>/dev/null || true

      - name: Upload the cluster state (failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-smoke-cluster-state
          path: .out/cluster-state/
          if-no-files-found: warn
          retention-days: 90

      - name: make dev-down
        if: always()
        run: make dev-down
