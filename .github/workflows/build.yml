# Release Docker & Helm: runs on every published release (semantic-release publishes it on main, see
# release.yml). The release's tag is the version: the image guidedtraffic/trove (Docker Hub) for
# linux/amd64 and linux/arm64, built from the Containerfile, and the Helm charts trove and trove-bastion in the
# gh-pages branch (the chart repository https://guided-traffic.github.io/trove/) with the release's assets.
# docs/developer/releasing.md (The release pipeline) describes the jobs and the secrets.
name: Release Docker & Helm

on:
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# No token permission beyond reading by default; each job asks for what it uses (docs/security/data-and-secret-flow.md).
permissions:
  contents: read

jobs:
  build:
    name: Build Docker Image
    # Publishes: release events only (a dispatch runs the check alone).
    runs-on: self-hosted
    # contents: write for the release assets (softprops/action-gh-release uploads the SPDX file).
    # Nothing else of the token is used: no OIDC token, no attestation API, no pages.
    permissions:
      contents: write
    env:
      TROVE_SBOM_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      # The tag becomes the version of the image and, below, of the charts: it must be a plain x.y.z (the text is not echoed).
      - name: Check the release tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the release tag is not vX.Y.Z"; exit 1; }

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # The SBOM generator (below) is served from a registry container of this run on Docker's default bridge network, reached
      # by its IP. The builder stays on the default bridge network too, with no network option: a builder on a user-defined
      # network resolves names through 127.0.0.11, which the network namespaces of BuildKit's RUN steps cannot use (release
      # v0.25.1, run 42433259845: `go mod download` could not resolve proxy.golang.org). The registry speaks plain HTTP,
      # allowed for that one address.
      - name: Start the registry of the SBOM generator
        id: sbom_net
        run: |
          set -euo pipefail
          host="$(tools/sbom-generator/registry.sh start)"
          echo "host=${host}" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Docker Buildx
        timeout-minutes: 16
        uses: ./.github/actions/install-buildx
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false
          buildkitd-config-inline: |
            [registry."${{ steps.sbom_net.outputs.host }}"]
              http = true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Docker meta
        id: tag_names
        uses: docker/metadata-action@v6
        with:
          images: |
            guidedtraffic/trove
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
          labels: |
            org.opencontainers.image.title=trove
            org.opencontainers.image.description=trove, an artifact repository manager for package formats
            org.opencontainers.image.vendor=Guided Traffic
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.documentation=https://github.com/guided-traffic/trove
            org.opencontainers.image.source=https://github.com/guided-traffic/trove

      # The build arguments read the same pins as the Makefile: the Go line of go.mod, web/.nvmrc for the
      # Node.js of the web stage, and tools/versions.env for the base image.
      - name: Name the toolchain pins of the build
        id: pins
        run: |
          set -euo pipefail
          echo "go=$(awk '$1=="go"{print $2}' go.mod)" >> "$GITHUB_OUTPUT"
          echo "node=$(tr -d '[:space:]' < web/.nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Extract version without v prefix
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Extracted version: ${VERSION}"

      # The build date is the commit's date, not the clock's, so that the same tag gives the same binary.
      - name: Get the commit date
        id: time
        run: echo "date=$(date -u -d "@$(git log -1 --format=%ct HEAD)" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # The SBOM attestation of the image comes from a BuildKit generator that runs the pinned syft (SYFT_IMAGE, the version
      # that writes the SPDX file of the release below), not from the scanner that BuildKit bundles, which carries its own
      # syft (Q-HA-166). The generator is built here for both platforms, pushed to the registry of this run and referenced by
      # its digest; it is not published. tools/sbom-generator/check-pins.sh (make versions-check) keeps the version in one
      # place, and the job sbom-generator of Test and Release builds the generator and a test image before any release.
      - name: Build the SBOM generator at the syft pin
        id: sbom_generator
        run: |
          set -euo pipefail
          image="$(tools/sbom-generator/registry.sh up)"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        id: build
        with:
          file: Containerfile
          context: .
          build-args: |
            NODE_VERSION=${{ steps.pins.outputs.node }}
            GO_VERSION=${{ steps.pins.outputs.go }}
            RUNTIME_BASE_IMAGE=${{ env.RUNTIME_BASE_IMAGE }}
            TRIVY_VERSION=${{ env.TRIVY_VERSION }}
            TRIVY_SHA256_LINUX_AMD64=${{ env.TRIVY_SHA256_LINUX_AMD64 }}
            TRIVY_SHA256_LINUX_ARM64=${{ env.TRIVY_SHA256_LINUX_ARM64 }}
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.time.outputs.date }}
          # Both architectures are cross-compiled by the Go stage of the Containerfile: no emulation.
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.tag_names.outputs.labels }}
          # Security features for better Docker Hub score
          provenance: true
          sbom: generator=${{ steps.sbom_generator.outputs.image }}
          # Pushed by digest and without a tag: no tag moves before the SBOM attestations are asserted (the next steps).
          outputs: type=image,name=guidedtraffic/trove,push-by-digest=true,name-canonical=true,push=true,annotation-index.org.opencontainers.image.description=trove

      - name: Remove the SBOM generator registry
        if: always()
        run: tools/sbom-generator/registry.sh down

      # BuildKit writes the attestations with the image, so they can be read only after the push. The image is pushed by digest
      # without a tag: a failure here moves no tag, and release-helm-gh (needs: build) publishes no chart. The pre-release
      # check of Test and Release (job sbom-generator) is what keeps this from happening on a release.
      - name: The SBOM attestations name the pinned syft
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::the build step wrote no image digest"; exit 1; }
          tools/sbom-generator/creators.sh image "guidedtraffic/trove@${DIGEST}"

      # The tags of docker/metadata-action (version, major.minor, major, sha, and latest on main) point at the index that was
      # asserted. imagetools create adds them to that index as it is: the attestation manifests are part of it, and the tags
      # resolve to the same digest.
      - name: Tag the asserted image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.tag_names.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -z "$tag" ] || args+=(-t "$tag")
          done <<< "$TAGS"
          [ "${#args[@]}" -gt 0 ] || { echo "::error::docker/metadata-action wrote no tag"; exit 1; }
          docker buildx imagetools create "${args[@]}" "guidedtraffic/trove@${DIGEST}"
          docker buildx imagetools inspect "guidedtraffic/trove:${GITHUB_REF_NAME#v}" --format '{{ json .Manifest }}' | jq -e --arg d "$DIGEST" '.digest == $d' >/dev/null \
            || { echo "::error::the version tag does not resolve to the asserted digest"; exit 1; }

      # The SPDX file of the release is written by the pinned syft image (SYFT_IMAGE, the same version as the attestation above,
      # Q-HA-204). The image is read from the registry by the tag asserted above (`registry:` keeps syft off the runner's Docker
      # daemon), and nothing is downloaded from GitHub at release time (F-120). The output is the file of the former
      # step that wrapped the syft CLI: spdx-json, same name, same place for the upload below.
      - name: Generate the SPDX SBOM at the syft pin
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/guidedtraffic-trove_${VERSION}.spdx.json"
          docker run --rm "${SYFT_IMAGE}" "registry:guidedtraffic/trove:${VERSION}" -o spdx-json > "$out"
          test -s "$out"

      - name: Upload the SPDX SBOM as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: guidedtraffic-trove_${{ steps.version.outputs.version }}.spdx.json
          path: ${{ github.workspace }}/guidedtraffic-trove_${{ steps.version.outputs.version }}.spdx.json
          if-no-files-found: error

      - name: Upload SBOM to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ github.workspace }}/guidedtraffic-trove_*.spdx.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Scout scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: guidedtraffic/trove:${{ steps.version.outputs.version }}
          sarif-file: scout-report.sarif
          summary: true
          dockerhub-user: guidedtraffic
          dockerhub-password: ${{ secrets.DOCKERHUB_PAT }}

  release-helm-gh:
    name: Release Helm Chart to GitHub Pages
    needs: build
    # Publishes: release events only (a dispatch runs the check alone).
    runs-on: self-hosted
    # The gh-pages branch is pushed with git. contents: write is what the push needs; pages: write stays as the workflow always had it,
    # because dropping it gains no least privilege and whether the Pages build runs for a GITHUB_TOKEN push is not verified here.
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      # Update the chart version and the app version of both charts to the release (R-ARCH-025, R-BAS-045),
      # and the image tag in the values.yaml of the chart trove (the only line that starts with two spaces
      # and "tag:", see test/chart/image_test.go). The chart trove-bastion keeps image.tag empty, which
      # means its appVersion.
      - name: Update Chart Versions
        id: version
        run: |
          set -euo pipefail
          # The tag is a plain vX.Y.Z before it reaches sed
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the release tag is not vX.Y.Z"; exit 1; }
          # Extract the version from the release tag (without the 'v' prefix)
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Update the chart version and the app version of both charts
          for chart in trove trove-bastion; do
            sed -i "s/^version:.*$/version: ${VERSION}/" "deploy/helm/${chart}/Chart.yaml"
            sed -i "s/^appVersion:.*$/appVersion: \"${VERSION}\"/" "deploy/helm/${chart}/Chart.yaml"
          done
          # Update the image tag in values.yaml
          sed -i "s/^  tag:.*$/  tag: \"${VERSION}\"/" deploy/helm/trove/values.yaml

      - name: Create Helm Packages
        run: |
          cd deploy/helm
          helm package trove/ trove-bastion/
          mkdir -p repo
          mv ./*.tgz repo/
          # Create a temporary index for the new charts
          helm repo index repo/ --url https://guided-traffic.github.io/trove/
          cd ../..

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Save Chart Package
        run: |
          mkdir -p /tmp/helm-charts
          cp -r deploy/helm/repo/* /tmp/helm-charts/

      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Pages
        run: |
          # Copy the new charts into the root directory
          cp /tmp/helm-charts/*.tgz .

          # Merge with the existing index.yaml, if there is one
          if [ -f index.yaml ]; then
            # Create a temporary directory for the merge
            mkdir -p temp-repo
            cp ./*.tgz temp-repo/
            # Merge with the existing index
            helm repo index temp-repo/ --url https://guided-traffic.github.io/trove/ --merge index.yaml
            cp temp-repo/index.yaml .
            rm -rf temp-repo
          else
            # Create a new index if none exists
            helm repo index . --url https://guided-traffic.github.io/trove/
          fi

          git add --force ./*.tgz index.yaml
          git commit -m "Release Helm chart for $GITHUB_REF_NAME"
          git push --force origin gh-pages

      # The working directory is the gh-pages checkout, which holds every chart ever published: a *.tgz
      # glob here would attach the whole chart history to each release. Only this release's package
      # belongs on it. index.yaml is the full repository index and stays as a restorable snapshot.
      - name: Update Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            trove-${{ steps.version.outputs.version }}.tgz
            trove-bastion-${{ steps.version.outputs.version }}.tgz
            index.yaml
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
