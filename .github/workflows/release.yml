  # >>> T16 e2e-oci
  # The OCI acceptance suite (R-OCI-035, T-16 WP11) on a kind cluster: the Docker Engine with Buildx and Podman in privileged client pods of the
  # namespace trove-e2e-clients (Q-OCI-21), against the scatter profile and the counting OCI test upstream (docs/developer/e2e.md#the-oci-tests).
