# Release pipeline of v0.* tags (R-HA-047, Q-HA-11). Publishes the multi-architecture image and the
# Helm chart to ghcr.io/guided-traffic, signs both keyless with cosign from this workflow's GitHub OIDC
# identity, attests the image's SBOM and the provenance of both, verifies all of it, and writes the
# digests and the verify commands into the notes of the GitHub release of the tag. docs/developer/ci.md
# (Release pipeline) describes the pipeline, the identity and the recovery.
#
# The source is the tag. The release tooling (.github, Makefile, Dockerfile, tools/versions.env) is
# taken from the commit this run started on, which is main for a manual run and the tag itself for a
# tag push. That lets a tag that predates the tooling be published; see the jobs' "Take the release
# tooling" steps.
name: release

on:
  push:
    tags: ["v0.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v0.MINOR.PATCH tag to publish, for example v0.1.0. The run builds this tag's source."
        required: true
        type: string
      overwrite:
        description: "Replace the versions that already exist in ghcr.io (a re-publish after a partial failure). Off: an existing version stops the run before anything is pushed."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CHART_REPOSITORY: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  resolve:
    name: resolve the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read   # the ci runs of the tagged commit
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      overwrite: ${{ steps.tag.outputs.overwrite }}
      commit: ${{ steps.commit.outputs.commit }}
      date: ${{ steps.commit.outputs.date }}
    steps:
      - name: Name the tag and check its form
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_OVERWRITE: ${{ inputs.overwrite }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then tag="$GITHUB_REF_NAME"; else tag="$INPUT_TAG"; fi
          # The binary accepts only major.minor.patch versions, so a pre-release tag cannot be built.
          if ! [[ "$tag" =~ ^v0\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$tag is not a v0.MINOR.PATCH tag"
            exit 1
          fi
          # The signature identity names the branch of a manual run, so only main may start one.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::a manual run must be dispatched from main, not $GITHUB_REF"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "overwrite=${INPUT_OVERWRITE:-false}"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Name the commit and its build date
        id: commit
        run: |
          set -euo pipefail
          # The build date is the commit's date, not the clock's, so that the same tag gives the same binary.
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "date=$(date -u -d "@$(git log -1 --format=%ct HEAD)" +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the release tooling of this run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          persist-credentials: false
      - name: Take the release tooling, keep the tag's source
        run: |
          set -euo pipefail
          for p in .github Makefile Dockerfile tools; do
            rm -rf "$p"
            cp -R ".release-tooling/$p" "$p"
          done
      - uses: ./.github/actions/load-pins
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the pinned gh
        uses: ./.github/actions/install-gh

      - name: The commit passed ci
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          set -euo pipefail
          # A release is built only from a commit whose ci run passed. preview.yml applies the same rule to main.
          passed="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$COMMIT" --status success --json databaseId --jq 'length')"
          if [ "$passed" -lt 1 ]; then
            echo "::error::no successful ci run of $COMMIT"
            exit 1
          fi
          echo "$passed successful ci run(s) of $COMMIT"

      - name: The GitHub release of the tag exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # The notes are written last. Checking now keeps a run from publishing a version it cannot annotate.
          if ! out="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1)"; then
            echo "$out" >&2
            echo "::error::there is no GitHub release for $TAG; create it (a prerelease is fine) and run this workflow again"
            exit 1
          fi

  versions:
    name: versions (E0.2)
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          persist-credentials: false
      - name: Take the release tooling, keep the tag's source
        run: |
          set -euo pipefail
          for p in .github Makefile Dockerfile tools; do
            rm -rf "$p"
            cp -R ".release-tooling/$p" "$p"
          done
      - uses: ./.github/actions/load-pins
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: Install the pinned helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install the pinned cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: The installed tools are the pins
        run: |
          set -euo pipefail
          test "$(helm version --template '{{.Version}}')" = "$HELM_VERSION"
          cosign_have="$(cosign version 2>/dev/null | sed -n 's/^GitVersion: *//p')"
          if [ "$cosign_have" != "$COSIGN_VERSION" ]; then
            echo "::error::cosign $cosign_have is on PATH, tools/versions.env pins $COSIGN_VERSION"
            exit 1
          fi
          want="v$(tr -d '[:space:]' < web/.nvmrc)"
          have="$(node --version)"
          if [ "$have" != "$want" ]; then
            echo "::error::node $have is on PATH, web/.nvmrc pins $want"
            exit 1
          fi
          echo "go $(go env GOVERSION), node $have, helm $HELM_VERSION, cosign $cosign_have"
      - name: One version per tool (go, sqlc, oapi-codegen, golangci-lint)
        run: make versions-check

  image:
    name: image (linux/amd64, linux/arm64)
    needs: [resolve, versions]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write       # push the image to ghcr.io
      id-token: write       # keyless signatures and attestations
      attestations: write   # the provenance attestation, stored in the registry
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      COMMIT: ${{ needs.resolve.outputs.commit }}
      DATE: ${{ needs.resolve.outputs.date }}
      OVERWRITE: ${{ needs.resolve.outputs.overwrite }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          persist-credentials: false
      - name: Take the release tooling, keep the tag's source
        run: |
          set -euo pipefail
          for p in .github Makefile Dockerfile tools; do
            rm -rf "$p"
            cp -R ".release-tooling/$p" "$p"
          done
      - uses: ./.github/actions/load-pins
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the pinned gh
        uses: ./.github/actions/install-gh
      - name: Install the pinned buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a published version
        run: |
          set -euo pipefail
          # Login comes first: an anonymous request to a private package answers like a missing one.
          if out="$(docker manifest inspect "$IMAGE:$VERSION" 2>&1)"; then
            if [ "$OVERWRITE" != true ]; then
              echo "::error::$IMAGE:$VERSION exists; run again with the overwrite input set, or publish a new version"
              exit 1
            fi
            echo "::warning::$IMAGE:$VERSION exists and is replaced (overwrite is set)"
          elif grep -qE 'manifest unknown|not found' <<<"$out"; then
            echo "$IMAGE:$VERSION is not published yet"
          else
            echo "$out" >&2
            echo "::error::cannot tell whether $IMAGE:$VERSION exists"
            exit 1
          fi
      - name: Build the binaries and push the image (make image-push)
        id: image
        run: |
          set -euo pipefail
          # image-push builds the Angular bundle (make web), both binaries, and the distroless image of both.
          make image-push IMAGE_TAGS="$IMAGE:$VERSION" VERSION="$VERSION" COMMIT="$COMMIT" DATE="$DATE"
          digest="$(jq -r '."containerimage.digest"' .out/image-metadata.json)"
          if ! [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no image digest in the buildx metadata"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Image: \`$IMAGE@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - name: The binaries report the tag and embed the Angular build
        run: |
          set -euo pipefail
          have="$(bin/trove-linux-amd64 version)"
          echo "$have"
          if [[ "$have" != "trove $VERSION (commit $COMMIT, built $DATE, "* ]]; then
            echo "::error::bin/trove-linux-amd64 reports: $have"
            exit 1
          fi
          # Every asset that the English index refers to is in both binaries (R-ARCH-004).
          assets="$(grep -oE '(src|href)="[^"]+\.(js|css)"' internal/webui/dist/en/index.html | sed -E 's/^[a-z]+="//; s/"$//; s#.*/##' | sort -u)"
          if [ -z "$assets" ]; then
            echo "::error::internal/webui/dist/en/index.html names no asset"
            exit 1
          fi
          for arch in amd64 arm64; do
            modinfo="$(go version -m "bin/trove-linux-$arch")"
            if ! grep -q "GOARCH=$arch" <<<"$modinfo"; then
              echo "::error::bin/trove-linux-$arch is not a $arch binary"
              exit 1
            fi
            for asset in $assets; do
              grep -aqF "$asset" "bin/trove-linux-$arch" || { echo "::error::$asset is not embedded in bin/trove-linux-$arch"; exit 1; }
            done
          done
          echo "embedded: $(tr '\n' ' ' <<<"$assets")"
      - name: The pushed index has both platforms
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          platforms="$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" | jq -r '.manifests[].platform | select(. != null) | "\(.os)/\(.architecture)"' | sort -u)"
          for want in linux/amd64 linux/arm64; do
            if ! grep -qx "$want" <<<"$platforms"; then
              echo "::error::$want is missing from the index $DIGEST"
              exit 1
            fi
          done
          echo "$platforms"
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Install the pinned syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - name: Generate the SPDX SBOM and attest it (keyless)
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          "$SYFT" "$IMAGE@$DIGEST" -o spdx-json=sbom.spdx.json
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@$DIGEST"
      - name: Attest the build provenance (SLSA, pushed to ghcr.io)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Verify the signature, the SBOM attestation and the provenance
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          ref="$IMAGE@$DIGEST"
          identity="https://github.com/$GITHUB_WORKFLOW_REF"
          issuer=https://token.actions.githubusercontent.com
          cosign verify "$ref" --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" >/dev/null
          cosign verify-attestation --type spdxjson "$ref" --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" >/dev/null
          gh attestation verify "oci://$ref" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "verified $ref against $identity"
      - name: Keep the SBOM and the build metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image
          path: |
            sbom.spdx.json
            .out/image-metadata.json
          if-no-files-found: warn
          retention-days: 90

  chart:
    name: chart
    needs: [resolve, versions]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write       # push the chart to ghcr.io
      id-token: write       # keyless signatures and attestations
      attestations: write   # the provenance attestation, stored in the registry
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      OVERWRITE: ${{ needs.resolve.outputs.overwrite }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      digest: ${{ steps.chart.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          persist-credentials: false
      - name: Take the release tooling, keep the tag's source
        run: |
          set -euo pipefail
          for p in .github Makefile Dockerfile tools; do
            rm -rf "$p"
            cp -R ".release-tooling/$p" "$p"
          done
      - uses: ./.github/actions/load-pins
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the pinned gh
        uses: ./.github/actions/install-gh
      - name: Install the pinned helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install the pinned cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Log in to ghcr.io (helm)
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Refuse to overwrite a published version
        run: |
          set -euo pipefail
          if out="$(helm show chart "oci://$CHART_REPOSITORY/trove" --version "$VERSION" 2>&1)"; then
            if [ "$OVERWRITE" != true ]; then
              echo "::error::oci://$CHART_REPOSITORY/trove:$VERSION exists; run again with the overwrite input set, or publish a new version"
              exit 1
            fi
            echo "::warning::oci://$CHART_REPOSITORY/trove:$VERSION exists and is replaced (overwrite is set)"
          elif grep -qE 'not found|manifest unknown' <<<"$out"; then
            echo "trove $VERSION is not published yet"
          else
            echo "$out" >&2
            echo "::error::cannot tell whether oci://$CHART_REPOSITORY/trove:$VERSION exists"
            exit 1
          fi
      - name: Package the chart at the release version
        run: |
          set -euo pipefail
          # The chart in the repository keeps 0.0.0-dev; only the package carries the release version (R-HA-028).
          helm lint deploy/helm/trove -f deploy/helm/trove/ci/required-only.yaml
          helm package deploy/helm/trove --version "$VERSION" --app-version "$VERSION" --destination "$RUNNER_TEMP/dist"
          tgz="$RUNNER_TEMP/dist/trove-$VERSION.tgz"
          chart_yaml="$(helm show chart "$tgz")"
          grep -qx "version: $VERSION" <<<"$chart_yaml"
          grep -qx "appVersion: $VERSION" <<<"$chart_yaml"
          echo "TGZ=$tgz" >> "$GITHUB_ENV"
      - name: Push the chart
        id: chart
        run: |
          set -euo pipefail
          out="$(helm push "$TGZ" "oci://$CHART_REPOSITORY")"
          echo "$out"
          digest="$(sed -n 's/^Digest: //p' <<<"$out")"
          if ! [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no digest in the helm push output"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Chart: \`oci://$CHART_REPOSITORY/trove:$VERSION\` (\`$digest\`)" >> "$GITHUB_STEP_SUMMARY"
      - name: Sign the chart (keyless)
        env:
          DIGEST: ${{ steps.chart.outputs.digest }}
        run: cosign sign --yes "$CHART_REPOSITORY/trove@$DIGEST"
      - name: Attest the build provenance (SLSA, pushed to ghcr.io)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.CHART_REPOSITORY }}/trove
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true
      - name: Verify the signature and the provenance
        env:
          DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          set -euo pipefail
          ref="$CHART_REPOSITORY/trove@$DIGEST"
          identity="https://github.com/$GITHUB_WORKFLOW_REF"
          issuer=https://token.actions.githubusercontent.com
          cosign verify "$ref" --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" >/dev/null
          gh attestation verify "oci://$ref" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "verified $ref against $identity"
      - name: Keep the chart package
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-chart
          path: ${{ env.TGZ }}
          if-no-files-found: warn
          retention-days: 90

  release-notes:
    name: release notes
    needs: [resolve, image, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # edit the notes of the GitHub release
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      COMMIT: ${{ needs.resolve.outputs.commit }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
      CHART_DIGEST: ${{ needs.chart.outputs.digest }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      IDENTITY: https://github.com/${{ github.workflow_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          persist-credentials: false
      - name: Take the release tooling, keep the tag's source
        run: |
          set -euo pipefail
          for p in .github Makefile Dockerfile tools; do
            rm -rf "$p"
            cp -R ".release-tooling/$p" "$p"
          done
      - uses: ./.github/actions/load-pins
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the pinned gh
        uses: ./.github/actions/install-gh
      - name: Add the published artifacts to the notes of the release
        run: |
          set -euo pipefail
          # The notes keep their text; only the section between the markers of the script is replaced.
          notes="$RUNNER_TEMP/release-notes.md"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
            | .github/scripts/release-notes.sh > "$notes"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          echo "Release notes of $TAG: image \`$IMAGE:$VERSION\` \`$IMAGE_DIGEST\`, chart \`$CHART_REPOSITORY/trove:$VERSION\` \`$CHART_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
