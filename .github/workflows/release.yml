      - name: Upload the Silo server log (failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: silo-server-log
          path: .out/silo.log
          if-no-files-found: warn
          retention-days: 14

  # The failure suite on a kind cluster, two legs: the push set (the M0 checks, the drain with a transfer loop and
  # the exposure of E1.14) and access-long (the E1.1 sign-in, the E1.11 replica scatter and the E1.13 500 MB transfers;
  # the only leg with browser journeys). The failover set (E0.13: PostgreSQL switchover, kill and stop, Valkey failover,
  # kill and outage under k6 load; the E1.8 limits) left this job: it runs nightly and on dispatch in performance.yml
  # (owner, 2026-11-01). The legs build their own image, so they wait for no other job. Each has its own cluster name
  # and edge port, so legs can share a Docker host.
  e2e:
    name: e2e (${{ matrix.set }})
    runs-on: large
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: push
            port: "8080"
          - set: access-long
            port: "8086"
            browser: true
    env:
      # The image is built with an explicit VERSION=dev: the binary refuses a version that is not
      # major.minor.patch or "dev" (see docs/developer/e2e.md). make image builds it into the local Docker.
      TROVE_IMAGE: guidedtraffic/trove:dev
      TROVE_DEV_CLUSTER: trove-${{ matrix.set }}-${{ github.run_id }}
      TROVE_DEV_HTTP_PORT: ${{ matrix.port }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential jq

      - name: Install the pinned helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the pinned kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install the pinned kind
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install the shared library the pinned Node.js loads
        if: matrix.browser
        run: |
          set -euo pipefail
          # Node.js 26 links libatomic.so.1, which the runner image does not ship (Q-ARCH-218).
          sudo apt-get update
          sudo apt-get install -y libatomic1

      - name: Set up Node.js (the Playwright journeys)
        if: matrix.browser
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc

      - name: Install the Playwright journeys and their browser
        if: matrix.browser
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          # The browser build is the one the locked @playwright/test version names: one version per tool.
          # --with-deps installs the system libraries through apt (sudo, as for the build tools above).
          npx playwright install --with-deps chromium

      - name: Install the pinned Docker Buildx
        timeout-minutes: 16
        uses: ./.github/actions/install-buildx
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      - name: Log in to Docker Hub (the dev profile's images)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Tools on the runner
        run: |
          set -euo pipefail
          docker version --format '{{.Server.Version}}'
          kind version
          kubectl version --client
          helm version --short
          jq --version
          nproc
          free -g

      - name: The dev profile's dependency pins and the runner architecture
        run: |
          set -euo pipefail
          # The Valkey operator and the internal-secrets-operator images are published for linux/amd64
          # only (tools/versions.env); the hosted runner is amd64, so no emulation is needed here.
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::the dev profile needs an amd64 runner (or qemu), got $(uname -m)"; exit 1; }
          echo "HAProxy Ingress chart $DEV_HAPROXY_INGRESS_CHART_VERSION, image $DEV_HAPROXY_INGRESS_IMAGE"
          echo "cert-manager chart $DEV_CERT_MANAGER_CHART_VERSION (images pinned by digest)"
          echo "valkey-operator chart $DEV_VALKEY_OPERATOR_CHART_VERSION, internal-secrets-operator chart $DEV_ISO_CHART_VERSION"
          echo "CloudNativePG chart $CNPG_CHART_VERSION"
          # up.sh installs the charts of these repositories; the haproxy-ingress and cloudnative-pg archives are release assets, fetched by make dev-charts. Fail early, not 5 minutes into make dev-up.
          for u in https://charts.jetstack.io https://guided-traffic.github.io/valkey-operator https://guided-traffic.github.io/internal-secrets-operator; do
            curl -fsSL --retry 3 -o /dev/null "$u/index.yaml" || { echo "::error::chart repository $u is not reachable"; exit 1; }
          done

      - name: make image
        run: make image IMAGE="$TROVE_IMAGE" VERSION=dev

      - name: Fetch the dev charts that are GitHub release assets
        timeout-minutes: 16
        env:
          # Read by tools/github-download.sh: sent to github.com only (Q-ARCH-356).
          GITHUB_TOKEN: ${{ github.token }}
        run: make dev-charts

      - name: make dev-up
        timeout-minutes: 25
        run: make dev-up

      - name: make e2e SET=${{ matrix.set }}
        timeout-minutes: 60
        run: make e2e SET=${{ matrix.set }}

      - name: Upload the go test -json report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.set }}
          path: .out/test-e2e.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the k6 logs and summaries, the pod watch, the events and the driver output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-${{ matrix.set }}
          path: .out/e2e/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the Playwright report, traces and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright-${{ matrix.set }}
          path: .out/playwright/
          if-no-files-found: ignore
          retention-days: 14

      - name: Cluster state (failure only)
        if: failure()
        run: |
          set -u
          ctx="kind-${TROVE_DEV_CLUSTER}"
          mkdir -p .out/cluster-state
          kubectl config get-contexts || true
          for ns in trove ingress-controller cert-manager valkey-operator-system internal-secrets-operator-system cnpg-system kube-system; do
            kubectl --context "$ctx" -n "$ns" get pods -o wide > ".out/cluster-state/pods-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" describe pods > ".out/cluster-state/describe-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" get events --sort-by=.lastTimestamp > ".out/cluster-state/events-$ns.txt" 2>&1 || true
          done
          deploy/dev/cluster-logs.sh .out/cluster-state
          kubectl --context "$ctx" get nodes -o wide > .out/cluster-state/nodes.txt 2>&1 || true
          helm --kube-context "$ctx" -n trove status trove > .out/cluster-state/helm-status.txt 2>&1 || true
          docker ps -a > .out/cluster-state/docker-ps.txt 2>&1 || true
          cp -r .dev/logs .out/cluster-state/dev-logs 2>/dev/null || true

      - name: Upload the cluster state (failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-cluster-state-${{ matrix.set }}
          path: .out/cluster-state/
          if-no-files-found: warn
          retention-days: 14

      - name: make dev-down
        if: always()
        run: make dev-down

  # The npm acceptance matrix (R-NPM-045, roadmap M2 E2.1 to E2.12) with the npm side of the remote full mirror (R-REPO-055, R-REPO-059, Q-REPO-306): eight real clients against the scatter profile and the
  # counting test upstream, docs/developer/e2e.md#the-npm-client-matrix. Per change it runs the one leg npm. The legs
  # npm-ha and npm-ha-crash are E2.11 (Q-HA-67: drain variant A, the PostgreSQL-switchover and Valkey-failover scenarios
  # under the npm load, and the pod crash with three force-deletes). They left this job for performance.yml, which runs
  # npm-ha nightly and on dispatch (owner, 2026-11-01). The three-force-delete crash has no CI leg after that and is run
  # by hand (make e2e SET=npm-ha-crash). A dispatch with closing=true (Q-NPM-46) replaces the matrix with the legs of the
  # commit that closes the phase: npm-closing (the scenario list and the cold-cache install with Valkey stopped, and the
  # read-only subset against the public registry) and npm-ha-closing (npm-ha, the 20-minute pod crash and the 5-minute
  # Valkey outage under the npm load). The closing run also runs fuzz-npm, below.
  # The ports differ from the e2e job's (8080, 8086) so that the jobs can share a runner host.
  e2e-npm:
    name: e2e (${{ matrix.set }})
    runs-on: large
    timeout-minutes: ${{ startsWith(matrix.set, 'npm-ha') && 120 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.closing && '[{"set":"npm","port":"8082"},{"set":"npm-closing","port":"8083"},{"set":"npm-ha-closing","port":"8084"}]' || '[{"set":"npm","port":"8082"}]') }}
    env:
      TROVE_IMAGE: guidedtraffic/trove:dev
      TROVE_DEV_CLUSTER: trove-${{ matrix.set }}-${{ github.run_id }}
      TROVE_DEV_HTTP_PORT: ${{ matrix.port }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential jq

      - name: Install the pinned helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the pinned kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install the pinned kind
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The clients run inside the clients image (its own Node.js, test/e2e/clients/Dockerfile), so this job needs no
      # Node.js on the runner and none of the libraries the pinned Node.js loads (Q-ARCH-218).

      - name: Install the pinned Docker Buildx
        timeout-minutes: 16
        uses: ./.github/actions/install-buildx
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      - name: Log in to Docker Hub (the dev profile's images)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: The dev profile's dependency pins and the runner architecture
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::the dev profile needs an amd64 runner (or qemu), got $(uname -m)"; exit 1; }
          echo "kind $KIND_VERSION, kubectl $KUBECTL_VERSION, helm $HELM_VERSION, clients Node image $E2E_CLIENTS_NODE_IMAGE"
          kind version
          kubectl version --client
          helm version --short
          for u in https://charts.jetstack.io https://guided-traffic.github.io/valkey-operator https://guided-traffic.github.io/internal-secrets-operator; do
            curl -fsSL --retry 3 -o /dev/null "$u/index.yaml" || { echo "::error::chart repository $u is not reachable"; exit 1; }
          done

      - name: make image
        run: make image IMAGE="$TROVE_IMAGE" VERSION=dev

      - name: Fetch the dev charts that are GitHub release assets
        timeout-minutes: 16
        env:
          # Read by tools/github-download.sh: sent to github.com only (Q-ARCH-356).
          GITHUB_TOKEN: ${{ github.token }}
        run: make dev-charts

      - name: make dev-up
        timeout-minutes: 25
        run: make dev-up

      - name: make e2e SET=${{ matrix.set }}
        timeout-minutes: ${{ startsWith(matrix.set, 'npm-ha') && 80 || 60 }}
        run: make e2e SET=${{ matrix.set }}

      - name: Upload the go test -json report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-npm-report-${{ matrix.set }}
          path: .out/test-e2e.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the matrix report, the client logs, the test upstream's counters, the load records and k6 logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-npm-artifacts-${{ matrix.set }}
          path: .out/e2e/
          if-no-files-found: warn
          retention-days: 14

      - name: Cluster state (failure only)
        if: failure()
        run: |
          set -u
          ctx="kind-${TROVE_DEV_CLUSTER}"
          mkdir -p .out/cluster-state
          for ns in trove ingress-controller cert-manager valkey-operator-system internal-secrets-operator-system cnpg-system kube-system; do
            kubectl --context "$ctx" -n "$ns" get pods -o wide > ".out/cluster-state/pods-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" describe pods > ".out/cluster-state/describe-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" get events --sort-by=.lastTimestamp > ".out/cluster-state/events-$ns.txt" 2>&1 || true
          done
          deploy/dev/cluster-logs.sh .out/cluster-state
          kubectl --context "$ctx" get nodes -o wide > .out/cluster-state/nodes.txt 2>&1 || true
          helm --kube-context "$ctx" -n trove status trove > .out/cluster-state/helm-status.txt 2>&1 || true
          docker ps -a > .out/cluster-state/docker-ps.txt 2>&1 || true
          cp -r .dev/logs .out/cluster-state/dev-logs 2>/dev/null || true

      - name: Upload the cluster state (failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-npm-cluster-state-${{ matrix.set }}
          path: .out/cluster-state/
          if-no-files-found: warn
          retention-days: 14

      - name: make dev-down
        if: always()
        run: make dev-down

  # The NuGet acceptance suite (R-NUGET-027, roadmap M3 E3.1 to E3.8) on a kind cluster: the .NET 10 SDK and nuget.exe on
  # Mono in the client pods, against the scatter profile and the counting NuGet test upstream (docs/developer/e2e.md#the-nuget-clients).
  # Per change it runs the leg nuget: every TestNuGet... except the closing and HA names (Q-NUGET-34), the NuGet mirror (TestNuGetMirror...) among them. A dispatch with
  # closing=true adds the leg nuget-closing (TestNuGetClosing...). The nightly leg nuget-ha is job e2e-nuget in performance.yml.
  # The ports 8088 to 8090 are the first free ones of both workflows (Q-ARCH-277); the legs differ from the others in cluster name and port.
  e2e-nuget:
    name: e2e (${{ matrix.set }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.closing && '[{"set":"nuget","port":"8088"},{"set":"nuget-closing","port":"8089"}]' || '[{"set":"nuget","port":"8088"}]') }}
    env:
      TROVE_IMAGE: guidedtraffic/trove:dev
