          GITHUB_TOKEN: ${{ github.token }}
        run: make dev-charts

      - name: make dev-up
        timeout-minutes: 25
        run: make dev-up

      - name: make e2e SET=${{ matrix.set }}
        timeout-minutes: 60
        run: make e2e SET=${{ matrix.set }}

      - name: Upload the go test -json report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-nuget-report-${{ matrix.set }}
          path: .out/test-e2e.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the matrix report, the clients image log, the test upstream's counters, the client logs and the k6 logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-nuget-artifacts-${{ matrix.set }}
          path: .out/e2e/
          if-no-files-found: warn
