        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        if: steps.scope.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential jq

      - name: Set up Node.js (the Playwright journeys)
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc

      - name: Install the Playwright journeys and their browser
        if: steps.scope.outputs.run == 'true'
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Install the pinned helm
        if: steps.scope.outputs.run == 'true'
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the pinned kubectl
        if: steps.scope.outputs.run == 'true'
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install the pinned kind
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install the pinned Docker Buildx
        timeout-minutes: 16
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/install-buildx
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Set up Docker Buildx
        if: steps.scope.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      - name: Log in to Docker Hub (the dev profile's images)
        if: steps.scope.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: make npm-clients-image
        if: steps.scope.outputs.run == 'true'
        run: make npm-clients-image

      - name: make nuget-clients-image
        if: steps.scope.outputs.run == 'true'
        run: make nuget-clients-image

      - name: The dev profile's dependency pins and the runner architecture
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::the dev profile needs an amd64 runner (or qemu), got $(uname -m)"; exit 1; }
          echo "kind $KIND_VERSION, kubectl $KUBECTL_VERSION, helm $HELM_VERSION, NuGet SDK $E2E_NUGETCLIENTS_SDK_IMAGE"
          kind version
          kubectl version --client
          helm version --short
          for u in https://charts.jetstack.io https://guided-traffic.github.io/valkey-operator https://guided-traffic.github.io/internal-secrets-operator; do
            curl -fsSL --retry 3 -o /dev/null "$u/index.yaml" || { echo "::error::chart repository $u is not reachable"; exit 1; }
          done

      - name: make image
        if: steps.scope.outputs.run == 'true'
        run: make image IMAGE="$TROVE_IMAGE" VERSION=dev

      - name: Fetch the dev charts that are GitHub release assets
        timeout-minutes: 16
        if: steps.scope.outputs.run == 'true'
        env:
          # Read by tools/github-download.sh: sent to github.com only (Q-ARCH-356).
          GITHUB_TOKEN: ${{ github.token }}
        run: make dev-charts

      - name: make dev-up
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 25
        run: make dev-up

      - name: make e2e SET=${{ matrix.set }}
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 70
        run: make e2e SET=${{ matrix.set }}

      - name: Upload the go test -json report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-vuln-report-${{ matrix.set }}
          path: .out/test-e2e.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the job logs (ci-job-*.log), the clients image logs and the test output
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-vuln-artifacts-${{ matrix.set }}
          path: .out/e2e/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the Playwright report, traces and screenshots
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-vuln-playwright-${{ matrix.set }}
          path: .out/playwright/
          if-no-files-found: ignore
          retention-days: 14

      - name: Cluster state (failure only)
        if: failure() && steps.scope.outputs.run == 'true'
        run: |
          set -u
          ctx="kind-${TROVE_DEV_CLUSTER}"
          mkdir -p .out/cluster-state
          for ns in trove ingress-controller cert-manager valkey-operator-system internal-secrets-operator-system cnpg-system kube-system; do
            kubectl --context "$ctx" -n "$ns" get pods -o wide > ".out/cluster-state/pods-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" describe pods > ".out/cluster-state/describe-$ns.txt" 2>&1 || true
            kubectl --context "$ctx" -n "$ns" get events --sort-by=.lastTimestamp > ".out/cluster-state/events-$ns.txt" 2>&1 || true
          done
          deploy/dev/cluster-logs.sh .out/cluster-state
          kubectl --context "$ctx" get nodes -o wide > .out/cluster-state/nodes.txt 2>&1 || true
          helm --kube-context "$ctx" -n trove status trove > .out/cluster-state/helm-status.txt 2>&1 || true
          docker ps -a > .out/cluster-state/docker-ps.txt 2>&1 || true
          cp -r .dev/logs .out/cluster-state/dev-logs 2>/dev/null || true

      - name: Upload the cluster state (failure only)
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-vuln-cluster-state-${{ matrix.set }}
          path: .out/cluster-state/
          if-no-files-found: warn
          retention-days: 14

      - name: make dev-down
        if: always() && steps.scope.outputs.run == 'true'
        run: make dev-down

  # The 30-minute fuzz run of npm's Match and Inspect (roadmap M2, E2.6), in the full run on the commit that closes the
  # phase only (dispatch with closing=true, Q-NPM-46). Three legs: Match and Inspect with the R-ARCH-028 limits checked
  # on every input, and the classifier's own Match fuzz. A crash fails the leg and uploads the input.
  fuzz-npm:
    name: fuzz npm ${{ matrix.target }} (30 min)
    if: github.event_name == 'workflow_dispatch' && inputs.closing
    runs-on: self-hosted
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzR_ARCH_028_Match, FuzzR_ARCH_028_Inspect, FuzzMatch]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: make fuzz-npm
        run: make fuzz-npm FUZZ=${{ matrix.target }} FUZZTIME=30m

      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-npm-${{ matrix.target }}
          path: internal/formats/npm/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14

  # The 30-minute fuzz runs of the NuGet readers (nupkg, nuspec) and of the version and ID rules (version, id), in the full run on
  # the commit that closes the phase only (dispatch with closing=true; Q-ARCH-278). One leg per target, the six of NUGET_FUZZ_TARGETS
  # in the Makefile, so the legs run side by side and a crash fails its own leg and uploads its input.
  fuzz-nuget:
    name: fuzz nuget ${{ matrix.fuzz }} (30 min)
    if: github.event_name == 'workflow_dispatch' && inputs.closing
    runs-on: self-hosted
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: nupkg
            fuzz: FuzzR_ARCH_028_Inspect
          - pkg: nuspec
            fuzz: FuzzR_NUGET_005_Nuspec
          - pkg: version
            fuzz: FuzzNormalize
          - pkg: version
            fuzz: FuzzCompare
          - pkg: version
            fuzz: FuzzRange
          - pkg: id
            fuzz: FuzzID
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: make fuzz-nuget
        run: make fuzz-nuget NUGET_FUZZ_TARGETS="${{ matrix.pkg }}:${{ matrix.fuzz }}" NUGET_FUZZTIME=30m

      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-nuget-${{ matrix.pkg }}-${{ matrix.fuzz }}
          path: internal/formats/nuget/${{ matrix.pkg }}/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14

  workflows:
    name: workflow files (actionlint)
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install actionlint at the pin
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # shellcheck is not pinned, so its findings are not gated here; the runner image's copy would
      # make the result depend on the image. See docs/developer/releasing.md.
      - name: actionlint
        run: actionlint -shellcheck=

  # R-ARCH-025 and R-ARCH-026: the OpenAPI document has no breaking change, the migration files only add to
  # the latest v0.* release, and no migration that main has committed is changed, removed or renamed (Q-ARCH-283).
  # The baseline is a tag and the history check reads main, so the clone needs the whole history and the tags. It
  # runs on a pull request (the merge commit, with main's history) and on a push to main. The job runs
  # `make compat-check` (docs/developer/releasing.md#compatibility).
  # Switched off until the first stable release (Q-ARCH-340): to switch it on, delete `if: false`, put `compat` back into the needs of
  # semantic-release and drop its ignore line in .github/actionlint.yaml (docs/developer/releasing.md#switched-off-until-the-first-stable-release).
  compat:
    name: compatibility with the latest release
    if: false
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: make compat-check
        run: make compat-check

  # The requirement rules and the committed pages: the generator's -check, and every relative link and anchor.
  coverage:
    name: coverage generator (links and rules)
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Rules and the committed pages
        run: go run ./internal/tools/coverage -check

      - name: Relative links and anchors
        run: go run ./internal/tools/coverage -links

  # The evidence record (docs/developer/coverage.md#how-ci-feeds-it): the generator writes implemented.txt and the pages
  # rendered from it from the test reports of this run, and fails only when the committed list claims a requirement the
  # reports do not prove. Requirements proven for the first time are listed in the job summary; the written files go to
  # Semantic Release, which commits them with the release, so nobody refreshes them by hand. The reports are those of every
  # tier: unit, Angular, chart, integration and the kind legs of this run, and for each kind leg without a report here the newest
  # one of that leg on main, from this workflow or from the nightly (Q-ROAD-11). The job waits for the kind legs, so it ends
  # when they do; Semantic Release waits for them as well.
  coverage-evidence:
    name: coverage evidence (implemented.txt)
    needs: [unit, web, integration, chart, e2e, e2e-npm, e2e-nuget, e2e-oci, e2e-deb, e2e-ansible, e2e-ci, e2e-bastion, e2e-vuln]
    runs-on: self-hosted
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read  # the reports of the kind legs that did not run in this run (tools/fetch-e2e-reports.sh)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install the tools the report download uses
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      - name: Download the test reports of this run
        uses: actions/download-artifact@v8
        with:
          pattern: test-*
          path: .out/reports

      # The kind legs of this run that wrote a report. A leg whose steps were skipped (the path filter of the scoped legs) wrote none.
      - name: Download the end-to-end reports of this run
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-*report*
          path: .out/reports-e2e

      - name: Every expected report is present
        run: |
          set -euo pipefail
          # A missing report would drop the requirements only that report proves, so it is an error.
          for dir in test-unit test-chart test-integration-a test-integration-b test-integration-c; do
            if ! compgen -G ".out/reports/$dir/*.json" >/dev/null; then
              echo "::error::report artifact $dir is missing"
              exit 1
            fi
          done
          if ! compgen -G ".out/reports/test-web/*.xml" >/dev/null; then
            echo "::error::report artifact test-web is missing"
            exit 1
          fi
          ls -l .out/reports/*/*.json .out/reports/*/*.xml
          if compgen -G ".out/reports-e2e/*/*.json" >/dev/null; then ls -l .out/reports-e2e/*/*.json; fi

      # Q-ROAD-11: for every kind leg without a report in this run, the newest report of that leg on main, from Test and Release or
      # from the nightly. Their failing tests veto like the ones of this run.
      - name: The newest reports of the kind legs that did not run in this run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .out/reports-e2e
          tools/fetch-e2e-reports.sh .out/reports-e2e .out/reports-carried | tee .out/carried.txt

      - name: Rules, no claim without a passing test, and the evidence record written from the reports
        run: |
          set -euo pipefail
          args=()
          for f in .out/reports/*/*.json .out/reports/*/*.xml .out/reports-e2e/*/*.json; do args+=(-tests "$f"); done
          for f in .out/reports-carried/*/*.json; do
            [ -e "$f" ] && args+=(-carried "$f")
          done
          rc=0
          go run ./internal/tools/coverage -claims "${args[@]}" > .out/evidence.txt || rc=$?
          cat .out/evidence.txt
          {
            echo '### Requirement evidence'
            echo '```'
            grep -E '^(implemented:|newly proven:|withdrawn by|  R-)' .out/evidence.txt || true
            echo '```'
            echo '### Reports of earlier runs'
            echo '```'
            cat .out/carried.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload the evidence record
        uses: actions/upload-artifact@v7
        with:
          name: coverage-evidence
          path: |
            docs/coverage/implemented.txt
            docs/coverage/checklist.md
            docs/coverage/README.md
          if-no-files-found: error
          retention-days: 14

  # The unit and integration profiles merged (make coverage-report): the job summary, and the README's
  # badge, which Semantic Release commits with the release.
  coverage-report:
    name: Combined Coverage Report
    needs: [unit, integration]
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Download the coverage profiles of this run
        uses: actions/download-artifact@v8
        with:
          pattern: profile-*
          merge-multiple: true
          path: .out/coverage

      - name: make coverage-report
        run: make coverage-report

      - name: The combined report in the job summary
        run: cat .out/coverage/summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the combined report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-combined
          path: |
            .out/coverage/coverage.txt
            .out/coverage/summary.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload the coverage badge
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: .out/coverage/coverage.json
          if-no-files-found: error
          retention-days: 14

  # The npm dependency set of semantic-release, verified and exercised: the release notes of the
  # commit types the release reads are rendered (hack/verify-release-tooling.mjs), so a dependency bump
  # that breaks the release fails the pull request, not main.
  release-tooling:
    name: Release Tooling
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install the shared library the pinned Node.js loads
        run: |
          set -euo pipefail
          # Node.js 26 links libatomic.so.1, which the runner image does not ship (Q-ARCH-218).
          sudo apt-get update
          sudo apt-get install -y libatomic1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: make test-release-tooling
        run: make test-release-tooling

  # The version from the commits since the last tag, the release notes, the tag and the GitHub release (.releaserc.json;
  # docs/developer/releasing.md). Until the first stable release only the jobs below gate it (owner, 2026-11-10, Q-ARCH-457): the
  # integration and kind legs, and the coverage jobs that need them, still run on every push and do not hold a release back.
  # `compat` is out of these needs while that job is switched off (Q-ARCH-340): a skipped need would skip the release. It goes back in, after
  # `workflows`, when the job is switched on.
  semantic-release:
    name: Semantic Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [versions, lint, gosec, govulncheck, cyclomatic-complexity, generate, nuget-vectors, build-no-node, unit, web, malware-scan, chart, image, sbom-generator, container-scan, workflows, coverage, release-tooling]
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      # The GitHub App of the organisation, scoped to this repository; the token expires after an hour
      # and is revoked at the end of the job. Not GITHUB_TOKEN: a release created with it would not
      # start "Release Docker & Helm" (build.yml).
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write  # tag, release, @semantic-release/git commit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install the shared library the pinned Node.js loads
        run: |
          set -euo pipefail
          # Node.js 26 links libatomic.so.1, which the runner image does not ship (Q-ARCH-218).
          sudo apt-get update
          sudo apt-get install -y libatomic1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx semantic-release
