# Test and Release: the pipeline of every push to main and every pull request. Every check is a job
# of its own, and every job calls a Makefile target (or a command that the Makefile would run), so a
# failure reproduces on a laptop with the same command. Semantic Release needs the set of jobs named at that job
# (Q-ARCH-457): on main it cuts the release from the conventional commits since the last tag (.releaserc.json), and the
# release's "published" event starts build.yml (Release Docker & Helm). What each job runs and how to
# reproduce it: docs/developer/releasing.md#ci.
#
# What runs per change: every check above, the e2e legs push and access-long, the npm acceptance leg
# (e2e-npm, set npm), the NuGet acceptance leg (e2e-nuget, set nuget), the OCI acceptance leg (e2e-oci, set oci, when the change touches the registry) and the GitLab CI OIDC leg (e2e-ci, set ci). The long legs failover and npm-ha are not here: they run nightly and on dispatch in
# performance.yml ("HA and Performance (nightly)"), outside the release path (owner, 2026-11-01); npm-ha-crash runs by
# hand (make e2e SET=npm-ha-crash).
# A red long leg is recorded as an open finding and does not hold the release.
#
# Runners (owner, 2026-11-05): the kind legs push, access-long, npm, oci and deb run on the organisation's large runners
# (runs-on: large); the kind legs that load the NuGet clients image (e2e-nuget, e2e-ci, e2e-bastion, e2e-vuln) need
# more than the 30 GiB of Docker storage a large pod has and run on GitHub-hosted runners (runs-on: ubuntu-24.04);
# every other job runs on the standard runners (runs-on: self-hosted). Sizes: docs/developer/releasing.md#ci.
name: Test and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      closing:
        description: >-
          The full run on the commit that closes a phase (Q-NPM-46): adds the legs the roadmap reserves for it, the npm
          scenario list and cold-cache install with Valkey stopped, the read-only subset against the public registry, the
          5-minute Valkey outage under the npm load, the NuGet closing leg (nuget-closing), and the 30-minute fuzz runs of
          npm's Match and Inspect and of the NuGet readers and version rules. Choose the closing commit as the ref of the run.
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes a run, on main too: Semantic Release releases every commit since the last
  # tag, so a cancelled run loses nothing.
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The runner pods have no CPU limit, so every tool would see the node's 32 cores and start that many threads on a node that other
  # jobs share; the time bounds of the tests would then measure the node. Owner, 2026-11-10: limit the tools, not the pods.
  GOMAXPROCS: "8"
  NG_BUILD_MAX_WORKERS: "8"
  VITEST_MAX_WORKERS: "8"

jobs:
  # One version per tool (E0.2): the Makefile compares go, node, sqlc, oapi-codegen and every CI tool
  # on PATH with its pin. The runner image's own helm, kubectl and kind are replaced by the pinned
  # ones first, so that the check looks at those.
  versions:
    name: versions
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install the shared library the pinned Node.js loads
        run: |
          set -euo pipefail
          # Node.js 26 links libatomic.so.1, which the runner image does not ship (Q-ARCH-218).
          sudo apt-get update
          sudo apt-get install -y libatomic1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc

      - name: Install the pinned helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the pinned kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install the pinned kind
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install the pinned Docker Buildx
        timeout-minutes: 16
        uses: ./.github/actions/install-buildx
        with:
          version: ${{ env.BUILDX_VERSION }}
          download-budget: '600'

      - name: Show the tool versions in the log
        run: |
          set -euo pipefail
          go version
          node --version
          helm version --short
          kubectl version --client
          kind version
          docker buildx version

      - name: make versions-check
        run: make versions-check

  lint:
    name: Code Linting
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Name the Go toolchain for the lint cache key
        run: echo "CI_GO_VERSION=$(go env GOVERSION)" >> "$GITHUB_ENV"

      # The Makefile builds .bin/golangci-lint-<pin>-<go version>. The name carries both inputs, so
      # the key does too, and the binary is platform-specific.
      - name: Restore the golangci-lint build
        uses: actions/cache@v6
        with:
          path: .bin
          key: golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-${{ env.CI_GO_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: make lint
        run: make lint

  gosec:
    name: GoSec Security Scan
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: make gosec
        run: make gosec

  govulncheck:
    name: Vulnerability Check
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: make vuln
        run: make vuln

  cyclomatic-complexity:
    name: Cyclomatic Complexity
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: make cyclo
        run: make cyclo

      - name: Complexity report
        if: always()
        run: |
          {
            echo "## Cyclomatic complexity"
            echo
            echo "Threshold: $(sed -n -E 's/^CYCLO_THRESHOLD *\?= *([0-9]+).*/\1/p' Makefile) (no function above it). The 20 most complex functions:"
            echo
            echo '```'
            make -s cyclo-report
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  # The generated code (sqlc, oapi-codegen, the config schema) regenerated and compared with the tree.
  generate:
    name: generate
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: make generate-check
        run: make generate-check

      # The reference solution of the NuGet tests (perf/nuget/reference) regenerated from the counting upstream's package
      # set and compared with the committed files (Q-ARCH-279).
      - name: make nuget-reference-check
        run: make nuget-reference-check

  # The golden vectors of the NuGet version, range and ID rules regenerated with NuGet.Versioning in the pinned
  # .NET SDK image (tools/nugetvectors, R-NUGET-003) and compared with the committed file.
  nuget-vectors:
    name: nuget vectors
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: make nuget-vectors-check
        run: make nuget-vectors-check

  build-no-node:
    name: build without Node.js
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file

      - name: Build with Node.js off PATH and check the binary
        run: |
          set -euo pipefail
          # The runner image puts Node.js on PATH. Drop every PATH entry that holds a Node.js
          # executable, then check that no Node.js executable resolves and that the build tools
          # survived the trimming.
          trimmed=""
          IFS=: read -r -a dirs <<< "$PATH"
          for d in "${dirs[@]}"; do
            [ -n "$d" ] || continue
            if [ -e "$d/node" ] || [ -e "$d/npm" ] || [ -e "$d/npx" ] || [ -e "$d/corepack" ]; then
              echo "dropping $d from PATH (it holds a Node.js executable)"
              continue
            fi
            trimmed="${trimmed:+$trimmed:}$d"
          done
          export PATH="$trimmed"
          for tool in node npm npx corepack; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool still resolves to $(command -v "$tool")"
              exit 1
            fi
          done
          for tool in go make git file; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool is not on the trimmed PATH"
              exit 1
            fi
          done
          go version
          make build
          desc="$(file bin/trove)"
          echo "$desc"
          case "$desc" in
            *"statically linked"*) ;;
            *) echo "::error::bin/trove is not statically linked"; exit 1 ;;
          esac
          if ! go version -m bin/trove | grep -q 'CGO_ENABLED=0'; then
            echo "::error::bin/trove was not built with CGO_ENABLED=0"
            exit 1
          fi

  unit:
    name: unit tests
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: make test
        run: make test

      - name: Upload the go test -json report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-unit
          path: .out/test-unit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the unit coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: profile-unit
          path: .out/coverage/unit.out
          if-no-files-found: warn
          retention-days: 14

  web:
    name: web (Angular)
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the shared library the pinned Node.js loads
        run: |
          set -euo pipefail
          # Node.js 26 links libatomic.so.1, which the runner image does not ship (Q-ARCH-218).
          sudo apt-get update
          sudo apt-get install -y libatomic1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      # npm ci installs exactly package-lock.json and fails when package.json and the lockfile
      # disagree (E0.2: the Angular packages must match the lockfile).
      - name: make web-ci
        run: make web-ci

      - name: make web-lint (ESLint and the project rules)
        run: make web-lint

      - name: make web-test
        run: make web-test

      # The JUnit report of the Angular unit tests (angular.json), the evidence of the R-UI requirements the specs name.
      - name: Upload the Vitest JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-web
          path: |
            .out/test-web.xml
            .out/test-web-lint.xml
          if-no-files-found: warn
          retention-days: 14

      - name: make web-embed (build and embed into internal/webui)
        run: make web-embed

      # The notices of the bundled software in the embedded build (R-UI-001, Q-UI-144). Only this job holds a built UI;
      # the unit job runs the same test on the placeholder, where it is skipped.
      - name: go test of the embedded notices
        run: TROVE_UI_BUILT=1 go test -count=1 -run 'TestR_UI_001_ThirdPartyNotices' ./internal/webui/

  malware-scan:
    name: Malware Scan (source code)
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools and ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clamav clamav-daemon

      - name: Update the ClamAV database
        run: |
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam

      - name: make malware-scan
        run: make malware-scan

      - name: Upload the ClamAV report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clamav-report
          path: .out/clamav-report.txt
          if-no-files-found: warn
          retention-days: 30

  chart:
    name: chart
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install the pinned helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install the pinned kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Check the installed versions against the pins
        run: |
          set -euo pipefail
          test "$(helm version --template '{{.Version}}')" = "$HELM_VERSION"
          kubectl version --client -o json | grep -q "\"gitVersion\": \"$KUBECTL_VERSION\""

      - name: make chart-lint
        run: make chart-lint

      - name: Fetch the pinned promtool
        timeout-minutes: 16
        env:
          # The chart job is 20 minutes long: the download gets 10 of them, and the named error comes first.
          TROVE_DOWNLOAD_BUDGET: "600"
          # Read by tools/github-download.sh: sent to github.com only (Q-ARCH-356).
          GITHUB_TOKEN: ${{ github.token }}
        run: make promtool

      - name: make chart-test
        run: make chart-test

      - name: Upload the chart render report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-chart
          path: .out/test-chart.json
          if-no-files-found: warn
          retention-days: 14

  # The release image as build.yml builds it, for the host architecture only: the image runs as the
  # non-root UID of R-HA-033.
  image:
    name: image (host architecture, no push)
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install the pinned Docker Buildx
        timeout-minutes: 16
        uses: ./.github/actions/install-buildx
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      - name: Log in to Docker Hub (base image pulls)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: make image
        run: make image IMAGE=trove:ci

      - name: The image runs as a non-root user
        run: |
          set -euo pipefail
          user="$(docker image inspect trove:ci --format '{{.Config.User}}')"
          echo "user: $user"
          test "$user" = "65532:65532"

  # The SBOM generator of the release image (Q-HA-166, tools/sbom-generator): builds it at the syft pin, builds a two-platform
  # test image with it as the BuildKit SBOM generator (written to a file, nothing pushed to a public registry) and asserts that
  # both attestations name the pinned syft. A syft bump that breaks the generator fails here, before any release; the job is
  # a need of semantic-release below. It pulls public images anonymously and holds no secret.
  sbom-generator:
    name: SBOM generator (pinned syft, test image)
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Install make and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential jq

      - name: Install the pinned Docker Buildx
        timeout-minutes: 16
        uses: ./.github/actions/install-buildx
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      - name: make sbom-generator-check
        run: make sbom-generator-check

  # Trivy on the built image, as valkey-operator's container job runs it: vulnerabilities of the OS
  # and the libraries (fixed ones only), secrets and misconfigurations. A finding of CRITICAL or HIGH
  # fails the job.
  container-scan:
    name: Container Scan (Trivy, built image)
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install the pinned Docker Buildx
        timeout-minutes: 16
        uses: ./.github/actions/install-buildx
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      - name: Log in to Docker Hub (base image pulls)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: make image (for the scan)
        run: make image IMAGE=trove:scan

      # Trivy at its pin from tools/versions.env, checked against its digest; trivy-action then installs nothing
      # (skip-setup-trivy), so the scan does not depend on setup-trivy's cache or its silent download.
      - name: Install the pinned Trivy
        timeout-minutes: 16
        id: trivy_install
        env:
          # Read by tools/github-download.sh (the Trivy archive): sent to github.com only (Q-ARCH-356).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          make trivy
          echo "$PWD/.bin/trivy-${TRIVY_VERSION}" >> "$GITHUB_PATH"

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: trove:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln,secret,misconfig
          skip-setup-trivy: true

      # Runs after a failed scan too (the report is wanted), but not when the Trivy install failed: then no trivy is on PATH,
      # and this step would add an exit 127 beside the install's own failure, which is the cause.
      - name: Run Trivy scan (SARIF output)
        if: always() && steps.trivy_install.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: trove:scan
          format: sarif
          output: trivy-results.sarif
          scanners: vuln,secret,misconfig
          skip-setup-trivy: true

      - name: Upload Trivy scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-container-report
          path: trivy-results.sarif
          if-no-files-found: warn
          retention-days: 30

  integration:
    # Valkey 9.1 only: trove is in development and guarantees no older line (owner, 2026-10-29). The packages run in three
    # shards with a stack each (make test-integration SHARD=a|b|c, the lists in the Makefile).
    name: integration (shard ${{ matrix.shard }})
    runs-on: self-hosted
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install the Docker Compose plugin (the integration stack)
        run: |
          set -euo pipefail
          docker compose version >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y docker-compose-v2; }
          docker compose version

      - name: Log in to Docker Hub (stack image pulls)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: make integration-up
        run: make integration-up

      - name: make test-integration SHARD=${{ matrix.shard }}
        run: make test-integration SHARD=${{ matrix.shard }}

      # The OCI distribution conformance suite (R-OCI-035) on the stack of shard c, which holds the oci area: built from the pinned
      # tag by the job's Go, run against one replica through a local and a virtual repository.
      - name: make oci-conformance
        if: matrix.shard == 'c'
        run: make oci-conformance

      - name: Upload the OCI conformance reports
        if: always() && matrix.shard == 'c'
        uses: actions/upload-artifact@v7
        with:
          name: oci-conformance-junit
          path: |
            .out/oci-conformance/local/junit.xml
            .out/oci-conformance/local/report.html
            .out/oci-conformance/local/output.txt
            .out/oci-conformance/virtual/junit.xml
            .out/oci-conformance/virtual/report.html
            .out/oci-conformance/virtual/output.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the go test -json report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-integration-${{ matrix.shard }}
          path: .out/test-integration-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the integration coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: profile-integration-${{ matrix.shard }}
          path: .out/coverage/integration-9.1-${{ matrix.shard }}.out
          if-no-files-found: warn
          retention-days: 14

      - name: Container logs (failure only)
        if: failure()
        run: |
          docker compose -f test/integration/compose.yaml ps -a || true
          for c in $(docker ps -a --filter "name=trove-it-" --format '{{.Names}}'); do
            echo "::group::logs of $c"
            docker logs --timestamps "$c" 2>&1 | tail -n 300 || true
            echo "::endgroup::"
          done

      - name: make integration-down
        if: always()
        run: make integration-down

  # S3 conformance (R-STOR-035) against Silo (SILO_IMAGE), served over TLS only (INV-20).
  s3-conformance:
    name: S3 conformance
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load the tool pins
        uses: ./.github/actions/load-pins

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install make and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y make jq

      - name: Log in to Docker Hub (the openssl and Silo images)
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: make silo-up (serve Silo over TLS and seed the buckets)
        run: make silo-up

      - name: make s3-conformance
        run: make s3-conformance

      - name: make silo-down
        if: always()
