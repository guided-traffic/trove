name: Install build tools
description: >-
  Makes make, the C compiler and the extra commands a job names available. A runner that already has them (the GitHub-hosted
  images do) installs nothing, so the job does not depend on the Ubuntu archive being reachable (F-117: the archive did not
  resolve on the GitHub-hosted runners for over an hour on 2026-11-11); a runner that lacks them installs build-essential and
  the missing commands from the Ubuntu package of the same name.
inputs:
  commands:
    description: Extra commands the job needs, separated by spaces; each is also the name of its Ubuntu package (for example "jq file").
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install what the runner lacks
      shell: bash
      env:
        EXTRA: ${{ inputs.commands }}
      run: |
        missing=()
        if ! command -v make >/dev/null || ! command -v gcc >/dev/null; then
          missing+=(build-essential)
        fi
        for c in $EXTRA; do
          command -v "$c" >/dev/null || missing+=("$c")
        done
        if [ "${#missing[@]}" -eq 0 ]; then
          echo "make, gcc ${EXTRA:+and $EXTRA }are on the runner; nothing to install"
          exit 0
        fi
        echo "installing ${missing[*]}"
        # A source the runner image adds besides the Ubuntu archive (a PPA) that cannot be read makes apt-get update exit 100
        # although the archive's indexes were read (Release Tooling of Test and Release 43063590899: a Launchpad PPA answered
        # 503). The install below still has to succeed from the indexes that were read.
        if ! sudo apt-get update; then
          echo "::warning::apt-get update could not read every package index; installing from the indexes it read"
        fi
        sudo apt-get install -y "${missing[@]}"
