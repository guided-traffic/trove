# Builds gh at GH_VERSION (tools/versions.env) with go install and puts it first on PATH, so that the
# runner image's own gh is never the one a release step calls. Run after actions/setup-go and after
# ./.github/actions/load-pins.
name: Install the pinned gh
description: go install of gh at GH_VERSION, checked against the pin
runs:
  using: composite
  steps:
    - name: Build gh at the pin and check its version
      shell: bash
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/gh-bin"
        mkdir -p "$bin"
        GOBIN="$bin" go install "github.com/cli/cli/v2/cmd/gh@${GH_VERSION}"
        have="$("$bin/gh" --version | sed -n '1s/^gh version \([^ ]*\).*/\1/p')"
        if [ "$have" != "${GH_VERSION#v}" ]; then
          echo "::error::gh $have was built, tools/versions.env pins ${GH_VERSION#v}"
          exit 1
        fi
        echo "$bin" >> "$GITHUB_PATH"
        echo "gh $have from $bin"
