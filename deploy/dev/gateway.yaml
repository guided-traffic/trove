# The Gateway API edge of the profile `edge` (R-HA-038, R-HA-039): a platform-owned Gateway `shared` in the namespace gateway-system, implemented
# by Envoy Gateway (up.sh installs it from tools/versions.env, DEV_ENVOY_GATEWAY_*). trove's HTTPRoute (values-edge.yaml) attaches to it from the
# namespace ${NS}, as a route of a tenant attaches to a platform Gateway.
#
#   GatewayClass eg        Envoy Gateway's controller, configured by the EnvoyProxy `dev` (two proxy pods, the Service of type ClusterIP: the client pods of
#                          the e2e set reach it inside the cluster, like the dev Ingress's NodePort they need no host port)
#   Gateway shared         one HTTPS listener on 443 with the certificate Secret trove-edge-tls of the namespace ${NS} (the certificate of the Ingress,
#                          for `localhost`), allowed for routes of every namespace; the ReferenceGrant lets the Gateway read that Secret
#   ClientTrafficPolicy    the requirements of R-HA-039 that the Gateway API does not carry: encoded slashes and double slashes passed through
#                          unchanged (scoped npm names), no request-received timeout, an idle timeout above the longest pause of a slow transfer
#   BackendTrafficPolicy   the route-independent timeouts towards trove: none that cut a transfer at 15 minutes
#
# The CA ConfigMap trove-tls-ca of the BackendTLSPolicies (the chart renders them with tls.backendTLSPolicy.enabled) is made by up.sh from the
# dev CA, because Gateway API takes a ConfigMap and cert-manager writes a Secret.
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-system
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: dev
  namespace: gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
      envoyDeployment:
        replicas: 2
        container:
          image: ${DEV_ENVOY_PROXY_IMAGE}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: dev
    namespace: gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared
  namespace: gateway-system
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: trove-edge-tls
            namespace: ${NS}
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-system-reads-the-edge-certificate
  namespace: ${NS}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: gateway-system
  to:
    - group: ""
      kind: Secret
      name: trove-edge-tls
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: trove-paths-and-timeouts
  namespace: gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
  path:
    escapedSlashesAction: KeepUnchanged
    disableMergeSlashes: true
  headers:
    enableEnvoyHeaders: true          # the x-envoy-* headers tell the tests that an answer came through the Gateway
  timeout:
    http:
      requestReceivedTimeout: 0s
      idleTimeout: 1h
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: trove-timeouts
  namespace: gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
  timeout:
    http:
      requestTimeout: 0s
      connectionIdleTimeout: 1h
