# PostgreSQL for the local profile (R-HA-051, R-HA-013): the CloudNativePG cluster trove-db with
# a primary and one standby, synchronous replication with dataDurability preferred (a stopped
# standby does not pause writes on a laptop), the keepalive settings of R-HA-013 and the
# database trove owned by the role trove (single-role mode, R-HA-014).
#
# CloudNativePG creates the Secrets trove-db-app (username, password) and trove-db-ca (ca.crt),
# and the Services trove-db-rw, trove-db-ro and trove-db-r. The chart reads the first two
# directly (secrets.database, secrets.databaseCA), so the profile runs verify-full like
# production. The image is substituted by lib.sh (render) from DEV_CNPG_POSTGRES_IMAGE.
#
# WAL archiving to the bucket trove-pg-archive is not configured: point-in-time recovery
# (R-HA-023) belongs to the backup milestone.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: trove-db
spec:
  instances: 2
  imageName: ${DEV_CNPG_POSTGRES_IMAGE}
  primaryUpdateStrategy: unsupervised
  postgresql:
    parameters:
      max_connections: "450"      # the chart's budget (R-HA-016): 303 for api 2, packages 3, worker 2 and the vuln pool 2 with a surge of 1 each, 383 with the bridge, 403 with the bridge in the scatter profile (api 3), which the upgrade tests run (Q-HA-98)
      tcp_keepalives_idle: "60"
      tcp_keepalives_interval: "10"
      tcp_keepalives_count: "6"
      client_connection_check_interval: "10s"
      log_parameter_max_length: "0"       # no bound value in the statement log (it becomes a CI artifact, and a value can be a token's hash)
      track_wal_io_timing: "on"           # the WAL write and fsync times in pg_stat_io, which the clients-first sampler of the e2e set mirror reads
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
  certificates:
    # The server certificate the operator issues names the Services of the cluster only. The request and the control pooler
    # of the pooler profile (pooler.yaml, TROVE_POOLER=1) present the same certificate, and trove verifies it with verify-full
    # against the pooler's Service (R-HA-015, R-HA-058), so the Services of both poolers are named too.
    serverAltDNSNames:
      - trove-db-pooler-rw
      - trove-db-pooler-rw.${NS}
      - trove-db-pooler-rw.${NS}.svc
      - trove-db-pooler-rw.${NS}.svc.cluster.local
      - trove-db-pooler-control
      - trove-db-pooler-control.${NS}
      - trove-db-pooler-control.${NS}.svc
      - trove-db-pooler-control.${NS}.svc.cluster.local
  bootstrap:
    initdb:
      database: trove
      owner: trove
      postInitApplicationSQL:
        # the slow-statement log, for the role trove alone: a statement or COMMIT of trove above 50 ms shows in the primary's log, which the e2e cluster state keeps.
        # Per-statement logging rules out one slow statement only: the time is then between statements (idle in transaction) or spread over several (active). Set on the
        # role, not the database: the role survives the DROP DATABASE of the upgrade set, and the operator's own statements (ALTER ROLE ... PASSWORD) run as postgres, so they
        # never reach that log. Bootstrap runs once: an existing cluster keeps its settings (docs/developer/local-profile.md says how to set it there).
        - ALTER ROLE trove SET log_min_duration_statement = '50ms'
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
