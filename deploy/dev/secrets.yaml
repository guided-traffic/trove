# The generated Secrets of the profile (internal-secrets-operator, annotation prefix iso.gtrfc.com/): the
# operator fills the named fields once and never overwrites a value, so a second `up.sh` keeps every
# credential. Nothing here carries a secret value; up.sh waits until the fields are filled.
#
#   trove-valkey-auth     the one Valkey password (user `default`): the Valkey operator has no ACL users and no
#                         separate Sentinel password, so data and Sentinel clients use the same Secret
#                         (a dev-profile deviation from R-HA-056 / R-ARCH-031, see local-profile.md)
#   trove-s3              SeaweedFS identity: a fixed access key id and a generated secret key
#   trove-encryption-keys the key ring (R-HA-027): 32 raw bytes, the field name without .key is the key ID.
#                         Never set `rotate` on it: a rotation would destroy the encrypted data.
#   trove-break-glass     the break-glass password (plaintext form of R-AUTH-014); the chart has no consumer for it yet
apiVersion: v1
kind: Secret
metadata:
  name: trove-valkey-auth
  annotations:
    iso.gtrfc.com/autogenerate: password
    iso.gtrfc.com/length: "32"
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: trove-s3
  annotations:
    iso.gtrfc.com/autogenerate: secret-access-key
    iso.gtrfc.com/length: "40"
type: Opaque
stringData:
  access-key-id: trove-dev
---
apiVersion: v1
kind: Secret
metadata:
  name: trove-encryption-keys
  annotations:
    iso.gtrfc.com/autogenerate: dev.key
    iso.gtrfc.com/type: bytes
    iso.gtrfc.com/length: "32"
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: trove-break-glass
  annotations:
    iso.gtrfc.com/autogenerate: password
    iso.gtrfc.com/length: "32"
type: Opaque
