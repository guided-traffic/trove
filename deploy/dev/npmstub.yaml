# The counting test upstream of the npm e2e tests (test/npmstub, docs/developer/e2e.md): a stub npm registry
# behind Service npmstub on port 443, HTTPS only, with a certificate of the dev CA (pki.yaml). It is applied by
# deploy/dev/e2e.sh when TROVE_E2E_NPMSTUB=1, never by up.sh. The image is built by `make npm-stub-image` and
# loaded into kind by e2e.sh (tag trove-e2e-npmstub:dev), so the pull policy is IfNotPresent.
#
# trove reaches it as https://npmstub.${NS}.svc and trusts the dev CA through proxy.outbound.tls.ca_files
# (values-dev.yaml); the stub puts the Host of each request into the tarball addresses of its documents.
#
# The control API (/-/stub/: counters, failure modes, offering and dropping versions) needs the bearer token in
# Secret trove-npmstub (key control-token, generated by the secret operator). One replica only: the counters
# are in memory, so a second replica would split them.
apiVersion: v1
kind: Secret
metadata:
  name: trove-npmstub
  annotations:
    iso.gtrfc.com/autogenerate: control-token
    iso.gtrfc.com/length: "32"
type: Opaque
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: trove-npmstub-tls
spec:
  secretName: trove-npmstub-tls
  commonName: npmstub
  duration: 2160h           # 90 days
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages: [digital signature, key encipherment, server auth]
  dnsNames:
    - npmstub
    - npmstub.${NS}
    - npmstub.${NS}.svc
    - npmstub.${NS}.svc.cluster.local
  issuerRef:
    name: trove-dev-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: v1
kind: Service
metadata:
  name: npmstub
  labels:
    app.kubernetes.io/name: trove-npmstub
    app.kubernetes.io/part-of: trove-dev
spec:
  selector:
    app.kubernetes.io/name: trove-npmstub
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trove-npmstub
  labels:
    app.kubernetes.io/name: trove-npmstub
    app.kubernetes.io/part-of: trove-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trove-npmstub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trove-npmstub
        app.kubernetes.io/part-of: trove-dev
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: npmstub
          image: trove-e2e-npmstub:dev
          imagePullPolicy: IfNotPresent
          args:
            - -listen=:8443
            - -tls-cert=/tls/tls.crt
            - -tls-key=/tls/tls.key
            - -control-token-file=/control/control-token
          ports:
            - {name: https, containerPort: 8443}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # A TCP probe: an HTTP probe would be counted as a request to the upstream.
          readinessProbe:
            tcpSocket: {port: https}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: https}
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: control, mountPath: /control, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: trove-npmstub-tls}
        - name: control
          secret: {secretName: trove-npmstub}
