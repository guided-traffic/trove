                  items:
                    - {key: password, path: sentinel/password}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trove-valkey
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trove-valkey
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trove-valkey-sentinel
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trove-valkey-sentinel
---
# Ingress policy (R-HA-042, H-49): only trove's web and worker pods and the Valkey pods
# themselves reach Valkey and the Sentinels. Probes and `kubectl exec` do not cross it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trove-valkey
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [trove-valkey, trove-valkey-sentinel]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: trove
              trove/serve: "true"
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [trove-valkey, trove-valkey-sentinel]}
      ports:
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 26379}
