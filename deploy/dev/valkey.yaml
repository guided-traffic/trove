              - secret:
                  name: trove-valkey-ca
                  items:
                    - {key: ca.crt, path: ca.crt}
        - name: secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: trove-valkey-admin
                  items:
