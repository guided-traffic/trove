            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            exec:
              command: ["sh", "-c", 'valkey-cli --tls --cacert /tls/ca.crt -h 127.0.0.1 -p 26379 --no-auth-warning -a "$(cat /secrets/sentinel/password)" ping | grep -q PONG']
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: conf, mountPath: /conf}
            - {name: data, mountPath: /data}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: secrets, mountPath: /secrets, readOnly: true}
      volumes:
        - name: scripts
          configMap:
