# The test advisory source of the vulnerability-scanning tests (test/osvstub, docs/developer/e2e.md,
# R-VULN-029): a stub of osv.dev's bucket (<ecosystem>/all.zip, modified_id.csv, <id>.json, ecosystems.txt) and of
# the known-exploited catalog behind one Service on port 443, HTTPS only, with a certificate of the dev CA (pki.yaml).
# It is applied by deploy/dev/e2e.sh when TROVE_E2E_OSVSTUB=1, never by up.sh.
# The image is built by `make osv-stub-image` and loaded into kind by e2e.sh (tag trove-e2e-osvstub:dev), so the pull
# policy is IfNotPresent.
#
# trove reaches it as https://osvstub.${NS}.svc/ (vulnerabilities.sources.osv.base_url) and
# https://osvstub.${NS}.svc/sites/default/files/feeds/known_exploited_vulnerabilities.json (the kev url), and trusts
# the dev CA through proxy.outbound.tls.ca_files (values-dev.yaml).
#
# The control API (/-/stub/: request counts, faults, toggles, records, the catalog) needs the bearer token in Secret
# trove-osvstub (key control-token, generated by the secret operator). One replica only: the dataset and the request
# log are in memory, so a second replica would split them.
apiVersion: v1
kind: Secret
metadata:
  name: trove-osvstub
  annotations:
    iso.gtrfc.com/autogenerate: control-token
    iso.gtrfc.com/length: "32"
type: Opaque
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: trove-osvstub-tls
spec:
  secretName: trove-osvstub-tls
  commonName: osvstub
  duration: 2160h           # 90 days
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages: [digital signature, key encipherment, server auth]
  dnsNames:
    - osvstub
    - osvstub.${NS}
    - osvstub.${NS}.svc
    - osvstub.${NS}.svc.cluster.local
  issuerRef:
    name: trove-dev-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: v1
kind: Service
metadata:
  name: osvstub
  labels:
    app.kubernetes.io/name: trove-osvstub
    app.kubernetes.io/part-of: trove-dev
spec:
  selector:
    app.kubernetes.io/name: trove-osvstub
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trove-osvstub
  labels:
    app.kubernetes.io/name: trove-osvstub
    app.kubernetes.io/part-of: trove-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trove-osvstub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trove-osvstub
        app.kubernetes.io/part-of: trove-dev
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: osvstub
          image: trove-e2e-osvstub:dev
          imagePullPolicy: IfNotPresent
          args:
            - -listen=:8443
            - -tls-cert=/tls/tls.crt
            - -tls-key=/tls/tls.key
            - -control-token-file=/control/control-token
          ports:
            - {name: https, containerPort: 8443}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # A TCP probe: an HTTP probe would be counted as a request to the source.
          readinessProbe:
            tcpSocket: {port: https}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: https}
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: control, mountPath: /control, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: trove-osvstub-tls}
        - name: control
          secret: {secretName: trove-osvstub}
