# The counting test upstream of the Debian e2e tests (test/debstub, docs/developer/deb.md): a stub Debian archive behind one
# Service on port 443, HTTPS only, with a certificate of the dev CA (pki.yaml). It serves the suites stable and testing, the large
# index (suite bulk), a flat repository (/flat/binary/) and a flat root (/flatroot/), all signed by the stub's test keys.
# It is applied by a wiring step of the e2e harness (deploy/dev/e2e.sh), never by up.sh; no step applies it yet.
# The image is built by `make deb-stub-image` and must be loaded into kind (tag trove-e2e-debstub:dev), so the pull policy is
# IfNotPresent.
#
# trove reaches it as https://debstub.${NS}.svc and trusts the dev CA through proxy.outbound.tls.ca_files (values-dev.yaml). The
# remote repository under test names https://debstub.${NS}.svc/debian/ as its upstream (a suite is requested as dists/stable/),
# and the flat repositories https://debstub.${NS}.svc/flat/ and https://debstub.${NS}.svc/flatroot/. The public test keys for
# deb.upstreamKeys come from the control API (GET /-/stub/keyring?names=a) or from `debstub keyring a`.
#
# The control API (/-/stub/: counters, switches, new generations, the keys) needs the bearer token in Secret trove-debstub (key
# control-token, generated by the secret operator). One replica only: the counters and generations are in memory, so a second
# replica would split them.
apiVersion: v1
kind: Secret
metadata:
  name: trove-debstub
  annotations:
    iso.gtrfc.com/autogenerate: control-token
    iso.gtrfc.com/length: "32"
type: Opaque
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: trove-debstub-tls
spec:
  secretName: trove-debstub-tls
  commonName: debstub
  duration: 2160h           # 90 days
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages: [digital signature, key encipherment, server auth]
  dnsNames:
    - debstub
    - debstub.${NS}
    - debstub.${NS}.svc
    - debstub.${NS}.svc.cluster.local
  issuerRef:
    name: trove-dev-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: v1
kind: Service
metadata:
  name: debstub
  labels:
    app.kubernetes.io/name: trove-debstub
    app.kubernetes.io/part-of: trove-dev
spec:
  selector:
    app.kubernetes.io/name: trove-debstub
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trove-debstub
  labels:
    app.kubernetes.io/name: trove-debstub
    app.kubernetes.io/part-of: trove-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trove-debstub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trove-debstub
        app.kubernetes.io/part-of: trove-dev
    spec:
      automountServiceAccountToken: false
      # The stub keeps its dataset in memory, and the drain tests evict a worker node: it runs on the control-plane node, as the client pods do.
      nodeSelector: { node-role.kubernetes.io/control-plane: "" }
      tolerations: [{ key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }]
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: debstub
          image: trove-e2e-debstub:dev
          imagePullPolicy: IfNotPresent
          args:
            - -listen=:8443
            - -tls-cert=/tls/tls.crt
            - -tls-key=/tls/tls.key
            - -control-token-file=/control/control-token
          ports:
            - {name: https, containerPort: 8443}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # A TCP probe: an HTTP probe would be counted as a request to the upstream.
          readinessProbe:
            tcpSocket: {port: https}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: https}
            periodSeconds: 10
            failureThreshold: 6
          # The large index (70,000 paragraphs, 24 MB plain) is built in memory on first use.
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: control, mountPath: /control, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: trove-debstub-tls}
        - name: control
          secret: {secretName: trove-debstub}
