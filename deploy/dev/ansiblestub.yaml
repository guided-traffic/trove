# The counting test upstream of the Ansible e2e tests (test/ansiblestub, docs/developer/ansible-remote.md): a stub Galaxy behind
# Services on port 443, HTTPS only, with a certificate of the dev CA (pki.yaml). One pod answers five host names, told apart by the
# Host header, so every name has a Service of its own with the same selector:
#
#   ansiblestub            the Galaxy: the API root is https://ansiblestub.${NS}.svc/api/
#   ansiblestub-github     the GitHub stand-in for role archives (a 302 to the codeload host)
#   ansiblestub-codeload   the host it redirects to
#   ansiblestub-unlisted   a host that serves role archives and is none of the two above: a remote must not follow a role there
#   ansiblestub-realm      the single-sign-on realm of the hub exchange (token endpoint /auth/realms/test/protocol/openid-connect/token)
#
# It is applied by a wiring step of the e2e harness (deploy/dev/e2e.sh, TROVE_E2E_ANSIBLESTUB=1, set ansible), never by up.sh. The
# image is built by `make ansible-stub-image` and must be loaded into kind (tag trove-e2e-ansiblestub:dev), so the pull policy is
# IfNotPresent.
#
# trove reaches it as https://ansiblestub.${NS}.svc/api/ and trusts the dev CA through proxy.outbound.tls.ca_files (values-dev.yaml).
# The remote repository under test names that address as its upstream and allows the two role hosts in remote.extraHosts
# (ansiblestub-github.${NS}.svc, ansiblestub-codeload.${NS}.svc); it does not allow ansiblestub-unlisted.${NS}.svc.
#
# The control API (/-/stub/: counters, switches, throttle, realm, added and dropped versions, the corpus with its digests) needs
# the bearer token in Secret trove-ansiblestub (key control-token, generated by the secret operator). One replica only: the
# counters and the changes to the corpus are in memory, so a second replica would split them.
apiVersion: v1
kind: Secret
metadata:
  name: trove-ansiblestub
  annotations:
    iso.gtrfc.com/autogenerate: control-token
    iso.gtrfc.com/length: "32"
type: Opaque
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: trove-ansiblestub-tls
spec:
  secretName: trove-ansiblestub-tls
  commonName: ansiblestub
  duration: 2160h           # 90 days
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages: [digital signature, key encipherment, server auth]
  dnsNames:
    - ansiblestub
    - ansiblestub.${NS}
    - ansiblestub.${NS}.svc
    - ansiblestub.${NS}.svc.cluster.local
    - ansiblestub-github
    - ansiblestub-github.${NS}
    - ansiblestub-github.${NS}.svc
    - ansiblestub-github.${NS}.svc.cluster.local
    - ansiblestub-codeload
    - ansiblestub-codeload.${NS}
    - ansiblestub-codeload.${NS}.svc
    - ansiblestub-codeload.${NS}.svc.cluster.local
    - ansiblestub-unlisted
    - ansiblestub-unlisted.${NS}
    - ansiblestub-unlisted.${NS}.svc
    - ansiblestub-unlisted.${NS}.svc.cluster.local
    - ansiblestub-realm
    - ansiblestub-realm.${NS}
    - ansiblestub-realm.${NS}.svc
    - ansiblestub-realm.${NS}.svc.cluster.local
  issuerRef:
    name: trove-dev-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: v1
kind: Service
metadata:
  name: ansiblestub
  labels:
    app.kubernetes.io/name: trove-ansiblestub
    app.kubernetes.io/part-of: trove-dev
spec:
  selector:
    app.kubernetes.io/name: trove-ansiblestub
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: v1
kind: Service
metadata:
  name: ansiblestub-github
  labels:
    app.kubernetes.io/name: trove-ansiblestub
    app.kubernetes.io/part-of: trove-dev
spec:
  selector:
    app.kubernetes.io/name: trove-ansiblestub
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: v1
kind: Service
metadata:
  name: ansiblestub-codeload
  labels:
    app.kubernetes.io/name: trove-ansiblestub
    app.kubernetes.io/part-of: trove-dev
spec:
  selector:
    app.kubernetes.io/name: trove-ansiblestub
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: v1
kind: Service
metadata:
  name: ansiblestub-unlisted
  labels:
    app.kubernetes.io/name: trove-ansiblestub
    app.kubernetes.io/part-of: trove-dev
spec:
  selector:
    app.kubernetes.io/name: trove-ansiblestub
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: v1
kind: Service
metadata:
  name: ansiblestub-realm
  labels:
    app.kubernetes.io/name: trove-ansiblestub
    app.kubernetes.io/part-of: trove-dev
spec:
  selector:
    app.kubernetes.io/name: trove-ansiblestub
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trove-ansiblestub
  labels:
    app.kubernetes.io/name: trove-ansiblestub
    app.kubernetes.io/part-of: trove-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trove-ansiblestub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trove-ansiblestub
        app.kubernetes.io/part-of: trove-dev
    spec:
      automountServiceAccountToken: false
      # The stub keeps its dataset in memory, and the drain tests evict a worker node: it runs on the control-plane node, as the client pods do.
      nodeSelector: { node-role.kubernetes.io/control-plane: "" }
      tolerations: [{ key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }]
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ansiblestub
          image: trove-e2e-ansiblestub:dev
          imagePullPolicy: IfNotPresent
          args:
            - -listen=:8443
            - -tls-cert=/tls/tls.crt
            - -tls-key=/tls/tls.key
            - -control-token-file=/control/control-token
            - -github-host=ansiblestub-github.${NS}.svc
            - -codeload-host=ansiblestub-codeload.${NS}.svc
            - -unlisted-host=ansiblestub-unlisted.${NS}.svc
            - -realm-host=ansiblestub-realm.${NS}.svc
          ports:
            - {name: https, containerPort: 8443}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # A TCP probe: an HTTP probe would be counted as a request to the upstream.
          readinessProbe:
            tcpSocket: {port: https}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: https}
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: control, mountPath: /control, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: trove-ansiblestub-tls}
        - name: control
          secret: {secretName: trove-ansiblestub}
