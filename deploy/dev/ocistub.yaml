# The counting test upstream of the OCI e2e tests (test/ocistub, docs/developer/oci.md): a stub OCI registry behind three
# Services on port 443, HTTPS only, with a certificate of the dev CA (pki.yaml). The Services select the same pod and are the three
# hosts a large public registry has: ocistub is the registry (the /v2/ API), ocistub-auth the token realm (/token) and ocistub-cdn the
# blob CDN (the registry redirects blob downloads there). The stub keeps the three apart by the Host header and names them in the
# challenges and redirects.
# It is applied by a wiring step of the e2e harness (deploy/dev/e2e.sh), never by up.sh; no step applies it yet.
# The image is built by `make oci-stub-image` and must be loaded into kind (tag trove-e2e-ocistub:dev), so the pull policy is
# IfNotPresent.
#
# trove reaches it as https://ocistub.${NS}.svc and trusts the dev CA through proxy.outbound.tls.ca_files (values-dev.yaml). The remote
# repository under test names the realm host ocistub-auth.${NS}.svc and the CDN host ocistub-cdn.${NS}.svc in its extraHosts
# (R-OCI-021); the realm host with sendCredentials true when the test pulls with credentials.
#
# The control API (/-/stub/: counters, switches, moving tags, revoking tokens) needs the bearer token in Secret trove-ocistub (key
# control-token, generated by the secret operator). One replica only: the counters are in memory, so a second replica would split
# them.
apiVersion: v1
kind: Secret
metadata:
  name: trove-ocistub
  annotations:
    iso.gtrfc.com/autogenerate: control-token
    iso.gtrfc.com/length: "32"
type: Opaque
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: trove-ocistub-tls
spec:
  secretName: trove-ocistub-tls
  commonName: ocistub
  duration: 2160h           # 90 days
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages: [digital signature, key encipherment, server auth]
  dnsNames:
    - ocistub
    - ocistub.${NS}
    - ocistub.${NS}.svc
    - ocistub.${NS}.svc.cluster.local
    - ocistub-auth
    - ocistub-auth.${NS}
    - ocistub-auth.${NS}.svc
    - ocistub-auth.${NS}.svc.cluster.local
    - ocistub-cdn
    - ocistub-cdn.${NS}
    - ocistub-cdn.${NS}.svc
    - ocistub-cdn.${NS}.svc.cluster.local
  issuerRef:
    name: trove-dev-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: v1
kind: Service
metadata:
  name: ocistub
  labels:
    app.kubernetes.io/name: trove-ocistub
    app.kubernetes.io/part-of: trove-dev
spec:
  selector:
    app.kubernetes.io/name: trove-ocistub
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: v1
kind: Service
metadata:
  name: ocistub-auth
  labels:
    app.kubernetes.io/name: trove-ocistub
    app.kubernetes.io/part-of: trove-dev
spec:
  selector:
    app.kubernetes.io/name: trove-ocistub
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: v1
kind: Service
metadata:
  name: ocistub-cdn
  labels:
    app.kubernetes.io/name: trove-ocistub
    app.kubernetes.io/part-of: trove-dev
spec:
  selector:
    app.kubernetes.io/name: trove-ocistub
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trove-ocistub
  labels:
    app.kubernetes.io/name: trove-ocistub
    app.kubernetes.io/part-of: trove-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trove-ocistub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trove-ocistub
        app.kubernetes.io/part-of: trove-dev
    spec:
      automountServiceAccountToken: false
      # The stub keeps its dataset in memory, and the drain tests evict a worker node: it runs on the control-plane node, as the client pods do.
      nodeSelector: { node-role.kubernetes.io/control-plane: "" }
      tolerations: [{ key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }]
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ocistub
          image: trove-e2e-ocistub:dev
          imagePullPolicy: IfNotPresent
          args:
            - -listen=:8443
            - -tls-cert=/tls/tls.crt
            - -tls-key=/tls/tls.key
            - -control-token-file=/control/control-token
            - -public-url=https://ocistub.${NS}.svc
            - -realm-url=https://ocistub-auth.${NS}.svc
            - -cdn-url=https://ocistub-cdn.${NS}.svc
          ports:
            - {name: https, containerPort: 8443}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # A TCP probe: an HTTP probe would be counted as a request to the upstream.
          readinessProbe:
            tcpSocket: {port: https}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: https}
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: control, mountPath: /control, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: trove-ocistub-tls}
        - name: control
          secret: {secretName: trove-ocistub}
