# The GitLab-shaped OIDC issuer double of the CI e2e tests (test/oidcstub, docs/developer/e2e.md): discovery
# document and key set behind Service oidcstub on port 443, HTTPS only, with a certificate of the dev CA
# (pki.yaml). It is applied by deploy/dev/e2e.sh when TROVE_E2E_OIDCSTUB=1, never by up.sh. The image is built by
# `make oidc-stub-image` and loaded into kind by e2e.sh (tag trove-e2e-oidcstub:dev), so the pull policy is
# IfNotPresent.
#
# trove reaches it as https://oidcstub.${NS}.svc (that is the issuer it announces, -public-url) and trusts the dev CA
# through proxy.outbound.tls.ca_files (values-dev.yaml). Port 8080 is the plain-HTTP listener that the
# redirect-out-of-TLS fault points at: it exists so a test can assert that nothing reached it.
#
# The control API (mint, rotate, remove a key, faults, counters) listens on its own port 8444 (Service port
# "control"), also TLS, and needs the bearer token in Secret trove-oidcstub (key control-token, generated by the
# secret operator), which the container reads from OIDCSTUB_CONTROL_TOKEN. One replica only: the counters and the
# keys are in memory, so a second replica would split them.
apiVersion: v1
kind: Secret
metadata:
  name: trove-oidcstub
  annotations:
    iso.gtrfc.com/autogenerate: control-token
    iso.gtrfc.com/length: "32"
type: Opaque
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: trove-oidcstub-tls
spec:
  secretName: trove-oidcstub-tls
  commonName: oidcstub
  duration: 2160h           # 90 days
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages: [digital signature, key encipherment, server auth]
  dnsNames:
    - oidcstub
    - oidcstub.${NS}
    - oidcstub.${NS}.svc
    - oidcstub.${NS}.svc.cluster.local
  issuerRef:
    name: trove-dev-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: v1
kind: Service
metadata:
  name: oidcstub
  labels:
    app.kubernetes.io/name: trove-oidcstub
    app.kubernetes.io/part-of: trove-dev
spec:
  selector:
    app.kubernetes.io/name: trove-oidcstub
  ports:
    - name: https
      port: 443
      targetPort: https
    - name: control
      port: 8444
      targetPort: control
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trove-oidcstub
  labels:
    app.kubernetes.io/name: trove-oidcstub
    app.kubernetes.io/part-of: trove-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trove-oidcstub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trove-oidcstub
        app.kubernetes.io/part-of: trove-dev
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oidcstub
          image: trove-e2e-oidcstub:dev
          imagePullPolicy: IfNotPresent
          args:
            - -listen=:8443
            - -tls-cert=/tls/tls.crt
            - -tls-key=/tls/tls.key
            - -control-listen=:8444
            - -plain-listen=:8080
            - -public-url=https://oidcstub.${NS}.svc
            - -plain-public-url=http://oidcstub.${NS}.svc:8080
          env:
            - name: OIDCSTUB_CONTROL_TOKEN
              valueFrom:
                secretKeyRef: {name: trove-oidcstub, key: control-token}
          ports:
            - {name: https, containerPort: 8443}
            - {name: control, containerPort: 8444}
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # A TCP probe: an HTTP probe would be counted as a request to the upstream.
          readinessProbe:
            tcpSocket: {port: https}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: https}
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: trove-oidcstub-tls}
