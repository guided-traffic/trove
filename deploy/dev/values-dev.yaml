# Chart values of the local development profile (R-HA-051): the real chart with two web and
# two worker replicas against the dependencies deploy/dev/up.sh installs into the "trove"
# namespace of the kind cluster "trove". The backup CronJob of R-HA-051 is not part of the chart
# skeleton yet, so no backup target is configured here.
image:
  registry: docker.io
  repository: guidedtraffic/trove
  tag: dev                       # built by `make image`, loaded by up.sh with `kind load docker-image`
  pullPolicy: IfNotPresent       # the image never leaves the kind nodes

highAvailability:
  enforce: true

# TLS on trove's listeners (R-ARCH-035, R-HA-063): the certificate is Secret trove-tls, issued by
# cert-manager from the dev CA (pki.yaml). The short reload interval makes the rotation drill (E0.15)
# fast; the chart default is 10s.
tls:
  enabled: true
  secretName: trove-tls
  reloadInterval: 2s

web:
  replicaCount: 2
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
      ephemeral-storage: 256Mi
    limits:
      memory: 1Gi

worker:
  replicaCount: 2
  terminationGracePeriodSeconds: 60      # the drain test (E0.14) waits for the grace period of a worker whose job outlasts it; the chart default is 300
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 256Mi
    limits:
      memory: 512Mi
  spool:
    sizeLimit: 4Gi

spool:
  sizeLimit: 4Gi
  headroom: 2GiB

config:
  server:
    base_url: https://localhost:8080          # the edge's certificate names localhost; up.sh follows TROVE_DEV_HTTP_PORT
    trusted_proxies: ["10.244.0.0/24"]    # the pod range of the control-plane node, where HAProxy Ingress is pinned (haproxy-values.yaml); up.sh checks it against the node's podCIDR
    replica_header: always                 # X-Trove-Replica on every response: the scatter profile (E0.11) counts replicas per request, also anonymous ones
  log:
    level: debug
  system:
    bootstrap_anonymous_read: true         # until authentication ships nobody holds system.read; the E0.13 load reads /system/replicas
  database:
    host: trove-db-rw.trove.svc           # the read-write Service of the CloudNativePG cluster trove-db
    name: trove
    ssl_mode: verify-full
  valkey:
    mode: sentinel
    sentinel:
      # The Valkey operator's names: <pod>.<headless Service>.<namespace>.svc.cluster.local, the only names
      # its certificate carries. The primary is named after the resource.
      addresses:
        - trove-valkey-sentinel-0.trove-valkey-sentinel-headless.trove.svc.cluster.local:36379
        - trove-valkey-sentinel-1.trove-valkey-sentinel-headless.trove.svc.cluster.local:36379
        - trove-valkey-sentinel-2.trove-valkey-sentinel-headless.trove.svc.cluster.local:36379
      primary_name: trove-valkey
      tls: true
    tls:
      mode: verify-full
  storage:
    s3:
      bucket: trove-blobs
      region: us-east-1
      endpoint: https://trove-s3.trove.svc:9000    # SeaweedFS over TLS; the certificate names trove-s3.trove.svc
      force_path_style: true
      credentials:
        source: static
    upload:
      max_size: 1GiB

secrets:
  database:
    existingSecret: trove-db-app          # created by CloudNativePG
  databaseCA:
    existingSecret: trove-db-ca           # created by CloudNativePG
    key: ca.crt
  s3:
    existingSecret: trove-s3              # generated by the internal-secrets-operator (secrets.yaml)
  # Interim deviation from R-HA-056 / R-ARCH-031 (dev profile only): the Valkey operator has no ACL users and no
  # separate Sentinel password, so trove connects as the `default` user (empty usernameKey) with the cluster
  # password, and the same Secret authenticates against the Sentinels. See local-profile.md.
  valkey:
    existingSecret: trove-valkey-auth     # generated by the internal-secrets-operator
    usernameKey: ""
  valkeySentinel:
    existingSecret: trove-valkey-auth
  s3CA:
    existingSecret: trove-s3-tls          # the SeaweedFS certificate Secret (cert-manager, dev CA); renders storage.s3.ca_file
    key: ca.crt
  valkeyCA:
    existingSecret: trove-valkey-tls      # the Valkey operator's certificate Secret (cert-manager, dev CA)
  encryption:
    existingSecret: trove-encryption-keys # generated by the internal-secrets-operator: 32 raw bytes
    keys: [dev.key]

# The edge: HAProxy Ingress (haproxy-values.yaml) terminates TLS with Secret trove-edge-tls for localhost and
# speaks HTTPS to trove, verifying trove's certificate against the dev CA (R-HA-063).
ingress:
  enabled: true
  className: haproxy
  tls:
    - secretName: trove-edge-tls
      hosts: [localhost]
  backendTLS:
    controller: haproxy
    verify: true
    caSecret: trove-tls                   # a cert-manager Secret carries ca.crt

# The second endpoint (R-EP-001 to R-EP-005, E0.16): `customers` listens on :8443 with its own host, its own
# certificate pair plus a wildcard pair chosen by SNI (all from cert-manager, pki.yaml), serves only the package
# routes (`surface: [packages]`: /ui/, /api/v1/ and /files/ answer the 404 of an unknown path) and has its own
# Ingress on the same HAProxy Ingress, which verifies the endpoint's certificate for
# trove-ep-customers.<namespace>.svc. The host resolves to the loopback address on every system that treats
# *.localhost that way; the edge port follows TROVE_DEV_HTTP_PORT (up.sh sets baseUrl).
endpoints:
  customers:
    port: 8443
    baseUrl: https://packages.trove.localhost:8080
    hosts: [packages.trove.localhost]
    wildcardHost: "*.packages.trove.localhost"
    surface: [packages]
    trustedProxies: ["10.244.0.0/24"]     # the same HAProxy pods as the default endpoint
    tls:
      existingSecret: trove-customers-tls
      extraSecrets: [trove-customers-wildcard-tls]
    ingress:
      enabled: true
      className: haproxy
      tls:
        - secretName: trove-customers-edge-tls
          hosts: [packages.trove.localhost, "*.packages.trove.localhost"]
