# The `vuln` e2e profile (R-VULN-029, docs/developer/e2e.md#the-vulnerability-tests), layered after values-dev.yaml and
# values-scatter.yaml (three api and three packages replicas, every request to another one; the worker and the vuln pool with two replicas each from values-dev.yaml) by
# up.sh when TROVE_PROFILE=vuln: the scanning reads the test advisory source (deploy/dev/osvstub.yaml, started by
# e2e.sh with TROVE_E2E_OSVSTUB=1) instead of osv.dev and CISA, and the hosts of the two test upstreams count as public
# registries (R-VULN-010), so a remote repository over them is matched with matchPublicAdvisories auto.
#
# The stub's certificate is signed by the dev CA, which trove trusts for upstreams through proxy.outbound.tls.ca_files
# (values-dev.yaml). The namespace is the one of the dev cluster, as everywhere in values-dev.yaml.
config:
  vulnerabilities:
    sources:
      osv:
        mode: online            # values-dev.yaml switches the sources off
        base_url: https://osvstub.trove.svc/
      kev:
        mode: online
        url: https://osvstub.trove.svc/sites/default/files/feeds/known_exploited_vulnerabilities.json
    matching:
      public_upstreams:
        npm: [registry.npmjs.org, npmstub.trove.svc]
        nuget: [api.nuget.org, www.nuget.org, nugetstub.trove.svc]
  # The three scheduled syncs are off: the tests start every sync through the task API, and a scheduled one that fires inside a
  # test's window is a request to the test advisory source that no test caused (the KEV sync fires at minute 41 of hours 0, 6, 12
  # and 18 UTC, the OSV sync every 15 minutes). A disabled task still runs when it is triggered.
  maintenance:
    tasks:
      vuln-sync-osv: {enabled: false, schedule: "*/15 * * * *"}
      vuln-sync-osv-full: {enabled: false, schedule: "17 3 * * 0"}
      vuln-sync-kev: {enabled: false, schedule: "41 */6 * * *"}
worker:
  pools:
    # A worker of the pool is released 14 s after SIGTERM with this grace period (grace - 5 s of margin - 11 s, internal/app/shutdown.go),
    # not the 44 s of values-dev.yaml: since Q-VULN-90 and Q-VULN-91 the full sync of the 100,000 filler records takes under a minute, and
    # the drain test of R-VULN-004 needs a run that is still working when the release is due (Q-VULN-92).
    - name: vuln
      queues: [vuln]
      replicaCount: 2
      terminationGracePeriodSeconds: 30
