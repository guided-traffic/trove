# The counting test upstream of the NuGet e2e tests (test/nugetstub, docs/developer/e2e.md): a stub NuGet v3
# server behind two Services on port 443, HTTPS only, with a certificate of the dev CA (pki.yaml). Both Services
# select the same pod; the service index names nugetstub as the API host (index, registrations) and
# nugetstub-content as the content host (flat container, search), which is how nuget.org spreads its resources.
# It is applied by deploy/dev/e2e.sh when TROVE_E2E_NUGETSTUB=1, never by up.sh (the wiring is a later step).
# The image is built by `make nuget-stub-image` and loaded into kind by e2e.sh (tag trove-e2e-nugetstub:dev), so
# the pull policy is IfNotPresent.
#
# trove reaches it as https://nugetstub.${NS}.svc and trusts the dev CA through proxy.outbound.tls.ca_files
# (values-dev.yaml). The remote repository under test names the extra host nugetstub-content.${NS}.svc in its
# extraHosts (R-NUGET-014).
#
# The control API (/-/stub/: counters, failure modes, offering and dropping versions) needs the bearer token
# in Secret trove-nugetstub (key control-token, generated by the secret operator). One replica only: the counters
# are in memory, so a second replica would split them.
apiVersion: v1
kind: Secret
metadata:
  name: trove-nugetstub
  annotations:
    iso.gtrfc.com/autogenerate: control-token
    iso.gtrfc.com/length: "32"
type: Opaque
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: trove-nugetstub-tls
spec:
  secretName: trove-nugetstub-tls
  commonName: nugetstub
  duration: 2160h           # 90 days
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages: [digital signature, key encipherment, server auth]
  dnsNames:
    - nugetstub
    - nugetstub.${NS}
    - nugetstub.${NS}.svc
    - nugetstub.${NS}.svc.cluster.local
    - nugetstub-content
    - nugetstub-content.${NS}
    - nugetstub-content.${NS}.svc
    - nugetstub-content.${NS}.svc.cluster.local
  issuerRef:
    name: trove-dev-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: v1
kind: Service
metadata:
  name: nugetstub
  labels:
    app.kubernetes.io/name: trove-nugetstub
    app.kubernetes.io/part-of: trove-dev
spec:
  selector:
    app.kubernetes.io/name: trove-nugetstub
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: v1
kind: Service
metadata:
  name: nugetstub-content
  labels:
    app.kubernetes.io/name: trove-nugetstub
    app.kubernetes.io/part-of: trove-dev
spec:
  selector:
    app.kubernetes.io/name: trove-nugetstub
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trove-nugetstub
  labels:
    app.kubernetes.io/name: trove-nugetstub
    app.kubernetes.io/part-of: trove-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trove-nugetstub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trove-nugetstub
        app.kubernetes.io/part-of: trove-dev
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nugetstub
          image: trove-e2e-nugetstub:dev
          imagePullPolicy: IfNotPresent
          args:
            - -listen=:8443
            - -tls-cert=/tls/tls.crt
            - -tls-key=/tls/tls.key
            - -control-token-file=/control/control-token
            - -public-url=https://nugetstub.${NS}.svc
            - -content-url=https://nugetstub-content.${NS}.svc
          ports:
            - {name: https, containerPort: 8443}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # A TCP probe: an HTTP probe would be counted as a request to the upstream.
          readinessProbe:
            tcpSocket: {port: https}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: https}
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: control, mountPath: /control, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: trove-nugetstub-tls}
        - name: control
          secret: {secretName: trove-nugetstub}
