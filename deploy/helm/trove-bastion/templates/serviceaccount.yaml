{{- /*
The Bastion never calls the Kubernetes API (R-BAS-006, R-BAS-045): no token is mounted, and the chart
renders no Role and no RoleBinding.
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "trove-bastion.serviceAccountName" . }}
  labels:
    {{- include "trove-bastion.labels" (dict "root" . "component" "serviceaccount") | nindent 4 }}
  {{- if or .Values.serviceAccount.annotations .Values.commonAnnotations }}
  annotations:
    {{- toYaml (merge (dict) .Values.serviceAccount.annotations .Values.commonAnnotations) | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
