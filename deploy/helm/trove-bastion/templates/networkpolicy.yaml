{{- /*
Network policy (R-BAS-047, ADR-154): ingress rules only, one policy for the Bastion pods, and every rule
names its port. The chart renders no egress rule: the Bastion pods' egress is the cluster operator's own
policy (docs/security/bastion.md, H-522).

The https port only from networkPolicy.ingress.https.from (the ingress controller's namespace; the
Bastion is reached through its Ingress, never directly), the ops port only from
networkPolicy.ingress.ops.from and networkPolicy.ingress.probeCIDRs. No peer for the ops port closes it
for everyone: an empty "from" would mean from anywhere. An empty https.from is refused at render time
(trove-bastion.validate) for the same reason.
*/ -}}
{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $httpsPort := include "trove-bastion.port" (dig "server" "listen" ":8443" .Values.config) }}
{{- $opsPort := include "trove-bastion.port" (dig "server" "ops_listen" ":8081" .Values.config) }}
{{- $ops := list }}
{{- range $np.ingress.ops.from }}{{ $ops = append $ops . }}{{- end }}
{{- range $np.ingress.probeCIDRs }}{{ $ops = append $ops (dict "ipBlock" (dict "cidr" .)) }}{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trove-bastion.fullname" . }}
  labels:
    {{- include "trove-bastion.labels" (dict "root" . "component" "bastion") | nindent 4 }}
  {{- with (include "trove-bastion.commonAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "trove-bastion.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ $httpsPort }}
      from:
        {{- toYaml $np.ingress.https.from | nindent 8 }}
    {{- if $ops }}
    - ports:
        - protocol: TCP
          port: {{ $opsPort }}
      from:
        {{- toYaml $ops | nindent 8 }}
    {{- end }}
{{- end }}
