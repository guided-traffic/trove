{{- if .Values.autoscaling.enabled }}
{{- /*
bastion.replicas is autoscaling.maxReplicas (R-BAS-025): the budgets towards the main installation are
divided by it, so the sum over the replicas never exceeds the configured budget however far the
autoscaler goes.
*/ -}}
{{- $a := .Values.autoscaling }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "trove-bastion.fullname" . }}
  labels:
    {{- include "trove-bastion.labels" (dict "root" . "component" "bastion") | nindent 4 }}
  {{- with (include "trove-bastion.commonAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: {{ include "trove-bastion.workloadKind" . }}
    name: {{ include "trove-bastion.fullname" . }}
  minReplicas: {{ $a.minReplicas }}
  maxReplicas: {{ $a.maxReplicas }}
  metrics:
    {{- if $a.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $a.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if $a.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $a.targetMemoryUtilizationPercentage }}
    {{- end }}
    {{- with $a.metrics }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $a.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
