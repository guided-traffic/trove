# A persistent cache volume per pod (a StatefulSet) with routing by path, and the edge limit's whitelist.
config:
  server:
    base_url: https://packages.example.com            # example
    trusted_proxies: ["10.244.0.0/16"]                # example: the ingress controller's pods
  bastion:
    main:
      url: https://trove.example.com                  # example
    blocking:
      exempt_cidrs: ["198.51.100.0/24", "203.0.113.7/32"]   # example
secrets:
  mainToken:
    existingSecret: trove-bastion-token               # example
cacheVolume:
  type: persistent
  size: 50Gi                                          # example
  storageClassName: fast                              # example
  routeByPath: true
replicaCount: 3                                       # example
tls:
  certManager:
    issuerRef:
      name: internal-ca                               # example
networkPolicy:
  egress:
    main:
      to:
        - ipBlock:
            cidr: 198.51.100.10/32                    # example
