# The values a render needs (R-BAS-045, Q-BAS-55): the Bastion's own URL, the main installation's URL, the
# Secret of the Bastion token, a certificate source for the listener and the address of the main installation
# for the network policy. Everything else is the chart's default.
config:
  server:
    base_url: https://packages.example.com            # example
    trusted_proxies: ["10.244.0.0/16"]                # example: the ingress controller's pods
  bastion:
    main:
      url: https://trove.example.com                  # example
secrets:
  mainToken:
    existingSecret: trove-bastion-token               # example
tls:
  certManager:
    issuerRef:
      name: internal-ca                               # example
networkPolicy:
  egress:
    main:
      to:
        - ipBlock:
            cidr: 198.51.100.10/32                    # example
