# The explicit plaintext switch (INV-20): no TLS on the listeners, plain probes, no Certificate. Egress and
# edge limit off, a single replica without the HA enforcement: the smallest render the chart allows.
highAvailability:
  enforce: false
replicaCount: 1
config:
  server:
    base_url: https://packages.example.com
    trusted_proxies: ["10.244.0.0/16"]                # example: the ingress controller's pods
  bastion:
    main:
      url: https://trove.example.com
secrets:
  mainToken:
    existingSecret: trove-bastion-token
tls:
  enabled: false
edgeLimit:
  enabled: false
ingress:
  enabled: false
networkPolicy:
  egress:
    enabled: false
