# The bucket backend with Valkey (Sentinel), a trust bundle, tracing and the monitoring objects: the
# profile of the e2e run with a SeaweedFS bucket. Also the set the rule tests render
# (test/chart/bastion_rules_test.go), so the Valkey alert is part of the rule file.
config:
  server:
    base_url: https://packages.example.com
    trusted_proxies: ["10.244.0.0/16"]
  bastion:
    main:
      url: https://trove.example.com
    cache:
      backend: bucket
      bucket:
        endpoint: https://object.storage.eu01.onstackit.cloud
        region: eu01
        bucket: trove-bastion-partners
    blocking:
      exempt_cidrs: ["198.51.100.0/24"]
  valkey:
    mode: sentinel
    sentinel:
      addresses:
        - trove-bastion-valkey-sentinel-0:26379
        - trove-bastion-valkey-sentinel-1:26379
        - trove-bastion-valkey-sentinel-2:26379
      primary_name: trove-bastion
  tracing:
    enabled: true
    endpoint: https://otel-collector.observability:4318
secrets:
  mainToken:
    existingSecret: trove-bastion-token
  signingKey:
    existingSecret: trove-bastion-signing
  cacheBucket:
    existingSecret: trove-bastion-s3
  valkey:
    existingSecret: trove-bastion-valkey
  valkeySentinel:
    existingSecret: trove-bastion-valkey-sentinel
  valkeyCA:
    existingSecret: trove-bastion-valkey-ca
trustedCA:
  existingConfigMap: corp-ca-bundle
tls:
  existingSecret: trove-bastion-listener
ingress:
  tls:
    - secretName: trove-bastion-public-tls
      hosts: [packages.example.com]
networkPolicy:
  egress:
    main:
      to:
        - ipBlock:
            cidr: 198.51.100.10/32
    valkey:
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: trove-bastion-valkey
    cacheBucket:
      to:
        - ipBlock:
            cidr: 203.0.113.0/24                      # example: the object store's addresses
    tracing:
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
metrics:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  prometheusRule:
    enabled: true
    labels:
      release: kube-prometheus-stack
