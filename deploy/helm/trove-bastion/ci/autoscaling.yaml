# Autoscaling: bastion.replicas is autoscaling.maxReplicas, the Deployment has no replicas field.
config:
  server:
    base_url: https://packages.example.com
    trusted_proxies: ["10.244.0.0/16"]                # example: the ingress controller's pods
  bastion:
    main:
      url: https://trove.example.com
secrets:
  mainToken:
    existingSecret: trove-bastion-token
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
tls:
  certManager:
    issuerRef:
      name: internal-ca
networkPolicy:
  egress:
    main:
      to:
        - ipBlock:
            cidr: 198.51.100.10/32
