# Production-shaped: every optional Secret, the Ingress with TLS, a generic ephemeral spool,
# static S3 credentials, a bearer token for /metrics and a certificate-authenticated Valkey.
image:
  tag: 0.0.0-ci
global:
  imagePullSecrets:
    - name: registry-pull
config:
  backup:
    target:
      bucket: trove-backups
  server:
    base_url: https://trove.example.com
    trusted_proxies: ["10.244.0.0/16"]
  database:
    host: trove-db-pooler-rw.trove.svc
    session_host: trove-db-rw.trove.svc
  storage:
    s3:
      bucket: trove-blobs
      region: eu-central-1
      credentials:
        source: static
    upload:
      max_size: 10GiB
  valkey:
    sentinel:
      addresses:
        - trove-valkey-sentinel-0.trove-valkey-sentinel.trove.svc:26379
        - trove-valkey-sentinel-1.trove-valkey-sentinel.trove.svc:26379
        - trove-valkey-sentinel-2.trove-valkey-sentinel.trove.svc:26379
      primary_name: trove
  metrics:
    auth: static
  authz:
    role_bindings:                                 # applied by the migration Job
      - role: admin
        group: gh-wds18-k8s-main-admins
      - role: auditor
        group: gh-wds18-k8s-main-auditors
  ci:                                              # the GitLab CI OIDC federation
    token:
      max_ttl: 30m                                 # at most auth.tokens.cit.max_ttl
    exchange:
      rate_limit:
        exempt_cidrs: ["10.20.0.0/16"]             # example: a runner network behind NAT
    issuers:                                       # applied by the migration Job, read-only in the API and the UI
      - name: gitlab-main
        kind: gitlab
        issuer: https://gitlab.example.com
        public_issuer: false                       # example: an instance without open sign-up
        allowed_audiences: ["https://packages.example.com"]
        ca_bundle_ref: file:/var/run/secrets/gitlab-ca/ca.crt # example: an instance behind a private CA
secrets:
  backupSource:
    existingSecret: trove-s3-read              # a login that only reads the blob bucket
  database:
    existingSecret: trove-db-app
  databaseMigration:
    existingSecret: trove-db-owner
  databaseCA:
    existingSecret: trove-db-ca
  databaseClientCert:
    existingSecret: trove-db-client
  s3:
    existingSecret: trove-s3
  valkey:
    existingSecret: trove-valkey
  valkeySentinel:
    existingSecret: trove-valkey-sentinel
  valkeyCA:
    existingSecret: trove-valkey-ca
  valkeyClientCert:
    existingSecret: trove-valkey-client
  encryption:
    existingSecret: trove-encryption-keys
    keys: [2026-10.key, 2026-04.key]
  metricsToken:
    existingSecret: trove-metrics
spool:
  type: ephemeral
  sizeLimit: 20Gi
  ephemeral:
    storageClassName: standard
    size: 50Gi
    accessModes: [ReadWriteOnce]
tls:
  secretName: trove-tls                            # example: a cert-manager Certificate's secret (tls.crt, tls.key, ca.crt)
  minVersion: "1.3"
  clientCA:
    secretName: trove-edge-ca                      # example: mutual TLS from the edge
  ops:
    secretName: trove-ops-tls                      # example: separate certificate for the operations listener
ingress:
  enabled: true
  className: haproxy
  backendTLS:
    controller: haproxy                            # example: HAProxy Ingress connects with HTTPS and verifies trove
    caSecret: trove-tls                            # example: the cert-manager Secret carries ca.crt
    clientCertSecret: trove-edge-client            # example: client certificate for the mutual TLS of tls.clientCA
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  tls:
    - secretName: trove-tls
      hosts: [trove.example.com]
api:
  podAnnotations:
    example.com/note: api
  extraEnv:
    - name: TROVE_LOG_LEVEL
      value: debug
packages:
  podAnnotations:
    example.com/note: packages
worker:
  nodeSelector:
    kubernetes.io/os: linux
commonLabels:
  team: platform
