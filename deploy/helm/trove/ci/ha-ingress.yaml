# Production-shaped: every optional Secret, the Ingress with TLS, a generic ephemeral spool,
# static S3 credentials, a bearer token for /metrics and a certificate-authenticated Valkey.
image:
  tag: 0.0.0-ci                                    # example
global:
  imagePullSecrets:
    - name: registry-pull                          # example
config:
  server:
    base_url: https://trove.example.com            # example
    trusted_proxies: ["10.244.0.0/16"]             # example
  database:
    host: trove-db-pooler-rw.trove.svc             # example
    session_host: trove-db-rw.trove.svc            # example
  storage:
    s3:
      bucket: trove-blobs                          # example
      region: eu-central-1                         # example
      credentials:
        source: static
    upload:
      max_size: 10GiB                              # default (proposed)
  valkey:
    sentinel:
      addresses:                                   # example
        - trove-valkey-sentinel-0.trove-valkey-sentinel.trove.svc:26379
        - trove-valkey-sentinel-1.trove-valkey-sentinel.trove.svc:26379
        - trove-valkey-sentinel-2.trove-valkey-sentinel.trove.svc:26379
      primary_name: trove                          # example
  metrics:
    auth: static
  authz:
    role_bindings:                                 # R-AUTHZ-010: applied by the migration Job
      - role: admin                                # example
        group: gh-wds18-k8s-main-admins            # example
      - role: auditor                              # example
        group: gh-wds18-k8s-main-auditors          # example
  ci:                                              # R-CI-001, Q-CI-16: the GitLab CI OIDC federation
    token:
      max_ttl: 30m                                 # example; at most auth.tokens.cit.max_ttl (R-CI-016)
    exchange:
      rate_limit:
        exempt_cidrs: ["10.20.0.0/16"]             # example: a runner network behind NAT (R-CI-021)
    issuers:                                       # applied by the migration Job, read-only in the API and the UI
      - name: gitlab-main                          # example
        kind: gitlab
        issuer: https://gitlab.example.com         # example
        public_issuer: false                       # example: an instance without open sign-up
        allowed_audiences: ["https://packages.example.com"]   # example
        ca_bundle_ref: file:/var/run/secrets/gitlab-ca/ca.crt # example: an instance behind a private CA
secrets:
  database:
    existingSecret: trove-db-app                   # example
  databaseMigration:
    existingSecret: trove-db-owner                 # example
  databaseCA:
    existingSecret: trove-db-ca                    # example
  databaseClientCert:
    existingSecret: trove-db-client                # example
  s3:
    existingSecret: trove-s3                       # example
  valkey:
    existingSecret: trove-valkey                   # example
  valkeySentinel:
    existingSecret: trove-valkey-sentinel          # example
  valkeyCA:
    existingSecret: trove-valkey-ca                # example
  valkeyClientCert:
    existingSecret: trove-valkey-client            # example
  encryption:
    existingSecret: trove-encryption-keys          # example
    keys: [2026-10.key, 2026-04.key]               # example
  metricsToken:
    existingSecret: trove-metrics                  # example
spool:
  type: ephemeral
  sizeLimit: 20Gi
  ephemeral:
    storageClassName: standard                     # example
    size: 50Gi
    accessModes: [ReadWriteOnce]
tls:
  secretName: trove-tls                            # example: a cert-manager Certificate's secret (tls.crt, tls.key, ca.crt)
  minVersion: "1.3"                                # example
  clientCA:
    secretName: trove-edge-ca                      # example: mutual TLS from the edge
  ops:
    secretName: trove-ops-tls                      # example: separate certificate for the operations listener
ingress:
  enabled: true
  className: haproxy                               # example
  backendTLS:
    controller: haproxy                            # example: HAProxy Ingress connects with HTTPS and verifies trove
    caSecret: trove-tls                            # example: the cert-manager Secret carries ca.crt
    clientCertSecret: trove-edge-client            # example: client certificate for the mutual TLS of tls.clientCA
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt    # example
  tls:
    - secretName: trove-tls                        # example
      hosts: [trove.example.com]
api:
  podAnnotations:
    example.com/note: api                          # example
  extraEnv:
    - name: TROVE_LOG_LEVEL                        # example
      value: debug
packages:
  podAnnotations:
    example.com/note: packages                     # example
worker:
  nodeSelector:
    kubernetes.io/os: linux                        # example
commonLabels:
  team: platform                                   # example
