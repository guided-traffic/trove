# An endpoint with a pool of its own: its pods are <fullname>-packages-ep-customers,
# its listener runs only there, and the main packages pods do not open its port.
config:
  server:
    base_url: https://trove.example.com
  database:
    host: trove-db-rw.trove.svc
  storage:
    s3:
      bucket: trove-blobs
  valkey:
    sentinel:
      addresses:
        - trove-valkey-sentinel-0.trove-valkey-sentinel.trove.svc:26379
        - trove-valkey-sentinel-1.trove-valkey-sentinel.trove.svc:26379
        - trove-valkey-sentinel-2.trove-valkey-sentinel.trove.svc:26379
      primary_name: trove
tls:
  secretName: trove-tls
secrets:
  database:
    existingSecret: trove-db-app
  valkey:
    existingSecret: trove-valkey
  encryption:
    existingSecret: trove-encryption-keys
    keys: [2026-10.key]
endpoints:
  customers:
    port: 8443
    baseUrl: https://packages.example.com
    tls:
      existingSecret: trove-packages-tls
    pool:
      enabled: true
      replicaCount: 3
      resources:
        limits:
          memory: 1Gi
    ingress:
      enabled: true
      className: traefik-external
      backendTLS:
        controller: traefik
        verify: false
      tls:
        - secretName: packages-tls
          hosts: [packages.example.com]
