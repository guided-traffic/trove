# An endpoint with a pool of its own (R-EP-008, Q-EP-3): its pods are <fullname>-web-ep-customers,
# its listener runs only there, and the main web pods do not open its port.
config:
  server:
    base_url: https://trove.example.com            # example
  database:
    host: trove-db-rw.trove.svc                    # example
  storage:
    s3:
      bucket: trove-blobs                          # example
  valkey:
    sentinel:
      addresses:                                   # example
        - trove-valkey-sentinel-0.trove-valkey-sentinel.trove.svc:26379
        - trove-valkey-sentinel-1.trove-valkey-sentinel.trove.svc:26379
        - trove-valkey-sentinel-2.trove-valkey-sentinel.trove.svc:26379
      primary_name: trove                          # example
tls:
  secretName: trove-tls                            # example
secrets:
  database:
    existingSecret: trove-db-app                   # example
  valkey:
    existingSecret: trove-valkey                   # example
  encryption:
    existingSecret: trove-encryption-keys          # example
    keys: [2026-10.key]                            # example
endpoints:
  customers:
    port: 8443                                     # example
    baseUrl: https://packages.example.com          # example
    tls:
      existingSecret: trove-packages-tls           # example
    pool:
      enabled: true
      replicaCount: 3                              # example
      resources:
        limits:
          memory: 1Gi                              # example
    ingress:
      enabled: true
      className: traefik-external                  # example
      backendTLS:
        controller: traefik
        verify: false
      tls:
        - secretName: packages-tls                 # example
          hosts: [packages.example.com]
