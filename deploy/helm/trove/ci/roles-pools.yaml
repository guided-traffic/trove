# The roles with every kind of pool: a path pool of packages for npm and one of
# api for the management API, a worker pool for the advisory sync, an autoscaler on packages and the endpoint
# customers over both roles with a pool of its own.
config:
  server:
    base_url: https://trove.example.com
  database:
    host: trove-db-rw.trove.svc
  storage:
    s3:
      bucket: trove-blobs
  valkey:
    sentinel:
      addresses:
        - trove-valkey-sentinel-0.trove-valkey-sentinel.trove.svc:26379
        - trove-valkey-sentinel-1.trove-valkey-sentinel.trove.svc:26379
        - trove-valkey-sentinel-2.trove-valkey-sentinel.trove.svc:26379
      primary_name: trove
tls:
  secretName: trove-tls
secrets:
  database:
    existingSecret: trove-db-app
  valkey:
    existingSecret: trove-valkey
  encryption:
    existingSecret: trove-encryption-keys
    keys: [2026-10.key]
ingress:
  enabled: true
  className: haproxy
  backendTLS:
    caSecret: trove-tls
api:
  pools:
    - name: admin
      paths: [/api/v1/repositories]
      replicaCount: 2
packages:
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
  pools:
    - name: npm
      paths: [/api/npm]
      replicaCount: 4
worker:
  pools:
    - name: vuln
      queues: [vuln]
      replicaCount: 2
    - name: bulk
      queues: [index, mirror]
endpoints:
  customers:
    port: 8443
    baseUrl: https://packages.example.com
    surface: [packages, files, api]
    tls:
      existingSecret: trove-packages-tls
    pool:
      enabled: true
      replicaCount: 2
    ingress:
      enabled: true
      className: haproxy
      backendTLS:
        caSecret: trove-packages-tls
    networkPolicy:
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
