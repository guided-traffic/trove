# A single-node development cluster: no enforcement, one replica per role, soft host spreading,
# standalone Valkey without TLS.
highAvailability:
  enforce: false
api:
  replicaCount: 1
  topologySpread:
    host:
      whenUnsatisfiable: ScheduleAnyway
packages:
  replicaCount: 1
  topologySpread:
    host:
      whenUnsatisfiable: ScheduleAnyway
worker:
  replicaCount: 1
  topologySpread:
    host:
      whenUnsatisfiable: ScheduleAnyway
config:
  server:
    base_url: http://localhost:8080
  database:
    host: postgres.default.svc
    ssl_mode: disable
    allow_insecure: true
  storage:
    s3:
      bucket: trove-blobs
      endpoint: http://minio.default.svc:9000
      allow_insecure_endpoint: true                # plain HTTP inside the cluster
      force_path_style: true
    upload:
      max_size: 1GiB
  valkey:
    mode: standalone
    address: valkey.default.svc:6379
    tls:
      mode: disable
    allow_insecure: true
tls:
  enabled: false                                   # plain HTTP inside the development cluster
secrets:
  database:
    existingSecret: postgres
  valkey:
    existingSecret: valkey
  encryption:
    existingSecret: trove-encryption-keys
    keys: [dev.key]
spool:
  sizeLimit: 4Gi
