# The ServiceMonitor, the PrometheusRule (the alerts of the vulnerability scanning) and the vulnerabilities section
# the chart reads, with the backup on so that the rule holds the alerts of the backup runs as well. The rules are rendered
# into a rule file and tested with promtool (deploy/helm/trove/tests/rules_test.yaml, test/chart).
backup:
  enabled: true
config:
  backup:
    target:
      bucket: trove-backups
  server:
    base_url: https://trove.example.com
  database:
    host: trove-db-rw.trove.svc
  storage:
    s3:
      bucket: trove-blobs
  valkey:
    sentinel:
      addresses:
        - trove-valkey-sentinel-0.trove-valkey-sentinel.trove.svc:26379
        - trove-valkey-sentinel-1.trove-valkey-sentinel.trove.svc:26379
        - trove-valkey-sentinel-2.trove-valkey-sentinel.trove.svc:26379
      primary_name: trove
  vulnerabilities:
    enabled: true
    stale_after: 24h
    sources:
      osv:
        mode: online
        max_archive_size: 1GiB
tls:
  secretName: trove-tls
secrets:
  database:
    existingSecret: trove-db-app
  valkey:
    existingSecret: trove-valkey
  encryption:
    existingSecret: trove-encryption-keys
    keys: [2026-10.key]
metrics:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  prometheusRule:
    enabled: true
    labels:
      release: kube-prometheus-stack
