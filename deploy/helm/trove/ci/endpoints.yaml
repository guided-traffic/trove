# Two further endpoints beside the default one: customers, served by the main packages
# pods through its own Ingress class, hosts, wildcard host and certificates chosen by SNI; and
# partners, a minimal one. Neither has a pool of its own (ci/endpoints-pool.yaml has).
config:
  server:
    base_url: https://trove.example.com
    additional_base_urls: ["https://trove.internal.example.com"]
    trusted_proxies: ["10.244.0.0/16"]
  database:
    host: trove-db-rw.trove.svc
  storage:
    s3:
      bucket: trove-blobs
  valkey:
    sentinel:
      addresses:
        - trove-valkey-sentinel-0.trove-valkey-sentinel.trove.svc:26379
        - trove-valkey-sentinel-1.trove-valkey-sentinel.trove.svc:26379
        - trove-valkey-sentinel-2.trove-valkey-sentinel.trove.svc:26379
      primary_name: trove
tls:
  secretName: trove-tls
secrets:
  database:
    existingSecret: trove-db-app
  valkey:
    existingSecret: trove-valkey
  encryption:
    existingSecret: trove-encryption-keys
    keys: [2026-10.key]
ingress:
  enabled: true
  className: haproxy                               # example: the internal edge
  backendTLS:
    controller: haproxy
    caSecret: trove-tls
  tls:
    - secretName: trove-tls
      hosts: [trove.example.com]
endpoints:
  default:
    hosts: [trove.example.com, trove.trove.svc]    # example: the public name and the in-cluster Service name
  customers:
    port: 8443
    baseUrl: https://packages.example.com
    hosts: [pkgs.example.org]
    wildcardHost: "*.registry.example.com"
    wildcardRoot: label
    hostRoots:
      pkgs.example.org: docker-hub                 # example: reserved, no format uses it yet
    surface: [packages, files]
    trustedProxies: ["10.244.0.0/16"]
    tls:
      existingSecret: trove-packages-tls           # example: keys tls.crt, tls.key
      extraSecrets: [trove-packages-wildcard-tls]  # example: the wildcard pair, chosen by SNI
      clientCaSecret: trove-customer-ca            # example: mutual TLS from the customers' edge
    ingress:
      enabled: true
      className: traefik-external                  # example: another controller than the default endpoint
      backendTLS:
        controller: traefik
        verify: false
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
      tls:
        - secretName: packages-tls
          hosts: [packages.example.com, "*.registry.example.com"]
    networkPolicy:
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-external
  partners:
    port: 8444
    baseUrl: https://partners.example.com
    exposure: all
    ingress:
      enabled: true
      tls:
        - secretName: partners-tls
          hosts: [partners.example.com]
