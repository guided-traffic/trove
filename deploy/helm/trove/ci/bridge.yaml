# The first step of the upgrade across the cut: web.enabled renders <fullname>-web and the Service
# <fullname> with the edge of the old shape beside api, packages and worker; an endpoint pool is then a pool of web.
web:
  enabled: true
config:
  backup:
    target:
      bucket: trove-backups
  server:
    base_url: https://trove.example.com
  database:
    host: trove-db-rw.trove.svc
  storage:
    s3:
      bucket: trove-blobs
  valkey:
    sentinel:
      addresses:
        - trove-valkey-sentinel-0.trove-valkey-sentinel.trove.svc:26379
        - trove-valkey-sentinel-1.trove-valkey-sentinel.trove.svc:26379
        - trove-valkey-sentinel-2.trove-valkey-sentinel.trove.svc:26379
      primary_name: trove
tls:
  secretName: trove-tls
secrets:
  database:
    existingSecret: trove-db-app
  valkey:
    existingSecret: trove-valkey
  encryption:
    existingSecret: trove-encryption-keys
    keys: [2026-10.key]
ingress:
  enabled: true
  className: traefik
  backendTLS:
    controller: traefik
    verify: false
endpoints:
  customers:
    port: 8443
    baseUrl: https://packages.example.com
    tls:
      existingSecret: trove-packages-tls
    pool:
      enabled: true
      replicaCount: 3
    ingress:
      enabled: true
      className: traefik-external
      backendTLS:
        controller: traefik
        verify: false
