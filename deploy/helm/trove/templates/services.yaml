{{- /*
Every Service renders sessionAffinity: None, fixed and not a value (R-HA-037, R-ARCH-032): any
replica of a role can answer any request of its families. The client Services select the pods of one
role (R-HA-002): <fullname>-api the main api pods, <fullname>-packages the main packages pods, one
Service <fullname>-<role>-<pool> per path pool (R-HA-062) and, with web.enabled, <fullname> the web
pods of the bridge (R-HA-064). The ops Service selects every trove pod and carries the operations
port only; worker pods are reached on it alone.
*/ -}}
{{- range $unit := include "trove.units" . | fromYamlArray }}
{{- if or (eq $unit.kind "bridge") (and (has $unit.kind (list "main" "pool")) (has $unit.role (list "api" "packages"))) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ if eq $unit.kind "bridge" }}{{ include "trove.fullname" $ }}{{ else }}{{ include "trove.fullname" $ }}-{{ $unit.name }}{{ end }}
  labels:
    {{- include "trove.labels" (dict "root" $ "component" $unit.role "pool" $unit.pool) | nindent 4 }}
    {{- with $.Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- $svcAnn := merge (dict) $.Values.service.annotations $.Values.commonAnnotations }}
  {{- /* Traefik reads the backend scheme and transport from the Service (R-HA-063). */}}
  {{- if and $.Values.ingress.enabled $.Values.tls.enabled (eq $.Values.ingress.backendTLS.controller "traefik") }}
  {{- $_ := set $svcAnn "traefik.ingress.kubernetes.io/service.serversscheme" "https" }}
  {{- with $.Values.ingress.backendTLS.serversTransport }}
  {{- $_ := set $svcAnn "traefik.ingress.kubernetes.io/service.serverstransport" . }}
  {{- end }}
  {{- end }}
  {{- if $svcAnn }}
  annotations:
    {{- toYaml $svcAnn | nindent 4 }}
  {{- end }}
spec:
  type: {{ $.Values.service.type }}
  sessionAffinity: None
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if $.Values.tls.enabled }}
      appProtocol: https
      {{- end }}
  selector:
    {{- include "trove.selectorLabels" (dict "root" $ "component" $unit.role "pool" $unit.pool) | nindent 4 }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trove.fullname" . }}-ops
  labels:
    {{- include "trove.labels" (dict "root" . "component" "ops") | nindent 4 }}
  {{- with (include "trove.commonAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
    - name: ops
      port: {{ .Values.service.opsPort }}
      targetPort: ops
      protocol: TCP
      {{- if .Values.tls.enabled }}
      appProtocol: https
      {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "trove.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    trove/serve: "true"
