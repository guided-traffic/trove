{{- range $role := list "web" "worker" }}
{{- $r := index $.Values $role }}
{{- if $r.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "trove.fullname" $ }}-{{ $role }}
  labels:
    {{- include "trove.labels" (dict "root" $ "component" $role) | nindent 4 }}
  {{- with (include "trove.commonAnnotations" $) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- if $r.podDisruptionBudget.minAvailable }}
  minAvailable: {{ $r.podDisruptionBudget.minAvailable }}
  {{- else }}
  maxUnavailable: {{ $r.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  unhealthyPodEvictionPolicy: {{ $r.podDisruptionBudget.unhealthyPodEvictionPolicy }}
  selector:
    matchLabels:
      {{- include "trove.selectorLabels" (dict "root" $ "component" $role) | nindent 6 }}
{{- end }}
{{- end }}
