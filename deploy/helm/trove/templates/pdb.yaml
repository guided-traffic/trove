{{- define "trove.pdb" -}}
{{- $ := .root }}
{{- $role := .role }}
{{- $pool := .pool }}
{{- $r := .r }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "trove.fullname" $ }}-{{ .name }}
  labels:
    {{- include "trove.labels" (dict "root" $ "component" $role "pool" $pool) | nindent 4 }}
  {{- with (include "trove.commonAnnotations" $) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- if $r.podDisruptionBudget.minAvailable }}
  minAvailable: {{ $r.podDisruptionBudget.minAvailable }}
  {{- else }}
  maxUnavailable: {{ $r.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  unhealthyPodEvictionPolicy: {{ $r.podDisruptionBudget.unhealthyPodEvictionPolicy }}
  selector:
    matchLabels:
      {{- include "trove.selectorLabels" (dict "root" $ "component" $role "pool" $pool) | nindent 6 }}
{{- end -}}
{{- range $role := list "web" "worker" }}
{{- $r := index $.Values $role }}
{{- if $r.podDisruptionBudget.enabled }}
{{- include "trove.pdb" (dict "root" $ "role" $role "pool" "" "name" $role "r" $r) | nindent 0 }}
{{- end }}
{{- end }}
{{- /* The pool of an endpoint gets the disruption budget of the web values it overrides (R-EP-008). */}}
{{- range $name := include "trove.endpointNames" . | fromYamlArray }}
{{- if include "trove.endpointPool" (dict "root" $ "name" $name) }}
{{- $r := include "trove.endpointPoolValues" (dict "root" $ "name" $name) | fromYaml }}
{{- if $r.podDisruptionBudget.enabled }}
{{- include "trove.pdb" (dict "root" $ "role" "web" "pool" (printf "ep-%s" $name) "name" (printf "web-ep-%s" $name) "r" $r) | nindent 0 }}
{{- end }}
{{- end }}
{{- end }}
