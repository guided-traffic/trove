{{- /* One policy/v1 PodDisruptionBudget of a Deployment. Argument: dict "root" . "unit" <one entry of trove.units>. */ -}}
{{- define "trove.pdb" -}}
{{- $ := .root }}
{{- $unit := .unit }}
{{- $r := $unit.r }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "trove.fullname" $ }}-{{ $unit.name }}
  labels:
    {{- include "trove.labels" (dict "root" $ "component" $unit.role "pool" $unit.pool) | nindent 4 }}
  {{- with (include "trove.commonAnnotations" $) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- if $r.podDisruptionBudget.minAvailable }}
  minAvailable: {{ $r.podDisruptionBudget.minAvailable }}
  {{- else }}
  maxUnavailable: {{ $r.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  unhealthyPodEvictionPolicy: {{ $r.podDisruptionBudget.unhealthyPodEvictionPolicy }}
  selector:
    matchLabels:
      {{- include "trove.selectorLabels" (dict "root" $ "component" $unit.role "pool" $unit.pool) | nindent 6 }}
{{- end -}}
{{- /* One PodDisruptionBudget per Deployment that enables it (R-HA-032): every role, every pool, every endpoint pool. */ -}}
{{- range $unit := include "trove.units" . | fromYamlArray }}
{{- if $unit.r.podDisruptionBudget.enabled }}
{{- include "trove.pdb" (dict "root" $ "unit" $unit) | nindent 0 }}
{{- end }}
{{- end }}
