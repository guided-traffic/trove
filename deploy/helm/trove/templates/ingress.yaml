{{- if .Values.ingress.enabled }}
{{- /*
The host is routed whole: path / with pathType Prefix, fixed and not a value (R-HA-037). The
operations port is never routed. The chart renders no affinity annotation.
*/ -}}
{{- $hosts := .Values.ingress.hosts }}
{{- if not $hosts }}
{{- $hosts = list (urlParse .Values.config.server.base_url).hostname }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "trove.fullname" . }}
  labels:
    {{- include "trove.labels" (dict "root" . "component" "web") | nindent 4 }}
    {{- with .Values.ingress.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- $ann := merge (dict) .Values.ingress.annotations .Values.commonAnnotations }}
  {{- /* Backend over TLS (R-HA-063): the controller-specific settings, only for the controller named. */}}
  {{- if and .Values.tls.enabled (eq .Values.ingress.backendTLS.controller "haproxy") }}
  {{- /* haproxy-ingress backend-scope keys (https://haproxy-ingress.github.io/docs/configuration/keys/), default prefix haproxy-ingress.github.io. */}}
  {{- $hp := "haproxy-ingress.github.io/" }}
  {{- $_ := set $ann (print $hp "secure-backends") "true" }}
  {{- with (ternary .Values.ingress.backendTLS.caSecret "" .Values.ingress.backendTLS.verify) }}
  {{- $_ := set $ann (print $hp "secure-verify-ca-secret") . }}
  {{- $_ := set $ann (print $hp "secure-sni") (printf "%s.%s.svc" (include "trove.fullname" $) $.Release.Namespace) }}
  {{- end }}
  {{- with .Values.ingress.backendTLS.clientCertSecret }}
  {{- $_ := set $ann (print $hp "secure-crt-secret") . }}
  {{- end }}
  {{- end }}
  {{- if and .Values.tls.enabled (eq .Values.ingress.backendTLS.controller "ingress-nginx") }}
  {{- $_ := set $ann "nginx.ingress.kubernetes.io/backend-protocol" "HTTPS" }}
  {{- with (ternary .Values.ingress.backendTLS.caSecret "" .Values.ingress.backendTLS.verify) }}
  {{- $_ := set $ann "nginx.ingress.kubernetes.io/proxy-ssl-verify" "on" }}
  {{- $_ := set $ann "nginx.ingress.kubernetes.io/proxy-ssl-secret" (printf "%s/%s" $.Release.Namespace .) }}
  {{- $_ := set $ann "nginx.ingress.kubernetes.io/proxy-ssl-name" (printf "%s.%s.svc" (include "trove.fullname" $) $.Release.Namespace) }}
  {{- $_ := set $ann "nginx.ingress.kubernetes.io/proxy-ssl-server-name" "on" }}
  {{- end }}
  {{- end }}
  {{- if $ann }}
  annotations:
    {{- toYaml $ann | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "trove.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
