{{- if .Values.ingress.enabled }}
{{- /*
The host is routed whole: path / with pathType Prefix, fixed and not a value (R-HA-037). The
operations port is never routed. The chart renders no affinity annotation.
*/ -}}
{{- $hosts := .Values.ingress.hosts }}
{{- if not $hosts }}
{{- $hosts = list (urlParse .Values.config.server.base_url).hostname }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "trove.fullname" . }}
  labels:
    {{- include "trove.labels" (dict "root" . "component" "web") | nindent 4 }}
    {{- with .Values.ingress.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or .Values.ingress.annotations .Values.commonAnnotations }}
  annotations:
    {{- toYaml (merge (dict) .Values.ingress.annotations .Values.commonAnnotations) | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "trove.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
