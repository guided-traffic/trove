{{- if .Values.metrics.prometheusRule.enabled }}
{{- /*
R-HA-045, R-VULN-024: every alert of _rules.tpl except metrics.prometheusRule.disabledAlerts, then extraRules.
deploy/helm/trove/tests/rules_test.yaml tests the rendered rules with promtool (test/chart).
*/ -}}
{{- $disabled := .Values.metrics.prometheusRule.disabledAlerts }}
{{- $rules := list }}
{{- range include "trove.rules.all" . | fromYamlArray }}
{{- if not (has .alert $disabled) }}
{{- $rules = append $rules . }}
{{- end }}
{{- end }}
{{- $rules = concat $rules .Values.metrics.prometheusRule.extraRules }}
{{- if $rules }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "trove.fullname" . }}
  labels:
    {{- include "trove.labels" (dict "root" . "component" "alerts") | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with (include "trove.commonAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  groups:
    - name: {{ include "trove.fullname" . }}
      rules:
        {{- toYaml $rules | nindent 8 }}
{{- end }}
{{- end }}
