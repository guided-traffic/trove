{{- /*
Network policies (R-HA-042, ADR-154, Q-HA-76): ingress rules only, one policy per Deployment, named
as the Deployment, and every rule names its port. The chart renders no egress rule and no policy for
pods it does not deploy. templates/_units.tpl lists the Deployments.

Per Deployment the policy admits the ports its pods open:
  8080                  from networkPolicy.ingress.http.from (empty = from anywhere, so any ingress
                        controller works); only api, packages, their path pools and the bridge web
  a further endpoint's  from that endpoint's networkPolicy.from (empty = from anywhere), for every
  port                  endpoint the pods open (templates/_units.tpl trove.unitEndpoints)
  8081                  only from networkPolicy.ingress.ops.from and networkPolicy.ingress.probeCIDRs; with no
                        peer at all the rule is left out, because an empty "from" would mean
                        from anywhere
A worker listens on no client port, so its policy holds the 8081 rule only. The migration Job, the
pods of the backup CronJob and the restore Job accept nothing. Replicas never talk to each other, so no rule admits one trove pod from another.
*/ -}}
{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $ops := list }}
{{- range $np.ingress.ops.from }}{{ $ops = append $ops . }}{{- end }}
{{- range $np.ingress.probeCIDRs }}{{ $ops = append $ops (dict "ipBlock" (dict "cidr" .)) }}{{- end }}
{{- range $unit := include "trove.units" . | fromYamlArray }}
{{- $ctx := dict "root" $ "role" $unit.role "pool" $unit.pool }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trove.fullname" $ }}-{{ $unit.name }}
  labels:
    {{- include "trove.labels" (dict "root" $ "component" $unit.role "pool" $unit.pool) | nindent 4 }}
  {{- with (include "trove.commonAnnotations" $) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "trove.selectorLabels" (dict "root" $ "component" $unit.role "pool" $unit.pool) | nindent 6 }}
  policyTypes:
    - Ingress
  {{- $endpoints := include "trove.unitEndpoints" $ctx | fromYamlArray }}
  {{- if or (include "trove.opensDefault" $ctx) $endpoints $ops }}
  ingress:
    {{- if include "trove.opensDefault" $ctx }}
    - ports:
        - protocol: TCP
          port: 8080
      {{- with $np.ingress.http.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- range $name := $endpoints }}
    {{- $e := include "trove.endpoint" (dict "root" $ "name" $name) | fromYaml }}
    - ports:
        - protocol: TCP
          port: {{ $e.port }}
      {{- with $e.networkPolicyFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- /* No peer at all closes 8081 for everyone: an empty "from" would mean from anywhere. */}}
    {{- if $ops }}
    - ports:
        - protocol: TCP
          port: 8081
      from:
        {{- toYaml $ops | nindent 8 }}
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trove.fullname" . }}-migrate
  labels:
    {{- include "trove.labels" (dict "root" . "component" "migrate") | nindent 4 }}
  {{- if and (eq .Values.migrations.mode "hook") (not .Values.restore.enabled) }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "trove.selectorLabels" (dict "root" . "component" "migrate") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress: []
{{- /*
The Jobs of trove backup open no port (R-HA-060, R-HA-042): their policies select their pods and admit nothing, as the
migration Job's does. They hold the credentials of the backup target, so no pod reaches them.
*/}}
{{- range $kind := list "backup" "restore" }}
{{- if (get $.Values $kind).enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trove.fullname" $ }}-{{ $kind }}
  labels:
    {{- include "trove.labels" (dict "root" $ "component" $kind) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "trove.selectorLabels" (dict "root" $ "component" $kind) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress: []
{{- end }}
{{- end }}
{{- end }}
