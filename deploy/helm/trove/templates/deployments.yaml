{{- /*
Two Deployments, always (R-HA-002): <fullname>-web runs "trove serve --role web" and
<fullname>-worker runs "trove serve --role worker". No value renders --role all. An endpoint
with pool.enabled adds <fullname>-web-ep-<name>, which also runs --role web (R-EP-008).
*/ -}}
{{- range $role := list "web" "worker" }}
{{- include "trove.deployment" (dict "root" $ "role" $role "pool" "" "name" $role "r" (index $.Values $role)) | nindent 0 }}
{{- end }}
{{- range $name := include "trove.endpointNames" . | fromYamlArray }}
{{- if include "trove.endpointPool" (dict "root" $ "name" $name) }}
{{- $r := include "trove.endpointPoolValues" (dict "root" $ "name" $name) | fromYaml }}
{{- include "trove.deployment" (dict "root" $ "role" "web" "pool" (printf "ep-%s" $name) "name" (printf "web-ep-%s" $name) "r" $r) | nindent 0 }}
{{- end }}
{{- end }}
