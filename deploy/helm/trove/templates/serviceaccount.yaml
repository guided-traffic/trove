{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "trove.serviceAccountName" . }}
  labels:
    {{- include "trove.labels" (dict "root" . "component" "serviceaccount") | nindent 4 }}
  {{- if or .Values.serviceAccount.annotations .Values.commonAnnotations }}
  annotations:
    {{- toYaml (merge (dict) .Values.serviceAccount.annotations .Values.commonAnnotations) | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
