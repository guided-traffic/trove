# Values of the trove chart. A value is commented where its meaning, unit, range or consequence is not evident
# from its name. Values of features the chart does not render yet (Gateway API chart-created Gateway)
# are not defined: values.schema.json refuses unknown keys, so a typo or a value of a later feature fails before
# anything renders. docs/developer/helm-chart.md lists what is in and what is not; docs/spec/ha-and-helm.md is the
# reference of every key.

# ── Global ──────────────────────────────────────────────────────────────────
global:
  imageRegistry: ""                     # empty = image.registry
  imagePullSecrets: []                  # example: [{name: registry-pull}]

nameOverride: ""
fullnameOverride: ""
commonLabels: {}
commonAnnotations: {}

image:
  registry: docker.io                   # Docker Hub (build.yml publishes there)
  repository: guidedtraffic/trove       # the image of the release pipeline
  tag: ""                               # empty = chart appVersion
  digest: ""                            # example: sha256:<64 hex>; wins over tag
  pullPolicy: IfNotPresent

highAvailability:
  enforce: true                         # >= 2 replicas, a PDB and DoNotSchedule host spreading per role; Sentinel mode with >= 3 Sentinels

# ── api Deployment: trove serve --role api ───────────────────────
# The UI, the management API, the sign-in and the CI exchange; the login secrets mount here only.
api:
  replicaCount: 2                       # ignored when autoscaling.enabled
  minReadySeconds: 10
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  terminationGracePeriodSeconds: 120    # the UI's uploads and the audit exports
  spool:
    sizeLimit: 5Gi                      # holds the UI's uploads through the content route, up to config.ui.deploy.max_upload_bytes
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 1Gi
    limits:
      memory: 1Gi                       # no CPU limit by default
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 0  # 0 = no memory metric
    metrics: []                         # additional autoscaling/v2 metric specs
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        policies:
          - type: Pods
            value: 2
            periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Pods
            value: 1
            periodSeconds: 120
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
    minAvailable: null                  # mutually exclusive with maxUnavailable
    unhealthyPodEvictionPolicy: AlwaysAllow
  topologySpread:
    enabled: true                       # render the two constraints below
    nodeTaintsPolicy: Honor             # cordoned nodes do not count as domains
    zone:
      maxSkew: 1
      whenUnsatisfiable: ScheduleAnyway
    host:
      maxSkew: 1
      whenUnsatisfiable: DoNotSchedule  # required with highAvailability.enforce
  topologySpreadConstraints: []         # non-empty replaces the generated constraints
  nodeFailureTolerationSeconds: 60      # not-ready/unreachable tolerations
  affinity: {}
  nodeSelector: {}                      # example: {kubernetes.io/arch: arm64}
  tolerations: []
  priorityClassName: ""                 # example: business-critical
  schedulerName: ""
  podAnnotations: {}
  podLabels: {}
  extraEnv: []                          # appended after the shared extraEnv
  pools: []                             # example: [{name: admin, paths: [/api/v1/repositories], replicaCount: 2}]; routed: false renders the pool without its route until its pods are ready

# ── packages Deployment: trove serve --role packages ─────────────
# The package protocols and the raw file transfer, tokens only; no login secret mounts here.
packages:
  replicaCount: 3                       # ignored when autoscaling.enabled
  minReadySeconds: 10
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  terminationGracePeriodSeconds: 120
  spool:
    sizeLimit: ""                       # empty = spool.sizeLimit
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 2Gi
    limits:
      memory: 2Gi                       # no CPU limit by default
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 0  # 0 = no memory metric
    metrics: []                         # additional autoscaling/v2 metric specs
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        policies:
          - type: Pods
            value: 2
            periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Pods
            value: 1
            periodSeconds: 120
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
    minAvailable: null                  # mutually exclusive with maxUnavailable
    unhealthyPodEvictionPolicy: AlwaysAllow
  topologySpread:
    enabled: true                       # render the two constraints below
    nodeTaintsPolicy: Honor             # cordoned nodes do not count as domains
    zone:
      maxSkew: 1
      whenUnsatisfiable: ScheduleAnyway
    host:
      maxSkew: 1
      whenUnsatisfiable: DoNotSchedule  # required with highAvailability.enforce
  topologySpreadConstraints: []         # non-empty replaces the generated constraints
  nodeFailureTolerationSeconds: 60      # not-ready/unreachable tolerations
  affinity: {}
  nodeSelector: {}                      # example: {kubernetes.io/arch: arm64}
  tolerations: []
  priorityClassName: ""                 # example: business-critical
  schedulerName: ""
  podAnnotations: {}
  podLabels: {}
  extraEnv: []                          # appended after the shared extraEnv
  pools: []                             # example: [{name: npm, paths: [/api/npm], replicaCount: 4}]; routed: false renders the pool without its route until its pods are ready

# ── web Deployment: the bridge of the upgrade across the cut ─────
# Rendered only with web.enabled: trove serve --role web, the Service <fullname> and the edge of the releases
# before the cut. Every other key keeps its meaning and default of those releases; a fresh installation never sets it.
web:
  enabled: false                        # true for steps 1 and 2 of the cut (R-HA-064)
  routed: true                          # false in step 2: the edge moves to api and packages while the bridge still runs
  replicaCount: 3                       # ignored when autoscaling.enabled
  minReadySeconds: 10
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  terminationGracePeriodSeconds: 120
  spool:
    sizeLimit: ""                       # empty = spool.sizeLimit
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 2Gi
    limits:
      memory: 2Gi                       # no CPU limit by default
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 0  # 0 = no memory metric
    metrics: []                         # additional autoscaling/v2 metric specs
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        policies:
          - type: Pods
            value: 2
            periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Pods
            value: 1
            periodSeconds: 120
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
    minAvailable: null                  # mutually exclusive with maxUnavailable
    unhealthyPodEvictionPolicy: AlwaysAllow
  topologySpread:
    enabled: true                       # render the two constraints below
    nodeTaintsPolicy: Honor             # cordoned nodes do not count as domains
    zone:
      maxSkew: 1
      whenUnsatisfiable: ScheduleAnyway
    host:
      maxSkew: 1
      whenUnsatisfiable: DoNotSchedule  # required with highAvailability.enforce
  topologySpreadConstraints: []         # non-empty replaces the generated constraints
  nodeFailureTolerationSeconds: 60      # not-ready/unreachable tolerations
  affinity: {}
  nodeSelector: {}                      # example: {kubernetes.io/arch: arm64}
  tolerations: []
  priorityClassName: ""                 # example: business-critical
  schedulerName: ""
  podAnnotations: {}
  podLabels: {}
  extraEnv: []                          # appended after the shared extraEnv
  pools: []                             # kept for the releases before the cut; ignored, the bridge renders no path pool

# ── worker Deployment: trove serve --role worker ─────────────────
worker:
  replicaCount: 2
  minReadySeconds: 10
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  terminationGracePeriodSeconds: 300    # jobs persist their cursor before exit
  spool:
    sizeLimit: 5Gi                      # workers spool only cache fills of jobs, the artifacts of a mirror pass (at most the background share B of a repository at a time, each up to the repository maxArtifactBytes), one advisory archive while a sync runs (config.vulnerabilities.sources.osv.max_archive_size, validated) and, from P1, the nuget-symbol-index job's one extracted PDB at a time (formats/nuget.md)
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 1Gi
    limits:
      memory: 1Gi                       # includes the remote engine a worker builds for mirror passes: 16 MiB of metadata bytes, 10,000 negative entries and no query cache (Q-ARCH-317)
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 0
    metrics: []
    behavior: {}                        # Kubernetes defaults
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
    minAvailable: null
    unhealthyPodEvictionPolicy: AlwaysAllow
  topologySpread:
    enabled: true
    nodeTaintsPolicy: Honor
    zone:
      maxSkew: 1
      whenUnsatisfiable: ScheduleAnyway
    host:
      maxSkew: 1
      whenUnsatisfiable: DoNotSchedule  # workers spread evenly; with nodes ≥ replicas no two share a node (INV-12)
  topologySpreadConstraints: []
  nodeFailureTolerationSeconds: 60
  affinity: {}
  nodeSelector: {}
  tolerations: []
  priorityClassName: ""
  schedulerName: ""
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  pools: []                             # example: [{name: vuln, queues: [vuln], replicaCount: 2}]; the main worker claims every queue no pool lists

# ── trove configuration (rendered to /etc/trove/trove.yaml) ─────────────────
# Chart-managed keys (secret file paths, storage.spool.dir) must not be set here.
# One file serves every Deployment and Job; the role is the container argument --role.
# The subtree is free-form until the binary emits its JSON Schema (internal/config/schema.json);
# the keys below are the ones the chart reads itself or that are required.
config:
  server:                               # operations-and-observability.md
    base_url: ""                        # required; example: https://trove.example.com
    trusted_proxies: []                 # no proxy is trusted, the TCP peer is the client; example: ["10.244.3.17", "10.244.5.9"] (the addresses of the ingress controller pods, never the whole pod CIDR; a prefix of length 0 is refused)
    forwarded_header: x-forwarded-for   # the one header the edge rewrites, x-forwarded-for | forwarded; the other is never read
  health:                               # operations-and-observability.md
    shutdown_drain_delay: 5s            # default; must exceed the edge's endpoint removal time (0.2 to 1.8 s measured for HAProxy Ingress on the CI runners, R-HA-059)
  log:
    level: info
  database:                             # ha-and-helm.md
    host: ""                            # required; example: trove-db-rw.trove.svc
    port: 5432
    name: trove
    ssl_mode: verify-full
    session_host: ""                    # empty = host (the migration Job connects there)
  valkey:                               # ha-and-helm.md
    mode: sentinel                      # sentinel | standalone (development only)
    sentinel:
      addresses: []                     # required; example: [trove-valkey-sentinel-0.trove-valkey-sentinel.trove.svc:26379, trove-valkey-sentinel-1.trove-valkey-sentinel.trove.svc:26379, trove-valkey-sentinel-2.trove-valkey-sentinel.trove.svc:26379]
      primary_name: ""                  # required; example: trove
      tls: true
    address: ""                         # standalone mode only; example: trove-valkey.trove.svc:6379
    tls:
      mode: verify-full                 # verify-full | verify-ca | disable
    allow_insecure: false
  storage:                              # storage.md
    s3:
      bucket: ""                        # required; example: trove-blobs
      region: ""                        # example: eu-central-1
      endpoint: ""                      # AWS resolution; example: http://trove-s3.trove.svc:9000
      force_path_style: false           # true for SeaweedFS, MinIO and Ceph RGW
      credentials:
        source: default                 # default | webIdentity | static
    upload:
      max_size: 10GiB                   # must fit the spool
  metrics:
    auth: none                          # none | static (needs secrets.metricsToken)
  backup:                               # backup-and-restore.md R-BAK-011 owns these keys; the chart manages manual_run and the credential and CA file paths of the target
    target:
      endpoint: ""                      # AWS resolution; example: https://s3.eu-central-1.amazonaws.com
      region: ""                        # example: eu-central-1
      bucket: ""                        # required with backup.enabled or restore.enabled; example: trove-backups
      credentials:
        source: default                 # default | webIdentity | static (secrets.backupTarget)
    expected_interval: 24h              # drives TroveBackupStale through its gauge; the chart reads it for the window of the alert on a backup that never ran (R-HA-045)
  auth:                                 # identity-and-authentication.md
    login_page:
      auto_redirect: true               # true: with exactly one OIDC provider the sign-in page goes straight to it; /ui/login?auto_sign_in=false still shows the page with the break-glass form. false: the page lists the providers
  # The vulnerability scanning (docs/spec/vulnerability-scanning.md). Every key has a default in the binary and
  # is rendered only when set here; the chart reads three of them: enabled, sources.osv.mode and sources.osv.max_archive_size
  # (the worker spool must hold one archive, validated), and stale_after (the threshold of TroveVulnerabilityDataStale).
  # vulnerabilities:
  #   enabled: true
  #   enforcement: enforce              # enforce | report
  #   stale_after: 24h
  #   sources:
  #     osv:
  #       mode: online                  # online | repository | off
  #       max_archive_size: 1GiB        # at most the worker spool budget (worker.spool.sizeLimit - spool.headroom)
  # The NuGet format (docs/developer/configuration.md). Every key has a default and
  # is rendered only when set here; the settings of one repository (deleteMode, forwardSearch) are in its document, not in this file.
  # nuget:
  #   archive:
  #     max_nuspec_bytes: 1MiB          # 1KiB to 1MiB, can only be tightened
  #     max_entries: 65535              # entries the central directory of a package may declare
  #     max_uncompressed_bytes: 4GiB    # the sum of the declared sizes of a package
  #     max_compression_ratio: 100      # 1 to 100, of an entry read into memory
  #   registration:
  #     page_size: 64                   # versions per registration page
  #     inline_below: 128               # a package with fewer visible versions has its pages inlined
  #   search:
  #     default_take: 20                # at most max_take
  #     max_take: 1000
  #     max_skip: 3000                  # a larger skip answers 400
  #     virtual_merge_window: 1000      # results per member a virtual repository merges
  #     remote_result_ttl: 60s          # how long a forwarded search answer is kept, at most 1h
  # System role bindings. The migration Job (trove migrate) applies the list on every install
  # and upgrade and removes the bindings taken out of it; the API and the UI show them read-only. A group that does not
  # exist is created, and the login provider's group sync fills it: a rule of config.auth.oidc.providers.<id>.group_sync
  # must map the IdP group to the same name. A user or service account must exist, or the Job fails. Whoever controls the
  # membership of a declared IdP group holds the role. The default is no declaration.
  # authz:
  #   role_bindings:
  #     - role: admin                   # example: admin | security-admin | auditor | repository-admin | webhook-admin
  #       group: gh-wds18-k8s-main-admins   # exactly one of group, user, service_account
  #     - role: auditor                 # example: reads every repository's metadata and the configuration, changes nothing
  #       group: gh-wds18-k8s-main-auditors
  # GitLab CI OIDC federation (docs/spec/gitlab-ci-oidc.md, docs/developer/configuration.md). Every key has a default and is
  # rendered only when set here. ci.issuers declares GitLab instances as trusted CI issuers: the migration Job applies the list
  # on every install and upgrade (an issuer taken out of it is disabled, not deleted), the API and the UI show them read-only
  # with source "configuration", and their mappings are managed through the API.
  # ci:
  #   token:
  #     default_ttl: 15m                # lifetime of a CI token that asks for none
  #     max_ttl: 1h                     # at most auth.tokens.cit.max_ttl (6h), or the pod does not start
  #     min_ttl: 30s
  #   exchange:
  #   enabled: true
  #     expose_reason: true             # false leaves the reason out of the 400 answers
  #     rate_limit:
  #       per_client_ip_per_minute: 600 # cluster-wide
  #       per_client_ip_burst: 100
  #       per_subject_per_minute: 300   # per issuer and project, cluster-wide
  #       per_subject_burst: 100
  #       exempt_cidrs: []              # example: ["10.20.0.0/16"], a runner network behind NAT
  #   signing_keys:
  #     max_stale: 24h                  # older key sets fail closed with 503
  #   mappings:
  #     max_per_issuer: 1000            # mappings of one issuer, all tiers
  #     max_per_project: 100            # of one project's tier on one issuer, at most max_per_issuer
  #   replay:
  #     retention_after_expiry: 15m     # at least 1m, the margin for a replica clock behind the database's
  #   issuers:
  #     - name: gitlab-main             # example: ^[a-z0-9][a-z0-9._-]{1,63}$
  #       kind: gitlab                  # the only kind of this release
  #       issuer: https://gitlab.example.com   # example: https, exactly the iss of the ID tokens
  #       public_issuer: false          # example: an instance without open sign-up; default true
  #       allowed_audiences: ["https://packages.example.com"]   # without it the base URL and npm:<host name>
  #       ca_bundle_ref: file:/var/run/secrets/gitlab-ca/ca.crt  # example: an instance behind a private CA

# ── TLS on trove's own listeners ────────────────────
# The chart never creates the Secret. It holds the keys of a cert-manager TLS Secret (tls.crt,
# tls.key and, for the edge and for Prometheus, ca.crt). Mounted as a directory volume without
# subPath, so a rotated Secret reaches the pod through the kubelet's atomic swap and the process
# reloads the files (tls.reloadInterval). tls.* configures the default client listener :8080 and
# the operations listener :8081; each entry of endpoints carries its own tls block.
tls:
  enabled: true                         # false = plain HTTP inside the cluster
  secretName: ""                        # required with tls.enabled; example: trove-tls (cert-manager Certificate secretName)
  certKey: tls.crt                      # key of the certificate chain in the Secret
  keyKey: tls.key                       # key of the private key in the Secret
  minVersion: "1.2"                     # "1.2" | "1.3" (server.tls.min_version)
  reloadInterval: 10s                   # content poll of the mounted files (server.tls.reload_interval)
  clientCA:                             # optional mutual TLS: the edge must present a client certificate
    secretName: ""                      # empty = no client certificates requested; example: trove-edge-ca
    key: ca.crt                         # key of the CA bundle in that Secret
    auth: require                       # require | verify_if_given (server.tls.client_auth)
  ops:                                  # optional separate certificate for:8081 (probes, metrics); empty = same material as:8080. Recommended with endpoint pools and workers: only then the listener private key of:8080 stays out of the pods that do not serve it
    secretName: ""                      # example: trove-ops-tls
    certKey: tls.crt
    keyKey: tls.key
  backendTLSPolicy:                     # Gateway API: how the Gateway verifies trove (needs the BackendTLSPolicy CRD)
    enabled: false
    caConfigMapName: ""                 # required when enabled; example: trove-tls-ca (a ConfigMap with ca.crt: Gateway API takes no Secret here)
    hostname: ""                        # empty = <fullname>.<namespace>.svc; must be a SAN of the certificate

# ── Existing Secrets (the chart never creates one) ──────────────────────────
secrets:
  database:
    existingSecret: ""                  # required; example: trove-db-app (CloudNativePG application Secret)
    usernameKey: username
    passwordKey: password
  databaseMigration:
    existingSecret: ""                  # empty = single-role mode; example: trove-db-owner
    usernameKey: username
    passwordKey: password
  databaseBackup:
    existingSecret: ""                  # empty = secrets.database; the backup pods only; example: trove-db-backup (the login of database.backup_role)
    usernameKey: username
    passwordKey: password
  databaseCA:
    existingSecret: ""                  # example: trove-db-ca (only ca.crt is projected)
    key: ca.crt
  databaseClientCert:
    existingSecret: ""                  # no client certificate
    certKey: tls.crt
    keyKey: tls.key
  s3:
    existingSecret: ""                  # required with credentials.source static; also the Secret of an S3 provisioner when a *Key below is set
    accessKeyIdKey: access-key-id       # example (provisioner Secret): AWS_ACCESS_KEY_ID
    secretAccessKeyKey: secret-access-key  # example (provisioner Secret): AWS_SECRET_ACCESS_KEY
    bucketKey: ""                       # the bucket comes from config.storage.s3.bucket; example (provisioner Secret): S3_BUCKET; set = TROVE_STORAGE_S3_BUCKET reads this key of the Secret
    regionKey: ""                       # config.storage.s3.region; example (provisioner Secret): S3_REGION; set = TROVE_STORAGE_S3_REGION reads this key
    endpointKey: ""                     # config.storage.s3.endpoint; example (provisioner Secret): S3_ENDPOINT (a host without scheme, which trove reaches over https); set = TROVE_STORAGE_S3_ENDPOINT reads this key
  valkey:
    existingSecret: ""                  # required; example: trove-valkey
    usernameKey: username               # empty = the "default" user, the file is not mounted
    passwordKey: password
  valkeySentinel:
    existingSecret: ""                  # Sentinels without authentication; example: trove-valkey-sentinel
    usernameKey: ""                     # empty = no Sentinel user, the file is not mounted
    passwordKey: password
  backupTarget:
    existingSecret: ""                  # required with config.backup.target.credentials.source static while backup.enabled or restore.enabled; the backup and restore pods only
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key
    sessionTokenKey: ""                 # empty = no session token
  backupSource:
    existingSecret: ""                  # required with config.storage.s3.credentials.source static and backup.enabled; the backup pods only. A login that may only read the blob bucket (s3:GetObject, s3:ListBucket), so a compromised backup pod cannot write the blobs or the journal (R-BAK-015)
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key
  journalReader:
    existingSecret: ""                  # required with journalCredentials.source static of postRestore or restore; those Jobs only. A login that may list the object versions of the blob bucket (s3:ListBucketVersions), which the runtime credential deliberately lacks (R-HA-023)
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key
  backupTargetCA:
    existingSecret: ""                  # empty = the system trust store; the backup and restore pods only; example: trove-backup-target-tls. Renders backup.target.ca_file
    key: ca.crt
  s3CA:
    existingSecret: ""                  # empty = the outbound trust store (system roots plus config.proxy.outbound.tls.ca_files); example: trove-s3-tls. Renders storage.s3.ca_file
    key: ca.crt
  valkeyCA:
    existingSecret: ""                  # empty = system roots; example: trove-valkey-ca
    key: ca.crt
  valkeyClientCert:
    existingSecret: ""                  # no client certificate; needed while Valkey keeps tls-auth-clients yes
    certKey: tls.crt
    keyKey: tls.key
  oidc: []                              # no client secrets; mounted in api pods only. Each entry mounts the Secret at /var/run/secrets/trove/oidc-<providerId>/ and renders client_secret_file of that provider; the provider itself is config.auth.oidc.providers.<providerId>
  #  - providerId: corp                 # the ID of a provider in config.auth.oidc.providers ([a-z0-9-], at most 32)
  #    existingSecret: trove-oidc-corp
  #    key: client-secret
  breakGlass:
    existingSecret: ""                  # empty = config.auth.break_glass.enabled false; example: trove-break-glass. api pods only
    key: password                       # plaintext (at least 20 characters) or an Argon2id PHC hash
  encryption:
    existingSecret: ""                  # required; example: trove-encryption-keys
    keys: []                            # required; ordered, first = active; example: [2026-10.key, 2026-04.key]
  metricsToken:
    existingSecret: ""                  # needed with config.metrics.auth static
    key: token

# ── Monitoring (the alerts of the vulnerability scanning, the mirror and the bridge so far) ─
metrics:
  serviceMonitor:
    enabled: false                      # needs the Prometheus operator's CRDs
    namespace: ""                       # release namespace; with tls.enabled it must be the release namespace, because the CA Secret is read from the ServiceMonitor's namespace
    interval: 30s
    scrapeTimeout: 10s
    labels: {}                          # example: {release: kube-prometheus-stack}
    relabelings: []                     # appended after the fixed role and pool relabelings
    metricRelabelings: []
  prometheusRule:
    enabled: false                      # needs the Prometheus operator's CRDs
    labels: {}                          # example: {release: kube-prometheus-stack}
    disabledAlerts: []                  # example: [TroveVulnerabilitySyncFailing]
    extraRules: []                      # appended after the alerts of the chart

# ── Network policy: ingress rules only, one policy per Deployment, each rule with its port ─
# No egress value exists: the chart renders no egress rule and no policy for pods it does not deploy.
networkPolicy:
  enabled: true                         # every Deployment accepts only the ports it opens, from the listed peers; the migration Job accepts nothing
  ingress:
    http:
      from: []                          # empty = port 8080 from anywhere, so the ingress controller works wherever it runs; example: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik}}}]
    ops:
      from:                             # port 8081 (probes, metrics) only from the monitoring namespace and probeCIDRs
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    probeCIDRs: []                      # most CNIs exempt kubelet probes; where one does not, list the node CIDRs; example: ["10.0.0.0/16"]

# ── Pod identity and security ──────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""                              # <fullname>
  annotations: {}                       # example (IRSA): {eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/trove-s3"}
  automountServiceAccountToken: false   # trove never calls the Kubernetes API

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532                      # null on OpenShift (restricted-v2 assigns the UID)
  runAsGroup: 65532                     # null on OpenShift
  fsGroup: 65532                        # null on OpenShift
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

# ── Volumes (nothing ReadWriteMany, nothing persistent) ─
spool:
  type: emptyDir                        # emptyDir | ephemeral
  sizeLimit: 20Gi                       # web.spool and worker.spool override it
  headroom: 2GiB                        # sizeLimit - headroom = storage.spool.max_bytes
  medium: ""                            # node disk; "Memory" counts against the memory limit
  ephemeral:
    storageClassName: ""                # cluster default
    size: 50Gi                          # used with type ephemeral
    accessModes: [ReadWriteOnce]        # ReadWriteOnce | ReadWriteOncePod; nothing else validates

tmp:
  sizeLimit: 1Gi                        # /tmp under readOnlyRootFilesystem

# ── Probes ────────────────────────────────
probes:
  startup:
    enabled: true
    path: /healthz
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 60                # 2 minutes to bind the listeners
    custom: {}                          # replaces the generated probe
  liveness:
    enabled: true
    path: /healthz
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
    custom: {}
  readiness:
    enabled: true
    path: /readyz
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 1                 # debouncing happens in the process (health.failure_threshold)
    successThreshold: 1
    custom: {}

# ── Exposure ───────────────────────────────────────────────────────────────
service:
  type: ClusterIP                       # ClusterIP | LoadBalancer | NodePort
  port: 8080
  opsPort: 8081
  # The role Services <fullname>-api and <fullname>-packages, the Services of the path pools and, with web.enabled, <fullname> take type and port from here.
  # A LoadBalancer or NodePort role Service reaches one role only: a host is split between roles at the Ingress.
  # No sessionAffinity value: every Service renders sessionAffinity: None.
  annotations: {}
  labels: {}

ingress:
  enabled: false
  className: ""                         # cluster default IngressClass; example: traefik
  annotations: {}                       # controller-specific settings; never cookie affinity
  labels: {}
  hosts: []                             # empty = host of config.server.base_url
  # No path value: every host gets the fixed path rules (Prefix rules per route family onto <fullname>-api and
  # <fullname>-packages, plus the paths of api.pools and packages.pools; / onto <fullname> with web.enabled).
  tls: []                               # example: [{secretName: trove-tls, hosts: [trove.example.com]}]
  backendTLS:                           # how the controller reaches trove when tls.enabled; trove speaks HTTPS, so the controller must too
    controller: haproxy                 # haproxy (HAProxy Ingress, the primary target) | traefik | ingress-nginx | manual (you set the backend protocol in ingress.annotations / service.annotations)
    verify: true                        # the controller verifies the trove certificate; needs caSecret (haproxy, ingress-nginx) or serversTransport (traefik); false = encrypted but unverified
    caSecret: ""                        # required with verify on haproxy and ingress-nginx; Secret in the release namespace with ca.crt; example: trove-tls (a cert-manager Secret carries ca.crt)
    clientCertSecret: ""                # haproxy: Secret with tls.crt and tls.key that HAProxy Ingress presents to trove (required with tls.clientCA); example: trove-edge-client
    serversTransport: ""                # traefik: ServersTransport reference <namespace>-<name>@kubernetescrd that verifies trove; example: trove-trove-tls@kubernetescrd

gateway:
  enabled: false                        # an HTTPRoute (gateway.networking.k8s.io/v1, Gateway API v1.2 or later) with the path rules of the Ingress; may run beside ingress.enabled
  parentRefs: []                        # required with enabled; the platform-owned Gateway; example: [{name: shared, namespace: gateway-system, sectionName: https}]
  hostnames: []                         # empty = host of config.server.base_url
  annotations: {}
  labels: {}
  timeouts:
    request: 3600s                      # on every rule; backendRequest must not exceed it
    backendRequest: 3600s
  filters: []                           # HTTPRoute filters on every path rule; example: [{type: RequestHeaderModifier, requestHeaderModifier: {set: [{name: X-Edge, value: gw}]}}]
  extraRules: []                        # HTTPRoute rules appended after the path rules

# ── Endpoints (docs/spec/endpoints.md) ──────────────────────────
# Further client entry points, each with its own listener port, Service, Ingress, NetworkPolicy,
# certificates and optionally its own pool of pods per role its surface holds. The default endpoint (:8080, config.server.base_url,
# tls.*, ingress.*) always exists; an entry named default tunes it, with these keys only: hosts,
# wildcardHost, hostRoots, surface, auth, exposure, cacheFill, rateLimitClass, replicaHeader.
# The chart renders the entries into server.endpoints of trove.yaml; config.server.endpoints is refused.
# Values of a further endpoint are listed once here and carry their defaults.
endpoints: {}                           # only the default endpoint; example:
#  default:                             # optional
#    hosts: []                          # with a further endpoint, the hosts of config.server.base_url and additional_base_urls; add the in-cluster Service name here when clients use it
#  customers:                           # example: the endpoint name, ^[a-z][a-z0-9-]{0,19}$, <fullname>-ep-<name> at most 63 characters
#    port: 8443                         # required; container port and Service port; not 8080, 8081 or another endpoint's port
#    baseUrl: https://packages.example.com   # required; an origin (scheme, host, optional port)
#    hosts: []                          # example [pkgs.example.org]
#    wildcardHost: ""                   # example "*.packages.example.com" (one label, at least two labels in the domain)
#    hostRoots: {}                      # host -> qualified repository name <projectKey>/<repoKey>; binds the host's /v2/ to an OCI repository (Docker Engine mirror)
#    surface: [packages]                # ui is not allowed on a further endpoint; api, ci_exchange, files are off by default
#    auth: {tokenTypes: [sat], boundTokensOnly: true, anonymous: false}   # enforced from the identity milestone
#    exposure: rules                    # rules | all; enforced from the exposure milestone
#    cacheFill: false
#    rateLimitClass: external
#    replicaHeader: never               # authenticated | always | never
#    maxInFlight: 1024                  # per replica and endpoint
#    trustedProxies: []                 # config.server.trusted_proxies
#    tls:
#      existingSecret: ""               # "" = the pair of tls.secretName; example trove-packages-tls (keys tls.crt, tls.key)
#      extraSecrets: []                 # example [trove-packages-wildcard-tls]: further pairs, chosen by SNI
#      clientCaSecret: ""               # no client certificates; example trove-customer-ca (key ca.crt)
#    pool:
#      enabled: false                   # served by the main Deployments of the roles the surface holds; true renders <fullname>-packages-ep-<name> and, with api families, <fullname>-api-ep-<name> (<fullname>-web-ep-<name> with web.enabled)
#      replicaCount: 2                  # every key of the role's values (api or packages) may be overridden here
#    service:
#      type: ClusterIP                  # ClusterIP | LoadBalancer | NodePort
#      annotations: {}
#      loadBalancerSourceRanges: []
#    ingress:
#      enabled: false
#      className: ""                    # cluster default IngressClass; example traefik-external
#      annotations: {}
#      tls: []                          # example [{secretName: packages-tls, hosts: [packages.example.com, "*.packages.example.com"]}]
#      backendTLS: {}                   # ingress.backendTLS; any key given here wins for this endpoint (controller, verify, caSecret, ...)
#    networkPolicy:
#      from: []                         # empty = from anywhere

# ── Migrations ──────────────────────────────────────────────────
migrations:
  mode: hook                            # hook | disabled
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  podAnnotations: {}
  extraEnv: []

# ── Post-restore Job (R-HA-025 step 4) ───────────────────────────────────────
# The clean-up after a platform (point-in-time) restore: a post-install and post-upgrade hook that Helm waits for. Run it while every
# role is at zero. A restore with restore.enabled runs the same clean-up itself.
postRestore:
  hold: false                           # R-HA-025 step 1: every role and pool may be at zero (replicaCount 0 and autoscaling off are required, nothing else of the role minimums applies) and the backup CronJob is suspended, with no Job; the upgrade of the steps after it keeps it until the final one without it
  enabled: false
  restoredTo: ""                        # required with enabled, the time t the platform restore went to, RFC 3339; example: "2026-10-28T09:15:00Z"
  skipRevocationJournal: false          # only when the source's bucket is gone (R-BAK-024)
  journalCredentials:
    source: runtime                     # runtime (the blob store's credential, a plain listing) | default (the identity of the Job's ServiceAccount lists object versions) | static (secrets.journalReader)
  backoffLimit: 2                       # a retry applies the clean-up again; its steps are safe to repeat
  activeDeadlineSeconds: 0              # 0 = not rendered
  terminationGracePeriodSeconds: 60     # at least 30
  serviceAccount:
    create: true
    name: ""                            # <fullname>-post-restore
    annotations: {}                     # example (IRSA, with s3:ListBucketVersions on the blob bucket when journalCredentials.source is default): {eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/trove-post-restore"}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  podAnnotations: {}                    # safe-to-evict: "false" is always added
  extraEnv: []
  extraVolumes: []                      # the post-restore Job's own, like extraEnv: it holds the owner login, the blob store and the journal reader, never the target (R-BAK-015); see backup.extraVolumes
  extraVolumeMounts: []

# ── Backup CronJob and restore Job (R-HA-060, R-BAK-012) ──────────────────────
# Both are Jobs of the binary's command `trove backup`, not roles. They serve nothing, open no port and mount no volume but /tmp and the extra volumes of their own values.
backup:
  enabled: false                        # true turns the backup on and then needs config.backup.target.bucket
  schedule: "0 2 * * *"                 # five fields or one of the @-macros, the dialect of trove's cron parser; no seconds, no ?, day of week 0-6, no @every, no TZ=
  timeZone: Etc/UTC
  suspend: false                        # rendered true while restore.enabled
  adoptTarget: false                    # adds --adopt-target, to adopt the target of the installation this one was restored from (R-BAK-002)
  startingDeadlineSeconds: 3600         # a run missed by more than this is skipped, not started late
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 2                       # a drain or an eviction is not counted (podFailurePolicy)
  activeDeadlineSeconds: 0              # 0 = not rendered: a first backup of a large installation takes many hours, and a hung run cancels itself after config.backup.stall_timeout
  terminationGracePeriodSeconds: 60     # at least 30: time to end the run as interrupted
  tmpSizeLimit: 256Mi                   # the only volume the chart adds; the commands use at most 64 MiB of it
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      memory: 1Gi
  serviceAccount:
    create: true
    name: ""                            # <fullname>-backup
    annotations: {}                     # example (IRSA, read on the blob bucket, write on the target): {eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/trove-backup"}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  podAnnotations: {}                    # cluster-autoscaler.kubernetes.io/safe-to-evict: "false" is always added
  podLabels: {}
  extraEnv: []
  extraVolumes: []                      # the backup pod's own, like extraEnv: the global extraVolumes reach the Deployments only (Q-HA-149); a file the configuration names (proxy.outbound.tls.ca_files) must exist here
  extraVolumeMounts: []

restore:
  enabled: false                        # renders the restore Job, no migration Job and a suspended CronJob; every role and pool must have no replica
  backupId: ""                          # required with enabled; example: 20261028T020000Z-7f3a
  skipRevocationJournal: false          # only when the source's bucket is gone (R-BAK-024)
  extraArgs: []                         # appended to trove backup restore; example: [--check] for a run of the preconditions only
  journalCredentials:
    source: runtime                     # runtime (the blob store's credential, a plain listing) | default (the identity of the Job's ServiceAccount lists object versions) | static (secrets.journalReader); anything but runtime keeps a deletion with the runtime credential from hiding a journal entry (R-BAK-015)
  backoffLimit: 2                       # a drain or an eviction is not counted; every retry resumes from the anchor
  activeDeadlineSeconds: 0              # 0 = not rendered
  terminationGracePeriodSeconds: 60     # at least 30
  serviceAccount:
    create: true
    name: ""                            # <fullname>-restore
    annotations: {}                     # example (IRSA, read on the target, write on the new blob prefix, read on the source's journal): {eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/trove-restore"}
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      memory: 2Gi
  podAnnotations: {}                    # safe-to-evict: "false" is always added, as for backup pods
  extraEnv: []
  extraVolumes: []                      # the restore Job's own, like extraEnv; see backup.extraVolumes
  extraVolumeMounts: []

# ── Extension points ────────────────────────────────────────────
extraEnv: []                            # example: [{name: TROVE_LOG_LEVEL, value: debug}]
extraEnvFrom: []
extraVolumes: []                        # the operator's, for the Deployments only (the Jobs take backup.extraVolumes and restore.extraVolumes, Q-HA-149); the chart's volume check cannot see a claim's access mode
extraVolumeMounts: []
extraObjects: []                        # extra manifests rendered with tpl
