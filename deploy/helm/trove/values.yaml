# Skeleton values of the trove chart (M0). Every value carries "# default (proposed)" or
# "# example", as in docs/spec/ha-and-helm.md R-HA-031. Values of later phases (autoscaling,
# NetworkPolicy, Gateway, monitoring, backup, restore, pools) are not defined yet:
# values.schema.json refuses unknown keys, so a typo or a value of a later phase fails
# before anything renders. docs/developer/helm-chart.md lists what is in and what is not.

# ── Global ──────────────────────────────────────────────────────────────────
global:
  imageRegistry: ""                     # default (proposed): empty = image.registry
  imagePullSecrets: []                  # default (proposed); example: [{name: registry-pull}]

nameOverride: ""                        # default (proposed)
fullnameOverride: ""                    # default (proposed)
commonLabels: {}                        # default (proposed)
commonAnnotations: {}                   # default (proposed)

image:
  registry: ghcr.io                     # default (proposed) (Q-HA-11)
  repository: guided-traffic/trove      # default (proposed)
  tag: ""                               # default (proposed): empty = chart appVersion
  digest: ""                            # default (proposed); example: sha256:<64 hex>; wins over tag
  pullPolicy: IfNotPresent              # default (proposed)

highAvailability:
  enforce: true                         # default (proposed): >= 2 replicas, a PDB and DoNotSchedule host spreading per role; Sentinel mode with >= 3 Sentinels (R-HA-029)

# ── web Deployment: trove serve --role web (R-HA-002) ───────────────────────
web:
  replicaCount: 3                       # default (proposed) (Q-HA-16)
  minReadySeconds: 10                   # default (proposed)
  revisionHistoryLimit: 5               # default (proposed)
  strategy:
    type: RollingUpdate                 # default (proposed)
    rollingUpdate:
      maxSurge: 1                       # default (proposed)
      maxUnavailable: 0                 # default (proposed)
  terminationGracePeriodSeconds: 120    # default (proposed) (R-HA-011)
  spool:
    sizeLimit: ""                       # default (proposed): empty = spool.sizeLimit (R-HA-035)
  resources:
    requests:
      cpu: "1"                          # default (proposed)
      memory: 1Gi                       # default (proposed)
      ephemeral-storage: 2Gi            # default (proposed)
    limits:
      memory: 2Gi                       # default (proposed); no CPU limit by default (R-HA-036)
  podDisruptionBudget:
    enabled: true                       # default (proposed)
    maxUnavailable: 1                   # default (proposed)
    minAvailable: null                  # default (proposed); mutually exclusive with maxUnavailable
    unhealthyPodEvictionPolicy: AlwaysAllow  # default (proposed) (R-HA-008)
  topologySpread:
    enabled: true                       # default (proposed): render the two constraints below
    nodeTaintsPolicy: Honor             # default (proposed): cordoned nodes do not count as domains (R-HA-059)
    zone:
      maxSkew: 1                        # default (proposed)
      whenUnsatisfiable: ScheduleAnyway # default (proposed)
    host:
      maxSkew: 1                        # default (proposed)
      whenUnsatisfiable: DoNotSchedule  # default (proposed); required with highAvailability.enforce
  topologySpreadConstraints: []         # default (proposed); non-empty replaces the generated constraints
  nodeFailureTolerationSeconds: 60      # default (proposed); not-ready/unreachable tolerations (R-HA-032)
  affinity: {}                          # default (proposed)
  nodeSelector: {}                      # default (proposed); example: {kubernetes.io/arch: arm64}
  tolerations: []                       # default (proposed)
  priorityClassName: ""                 # default (proposed); example: business-critical
  schedulerName: ""                     # default (proposed)
  podAnnotations: {}                    # default (proposed)
  podLabels: {}                         # default (proposed)
  extraEnv: []                          # default (proposed); appended after the shared extraEnv

# ── worker Deployment: trove serve --role worker (R-HA-002) ─────────────────
worker:
  replicaCount: 2                       # default (proposed) (Q-HA-16); at least 1 (R-HA-002)
  minReadySeconds: 10                   # default (proposed)
  revisionHistoryLimit: 5               # default (proposed)
  strategy:
    type: RollingUpdate                 # default (proposed)
    rollingUpdate:
      maxSurge: 1                       # default (proposed)
      maxUnavailable: 0                 # default (proposed)
  terminationGracePeriodSeconds: 300    # default (proposed): jobs persist their cursor before exit
  spool:
    sizeLimit: 5Gi                      # default (proposed) in storage.md R-HA-035: workers spool only job output (reports, cache fills) and accept no uploads, so config.storage.upload.max_size need not fit (the binary checks that rule on web and all only)
  resources:
    requests:
      cpu: 500m                         # default (proposed)
      memory: 512Mi                     # default (proposed)
      ephemeral-storage: 1Gi            # default (proposed)
    limits:
      memory: 1Gi                       # default (proposed)
  podDisruptionBudget:
    enabled: true                       # default (proposed)
    maxUnavailable: 1                   # default (proposed)
    minAvailable: null                  # default (proposed)
    unhealthyPodEvictionPolicy: AlwaysAllow  # default (proposed)
  topologySpread:
    enabled: true                       # default (proposed)
    nodeTaintsPolicy: Honor             # default (proposed)
    zone:
      maxSkew: 1                        # default (proposed)
      whenUnsatisfiable: ScheduleAnyway # default (proposed)
    host:
      maxSkew: 1                        # default (proposed)
      whenUnsatisfiable: DoNotSchedule  # default (proposed): workers spread evenly (INV-12)
  topologySpreadConstraints: []         # default (proposed)
  nodeFailureTolerationSeconds: 60      # default (proposed)
  affinity: {}                          # default (proposed)
  nodeSelector: {}                      # default (proposed)
  tolerations: []                       # default (proposed)
  priorityClassName: ""                 # default (proposed)
  schedulerName: ""                     # default (proposed)
  podAnnotations: {}                    # default (proposed)
  podLabels: {}                         # default (proposed)
  extraEnv: []                          # default (proposed)

# ── trove configuration (rendered to /etc/trove/trove.yaml) ─────────────────
# Chart-managed keys (secret file paths, storage.spool.dir) must not be set here (R-HA-029).
# One file serves every Deployment and Job; the role is the container argument --role (R-HA-002).
# The subtree is free-form until the binary emits its JSON Schema (internal/config/schema.json);
# the keys below are the ones the chart reads itself or that are required.
config:
  server:                               # operations-and-observability.md R-OPS-005
    base_url: ""                        # required; example: https://trove.example.com
    trusted_proxies: []                 # default (proposed): no proxy is trusted, the TCP peer is the client; example: ["10.244.3.17", "10.244.5.9"] (the addresses of the ingress controller pods, never the whole pod CIDR; a prefix of length 0 is refused)
    forwarded_header: x-forwarded-for   # default: the one header the edge rewrites, x-forwarded-for | forwarded; the other is never read
  health:                               # operations-and-observability.md R-OPS-001
    shutdown_drain_delay: 5s            # default (proposed); must exceed the edge's endpoint removal time (R-HA-059)
  log:
    level: info                         # default (proposed)
  database:                             # ha-and-helm.md R-HA-009 to R-HA-016
    host: ""                            # required; example: trove-db-rw.trove.svc
    port: 5432                          # default (proposed)
    name: trove                         # example
    ssl_mode: verify-full               # default (proposed)
    session_host: ""                    # default (proposed): empty = host (the migration Job connects there, R-HA-019)
  valkey:                               # ha-and-helm.md R-HA-056
    mode: sentinel                      # default (proposed): sentinel | standalone (development only)
    sentinel:
      addresses: []                     # required; example: [trove-valkey-sentinel-0.trove-valkey-sentinel.trove.svc:26379, trove-valkey-sentinel-1.trove-valkey-sentinel.trove.svc:26379, trove-valkey-sentinel-2.trove-valkey-sentinel.trove.svc:26379]
      primary_name: ""                  # required; example: trove
      tls: true                         # default (proposed)
    address: ""                         # default (proposed); standalone mode only; example: trove-valkey.trove.svc:6379
    tls:
      mode: verify-full                 # default (proposed): verify-full | verify-ca | disable
    allow_insecure: false               # default (proposed)
  storage:                              # storage.md R-STOR-024 to R-STOR-036
    s3:
      bucket: ""                        # required; example: trove-blobs
      region: ""                        # example: eu-central-1
      endpoint: ""                      # default (proposed): AWS resolution; example: http://trove-s3.trove.svc:9000
      force_path_style: false           # default (proposed); true for SeaweedFS, MinIO and Ceph RGW
      credentials:
        source: default                 # default (proposed): default | webIdentity | static
    upload:
      max_size: 10GiB                   # default (proposed) in storage.md; must fit the spool (R-HA-035)
  metrics:
    auth: none                          # default (proposed): none | static (needs secrets.metricsToken)

# ── TLS on trove's own listeners (R-HA-063, R-ARCH-035) ────────────────────
# The chart never creates the Secret. It holds the keys of a cert-manager TLS Secret (tls.crt,
# tls.key and, for the edge and for Prometheus, ca.crt). Mounted as a directory volume without
# subPath, so a rotated Secret reaches the pod through the kubelet's atomic swap and the process
# reloads the files (tls.reloadInterval). tls.* configures the default client listener :8080 and
# the operations listener :8081; each entry of endpoints carries its own tls block (R-EP-004).
tls:
  enabled: true                         # default (proposed) (Q-HA-32); false = plain HTTP inside the cluster (H-38)
  secretName: ""                        # required with tls.enabled; example: trove-tls (cert-manager Certificate secretName)
  certKey: tls.crt                      # default (proposed): key of the certificate chain in the Secret
  keyKey: tls.key                       # default (proposed): key of the private key in the Secret
  minVersion: "1.2"                     # default: "1.2" | "1.3" (server.tls.min_version)
  reloadInterval: 10s                   # default: content poll of the mounted files (server.tls.reload_interval)
  clientCA:                             # optional mutual TLS: the edge must present a client certificate
    secretName: ""                      # default (proposed): empty = no client certificates requested; example: trove-edge-ca
    key: ca.crt                         # default (proposed): key of the CA bundle in that Secret
    auth: require                       # default (proposed): require | verify_if_given (server.tls.client_auth)
  ops:                                  # optional separate certificate for :8081 (probes, metrics); empty = same material as :8080. Recommended with endpoint pools and workers: only then the listener private key of :8080 stays out of the pods that do not serve it (H-57)
    secretName: ""                      # default (proposed); example: trove-ops-tls
    certKey: tls.crt                    # default (proposed)
    keyKey: tls.key                     # default (proposed)
  backendTLSPolicy:                     # Gateway API: how the Gateway verifies trove (needs the BackendTLSPolicy CRD)
    enabled: false                      # default (proposed)
    caConfigMapName: ""                 # required when enabled; example: trove-tls-ca (a ConfigMap with ca.crt: Gateway API takes no Secret here)
    hostname: ""                        # default (proposed): empty = <fullname>.<namespace>.svc; must be a SAN of the certificate

# ── Existing Secrets (the chart never creates one) ──────────────────────────
secrets:
  database:
    existingSecret: ""                  # required; example: trove-db-app (CloudNativePG application Secret)
    usernameKey: username               # default (proposed)
    passwordKey: password               # default (proposed)
  databaseMigration:
    existingSecret: ""                  # default (proposed): empty = single-role mode (R-HA-014); example: trove-db-owner
    usernameKey: username               # default (proposed)
    passwordKey: password               # default (proposed)
  databaseCA:
    existingSecret: ""                  # example: trove-db-ca (only ca.crt is projected)
    key: ca.crt                         # default (proposed)
  databaseClientCert:
    existingSecret: ""                  # default (proposed): no client certificate
    certKey: tls.crt                    # default (proposed)
    keyKey: tls.key                     # default (proposed)
  s3:
    existingSecret: ""                  # default (proposed); required with credentials.source static; also the Secret of an S3 provisioner when a *Key below is set
    accessKeyIdKey: access-key-id       # default (proposed); example (provisioner Secret): AWS_ACCESS_KEY_ID
    secretAccessKeyKey: secret-access-key  # default (proposed); example (provisioner Secret): AWS_SECRET_ACCESS_KEY
    bucketKey: ""                       # default (proposed): the bucket comes from config.storage.s3.bucket; example (provisioner Secret): S3_BUCKET; set = TROVE_STORAGE_S3_BUCKET reads this key of the Secret
    regionKey: ""                       # default (proposed): config.storage.s3.region; example (provisioner Secret): S3_REGION; set = TROVE_STORAGE_S3_REGION reads this key
    endpointKey: ""                     # default (proposed): config.storage.s3.endpoint; example (provisioner Secret): S3_ENDPOINT (a host without scheme, which trove reaches over https); set = TROVE_STORAGE_S3_ENDPOINT reads this key
  valkey:
    existingSecret: ""                  # required (R-HA-029); example: trove-valkey
    usernameKey: username               # default (proposed); empty = the "default" user, the file is not mounted
    passwordKey: password               # default (proposed)
  valkeySentinel:
    existingSecret: ""                  # default (proposed): Sentinels without authentication; example: trove-valkey-sentinel
    usernameKey: ""                     # default (proposed): empty = no Sentinel user, the file is not mounted
    passwordKey: password               # default (proposed)
  s3CA:
    existingSecret: ""                  # default (proposed): empty = the outbound trust store (system roots plus config.proxy.outbound.tls.ca_files); example: trove-s3-tls. Renders storage.s3.ca_file
    key: ca.crt                         # default (proposed)
  valkeyCA:
    existingSecret: ""                  # default (proposed): empty = system roots; example: trove-valkey-ca
    key: ca.crt                         # default (proposed)
  valkeyClientCert:
    existingSecret: ""                  # default (proposed): no client certificate; needed while Valkey keeps tls-auth-clients yes
    certKey: tls.crt                    # default (proposed)
    keyKey: tls.key                     # default (proposed)
  encryption:
    existingSecret: ""                  # required; example: trove-encryption-keys
    keys: []                            # required; ordered, first = active; example: [2026-10.key, 2026-04.key]
  metricsToken:
    existingSecret: ""                  # default (proposed); needed with config.metrics.auth static
    key: token                          # default (proposed)

# ── Network policy (R-HA-042; ingress only, egress is not rendered yet) ─────
networkPolicy:
  enabled: true                         # default (proposed): web and worker accept only the listed peers; the migration Job accepts nothing
  ingress:
    http:
      from: []                          # default (proposed): empty = port 8080 from anywhere, so the ingress controller works wherever it runs; example: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik}}}]
    ops:
      from:                             # default (proposed): port 8081 (probes, metrics) only from the monitoring namespace and probeCIDRs
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
  probeCIDRs: []                        # default (proposed): most CNIs exempt kubelet probes; where one does not, list the node CIDRs; example: ["10.0.0.0/16"]

# ── Pod identity and security ──────────────────────────────────────────────
serviceAccount:
  create: true                          # default (proposed)
  name: ""                              # default (proposed): <fullname>
  annotations: {}                       # default (proposed); example (IRSA): {eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/trove-s3"}
  automountServiceAccountToken: false   # default (proposed): trove never calls the Kubernetes API

podSecurityContext:
  runAsNonRoot: true                    # default (proposed)
  runAsUser: 65532                      # default (proposed); null on OpenShift (restricted-v2 assigns the UID)
  runAsGroup: 65532                     # default (proposed); null on OpenShift
  fsGroup: 65532                        # default (proposed); null on OpenShift
  fsGroupChangePolicy: OnRootMismatch   # default (proposed)
  seccompProfile:
    type: RuntimeDefault                # default (proposed)

securityContext:
  allowPrivilegeEscalation: false       # default (proposed)
  privileged: false                     # default (proposed)
  readOnlyRootFilesystem: true          # default (proposed)
  runAsNonRoot: true                    # default (proposed)
  capabilities:
    drop: [ALL]                         # default (proposed)
  seccompProfile:
    type: RuntimeDefault                # default (proposed)

# ── Volumes (R-HA-035, R-HA-061: nothing ReadWriteMany, nothing persistent) ─
spool:
  type: emptyDir                        # default (proposed): emptyDir | ephemeral
  sizeLimit: 20Gi                       # default (proposed) (R-HA-035); web.spool and worker.spool override it
  headroom: 2GiB                        # default (proposed): sizeLimit - headroom = storage.spool.max_bytes (R-HA-035, R-STOR-004)
  medium: ""                            # default (proposed): node disk; "Memory" counts against the memory limit
  ephemeral:
    storageClassName: ""                # default (proposed): cluster default
    size: 50Gi                          # default (proposed); used with type ephemeral
    accessModes: [ReadWriteOnce]        # default (proposed): ReadWriteOnce | ReadWriteOncePod; nothing else validates

tmp:
  sizeLimit: 1Gi                        # default (proposed); /tmp under readOnlyRootFilesystem

# ── Probes (R-HA-034; paths from R-OPS-001) ────────────────────────────────
probes:
  startup:
    enabled: true                       # default (proposed)
    path: /healthz                      # default (proposed)
    periodSeconds: 2                    # default (proposed)
    timeoutSeconds: 2                   # default (proposed)
    failureThreshold: 60                # default (proposed): 2 minutes to bind the listeners
    custom: {}                          # default (proposed); replaces the generated probe
  liveness:
    enabled: true                       # default (proposed)
    path: /healthz                      # default (proposed)
    periodSeconds: 10                   # default (proposed)
    timeoutSeconds: 3                   # default (proposed)
    failureThreshold: 6                 # default (proposed)
    custom: {}                          # default (proposed)
  readiness:
    enabled: true                       # default (proposed)
    path: /readyz                       # default (proposed)
    periodSeconds: 5                    # default (proposed)
    timeoutSeconds: 3                   # default (proposed)
    failureThreshold: 1                 # default (proposed): debouncing happens in the process (health.failure_threshold)
    successThreshold: 1                 # default (proposed)
    custom: {}                          # default (proposed)

# ── Exposure ───────────────────────────────────────────────────────────────
service:
  type: ClusterIP                       # default (proposed): ClusterIP | LoadBalancer | NodePort
  port: 8080                            # default (proposed)
  opsPort: 8081                         # default (proposed)
  # No sessionAffinity value: every Service renders sessionAffinity: None (R-HA-037).
  annotations: {}                       # default (proposed)
  labels: {}                            # default (proposed)

ingress:
  enabled: false                        # default (proposed)
  className: ""                         # default (proposed): cluster default IngressClass; example: traefik
  annotations: {}                       # default (proposed); controller-specific settings; never cookie affinity (R-HA-037)
  labels: {}                            # default (proposed)
  hosts: []                             # default (proposed): empty = host of config.server.base_url
  # No path value: every host is routed whole, path / with pathType Prefix (R-HA-037).
  tls: []                               # default (proposed); example: [{secretName: trove-tls, hosts: [trove.example.com]}]
  backendTLS:                           # how the controller reaches trove when tls.enabled (R-HA-063); trove speaks HTTPS, so the controller must too
    controller: haproxy                 # default (proposed): haproxy (HAProxy Ingress, the primary target) | traefik | ingress-nginx | manual (you set the backend protocol in ingress.annotations / service.annotations)
    verify: true                        # default (proposed): the controller verifies the trove certificate; needs caSecret (haproxy, ingress-nginx) or serversTransport (traefik); false = encrypted but unverified
    caSecret: ""                        # required with verify on haproxy and ingress-nginx; Secret in the release namespace with ca.crt; example: trove-tls (a cert-manager Secret carries ca.crt)
    clientCertSecret: ""                # haproxy: Secret with tls.crt and tls.key that HAProxy Ingress presents to trove (required with tls.clientCA); example: trove-edge-client
    serversTransport: ""                # traefik: ServersTransport reference <namespace>-<name>@kubernetescrd that verifies trove; example: trove-trove-tls@kubernetescrd

# ── Endpoints (R-EP-008, docs/spec/endpoints.md) ──────────────────────────
# Further client entry points, each with its own listener port, Service, Ingress, NetworkPolicy,
# certificates and optionally its own pool of web pods. The default endpoint (:8080, config.server.base_url,
# tls.*, ingress.*) always exists; an entry named default tunes it, with these keys only: hosts,
# wildcardHost, hostRoots, wildcardRoot, surface, auth, exposure, cacheFill, rateLimitClass, replicaHeader.
# The chart renders the entries into server.endpoints of trove.yaml; config.server.endpoints is refused.
# Values of a further endpoint are listed once here and carry their defaults (R-EP-001, Q-EP-5, Q-EP-10).
endpoints: {}                           # default (proposed): only the default endpoint; example:
#  default:                             # optional
#    hosts: []                          # default (proposed): with a further endpoint, the hosts of config.server.base_url and additional_base_urls; add the in-cluster Service name here when clients use it
#  customers:                           # example: the endpoint name, ^[a-z][a-z0-9-]{0,19}$, <fullname>-ep-<name> at most 63 characters
#    port: 8443                         # example; required; container port and Service port; not 8080, 8081 or another endpoint's port
#    baseUrl: https://packages.example.com   # example; required; an origin (scheme, host, optional port)
#    hosts: []                          # default (proposed); example [pkgs.example.org]
#    wildcardHost: ""                   # default (proposed); example "*.packages.example.com" (one label, at least two labels in the domain)
#    hostRoots: {}                      # default (proposed): host -> repository key, reserved for later formats (R-EP-006)
#    wildcardRoot: none                 # default (proposed): none | label
#    surface: [packages]                # default (proposed): ui is not allowed on a further endpoint; api, ci_exchange, files are off by default
#    auth: {tokenTypes: [sat], boundTokensOnly: true, anonymous: false}   # default (proposed); enforced from the identity milestone
#    exposure: rules                    # default (proposed): rules | all; enforced from the exposure milestone
#    cacheFill: false                   # default (proposed)
#    rateLimitClass: external           # default (proposed)
#    replicaHeader: never               # default (proposed): authenticated | always | never
#    maxInFlight: 1024                  # default (proposed), per replica and endpoint
#    trustedProxies: []                 # default (proposed): config.server.trusted_proxies
#    tls:
#      existingSecret: ""               # default (proposed): "" = the pair of tls.secretName; example trove-packages-tls (keys tls.crt, tls.key)
#      extraSecrets: []                 # default (proposed); example [trove-packages-wildcard-tls]: further pairs, chosen by SNI
#      clientCaSecret: ""               # default (proposed): no client certificates; example trove-customer-ca (key ca.crt)
#    pool:
#      enabled: false                   # default (proposed): served by <fullname>-web; true renders <fullname>-web-ep-<name>
#      replicaCount: 2                  # default (proposed) when enabled; every key of web may be overridden here
#    service:
#      type: ClusterIP                  # default (proposed): ClusterIP | LoadBalancer | NodePort
#      annotations: {}                  # default (proposed)
#      loadBalancerSourceRanges: []     # default (proposed)
#    ingress:
#      enabled: false                   # default (proposed)
#      className: ""                    # default (proposed): cluster default IngressClass; example traefik-external
#      annotations: {}                  # default (proposed)
#      tls: []                          # default (proposed); example [{secretName: packages-tls, hosts: [packages.example.com, "*.packages.example.com"]}]
#      backendTLS: {}                   # default (proposed): ingress.backendTLS; any key given here wins for this endpoint (controller, verify, caSecret, ...)
#    networkPolicy:
#      from: []                         # default (proposed): empty = from anywhere

# ── Migrations (R-HA-019) ──────────────────────────────────────────────────
migrations:
  mode: hook                            # default (proposed): hook | disabled
  backoffLimit: 2                       # default (proposed)
  activeDeadlineSeconds: 1800           # default (proposed)
  ttlSecondsAfterFinished: 86400        # default (proposed)
  resources:
    requests:
      cpu: 100m                         # default (proposed)
      memory: 128Mi                     # default (proposed)
    limits:
      memory: 512Mi                     # default (proposed)
  podAnnotations: {}                    # default (proposed)
  extraEnv: []                          # default (proposed)

# ── Extension points (R-HA-046) ────────────────────────────────────────────
extraEnv: []                            # default (proposed); example: [{name: TROVE_LOG_LEVEL, value: debug}]
extraEnvFrom: []                        # default (proposed)
extraVolumes: []                        # default (proposed); the operator's: R-HA-061 cannot see a claim's access mode
extraVolumeMounts: []                   # default (proposed)
extraObjects: []                        # default (proposed); extra manifests rendered with tpl
